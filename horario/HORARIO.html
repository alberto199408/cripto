<style>
:root{
  --b0:#080C14; --b1:#0E1524; --b2:#152033; --b3:#1D2B44;
  --ln:#22304A; --tx:#E6EEF9; --t2:#93A5BE; --t3:#5D6E88;
  --ac:#3B9EFF; --up:#00FF9C; --dn:#FF4D6A;
  --c50:#FFB020; --c100:#FF3D9A; --cpe:#B36BFF;
  --cpr:#00E5FF; --cme:#3B9EFF; --cdi:#00FF9C; --cra:#FFB020;
  --sab:#39FF88;      /* sábado: verde neón */
  --dom:#00E5A0;      /* domingo: verde agua neón */
  --fer:#B36BFF;      /* feriado: morado */
  --glow:.55;         /* cuánto brillan los colores */
  --fz:15px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--b0);color:var(--tx);font-size:var(--fz);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;line-height:1.5;
  background-image:radial-gradient(900px 500px at 12% -8%,rgba(46,140,255,.10),transparent 60%),
                   radial-gradient(760px 460px at 92% 4%,rgba(255,61,154,.07),transparent 60%)}
.app{display:flex;min-height:100vh}

/* ---------- barra lateral ---------- */
aside{width:216px;flex:none;background:var(--b1);border-right:1px solid var(--ln);
  display:flex;flex-direction:column;padding:16px 12px;gap:5px;
  padding-top:max(16px,env(safe-area-inset-top))}
.marca{display:flex;align-items:center;gap:11px;padding:4px 6px 18px}
.marca .d{width:40px;height:40px;border-radius:12px;flex:none;
  background:linear-gradient(140deg,var(--ac),#7C3AED);
  display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(46,140,255,.34)}
.marca .d svg{width:21px;height:21px}
.marca b{display:block;font-size:13.5px;letter-spacing:.01em;line-height:1.25}
.marca span{display:block;font-size:9px;color:var(--t3);letter-spacing:.13em}
nav{display:flex;flex-direction:column;gap:4px}
nav button{background:none;border:0;color:var(--t2);text-align:left;cursor:pointer;
  padding:11px 13px;border-radius:11px;font-size:13.5px;display:flex;align-items:center;
  gap:11px;font-family:inherit;position:relative}
nav button svg{width:18px;height:18px;flex:none}
nav button:hover{background:var(--b2);color:var(--tx)}
nav button[aria-current=true]{background:linear-gradient(100deg,
  color-mix(in srgb,var(--ac) 26%,transparent),color-mix(in srgb,var(--ac) 8%,transparent));
  color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 40%,transparent)}
nav button[aria-current=true]::before{content:"";position:absolute;left:0;top:22%;bottom:22%;
  width:3px;border-radius:0 3px 3px 0;background:var(--ac)}
.pie{margin-top:auto;padding-top:12px;border-top:1px solid var(--ln)}
.usr{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:11px;background:var(--b2)}
.usr .av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--ac),#7C3AED);color:#fff;font-weight:700;font-size:12.5px}
.usr b{display:block;font-size:12.5px;line-height:1.2}
.usr span{display:block;font-size:10.5px;color:var(--t3)}
.ver{padding:9px 8px 0;font-size:10px;color:var(--t3);letter-spacing:.04em}

main{flex:1;min-width:0;padding:16px 20px calc(30px + env(safe-area-inset-bottom))}

/* ---------- encabezado ---------- */
.encab{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:15px}
.hico{width:38px;height:38px;border-radius:11px;background:var(--b2);border:1px solid var(--ln);
  display:grid;place-items:center;color:var(--ac);flex:none}
.hico svg{width:19px;height:19px}
.encab h1{font-size:21px;margin:0;font-weight:700;letter-spacing:-.01em}
.encab .der{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.selm{display:flex;align-items:center;gap:5px}
.selm button{background:var(--b1);border:1px solid var(--ln);color:var(--t2);cursor:pointer;
  width:34px;height:34px;border-radius:10px;font-size:15px;font-family:inherit;display:grid;
  place-items:center}
.selm button:hover{background:var(--b3);color:var(--tx)}
.selm select{background:var(--b1);border:1px solid var(--ln);color:var(--tx);height:34px;
  border-radius:10px;padding:0 10px;font-family:inherit;font-size:13px;cursor:pointer}
.syn{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--t3);
  padding:7px 12px;border-radius:10px;background:var(--b1);border:1px solid var(--ln)}
.syn i{width:7px;height:7px;border-radius:50%;background:var(--t3)}
.syn.ok i{background:var(--up)} .syn.mal i{background:var(--dn)}

.b{background:var(--b2);border:1px solid var(--ln);color:var(--t2);cursor:pointer;
  padding:9px 14px;border-radius:10px;font-size:13px;font-family:inherit;
  display:inline-flex;align-items:center;gap:7px}
.b:hover{background:var(--b3);color:var(--tx)}
.b.ac{background:linear-gradient(120deg,var(--ac),#1E6FE0);border-color:transparent;
  color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(46,140,255,.3)}
.b.rj{background:color-mix(in srgb,var(--dn) 20%,var(--b2));border-color:color-mix(in srgb,var(--dn) 45%,transparent);
  color:#FFB3C0}
.b.rj:hover{background:var(--dn);color:#fff}
.b.ok2{background:color-mix(in srgb,var(--up) 16%,var(--b2));
  border-color:color-mix(in srgb,var(--up) 42%,transparent);color:var(--up);font-weight:600}
.mini{background:var(--b0);border:1px solid var(--ln);color:var(--t3);cursor:pointer;
  width:26px;height:26px;border-radius:7px;display:inline-grid;place-items:center;padding:0}
.mini:hover{border-color:var(--ac);color:var(--ac)}
.mini .ic{width:13px;height:13px}
.mini.peg{margin-left:3px}
.cacc{white-space:nowrap}
.pegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px;
  max-height:44vh;overflow:auto}
label.peg{display:flex;align-items:center;gap:6px;background:var(--b0);border:1px solid var(--ln);
  border-radius:9px;padding:6px 9px;cursor:pointer;font-size:12px}
label.peg:hover{border-color:var(--ac)}
label.peg.sab{border-left:3px solid var(--sab)}
label.peg.dom{border-left:3px solid var(--dom)}
label.peg.fer{border-left:3px solid var(--fer)}
label.peg .pd2{flex:1;text-transform:capitalize}
label.peg .pe{font-size:10px;color:var(--t3);font-family:Consolas,monospace}
.b.cerrado{background:color-mix(in srgb,var(--dn) 18%,var(--b2));
  border-color:color-mix(in srgb,var(--dn) 45%,transparent);color:#FFB3C0;font-weight:600}
.b.abierto{background:color-mix(in srgb,var(--up) 18%,var(--b2));
  border-color:color-mix(in srgb,var(--up) 45%,transparent);color:#7DFFC8;font-weight:600}
.b .ic{width:14px;height:14px}
.solo-lect input,.solo-lect select{opacity:.65}
.b.sm{padding:6px 11px;font-size:12px}

/* ---------- paneles ---------- */
.tab3{display:grid;grid-template-columns:1.45fr 1fr 1.15fr;gap:13px;margin-bottom:13px}
.pan{background:linear-gradient(160deg,var(--b1),color-mix(in srgb,var(--b1) 82%,var(--b0)));
  border:1px solid var(--ln);border-radius:15px;padding:14px 16px;position:relative;overflow:hidden}
.pan.gr::after{content:"";position:absolute;right:-14%;top:-40%;width:56%;height:180%;
  border-radius:50%;opacity:.13;pointer-events:none;
  background:radial-gradient(circle,var(--ac),transparent 65%)}
.pt{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.12em;
  font-weight:700;color:var(--t2);background:var(--b0);border:1px solid var(--ln);
  padding:5px 11px;border-radius:99px;margin-bottom:12px;width:100%}
.pt .ic{width:14px;height:14px;color:var(--ac);flex:none}
.pt .sp{flex:1}
.pt .b{margin-left:6px}
.ic{width:16px;height:16px}
.pbig{font-family:Consolas,monospace;font-size:38px;font-weight:800;line-height:1.02;
  letter-spacing:-.02em;color:var(--up);
  text-shadow:0 3px 26px color-mix(in srgb,var(--up) 34%,transparent)}
.psub{font-size:12px;color:var(--t3);margin-top:5px;display:flex;align-items:center;
  gap:8px;flex-wrap:wrap}
.dpill{padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;
  font-family:Consolas,monospace}
.dpill.up{background:color-mix(in srgb,var(--up) 18%,transparent);color:var(--up)}
.dpill.dn{background:color-mix(in srgb,var(--dn) 18%,transparent);color:var(--dn)}
.curva{width:100%;height:150px;margin-top:8px;display:block}

/* rosca */
.rzona{display:flex;align-items:center;gap:14px}
.rosca{position:relative;width:158px;height:158px;flex:none}
.rosca svg{width:100%;height:100%}
.rcentro{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rcentro span{display:block;font-size:10px;color:var(--t3);letter-spacing:.09em}
.rcentro b{display:block;font-family:Consolas,monospace;font-size:19px;font-weight:800}
.rleg{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.lg2{display:grid;grid-template-columns:11px 1fr;column-gap:8px;align-items:center;
  font-size:12px;row-gap:1px}
.lg2 i{width:11px;height:11px;border-radius:3px;grid-row:1/3}
.lg2 .n{color:var(--tx)}
.lg2 .v{font-family:Consolas,monospace;font-size:11px;color:var(--t3);grid-column:2}
.lg2 .p{display:none}
.meta{margin-top:13px;background:var(--b0);border:1px solid var(--ln);border-radius:11px;
  padding:9px 12px}
.mt{display:flex;justify-content:space-between;font-size:11.5px;color:var(--t3);margin-bottom:6px}
.mt b{color:var(--up);font-family:Consolas,monospace}
.mb{height:7px;border-radius:99px;background:var(--b2);overflow:hidden}
.mb i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--ac),var(--up))}
.mb.chica{height:5px;margin:6px 0 4px}

/* desglose */
.desglose{background:var(--b0);border:1px solid var(--ln);border-radius:12px;padding:5px 3px}
.dl{display:grid;grid-template-columns:1fr auto;column-gap:12px;align-items:baseline;
  padding:6px 12px}
.dl .t{font-size:12.5px;color:var(--t2)}
.dl .v{font-family:Consolas,monospace;font-size:14px;font-weight:700;text-align:right}
.dl .s{grid-column:1/-1;font-size:10px;color:var(--t3);font-family:Consolas,monospace;margin-top:-3px}
.dl .s:empty{display:none}
.dl.off{opacity:.42} .dl.off .v{text-decoration:line-through}
.dl.suma{border-top:1px dashed var(--ln);margin-top:3px;padding-top:9px}
.dl.suma .t{font-weight:700;color:var(--tx);letter-spacing:.05em;font-size:11.5px}
.dl.suma .v{font-size:16px}
.dl.total{margin-top:5px;padding:11px 12px;border-radius:11px;
  background:linear-gradient(100deg,color-mix(in srgb,var(--up) 22%,transparent),
             color-mix(in srgb,var(--up) 7%,transparent));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--up) 34%,transparent)}
.dl.total .t{font-weight:800;color:var(--up);letter-spacing:.06em;font-size:12px}
.dl.total .v{font-size:20px;color:var(--up)}
.dl .c50{color:var(--c50)} .dl .c100{color:var(--c100)}
.dl .up{color:var(--up)} .dl .dn{color:var(--dn)}

/* ---------- tarjetas ---------- */
.tarj{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:13px}
.tarj.b{grid-template-columns:repeat(4,1fr) 1.5fr}
.tj{background:linear-gradient(160deg,var(--b1),color-mix(in srgb,var(--b1) 80%,var(--b0)));
  border:1px solid var(--ln);border-radius:15px;padding:13px 15px;display:flex;gap:12px;
  align-items:flex-start;position:relative;overflow:hidden;--cc:var(--ac)}
.tj.c50{--cc:var(--c50)} .tj.c100{--cc:var(--c100)} .tj.cpe{--cc:var(--cpe)}
.tj.cpr{--cc:var(--cpr)} .tj.cme{--cc:var(--cme)} .tj.cdi{--cc:var(--cdi)} .tj.cra{--cc:var(--cra)}
.tj{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cc) 22%,transparent)}
.tj::after{content:"";position:absolute;right:-30%;top:-60%;width:80%;height:200%;
  border-radius:50%;opacity:.09;background:radial-gradient(circle,var(--cc),transparent 65%)}
.tjc{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:color-mix(in srgb,var(--cc) 18%,transparent);color:var(--cc)}
.tjc svg{width:17px;height:17px}
.tjd{min-width:0;flex:1}
.tjk{font-size:9.5px;letter-spacing:.1em;color:var(--t3);font-weight:700}
.tjv{font-family:Consolas,monospace;font-size:25px;font-weight:800;line-height:1.15;
  margin:2px 0;color:var(--cc)}
.tjv .chico{font-size:14px;color:var(--t3)}
.tjs{font-size:10.5px;color:var(--t3);line-height:1.45}
.tjp{margin-top:7px;padding-top:7px;border-top:1px solid var(--ln);
  font-family:Consolas,monospace;font-size:14px;font-weight:700;color:var(--tx)}
.pan.mini{padding:12px 14px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.dgrid>div{background:var(--b0);border:1px solid var(--ln);border-radius:10px;padding:8px 11px}
.dgrid .k{display:block;font-size:9px;letter-spacing:.09em;color:var(--t3);font-weight:700}
.dgrid b{display:block;font-family:Consolas,monospace;font-size:14.5px;margin:2px 0}
.dgrid .s{display:block;font-size:10px;color:var(--t3)}

/* ---------- tabla ---------- */

  return (+p[2])+" "+MESES[+p[1]-1].toLowerCase().slice(0,3)+" "+p[0];
}

/* ---------- feriados del Ecuador, calculados para cualquier año ---------- */
function pascua(a){
  /* algoritmo de Gauss: de aquí salen Carnaval y Viernes Santo */
  var A=a%19, B=Math.floor(a/100), C=a%100;
  var D=Math.floor(B/4), E=B%4, F=Math.floor((B+8)/25), G=Math.floor((B-F+1)/3);
  var H=(19*A+B-D-G+15)%30, I=Math.floor(C/4), K=C%4;
  var L=(32+2*E+2*I-H-K)%7, M=Math.floor((A+11*H+22*L)/451);
  var mes=Math.floor((H+L-7*M+114)/31), dia=((H+L-7*M+114)%31)+1;
  return new Date(a, mes-1, dia);
}
function masDias(d,n){ var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function aISO(d){ return d.getFullYear()+"-"+dosD(d.getMonth()+1)+"-"+dosD(d.getDate()); }

/* traslado de ley: martes → lunes anterior · miércoles/jueves → viernes
   sábado → viernes anterior · domingo → lunes siguiente */
function trasladar(iso){
  var p=iso.split("-"), d=new Date(+p[0], +p[1]-1, +p[2]), s=d.getDay();
  if(s===2) return aISO(masDias(d,-1));
  if(s===3) return aISO(masDias(d,2));
  if(s===4) return aISO(masDias(d,1));
  if(s===6) return aISO(masDias(d,-1));
  if(s===0) return aISO(masDias(d,1));
  return iso;
}

function feriadosDe(anio){
  var F={};
  function pon(iso,nom,mueve){
    var f = mueve ? trasladar(iso) : iso;
    /* Si el traslado caería encima de OTRO feriado, no se mueve: se queda
       en su fecha. Es lo que pasa en noviembre con Difuntos (2) e
       Independencia de Cuenca (3) — los dos se descansan por separado. */
    if(f!==iso && F[f]) f=iso;
    if(F[f] && F[f]!==nom){
      if(F[f].indexOf(nom)<0) F[f]=F[f]+" y "+nom;
    } else F[f]=nom;
  }
  /* fijos que NO se trasladan */
  pon(anio+"-01-01","Año Nuevo",false);
  pon(anio+"-05-01","Día del Trabajo",false);
  pon(anio+"-12-25","Navidad",false);
  /* fijos que sí se trasladan */
  pon(anio+"-05-24","Batalla de Pichincha",true);
  pon(anio+"-08-10","Primer Grito de Independencia",true);
  pon(anio+"-10-09","Independencia de Guayaquil",true);
  pon(anio+"-11-02","Día de Difuntos",true);
  pon(anio+"-11-03","Independencia de Cuenca",true);
  /* movibles, atados a la Pascua */
  var P=pascua(anio);
  F[aISO(masDias(P,-48))]="Carnaval";
  F[aISO(masDias(P,-47))]="Carnaval";
  F[aISO(masDias(P,-2))]="Viernes Santo";
  /* feriados de una sola vez, publicados por el Ministerio ese año
     (ejemplo: el viernes 2 de enero de 2026, que no se repite) */
  var X=(BD.leyes&&BD.leyes.feriadosExtra)||LEYES_BASE.feriadosExtra||{};
  Object.keys(X).forEach(function(k){
    if(k.slice(0,4)===String(anio)) F[k]=X[k];
  });
  return F;
}
var FER_cache={};
function feriadoDe(iso){
  if(BD.quitados && BD.quitados[iso]) return null;         /* usted lo desmarcó */
  if(BD.feriados && BD.feriados[iso]) return BD.feriados[iso];   /* uno suyo */
  var a=iso.slice(0,4);
  if(!FER_cache[a]) FER_cache[a]=feriadosDe(+a);
  return FER_cache[a][iso]||null;
}

/* ---------- horas ---------- */
function aMin(hhmm){
  if(!hhmm) return null;
  var p=String(hhmm).split(":");
  if(p.length<2) return null;
  var h=parseInt(p[0],10), m=parseInt(p[1],10);
  if(isNaN(h)||isNaN(m)) return null;
  return h*60+m;
}
function aHHMM(min){
  if(min==null) return "";
  var neg=min<0; min=Math.abs(Math.round(min));
  return (neg?"-":"")+dosD(Math.floor(min/60))+":"+dosD(min%60);
}
function aHoras(min){ return min==null?0:min/60; }
function fh(min){   /* "11:45" para mostrar */
  if(!min) return "—";
  return aHHMM(min);
}
function usd(n){
  if(n==null||isNaN(n)) return "$0,00";
  var neg=n<0; n=Math.abs(n);
  var s=n.toFixed(2).split(".");
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,".");
  return (neg?"-$":"$")+s[0]+","+s[1];
}

/* ---------- un día ---------- */
function diaVacio(){ return {e1:"",s1:"",e2:"",s2:"",perm:"",obs:"",tipo:"",lib:false,mod:0}; }

function calcDia(iso, d, cfg){
  d = d || diaVacio();
  var dow = new Date(+iso.slice(0,4), +iso.slice(5,7)-1, +iso.slice(8,10)).getDay();
  var fer = feriadoDe(iso);
  var esDom = dow===0, esSab = dow===6;

  /* ------------------------------------------------------------------
     Se recorre el día MINUTO A MINUTO, en orden. Es la única forma de
     saber cuáles horas son ordinarias y cuáles suplementarias, y en qué
     franja horaria cayó cada una.
       · Las primeras 8 h del día son la jornada ordinaria (Art. 47)
       · Lo que sigue es suplementario: 50% hasta las 24:00 (Art. 55)
       · Entre las 24:00 y las 06:00 el suplementario sube al 100%
       · Sábado, domingo y feriado: el día entero al 100%
       · Jornada ordinaria entre 19:00 y 06:00: recargo del 25% (Art. 49)
     ------------------------------------------------------------------ */
  var trozos=[];
  function tramo(a,b){
    var x=aMin(a), y=aMin(b);
    if(x==null||y==null) return;
    if(y<x) y+=1440;              /* cruzó la medianoche */
    if(y>x) trozos.push([x,y]);
  }
  tramo(d.e1,d.s1);
  tramo(d.e2,d.s2);
  trozos.sort(function(p,q){ return p[0]-q[0]; });

  var perm = aMin(d.perm)||0;
  var jorn = cfg.jornada*60;
  var tope = (cfg.topeDia||4)*60;

  /* al 100% el día completo */
  var todo100 = (esDom || !!fer || d.tipo==="100");
  if(esSab && cfg.sab100!==false) todo100=true;

  var t=0, normal=0, sup50=0, ext100=0, madrugada=0, noche=0, exceso=0;

  trozos.forEach(function(p){
    for(var m=p[0]; m<p[1]; m++){
      t++;
      var hora = ((m % 1440) + 1440) % 1440;     /* la hora real del reloj */
      var esMadrugada = hora < 360;              /* 00:00 a 06:00 */
      var esNoche = (hora >= 1140) || (hora < 360);   /* 19:00 a 06:00 */

      if(todo100){ ext100++; continue; }         /* sábado, domingo o feriado */
      if(d.tipo==="50"){ sup50++; continue; }    /* usted lo forzó al 50% */

      if(normal < jorn){
        normal++;
        if(esNoche) noche++;                     /* Art. 49: recargo del 25% */
      } else if(sup50 + exceso < tope){
        /* suplementaria: al 100% si cae entre las 24:00 y las 06:00 */
        if(esMadrugada) ext100++; else sup50++;
        if(esMadrugada) madrugada++;
      } else {
        exceso++; ext100++;                      /* pasó el tope de 4 h al día */
        if(esMadrugada) madrugada++;
      }
    }
  });

  /* liq: recargo nocturno solo si la jornada ordinaria cae de noche */
  if(!cfg.usaNoche) noche=0;

  return {iso:iso, dow:dow, dia:DIAS[dow], fer:fer, esDom:esDom, esSab:esSab,
          d:d, trab:t, tramos:trozos.length, perm:perm, normal:normal,
          sup50:sup50, ext100:ext100, todo100:todo100,
          madrugada:madrugada, exceso:exceso, noche:noche,
          libre: d.lib || (t===0 && !perm)};
}

/* ---------- el mes completo ---------- */
function mesDe(clave){
  if(!BD.meses[clave]) BD.meses[clave]={dias:{}, anticipo:0, prest:0, otros:0, otrosNom:"", nota:""};
  var m=BD.meses[clave];
  if(!m.dias) m.dias={};
  return m;
}

function calcMes(clave){
  var a=+clave.slice(0,4), mm=+clave.slice(5,7)-1;
  var cfg=cfgDe(a), m=mesDe(clave);
  var n=diasDelMes(a,mm), filas=[];
  var tTrab=0, tSup=0, tExt=0, tPerm=0, dTrab=0, dFer=0, dLib=0, tMad=0, tNoc=0, tTope=0;

  for(var i=1;i<=n;i++){
    var iso=clave+"-"+dosD(i);
    var c=calcDia(iso, m.dias[iso], cfg);
    filas.push(c);
    tTrab+=c.trab; tSup+=c.sup50; tExt+=c.ext100; tPerm+=c.perm;
    tMad+=c.madrugada; tNoc+=c.noche; tTope+=c.exceso;
    if(c.trab>0) dTrab++;
    if(c.fer) dFer++;
    if(c.libre) dLib++;
  }

  /* --- dinero --- */
  var vh   = cfg.sueldo/(cfg.horasMes||240);
  var v50  = vh*(1+cfg.rec50);
  var v100 = vh*(1+cfg.rec100);
  var vNoc = vh*(cfg.recNoche||0.25);          /* solo el recargo, Art. 49 */
  var pag50  = aHoras(tSup)*v50;
  var pag100 = aHoras(tExt)*v100;
  var pagNoc = aHoras(tNoc)*vNoc;
  var total  = cfg.sueldo + pag50 + pag100 + pagNoc;

  var iess    = total*cfg.iess;
  var patron  = total*cfg.patronal;
  var fondos  = total*cfg.fondos;
  var anticipo=+m.anticipo||0, prest=+m.prest||0, otros=+m.otros||0;

  var neto = total + (cfg.cobraFondos?fondos:0) - iess - anticipo - prest - otros;

  return {clave:clave, anio:a, mes:mm, filas:filas, cfgAnio:cfg,
    tTrab:tTrab, tSup:tSup, tExt:tExt, tPerm:tPerm,
    tMad:tMad, tNoc:tNoc, tTope:tTope, pagNoc:pagNoc, vNoc:vNoc,
    dTrab:dTrab, dFer:dFer, dLib:dLib, dias:n,
    vh:vh, v50:v50, v100:v100,
    pag50:pag50, pag100:pag100, total:total,
    iess:iess, patron:patron, fondos:fondos,
    anticipo:anticipo, prest:prest, otros:otros, neto:neto, m:m};
}

/* ---------- resumen del año ---------- */
function calcAnio(a){
  var r={meses:[], total:0, neto:0, sup:0, ext:0, iess:0, fondos:0, anticipo:0, prest:0,
         pag50:0, pag100:0};
  for(var i=0;i<12;i++){
    var k=claveMes(a,i);
    if(!BD.meses[k]) continue;
    var c=calcMes(k);
    if(c.tTrab===0 && !c.anticipo && !c.prest) continue;
    r.meses.push(c);
    r.total+=c.total; r.neto+=c.neto; r.sup+=c.tSup; r.ext+=c.tExt;
    r.iess+=c.iess; r.fondos+=c.fondos; r.anticipo+=c.anticipo; r.prest+=c.prest;
    r.pag50+=c.pag50; r.pag100+=c.pag100;
  }
  return r;
}

/* ---------- guardar ---------- */
function guardar(){
  BD.mod=Date.now();
  try{ localStorage.setItem(LLAVE, JSON.stringify(BD)); }catch(e){}
  pintarGuardado();
}
function cargar(){
  BD=nuevaBD();
  try{
    var t=localStorage.getItem(LLAVE);
    if(t){
      var d=JSON.parse(t);
      if(d && d.cfg){
        BD.cfg=Object.assign(BD.cfg, d.cfg);
        BD.meses=d.meses||{};
        BD.sembrado=d.sembrado||0;
        BD.feriados=d.feriados||{};
        BD.quitados=d.quitados||{};
        BD.git=d.git||{}; BD.equipo=d.equipo||""; BD.mod=d.mod||0;
        BD.leyes=d.leyes||null; BD.leyesFecha=d.leyesFecha||0;
        BD.dueñoH=d.dueñoH||"";
        BD.leyesRevision=d.leyesRevision||0;
        if(!BD.cfg.manual) BD.cfg.manual={};
        BD.gitAuto=d.gitAuto||false;
      }
    }
  }catch(e){}
  /* Arrastre viejo: al principio venía "AQUA INGENIERIA" puesto de fábrica
     y quedó guardado en el navegador. Este registro es personal suyo, así
     que si nunca lo cambió a mano, se limpia. */
  if(!BD.cfg.empresaMia && /AQUA/i.test(BD.cfg.empresa||"")) BD.cfg.empresa="";
  sembrar();
}

/* La primera vez se cargan los meses que usted ya llevaba en su Excel
   (enero a julio de 2026). Después no se vuelve a tocar nada. */
function sembrar(){
  if(BD.sembrado) return;
  var n=0;
  Object.keys(SEMILLA).forEach(function(k){
    if(BD.meses[k] && Object.keys(BD.meses[k].dias||{}).length) return;  /* ya tiene algo suyo */
    BD.meses[k]=JSON.parse(JSON.stringify(SEMILLA[k]));
    n++;
  });
  BD.sembrado=1;
  if(n) try{ localStorage.setItem(LLAVE, JSON.stringify(BD)); }catch(e){}
}

function colorActual(k){
  var C=(BD.cfg&&BD.cfg.colores)||{};
  if(C[k]) return C[k];
  var d=COLORES.filter(function(x){ return x.k===k; })[0];
  return d?d.d:"#888888";
}
function brilloActual(){
  var g=(BD.cfg&&BD.cfg.glow);
  return g==null ? .55 : g;
}

function aplicarColores(){
  var R=document.documentElement.style;
  COLORES.forEach(function(c){ R.setProperty("--"+c.k, colorActual(c.k)); });
  R.setProperty("--glow", brilloActual());
  /* los fondos intermedios salen del fondo principal, para que todo case */
  var b0=colorActual("b0");
  R.setProperty("--b2", mezclar(b0, colorActual("b1"), .55));
  R.setProperty("--b3", mezclar(colorActual("b1"), colorActual("ac"), .16));
  R.setProperty("--ln", mezclar(colorActual("b1"), colorActual("tx"), .14));
  var tx=colorActual("tx");
  R.setProperty("--t2", mezclar(tx, b0, .34));
  R.setProperty("--t3", mezclar(tx, b0, .60));
  /* si el fondo es claro, las sombras se suavizan */
  document.body.classList.toggle("claro", esClaro(b0));
  R.setProperty("--fz",(BD.cfg.fz||15)+"px");
}
function hex(c){
  c=String(c||"").replace("#","");
  if(c.length===3) c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  return [parseInt(c.slice(0,2),16)||0, parseInt(c.slice(2,4),16)||0, parseInt(c.slice(4,6),16)||0];
}
function mezclar(a,b,p){
  var A=hex(a), B=hex(b);
  return "#"+[0,1,2].map(function(i){
    return Math.round(A[i]+(B[i]-A[i])*p).toString(16).padStart(2,"0");
  }).join("");
}
function esClaro(c){
  var v=hex(c);
  return (v[0]*299+v[1]*587+v[2]*114)/1000 > 140;
}

/* =====================================================================
   LAS LEYES, AÑO POR AÑO
   Cada año tiene sus porcentajes. Así un mes viejo NUNCA se recalcula
   con cifras nuevas: enero de 2026 se queda con el 9,45% aunque en
   2028 sea otro.
   Funciona sin internet. Cuando hay señal, busca si usted publicó una
   actualización y la guarda para seguir trabajando sin conexión.
   ===================================================================== */
var LEYES_BASE = {
  "version": 1,

/* lo que vale para un año: primero lo que usted bajó, luego lo de fábrica,
   y si el año no está, se usa el más cercano hacia atrás */
function leyDe(anio){
  var T = (BD.leyes && BD.leyes.anios) ? BD.leyes.anios : LEYES_BASE.anios;
  if(T[anio]) return T[anio];
  var años=Object.keys(T).map(Number).sort(function(a,b){ return a-b; });
  var elegido=años[años.length-1];
  for(var i=0;i<años.length;i++) if(años[i]<=anio) elegido=años[i];
  return T[elegido] || LEYES_BASE.anios["2026"];
}

/* la configuración del mes: la ley de ese año, más lo que usted haya
   cambiado a mano en Configuración */
function cfgDe(anio){
  var L=leyDe(anio), c=BD.cfg;
  var r=Object.assign({}, c);
  ["iess","patronal","fondos","rec50","rec100","recNoche",
   "jornada","horasMes","topeDia","topeSemana"].forEach(function(k){
    /* si usted lo tocó a mano, manda lo suyo; si no, manda la ley */
    r[k] = (c.manual && c.manual[k]!=null) ? c.manual[k] : L[k];
  });
  r.sbu = L.sbu;
  return r;
}

/* ---------------------------------------------------------------------
   BUSCAR ACTUALIZACIÓN
   Lee un archivo pequeño que usted publica. Si trae una versión más
   nueva, se guarda aquí y ya funciona sin internet.
   --------------------------------------------------------------------- */
function urlLeyes(){
  if(BD.cfg.urlLeyes) return BD.cfg.urlLeyes;
  var g=(BD.git||{});
  if(g.user) return "https://raw.githubusercontent.com/"+g.user+"/"+
                    (g.repoLeyes||"cripto")+"/main/leyes.json";
  return "";
}

function buscarLeyes(silencioso){
  var u=urlLeyes();
  if(!u){ if(!silencioso) aviso("Falta la dirección del archivo de leyes.",true); return Promise.resolve(false); }
  return fetch(u, {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("no se pudo leer ("+r.status+")");
    return r.json();
  }).then(function(d){
    if(!d || !d.anios) throw new Error("el archivo no tiene el formato correcto");
    var mio=(BD.leyes&&BD.leyes.version)||LEYES_BASE.version;
    if((d.version||0) <= mio){
      if(!silencioso) aviso("Ya tiene la versión más nueva ("+mio+").");
      return false;
    }
    BD.leyes=d;
    BD.leyesFecha=Date.now();
    FER_cache={};                      /* los feriados se vuelven a calcular */
    guardar(); repintar();
    aviso("Leyes actualizadas a la versión "+d.version+
          (d.actualizado?" ("+d.actualizado+")":"")+".");
    return true;
  }).catch(function(e){
    if(!silencioso) aviso("No se pudo buscar: "+(e.message||e), true);
    return false;
  });
}

/* al abrir, si hay internet, mira una vez al día */
function revisarLeyes(){
  if(!navigator.onLine) return;
  if(!urlLeyes()) return;
  var ultima=BD.leyesRevision||0;
  if(Date.now()-ultima < 86400000) return;    /* ya miró hoy */
  BD.leyesRevision=Date.now();
  try{ localStorage.setItem(LLAVE, JSON.stringify(BD)); }catch(e){}
  buscarLeyes(true);
}

/* =====================================================================
   AYUDAS Y ARRANQUE
   ===================================================================== */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function num(t){
  if(t==null) return null;
  t=String(t).trim().replace(/\s/g,"").replace(/\$/g,"");
  if(!t) return null;
  /* acepta 1.234,56 y 1234.56 */
  if(t.indexOf(",")>=0 && t.indexOf(".")>=0){
    t = t.lastIndexOf(",")>t.lastIndexOf(".") ? t.replace(/\./g,"").replace(",",".")
                                              : t.replace(/,/g,"");
  } else if(t.indexOf(",")>=0) t=t.replace(",",".");
  var v=parseFloat(t);
  return isNaN(v)?null:v;
}
var avTim=null;
function aviso(t, mal){
  var e=document.getElementById("aviso");
  e.textContent=t; e.className="on"+(mal?" mal":"");
  clearTimeout(avTim);
  avTim=setTimeout(function(){ e.className=""; }, mal?4600:2800);
}
function abrir(html, cb){
  var v=document.getElementById("velo"), c=document.getElementById("veloIn");
  c.innerHTML=html; v.className="on";
  c.querySelectorAll("[data-cerrar]").forEach(function(b){ b.onclick=cerrar; });
  v.onmousedown=function(e){ if(e.target===v) cerrar(); };
  if(cb) cb(c);
}
function cerrar(){
  var v=document.getElementById("velo");
  v.className=""; document.getElementById("veloIn").innerHTML="";

/* ---------- navegación ---------- */
function irA(v){
  if(v==="cfg" && hayClave() && !DESBLOQ){
    conPermiso("La configuración está protegida.", function(){ irA("cfg"); });
    return;
  }
  vista=v;
  document.querySelectorAll("nav button").forEach(function(b){
    b.setAttribute("aria-current", b.getAttribute("data-v")===v ? "true":"false");
  });
  repintar();
}
function repintar(){
  var t=document.getElementById("titulo");
  var a=+MES.slice(0,4), m=+MES.slice(5,7)-1;
  if(vista==="mes"){ t.textContent=MESES[m]+" "+a; pintarMes(); }
  if(vista==="anio"){ t.textContent="Resumen de "+a; pintarAnio(); }
  if(vista==="cfg"){ t.textContent="Configuración"; pintarCfg(); }
  ponerSelectores();
  pintarGuardado();
  try{ pintarSync(); }catch(e){}
}
function ponerSelectores(){
  var sm=document.getElementById("selMes"), sa=document.getElementById("selAnio");
  var a=+MES.slice(0,4), m=+MES.slice(5,7)-1;
  if(sm.options.length!==12){
    sm.innerHTML=MESES.map(function(n,i){ return '<option value="'+i+'">'+n+'</option>'; }).join("");
  }
  sm.value=m;
  var hoy=new Date().getFullYear(), años=[];
  for(var y=hoy-3;y<=hoy+2;y++) años.push(y);
  if(años.indexOf(a)<0) años.push(a);
  años.sort();
  var actual=sa.value;
  if(sa.options.length!==años.length || +actual!==a){
    sa.innerHTML=años.map(function(y){ return '<option value="'+y+'">'+y+'</option>'; }).join("");
  }
  sa.value=a;
}
function moverMes(n){
  var a=+MES.slice(0,4), m=+MES.slice(5,7)-1+n;
  while(m<0){ m+=12; a--; }
  while(m>11){ m-=12; a++; }
  MES=claveMes(a,m);
  repintar();
}

/* =====================================================================
   EL BOTÓN GUARDAR
   Guarda en este equipo y, si está conectado, manda todo al otro
   equipo en el momento. Antes no había botón y no se sabía si algo
   se había guardado o no.
   ===================================================================== */
var GUARDADO_HORA="";
function guardarYSincronizar(){
  var b=document.getElementById("bSave");
  guardar();
  GUARDADO_HORA=new Date().toTimeString().slice(0,5);
  if(!gitCfg().token){
    pintarBotonGuardar();
    aviso("Guardado en este equipo · "+GUARDADO_HORA+
          ". Para verlo en el teléfono, conecte la sincronización en Configuración.");
    return;
  }
  if(b){ b.disabled=true; b.textContent="Guardando…"; }
  sincronizar(true).then(function(){
    if(b) b.disabled=false;
    GUARDADO_HORA=new Date().toTimeString().slice(0,5);
    pintarBotonGuardar();
    aviso(SYNC.error
      ? ("Guardado aquí, pero no se pudo mandar al otro equipo: "+SYNC.error)
      : ("Guardado y enviado · "+GUARDADO_HORA+". Ya está en sus otros equipos."),
      !!SYNC.error);
  });
}
function pintarBotonGuardar(){
  var b=document.getElementById("bSave");
  if(!b) return;
  b.disabled=false;
  if(!GUARDADO_HORA){ b.className="b sm ac"; b.textContent="GUARDAR"; return; }
  b.className="b sm ok2";
  b.textContent="Guardado "+GUARDADO_HORA;
  b.title=gitCfg().token ? "Guardado aquí y enviado a sus otros equipos."
                         : "Guardado en este equipo.";
}

function arrancar(){
  cargar();
  try{ aplicarColores(); }catch(e){}
  /* Si el archivo tiene clave y este equipo no la ha escrito, no se
     muestra NADA hasta que la escriban. */
  if(archivoCerrado()){ pedirEntrada(); return; }
  arrancarDeVerdad();
}

function arrancarDeVerdad(){
  var d=new Date();
  MES=claveMes(d.getFullYear(), d.getMonth());
  document.querySelectorAll("nav button").forEach(function(b){
    b.onclick=function(){ irA(b.getAttribute("data-v")); };
  });
  document.getElementById("candado").onclick=tocarCandado;
  document.getElementById("bInst").onclick=instalarApp;
  document.getElementById("bSave").onclick=guardarYSincronizar;
  pintarBotonGuardar();
  /* Ctrl+S guarda, como en cualquier programa */
  document.addEventListener("keydown", function(e){
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="s"){
      e.preventDefault(); guardarYSincronizar();
    }
  });
  DESBLOQ = archivoCerrado() ? DESBLOQ : true;
  document.getElementById("mAnt").onclick=function(){ moverMes(-1); };
  document.getElementById("mSig").onclick=function(){ moverMes(1); };
  document.getElementById("bHoy").onclick=function(){
    var x=new Date(); MES=claveMes(x.getFullYear(), x.getMonth()); irA("mes");
  };
  document.getElementById("selMes").onchange=function(){
    MES=claveMes(+MES.slice(0,4), +this.value); repintar();
  };
  document.getElementById("selAnio").onchange=function(){
    MES=claveMes(+this.value, +MES.slice(5,7)-1); repintar();
  };
  document.addEventListener("keydown", function(e){
    if(e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if(e.key==="ArrowLeft") moverMes(-1);
    if(e.key==="ArrowRight") moverMes(1);
    if(e.key==="Escape") cerrar();
  });
  irA("mes");
  pintarCandado();
  try{ programarSync(); }catch(e){}
  try{ revisarLeyes(); }catch(e){}
  if(gitCfg().token) sincronizar(true);
}

else arrancar();

/* =====================================================================
   DOS CLAVES

   1) LA DEL DUEÑO — la suya. Vive dentro del archivo, no cambia nunca.
      Abre siempre, y es la única que AUTORIZA un equipo nuevo.
   2) LA DEL USUARIO — la que pone su cliente para el día a día.
      Sirve solo en equipos que usted ya autorizó.

   Si el cliente le pasa el archivo a un tercero, en ese equipo nuevo
   la clave del usuario NO abre: pide la del dueño, o un código de
   autorización que usted le genera sin dictar su clave.
   ===================================================================== */
var CANDADO = {
  puesto: false,
  huella: "",        /* huella de la clave del DUEÑO */
  dueño:  "",
  nota:   "",
  sal:    "aqua"     /* fija: así su clave da la misma huella en todos sus archivos */
};

var DESBLOQ=false;     /* edición desbloqueada en esta sesión */
var ESDUEÑO=false;     /* entró con la clave del dueño */

function huella(txt, extra){
  var d=new TextEncoder().encode("HORARIO·v3·"+(extra||"")+"·"+txt);
  if(window.crypto && crypto.subtle && crypto.subtle.digest){
    return crypto.subtle.digest("SHA-256", d).then(function(b){
      return Array.from(new Uint8Array(b)).map(function(x){
        return x.toString(16).padStart(2,"0"); }).join("");
    });
  }
  var h1=0x811c9dc5, h2=0x01000193, h3=0x9e3779b9;
  for(var i=0;i<d.length;i++){
    h1=((h1^d[i])*16777619)>>>0;
    h2=(((h2+d[i]*(i+7))<<5)|(h2>>>27))>>>0;
    h3=((h3^(d[i]+i))*2654435761)>>>0;
  }
  return Promise.resolve([h1,h2,h3].map(function(x){
    return ("00000000"+x.toString(16)).slice(-8); }).join(""));
}

function archivoCerrado(){ return !!(CANDADO.puesto && CANDADO.huella); }

/* ---------- la huella de ESTE equipo ---------- */
function idEquipo(){
  var k=LLAVE+".equipo";
  try{
    var v=localStorage.getItem(k);
    if(v) return v;
    v = Math.random().toString(36).slice(2,8).toUpperCase()+
        Date.now().toString(36).slice(-4).toUpperCase();
    localStorage.setItem(k,v);
    return v;
  }catch(e){ return "SINID0"; }
}
/* el código que el cliente le lee por teléfono: corto y fácil de dictar */
function codigoEquipo(){
  var id=idEquipo();
  return id.slice(0,4)+"-"+id.slice(4,8)+"-"+id.slice(8,10);
}

function equipoAutorizado(){
  try{ return localStorage.getItem(LLAVE+".ok")===CANDADO.huella; }catch(e){ return false; }
}
function autorizarEquipo(){
  try{ localStorage.setItem(LLAVE+".ok", CANDADO.huella); }catch(e){}
}
function quitarAutorizacion(){
  try{ localStorage.removeItem(LLAVE+".ok"); }catch(e){}
}

/* la clave del usuario, guardada en ESTE equipo */
function claveUsuario(){
  try{ return localStorage.getItem(LLAVE+".usr")||""; }catch(e){ return ""; }
}
function ponerClaveUsuario(h){
  try{ if(h) localStorage.setItem(LLAVE+".usr",h); else localStorage.removeItem(LLAVE+".usr"); }catch(e){}
}

/* ---------------------------------------------------------------------
   EL CÓDIGO DE AUTORIZACIÓN
   El cliente le lee el código de su equipo. Usted lo escribe en su
   generador junto con SU clave, y le devuelve la respuesta. Así su
   clave nunca sale de su boca, y ese código no sirve en otro equipo.
   --------------------------------------------------------------------- */
function respuestaPara(codigo, claveDueño){
  return huella(claveDueño, "autorizar·"+String(codigo).replace(/-/g,"").toUpperCase())
    .then(function(h){
      /* 8 dígitos, en dos grupos, fáciles de dictar */
      var n=parseInt(h.slice(0,8),16).toString().slice(-8).padStart(8,"0");
      return n.slice(0,4)+"-"+n.slice(4,8);
    });
}

/* ---------------------------------------------------------------------
   PANTALLA DE ENTRADA
   --------------------------------------------------------------------- */
function pedirEntrada(){
  document.body.classList.add("cerrado");
  var nuevo = !equipoAutorizado();
  var caja=document.createElement("div");
  caja.id="portal";
  caja.innerHTML=
    '<div class="pcaja">'+
      '<div class="plogo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
        'stroke-width="1.9" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/>'+
        '<path d="M8 11V7a4 4 0 018 0v4"/></svg></div>'+
      '<h1>Registro de Horario</h1>'+
      (nuevo
        ? '<p class="pd"><b>Equipo nuevo.</b><br>Este programa no se ha abierto aquí antes. '+
          'Necesita la autorización'+(CANDADO.dueño?' de <b>'+esc(CANDADO.dueño)+'</b>':'')+'.</p>'+
          '<div class="pcod"><span>Código de este equipo</span><b>'+codigoEquipo()+'</b></div>'
        : '<p class="pd">Escriba su clave para entrar.</p>')+
      (CANDADO.nota?'<div class="pnota">'+esc(CANDADO.nota)+'</div>':'')+
      '<input type="password" id="pClave" placeholder="'+
        (nuevo?"Clave del dueño":"Su clave")+'" autocomplete="off">'+
      (nuevo?'<div class="posep">o</div>'+
        '<input type="text" id="pCodigo" placeholder="Código de autorización" '+
        'autocomplete="off" inputmode="numeric">':'')+
      '<div class="pmsg" id="pMsg"></div>'+
      '<button class="b ac grande" id="pOk">Entrar</button>'+
      (nuevo?'<div class="ppie">Léale el código de arriba a quien le entregó el programa '+
        'y él le dará la autorización.</div>'
             :'<div class="ppie">Sin la clave no se muestra ningún dato.</div>')+
    '</div>';
  document.body.appendChild(caja);

  var inp=caja.querySelector("#pClave");
  setTimeout(function(){ try{ inp.focus(); }catch(e){} },120);
  var fallos=0;

  function mal(txt){
    fallos++;
    caja.querySelector("#pMsg").innerHTML='<span class="dn">'+txt+'</span>';
    var c=caja.querySelector(".pcaja");
    c.classList.remove("tiembla"); void c.offsetWidth; c.classList.add("tiembla");
  }
  function entrar(comoDueño){
    ESDUEÑO=!!comoDueño;
    DESBLOQ=!!comoDueño;
    autorizarEquipo();
    caja.classList.add("va");
    setTimeout(function(){
      caja.remove();
      document.body.classList.remove("cerrado");
      arrancarDeVerdad();
      /* si es la primera vez en este equipo y todavía no hay clave propia,
         se le ofrece ponerla — sea el dueño o el cliente */
      if(!claveUsuario()) setTimeout(ofrecerClaveUsuario, 650);
    }, 260);
  }

  function probar(){
    var v=inp.value.trim();
    var cod=caja.querySelector("#pCodigo");
    var codV=cod?cod.value.trim():"";

    /* 1 · el código de autorización, solo en equipo nuevo */
    if(nuevo && codV){
      respuestaEsperada(codV).then(function(ok){
        if(ok) entrar(false);
        else mal("Ese código no corresponde a este equipo.");
      });
      return;
    }
    if(!v){ mal("Escriba la clave."); return; }

    /* 2 · la clave del DUEÑO: abre siempre, en cualquier equipo */
    huella(v, "aqua").then(function(h){
      if(h===CANDADO.huella){ entrar(true); return; }
      /* 3 · la clave del USUARIO: solo si el equipo ya está autorizado */
      if(!nuevo && claveUsuario()){
        huella(v, "usuario·"+CANDADO.sal).then(function(hu){
          if(hu===claveUsuario()) entrar(false);
          else mal("Esa clave no es"+(fallos>1?" · si es un equipo nuevo, pida el código":"")+".");
        });
        return;
      }
      mal(nuevo ? "Esa no es la clave del dueño."
                : "Esa clave no es.");
    });
  }
  caja.querySelector("#pOk").onclick=probar;
  inp.onkeydown=function(e){ if(e.key==="Enter") probar(); };
  var cc=caja.querySelector("#pCodigo");
  if(cc) cc.onkeydown=function(e){ if(e.key==="Enter") probar(); };
}

/* comprueba que la respuesta corresponda a ESTE equipo */
function respuestaEsperada(dado){
  var limpio=String(dado).replace(/[^0-9]/g,"");
  return huellaCodigoLocal().then(function(esperado){
    return esperado.replace(/[^0-9]/g,"")===limpio;
  });
}
/* el equipo no conoce la clave del dueño, así que compara contra la
   huella guardada: el código sale de huella(clave)+código del equipo */
function huellaCodigoLocal(){
  var d=new TextEncoder().encode("HORARIO·v3·resp·"+CANDADO.huella+"·"+idEquipo());
  function fin(hex){
    var n=parseInt(hex.slice(0,8),16).toString().slice(-8).padStart(8,"0");
    return n.slice(0,4)+"-"+n.slice(4,8);
  }
  if(window.crypto && crypto.subtle && crypto.subtle.digest){
    return crypto.subtle.digest("SHA-256", d).then(function(b){
      return fin(Array.from(new Uint8Array(b)).map(function(x){
        return x.toString(16).padStart(2,"0"); }).join(""));
    });
  }
  var h=0x811c9dc5;
  for(var i=0;i<d.length;i++) h=((h^d[i])*16777619)>>>0;
  return Promise.resolve(fin(("00000000"+h.toString(16)).slice(-8).repeat(2)));
}

/* ---------------------------------------------------------------------
   OFRECER LA CLAVE DE USUARIO al entrar como dueño
   --------------------------------------------------------------------- */
function ofrecerClaveUsuario(){
  abrir('<div class="hoja" style="max-width:430px"><div class="hh">'+
    '<h3>Ponga su clave</h3><button class="x" data-cerrar>×</button></div><div class="hb">'+
    '<p class="mut" style="margin:0 0 12px;font-size:13px;line-height:1.7">'+
    'Este equipo ya está autorizado. Ponga <b>su propia clave</b> para el día a día, '+
    'y así nadie de su oficina abre el programa.</p>'+
    '<div class="campos">'+
      '<div class="campo ancho"><label>Su clave</label>'+
        '<input type="password" id="uC1" autocomplete="new-password"></div>'+
      '<div class="campo ancho"><label>Escríbala otra vez</label>'+
        '<input type="password" id="uC2" autocomplete="new-password"></div>'+
    '</div>'+
    '<div class="nota">La del dueño sigue funcionando siempre.</div>'+
    '</div><div class="hf"><button class="b" data-cerrar>Ahora no</button>'+
    '<button class="b ac" id="uOk">Guardar mi clave</button></div></div>',
  function(M){
    M.querySelector("#uOk").onclick=function(){
      var a=M.querySelector("#uC1").value, c=M.querySelector("#uC2").value;
      if(a.length<4){ aviso("Al menos 4 caracteres.",true); return; }
      if(a!==c){ aviso("No son iguales.",true); return; }
      huella(a,"usuario·"+CANDADO.sal).then(function(h){
        ponerClaveUsuario(h); cerrar();
        aviso("Guardada. La próxima vez entra con su clave.");
        if(vista==="cfg") pintarCfg();
      });
    };
  });
}

/* ---------------------------------------------------------------------
   PERMISOS DE EDICIÓN
   --------------------------------------------------------------------- */
function hayClave(){ return archivoCerrado(); }
function estaAbierto(){ return !hayClave() || DESBLOQ; }

function conPermiso(motivo, seguir){
  if(estaAbierto()){ seguir(); return; }
  abrir('<div class="hoja" style="max-width:410px"><div class="hh">'+
    '<h3>'+ico("llave")+' Clave</h3><button class="x" data-cerrar>×</button></div>'+
    '<div class="hb"><p class="mut" style="margin:0 0 12px;font-size:13px;line-height:1.7">'+
      esc(motivo)+'<br>Escriba su clave para continuar.</p>'+
      '<div class="campo"><label>Clave</label>'+
        '<input type="password" id="kC" autocomplete="off"></div>'+
      '<div class="nota" id="kMsg"></div></div>'+
    '<div class="hf"><button class="b" data-cerrar>Cancelar</button>'+
    '<button class="b ac" id="kOk">Desbloquear</button></div></div>',
  function(M){
    var inp=M.querySelector("#kC");
    setTimeout(function(){ try{ inp.focus(); }catch(e){} },60);
    function probar(){
      var v=inp.value;
      huella(v, "aqua").then(function(h){
        if(h===CANDADO.huella){ ESDUEÑO=true; ok(); return; }
        if(claveUsuario()){
          huella(v,"usuario·"+CANDADO.sal).then(function(hu){
            if(hu===claveUsuario()) ok();
            else falla();
          });
        } else falla();
      });
      function ok(){
        DESBLOQ=true; cerrar(); pintarCandado(); seguir();
        aviso("Desbloqueado hasta que cierre el programa.");
      }
      function falla(){
        M.querySelector("#kMsg").innerHTML='<span class="dn">Esa clave no es.</span>';
        inp.value=""; inp.focus();
      }
    }
    M.querySelector("#kOk").onclick=probar;
    inp.onkeydown=function(e){ if(e.key==="Enter") probar(); };
  });
}

function pintarCandado(){
  var b=document.getElementById("candado");
  if(!b) return;
  if(!hayClave()){ b.style.display="none"; return; }
  b.style.display="";
  if(DESBLOQ){
    b.className="b sm abierto";
    b.innerHTML=ico("abierto")+(ESDUEÑO?"Dueño":"Abierto");
    b.title=ESDUEÑO?"Entró como dueño.":"Puede editar. Toque para bloquear.";
  } else {
    b.className="b sm cerrado";
    b.innerHTML=ico("llave")+"Bloqueado";
    b.title="Toque para desbloquear con su clave.";
  }
}
function tocarCandado(){
  if(!hayClave()) return;
  if(DESBLOQ){ DESBLOQ=false; pintarCandado(); repintar(); aviso("Bloqueado."); }
  else conPermiso("Va a desbloquear la edición.", function(){ repintar(); });
}

/* =====================================================================
   CONFIGURACIÓN: LAS DOS CLAVES
   ===================================================================== */
function panelCandado(){
  var h='<div class="pan"><div class="pt">'+ico("llave")+'CLAVES Y ENTREGA'+
    '<span class="sp"></span><span class="chip '+(archivoCerrado()?"l":"s")+'">'+
    (archivoCerrado()?"protegido":"sin clave")+'</span></div>';

  /* --- estado --- */
  if(archivoCerrado()){
    h+='<div class="fcalc">Este archivo pide clave al abrirse'+
      (CANDADO.dueño?', y dice ser de <b>'+esc(CANDADO.dueño)+'</b>':'')+'.<br>'+
      'Código de este equipo: <b>'+codigoEquipo()+'</b>'+
      (ESDUEÑO?' · <b class="up">entró como dueño</b>':'')+
      (claveUsuario()?'<br>Este equipo tiene además su propia clave de usuario.':'')+
    '</div>';
  } else {
    h+='<div class="fcalc"><b class="dn">Sin clave.</b> Cualquiera que copie este '+
       'archivo lo abre y ve todos los datos.</div>';
  }

  /* --- clave del usuario, si el equipo ya está autorizado --- */

function engancharCandado(box){
  var b;

  /* --- clave del usuario --- */
  if((b=box.querySelector("#uSet"))) b.onclick=function(){
    var a=box.querySelector("#uS1").value, c=box.querySelector("#uS2").value;
    if(a.length<4){ aviso("Al menos 4 caracteres.",true); return; }
    if(a!==c){ aviso("Las dos claves no son iguales.",true); return; }
    huella(a,"usuario·"+CANDADO.sal).then(function(h){
      ponerClaveUsuario(h); pintarCfg();
      aviso("Guardada. La próxima vez entra con su clave.");
    });
  };
  if((b=box.querySelector("#uDel"))) b.onclick=function(){
    conPermiso("Va a quitar su clave de trabajo.", function(){
      ponerClaveUsuario(""); pintarCfg();
      aviso("Quitada. Ahora solo entra con la clave del dueño.");
    });
  };

  /* --- generar el archivo --- */
  if((b=box.querySelector("#caGen"))) b.onclick=function(){
    var a=box.querySelector("#caC1").value, c=box.querySelector("#caC2").value;
    if(a.length<4){ aviso("La clave del dueño debe tener al menos 4 caracteres.",true); return; }
    if(a!==c){ aviso("Las dos claves no son iguales.",true); return; }
    huella(a, "aqua").then(function(h){
      BD.dueñoH=h;                      /* para poder autorizar equipos después */
      guardar();
      generarArchivo(h, "aqua",
        box.querySelector("#caD").value.trim(),
        box.querySelector("#caN").value.trim(),
        box.querySelector("#caDat").value==="1");
    });
  };
  if((b=box.querySelector("#caLimpio"))) b.onclick=function(){
    conPermiso("Va a descargar una copia SIN clave.", function(){
      generarArchivo("", "", "", "", true);
    });
  };

  /* --- autorizar un equipo nuevo --- */
  if((b=box.querySelector("#auOk"))) b.onclick=function(){
    var cod=box.querySelector("#auC").value.trim();
    var k=box.querySelector("#auK").value;
    if(!cod){ aviso("Escriba el código que le leyeron.",true); return; }
    if(!k){ aviso("Escriba su clave de dueño.",true); return; }
    huella(k, "aqua").then(function(h){
      var esperada = archivoCerrado() ? CANDADO.huella : (BD.dueñoH||"");
      if(esperada && h!==esperada){
        aviso("Esa no es su clave de dueño.",true); return;
      }
      if(!esperada){
        aviso("Primero genere un archivo protegido: así queda registrada su clave.",true);
        return;
      }
      return respuestaDeAutorizacion(cod, h).then(function(r){
        var e=box.querySelector("#auR");
        e.style.display="";
        e.innerHTML='<div class="frt">DÍCTELE ESTA RESPUESTA</div>'+
          '<div class="frv">'+r+'</div>'+
          '<div class="frs">Solo sirve en el equipo <b>'+esc(cod.toUpperCase())+'</b>.<br>'+
          'Con eso entrará y podrá poner su propia clave.</div>';
      });
    });
  };
}

/* la respuesta se calcula igual que la espera el otro equipo */
function respuestaDeAutorizacion(codigo, huellaDueño){
  var id=String(codigo).replace(/[^A-Z0-9]/gi,"").toUpperCase();
  var d=new TextEncoder().encode("HORARIO·v3·resp·"+huellaDueño+"·"+id);
  function fin(hex){
    var n=parseInt(hex.slice(0,8),16).toString().slice(-8).padStart(8,"0");
    return n.slice(0,4)+"-"+n.slice(4,8);
  }
  if(window.crypto && crypto.subtle && crypto.subtle.digest){
    return crypto.subtle.digest("SHA-256", d).then(function(b){
      return fin(Array.from(new Uint8Array(b)).map(function(x){
        return x.toString(16).padStart(2,"0"); }).join(""));
    });
  }
  var h=0x811c9dc5;
  for(var i=0;i<d.length;i++) h=((h^d[i])*16777619)>>>0;
  return Promise.resolve(fin(("00000000"+h.toString(16)).slice(-8).repeat(2)));
}

/* =====================================================================
   ARMAR EL ARCHIVO QUE SE ENTREGA
   Se limpia todo lo dibujado, porque si no el archivo se llevaría los
   datos ya pintados y cualquiera los leería con el bloc de notas.
   ===================================================================== */
function generarArchivo(huellaNueva, sal, dueño, nota, conDatos){
  var copia=document.documentElement.cloneNode(true);

  ["cuerpo","veloIn","aviso"].forEach(function(id){
    var e=copia.querySelector("#"+id); if(e) e.innerHTML="";
  });
  var v=copia.querySelector("#velo"); if(v) v.className="";
  var p=copia.querySelector("#portal"); if(p) p.remove();
  var t=copia.querySelector("#titulo"); if(t) t.textContent="Registro de horario";
  ["pieV","usrNom","usrCar","usrIni"].forEach(function(id){
    var e=copia.querySelector("#"+id); if(e) e.textContent="";
  });
  var b=copia.querySelector("body");
  if(b){ b.className=""; b.removeAttribute("style"); }
  copia.removeAttribute("style");
  copia.querySelectorAll("select").forEach(function(s){ s.innerHTML=""; });
  copia.querySelectorAll("#candado,#sync").forEach(function(e){
    e.style.display="none"; e.innerHTML="";
  });

  var html=copia.outerHTML;

  var bloque = 'var CANDADO = {\n'+
    '  puesto: '+(huellaNueva?"true":"false")+',\n'+
    '  huella: "'+huellaNueva+'",\n'+
    '  dueño:  '+JSON.stringify(dueño||"")+',\n'+
    '  nota:   '+JSON.stringify(nota||"")+',\n'+
    '  sal:    '+JSON.stringify(sal||"aqua")+'\n};';
  var re=/var CANDADO = \{[\s\S]*?\n\};/;
  if(!re.test(html)){ aviso("No se pudo preparar el archivo.",true); return; }
  html=html.replace(re, bloque);

  if(!conDatos){
    var reS=/var SEMILLA=\{[\s\S]*?\};\n/;
    if(reS.test(html)) html=html.replace(reS, "var SEMILLA={};\n");
    else html=html.replace(/var SEMILLA=[^\n]*\n/, "var SEMILLA={};\n");
  }
  html="<!DOCTYPE html>\n"+html;

  /* comprobación final: que no se haya colado nada suyo */
  if(!conDatos){
    var fuga=null;
    Object.keys(BD.meses||{}).some(function(k){
      var d=BD.meses[k].dias||{};
      return Object.keys(d).some(function(iso){
        var o=d[iso].obs;
        if(o && o.length>4 && html.indexOf(o)>=0){ fuga="una observación suya"; return true; }
        return false;
      });
    });
    if(fuga){ aviso("No se descargó: se detectó "+fuga+" dentro del archivo.",true); return; }
  }

  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([html],{type:"text/html;charset=utf-8"}));
  a.download = huellaNueva ? "HORARIO-protegido.html" : "HORARIO-sin-clave.html";
  a.click();
  setTimeout(function(){ try{ URL.revokeObjectURL(a.href); }catch(e){} }, 4000);
  aviso(huellaNueva
    ? ("Descargado"+(conDatos?" CON sus datos":" limpio")+". Ese es el que entrega.")
    : "Descargado sin clave. Guárdelo: con él recupera el acceso.");
}

/* =====================================================================
   SINCRONIZAR TELÉFONO Y COMPUTADORA
   Usa la MISMA clave de GitHub que ya tiene. Los datos van a un
   repositorio privado suyo, en un archivo aparte (horario.json), así
   que no se mezcla con nada más.
   ===================================================================== */
var SYNC={ocupado:false, ultimo:null, error:"", auto:null};
function gitCfg(){ return BD.git||{}; }

function gh(ruta, opciones){
  var g=gitCfg();
  if(!g.token) return Promise.reject(new Error("Falta la clave de GitHub"));
  var o=Object.assign({}, opciones||{});
  o.headers=Object.assign({
    "Authorization":"Bearer "+g.token,
    "Accept":"application/vnd.github+json",
    "X-GitHub-Api-Version":"2022-11-28"
  }, o.headers||{});
  return fetch("https://api.github.com"+ruta,o).then(function(r){
    if(r.status===401) throw new Error("La clave no sirve o se venció");
    if(r.status===403) throw new Error("La clave no tiene permiso sobre repositorios");
    if(r.status===404) return {__falta:true};
    if(!r.ok) throw new Error("GitHub respondió "+r.status);
    return r.json();
  });
}

function conectarGit(token){
  BD.git=Object.assign(gitCfg(),{token:token});
  return gh("/user").then(function(u){
    if(u.__falta||!u.login) throw new Error("No se pudo leer su cuenta");
    BD.git.user=u.login;
    var repo=gitCfg().repo||"portafolio-cripto";
    BD.git.repo=repo;
    return gh("/repos/"+u.login+"/"+repo).then(function(r){
      if(!r.__falta) return r;
      return gh("/user/repos",{method:"POST",body:JSON.stringify({
        name:repo, private:true, auto_init:true,
        description:"Mis datos privados"})});
    });
  }).then(function(){ guardar(); return sincronizar(true); });
}

function bajarRemoto(){
  var g=gitCfg();
  return gh("/repos/"+g.user+"/"+g.repo+"/contents/horario.json").then(function(r){
    if(r.__falta) return {datos:null, sha:null};
    var txt;
    try{ txt=decodeURIComponent(escape(atob((r.content||"").replace(/\n/g,"")))); }
    catch(e){ txt=atob((r.content||"").replace(/\n/g,"")); }
    var d=null;
    try{ d=JSON.parse(txt); }catch(e){}
    return {datos:d, sha:r.sha};
  });
}
function subirRemoto(sha){
  var g=gitCfg();
  var paquete={cfg:BD.cfg, meses:BD.meses, feriados:BD.feriados, quitados:BD.quitados,
               equipo:nombreEquipo(), mod:BD.mod||Date.now(), guardado:Date.now()};
  var txt=JSON.stringify(paquete,null,1), b64;
  try{ b64=btoa(unescape(encodeURIComponent(txt))); }catch(e){ b64=btoa(txt); }
  var cuerpo={message:"horario · "+nombreEquipo()+" · "+hoyISO(), content:b64};
  if(sha) cuerpo.sha=sha;
  return gh("/repos/"+g.user+"/"+g.repo+"/contents/horario.json",
    {method:"PUT", body:JSON.stringify(cuerpo)});
}
function nombreEquipo(){
  if(BD.equipo) return BD.equipo;
  return /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent||"") ? "teléfono" : "computadora";
}

/* junta los dos lados: cada MES se compara por separado, así lo que
   escribió en el teléfono no borra lo de la computadora */
/* ---------------------------------------------------------------------
   JUNTAR LO DE LOS DOS EQUIPOS
   Se compara DÍA POR DÍA, no mes por mes: cada día lleva la hora en que
   se escribió, y gana el más reciente. Antes se comparaba el mes entero
   con una hora que nunca se guardaba, así que el último en sincronizar
   pisaba al otro y nunca coincidían.
   --------------------------------------------------------------------- */
function lleno(x){
  return !!(x && (x.e1||x.s1||x.e2||x.s2||x.perm||x.obs||x.tipo));
}
function juntarMeses(local, remoto){
  var r={};
  var claves={};
  Object.keys(local||{}).forEach(function(k){ claves[k]=1; });
  Object.keys(remoto||{}).forEach(function(k){ claves[k]=1; });

  Object.keys(claves).forEach(function(k){
    var A=(local||{})[k], B=(remoto||{})[k];
    if(!A){ r[k]=B; return; }
    if(!B){ r[k]=A; return; }

    var dias={};
    var isos={};
    Object.keys(A.dias||{}).forEach(function(i){ isos[i]=1; });
    Object.keys(B.dias||{}).forEach(function(i){ isos[i]=1; });

    Object.keys(isos).forEach(function(iso){
      var a=(A.dias||{})[iso], b=(B.dias||{})[iso];
      if(!lleno(a) && !lleno(b)){ if(a||b) dias[iso]=a||b; return; }
      if(!lleno(b)){ dias[iso]=a; return; }      /* allá vacío, acá lleno */
      if(!lleno(a)){ dias[iso]=b; return; }      /* acá vacío, allá lleno */
      /* los dos con horas: gana el escrito más tarde */
      dias[iso] = (+a.mod||0) >= (+b.mod||0) ? a : b;
    });

    /* los descuentos: gana el mes tocado más tarde */
    var nuevoA = (+A.mod||0) >= (+B.mod||0);
    var F = nuevoA ? A : B, G = nuevoA ? B : A;
    r[k]={ dias:dias,
      anticipo: (F.anticipo!=null && F.anticipo!==0) ? F.anticipo : (G.anticipo||0),
      prest:    (F.prest!=null    && F.prest!==0)    ? F.prest    : (G.prest||0),
      otros:    (F.otros!=null    && F.otros!==0)    ? F.otros    : (G.otros||0),
      otrosNom: F.otrosNom || G.otrosNom || "",
      nota:     F.nota || G.nota || "",
      mod: Math.max(+A.mod||0, +B.mod||0) };
  });
  return r;
}

function sincronizar(silencioso){
  var g=gitCfg();
  if(!g.token||!g.user){ if(!silencioso) aviso("Primero conecte su cuenta.",true); return Promise.resolve(); }
  if(SYNC.ocupado) return Promise.resolve();
  SYNC.ocupado=true; pintarSync("trabajando");
  return bajarRemoto().then(function(r){
    var d=r.datos;
    if(d){
      BD.meses=juntarMeses(BD.meses, d.meses);
      BD.feriados=Object.assign({}, d.feriados||{}, BD.feriados||{});
      BD.quitados=Object.assign({}, d.quitados||{}, BD.quitados||{});
      if(d.cfg && (d.mod||0)>(BD.mod||0)){
        var tk=BD.git;
        BD.cfg=Object.assign(BD.cfg, d.cfg);
        BD.git=tk;
      }
    }
    return subirRemoto(r.sha);
  }).then(function(){
    SYNC.ocupado=false; SYNC.ultimo=Date.now(); SYNC.error="";
    guardar(); repintar();
    if(!silencioso) aviso("Sincronizado. Sus horas están en todos sus equipos.");
  }).catch(function(e){
    SYNC.ocupado=false; SYNC.error=String(e&&e.message||e);
    pintarSync("mal");
    if(!silencioso) aviso("No se pudo sincronizar: "+SYNC.error, true);
  });
}
function pintarSync(estado){
  var e=document.getElementById("sync");
  if(!e) return;
  if(!gitCfg().token){ e.style.display="none"; return; }
  e.style.display="";
  if(estado==="trabajando"){ e.className="syn"; e.innerHTML='<i></i>sincronizando…'; return; }
  if(estado==="mal"||SYNC.error){ e.className="syn mal"; e.innerHTML='<i></i>sin sincronizar'; return; }
  e.className="syn ok";
  e.innerHTML='<i></i>'+(SYNC.ultimo?"guardado "+new Date(SYNC.ultimo).toTimeString().slice(0,5):"conectado");
}
function programarSync(){
  clearInterval(SYNC.auto);
  if(!gitCfg().token || !BD.gitAuto) return;
  SYNC.auto=setInterval(function(){ sincronizar(true); }, 90000);
}

function engancharSync(box){
  var bConn=box.querySelector("#gConn");
  if(bConn) bConn.onclick=function(){
    var t=box.querySelector("#gTok").value.trim();
    if(!t){ aviso("Pegue la clave.",true); return; }
    var eq=box.querySelector("#gEq").value.trim();
    if(eq) BD.equipo=eq;
    bConn.disabled=true; bConn.textContent="Conectando…";
    conectarGit(t).then(function(){
      BD.gitAuto=true; guardar(); programarSync(); repintar();
      aviso("Conectado. Ponga la misma clave en su otro equipo.");
    }).catch(function(e){
      BD.git={}; guardar();
      bConn.disabled=false; bConn.textContent="Conectar";
      aviso("No se pudo conectar: "+(e.message||e), true);
    });
  };
  var bS=box.querySelector("#gSync");
  if(bS) bS.onclick=function(){ sincronizar(false); };
  var bA=box.querySelector("#gAuto");
  if(bA) bA.onchange=function(){ BD.gitAuto=this.value==="1"; guardar(); programarSync(); };
  var bE=box.querySelector("#gEq2");
  if(bE) bE.onchange=function(){ BD.equipo=this.value.trim(); guardar(); };

  if(bD) bD.onclick=function(){
    confirmar("Desconectar","Este equipo deja de sincronizar. Sus datos siguen aquí.","Desconectar",
      function(){ BD.git={}; BD.gitAuto=false; guardar(); clearInterval(SYNC.auto);
                  repintar(); aviso("Desconectado."); });
  };
}

function mesAnterior(clave){

  if(m<0){ m=11; a--; }

  return BD.meses[k] ? calcMes(k) : null;

function curvaMes(c){
  var W=560, H=152, P=34, acc=0, pts=[], max=0;
  c.filas.forEach(function(f){ acc+=f.trab; pts.push(acc); });
  max=Math.max.apply(null, pts)||60;
  var n=pts.length;
  function X(i){ return P + i*(W-P-8)/Math.max(1,n-1); }
  function Y(v){ return H-22 - v*(H-40)/max; }
  var d="";
  pts.forEach(function(v,i){ d += (i?" L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1); });
  var area = d+" L"+X(n-1).toFixed(1)+" "+(H-22)+" L"+X(0).toFixed(1)+" "+(H-22)+" Z";
  var ejes="";
  for(var k=0;k<=4;k++){
    var v=max*k/4, y=Y(v);
    ejes+='<line x1="'+P+'" y1="'+y.toFixed(1)+'" x2="'+(W-8)+'" y2="'+y.toFixed(1)+
      '" stroke="var(--ln)" stroke-width="1" opacity=".45"/>'+
      '<text x="'+(P-6)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="9" '+
      'fill="var(--t3)" font-family="Consolas,monospace">'+Math.round(v/60)+'</text>';
  }
  var marcas="";
  [1,5,10,15,20,25,n].forEach(function(dd){
    if(dd>n||dd<1) return;
    marcas+='<text x="'+X(dd-1).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9" '+
      'fill="var(--t3)" font-family="Consolas,monospace">'+dd+'</text>';
  });
  var puntos="";
  c.filas.forEach(function(f,i){
    if(f.trab<=0) return;
    var col = f.ext100>0 ? "var(--c100)" : (f.sup50>0 ? "var(--c50)" : "var(--ac)");
    puntos+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(pts[i]).toFixed(1)+'" r="3" fill="'+col+
      '" stroke="var(--b1)" stroke-width="1.5"><title>día '+(i+1)+": "+fh(f.trab)+'</title></circle>';
  });
  return '<svg class="curva" viewBox="0 0 '+W+' '+H+'">'+
    '<defs><linearGradient id="gcur" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="var(--ac)" stop-opacity=".40"/>'+
      '<stop offset="100%" stop-color="var(--ac)" stop-opacity="0"/>'+
    '</linearGradient></defs>'+
    ejes+'<path d="'+area+'" fill="url(#gcur)"/>'+
    '<path d="'+d+'" fill="none" stroke="var(--ac)" stroke-width="2.2" '+
    'stroke-linejoin="round" stroke-linecap="round"/>'+puntos+marcas+'</svg>';
}

function dibujarRosca(c){

  if(!tot) return;
  var partes=[[norm,"var(--ac)"],[c.tSup,"var(--c50)"],[c.tExt,"var(--c100)"]];
  var r=58, circ=2*Math.PI*r, off=0;
  partes.forEach(function(p){
    if(p[0]<=0) return;
    var largo=p[0]/tot*circ;
    var e=document.createElementNS("http://www.w3.org/2000/svg","circle");
    e.setAttribute("cx",80); e.setAttribute("cy",80); e.setAttribute("r",r);
    e.setAttribute("fill","none"); e.setAttribute("stroke",p[1]);
    e.setAttribute("stroke-width",22);
    e.setAttribute("stroke-dasharray", largo.toFixed(2)+" "+(circ-largo).toFixed(2));
    e.setAttribute("stroke-dashoffset", (-off).toFixed(2));
    e.setAttribute("transform","rotate(-90 80 80)");
    s.appendChild(e);
    off+=largo;
  });
}

/* ---------- los enganches ---------- */
function engancharMes(c){
  var box=document.getElementById("cuerpo");

  /* ------------------------------------------------------------------
     ESCRIBIR LAS HORAS
     OJO: NO se redibuja la tabla al escribir. Antes se volvía a pintar
     todo con cada tecla y por eso saltaba el cursor y se escribía mal.
     Ahora solo se actualizan las celdas de ESA fila y los totales.
     ------------------------------------------------------------------ */
  box.querySelectorAll("tr[data-d]").forEach(function(tr){
    var iso=tr.getAttribute("data-d");
    tr.querySelectorAll("[data-c]").forEach(function(inp){
      inp.addEventListener("input", function(){ anotar(tr, iso, inp); });
      inp.addEventListener("change", function(){ anotar(tr, iso, inp); });
      /* Enter o flechas: pasar a la siguiente casilla, como en Excel */
      inp.addEventListener("keydown", function(e){
        if(e.key==="Enter"){ e.preventDefault(); mover(tr, inp, e.shiftKey?-1:1); }
        if(e.key==="ArrowDown" && inp.type!=="time"){ e.preventDefault(); bajarFila(tr, inp); }
        if(e.key==="ArrowUp" && inp.type!=="time"){ e.preventDefault(); subirFila(tr, inp); }
      });
    });
    tr.querySelector(".cdia").onclick=function(){ marcarDia(iso); };
    tr.querySelector(".cfec").onclick=function(){ marcarDia(iso); };
  });

  /* guarda el dato y refresca SOLO lo que cambió de esa fila */
  function anotar(tr, iso, inp){
    var m=mesDe(MES);
    if(!m.dias[iso]) m.dias[iso]=diaVacio();
    m.dias[iso][inp.getAttribute("data-c")]=inp.value;
    m.dias[iso].mod=Date.now();     /* la hora de ESTE día, para sincronizar bien */
    m.mod=Date.now();
    guardar();
    GUARDADO_HORA=""; pintarBotonGuardar();
    refrescarFila(tr, iso);
    refrescarTotales();
  }

  /* vuelve a calcular una sola fila, sin tocar el resto */
  function refrescarFila(tr, iso){
    var m=mesDe(MES);
    var f=calcDia(iso, m.dias[iso], cfgDe(+MES.slice(0,4)));
    var tot=tr.querySelector(".ctot");
    if(tot){ tot.textContent=fh(f.trab); tot.className="ctot"+(f.trab?"":" nada"); }
    var c50=tr.children[7], c100=tr.children[8];
    if(c50)  c50.innerHTML  = f.sup50 ?'<span class="p50">'+fh(f.sup50)+'</span>'  :'<span class="nada">—</span>';
    if(c100) c100.innerHTML = f.ext100?'<span class="p100">'+fh(f.ext100)+'</span>':'<span class="nada">—</span>';
  }

  /* los totales del pie y las cifras de arriba */
  function refrescarTotales(){
    var c2=calcMes(MES);
    var pie=box.querySelector(".tdias tfoot tr");
    if(pie){
      pie.children[1].innerHTML='<b>'+fh(c2.tTrab)+'</b>';
      pie.children[2].innerHTML='<b class="p50">'+fh(c2.tSup)+'</b>';
      pie.children[3].innerHTML='<b class="p100">'+fh(c2.tExt)+'</b>';
      pie.children[4].innerHTML='<b>'+(fh(c2.tPerm)||"—")+'</b>';
    }
    var big=box.querySelector(".pbig");
    if(big) big.textContent=usd(c2.neto);
    var pv=document.getElementById("pieV");
    if(pv) pv.textContent=usd(c2.neto);
    clearTimeout(refrescarTotales._t);
    refrescarTotales._t=setTimeout(function(){ if(vista==="mes") pintarMes(); }, 2500);
  }

  /* moverse entre casillas como en Excel */
  function casillas(){
    return [].slice.call(box.querySelectorAll(".tdias [data-c]"));
  }
  function mover(tr, inp, paso){
    var t=casillas(), i=t.indexOf(inp);
    var s=t[i+paso];
    if(s){ s.focus(); if(s.select) try{ s.select(); }catch(e){} }
  }
  function bajarFila(tr, inp){ saltarFila(tr, inp, 1); }
  function subirFila(tr, inp){ saltarFila(tr, inp, -1); }
  function saltarFila(tr, inp, dir){
    var col=inp.getAttribute("data-c");
    var filas=[].slice.call(box.querySelectorAll("tr[data-d]"));
    var i=filas.indexOf(tr), s=filas[i+dir];
    if(!s) return;
    var n=s.querySelector('[data-c="'+col+'"]');
    if(n){ n.focus(); if(n.select) try{ n.select(); }catch(e){} }
  }

  var b;
  if((b=box.querySelector("#bLlenar"))) b.onclick=llenarHorarioFijo;
  if((b=box.querySelector("#bCopiar"))) b.onclick=pegarEnVarios;
  box.querySelectorAll("[data-cop]").forEach(function(x){
    x.onclick=function(e){ e.stopPropagation(); copiarDia(x.getAttribute("data-cop")); };
  });
  box.querySelectorAll("[data-peg]").forEach(function(x){
    x.onclick=function(e){ e.stopPropagation(); pegarDia(x.getAttribute("data-peg")); };
  });
  if((b=box.querySelector("#bImp"))) b.onclick=imprimirMes;
  if((b=box.querySelector("#bXls"))) b.onclick=bajarExcel;
  if((b=box.querySelector("#bLimpiar"))) b.onclick=function(){
    conPermiso("Borrar un mes entero necesita su clave.", function(){
    confirmar("Limpiar el mes",
      "Se borran todas las horas de "+MESES[c.mes]+" "+c.anio+". Los descuentos se conservan.",
      "Limpiar", function(){
        mesDe(MES).dias={}; guardar(); pintarMes(); aviso("Mes limpio.");
      }, true);
    });
  };
  ["fAnt|anticipo","fPre|prest","fOtro|otros"].forEach(function(par){
    var p=par.split("|"), e=box.querySelector("#"+p[0]);
    if(e) e.addEventListener("change", function(){
      mesDe(MES)[p[1]]=num(e.value)||0; guardar(); pintarMes();
    });
  });
  var on=box.querySelector("#fOtroN");
  if(on) on.addEventListener("change", function(){
    mesDe(MES).otrosNom=on.value.trim(); guardar();
  });
}

/* =====================================================================
   COPIAR Y PEGAR UN DÍA
   Hay días que se repiten toda la semana. Se copia uno y se pega en los
   que quiera, sin escribir cuatro horas cada vez.
   ===================================================================== */
var DIA_COPIADO=null;

function copiarDia(iso){
  var m=mesDe(MES), d=m.dias[iso];
  if(!d || (!d.e1 && !d.s1 && !d.e2 && !d.s2)){
    aviso("Ese día está vacío: no hay nada que copiar.", true); return;
  }
  DIA_COPIADO={e1:d.e1||"", s1:d.s1||"", e2:d.e2||"", s2:d.s2||"",
               perm:d.perm||"", obs:d.obs||"", tipo:d.tipo||"", de:iso};
  pintarMes();
  aviso("Copiado el "+(+iso.slice(8,10))+": "+
        (DIA_COPIADO.e1||"—")+"–"+(DIA_COPIADO.s1||"—")+
        (DIA_COPIADO.e2?" y "+DIA_COPIADO.e2+"–"+DIA_COPIADO.s2:"")+
        ". Ahora toque pegar en los días que quiera.");
}

function pegarDia(iso){
  if(!DIA_COPIADO){ aviso("Primero copie un día con el primer botón.", true); return; }
  var m=mesDe(MES);
  if(!m.dias[iso]) m.dias[iso]=diaVacio();
  var d=m.dias[iso];
  d.e1=DIA_COPIADO.e1; d.s1=DIA_COPIADO.s1;

  var fer=feriadoDe(iso);
  var oficial=!BD.feriados[iso];

    '<button class="x" data-cerrar>×</button></div><div class="hb">'+
    (fer?'<div class="fcalc">Feriado: <b>'+esc(fer)+'</b>'+
        (oficial?' <span class="mut">(oficial del Ecuador)</span>':' <span class="mut">(lo puso usted)</span>')+
        '</div>':'')+
    '<div class="fsec">Cómo se paga este día</div>'+
    '<div class="pill grande" id="dT">'+
      '<button data-t="" class="'+(!d.tipo?"on":"")+'">Automático<span>como manda la ley</span></button>'+
      '<button data-t="50" class="'+(d.tipo==="50"?"on v":"")+'">Todo al 50%<span>suplementarias</span></button>'+
      '<button data-t="100" class="'+(d.tipo==="100"?"on r":"")+'">Todo al 100%<span>extraordinarias</span></button>'+
    '</div>'+
    '<div class="fsec">Feriado</div>'+
    '<div class="campos">'+
      '<div class="campo ancho"><label>Nombre del feriado (vacío = no es feriado)</label>'+
        '<input class="txt" id="dF" style="font-family:inherit" value="'+esc(fer||"")+'" '+
        'placeholder="ej: fiestas del cantón"></div>'+
    '</div>'+
    '<div class="fsec">Observación</div>'+
    '<div class="campos"><div class="campo ancho">'+
      '<input class="txt" id="dO" style="font-family:inherit" value="'+esc(d.obs||"")+'" '+
      'placeholder="por qué trabajó extra, a dónde fue…"></div></div>'+
    '<div class="fres" id="dR"></div>'+
    '</div><div class="hf">'+
    '<button class="b" data-cerrar>Cancelar</button>'+
    '<button class="b ac" id="dOk">Guardar</button></div></div>',
  function(M){
    var tipo=d.tipo||"";
    function rec(){
      var prueba=Object.assign({},d,{tipo:tipo});
      var guardaFer=BD.feriados[iso], guardaQui=BD.quitados[iso];
      var nom=M.querySelector("#dF").value.trim();
      if(nom) BD.feriados[iso]=nom; else { delete BD.feriados[iso]; BD.quitados[iso]=1; }
      var x=calcDia(iso, prueba, BD.cfg);
      if(guardaFer) BD.feriados[iso]=guardaFer; else delete BD.feriados[iso];
      if(guardaQui) BD.quitados[iso]=guardaQui; else delete BD.quitados[iso];
      M.querySelector("#dR").innerHTML=
        '<div class="frt">ASÍ QUEDA</div>'+
        '<div class="frv">'+fh(x.trab)+'</div>'+
        '<div class="frs">'+
          (x.trab? (x.normal?fh(x.normal)+' normales · ':'')+
                   (x.sup50?'<b class="p50">'+fh(x.sup50)+' al 50%</b> · ':'')+
                   (x.ext100?'<b class="p100">'+fh(x.ext100)+' al 100%</b>':'')+
                   (x.madrugada?'<br><span class="mut">'+fh(x.madrugada)+
                     ' cayeron entre las 24:00 y las 06:00 — van al 100% por ley</span>':'')+
                   (x.exceso?'<br><span class="mut">'+fh(x.exceso)+
                     ' pasan el tope de '+(BD.cfg.topeDia||4)+' h al día</span>':'')
                 : 'sin horas registradas')+
        '</div>';
    }
    M.querySelectorAll("#dT button").forEach(function(b){
      b.onclick=function(){
        tipo=b.getAttribute("data-t");
        M.querySelectorAll("#dT button").forEach(function(x){
          var t=x.getAttribute("data-t");
          x.className = t===tipo ? ("on "+(t==="100"?"r":t==="50"?"v":"")) : "";
        });
        rec();
      };
    });
    M.querySelector("#dF").addEventListener("input", rec);
    rec();
    M.querySelector("#dOk").onclick=function(){
      if(!m.dias[iso]) m.dias[iso]=diaVacio();
      m.dias[iso].tipo=tipo;
      m.dias[iso].obs=M.querySelector("#dO").value.trim();
      m.dias[iso].mod=Date.now();
      m.mod=Date.now();
      var nom=M.querySelector("#dF").value.trim();
      var ferPrevio = feriadoDe(iso)||"";
      if(nom!==ferPrevio && hayClave() && !DESBLOQ){
        aviso("Cambiar un feriado necesita la clave del dueño.",true);
        nom=ferPrevio;
      }
      var a=iso.slice(0,4);
      if(!FER_cache[a]) FER_cache[a]=feriadosDe(+a);
      var esOficial=!!FER_cache[a][iso];
      if(nom){
        delete BD.quitados[iso];
        if(!esOficial || nom!==FER_cache[a][iso]) BD.feriados[iso]=nom;
        else delete BD.feriados[iso];
      } else {
        delete BD.feriados[iso];
        if(esOficial) BD.quitados[iso]=1; else delete BD.quitados[iso];
      }
      guardar(); cerrar(); pintarMes(); aviso("Día guardado.");
    };
  });
}

/* ---------- llenar con el horario fijo ---------- */
function llenarHorarioFijo(){
  var cfg=BD.cfg, c=calcMes(MES);
  confirmar("Llenar con su horario fijo",
    "De lunes a viernes se pone <b>"+cfg.e1+"–"+cfg.s1+"</b> y <b>"+cfg.e2+"–"+cfg.s2+"</b>"+
    (cfg.sabTrabaja?", y los sábados <b>"+(cfg.sE1||cfg.e1)+"–"+(cfg.sS1||cfg.s1)+"</b>":"")+
    ", en los días que estén vacíos. "+
    "Los domingos, los feriados y los días que ya tienen horas <b>no se tocan</b>.",
    "Llenar", function(){
      var m=mesDe(MES), n=0;
      c.filas.forEach(function(f){
        if(f.esDom || f.fer) return;
        if(f.esSab && !cfg.sabTrabaja) return;
        var d=m.dias[f.iso];
        if(d && (d.e1||d.s1||d.e2||d.s2)) return;   /* ya tiene algo escrito */
        if(!m.dias[f.iso]) m.dias[f.iso]=diaVacio();
        m.dias[f.iso].mod=Date.now();
        m.dias[f.iso].e1=cfg.e1; m.dias[f.iso].s1=cfg.s1;
        if(f.esSab){
          m.dias[f.iso].e1=cfg.sE1||cfg.e1; m.dias[f.iso].s1=cfg.sS1||cfg.s1;
          m.dias[f.iso].e2=""; m.dias[f.iso].s2="";
        } else { m.dias[f.iso].e2=cfg.e2; m.dias[f.iso].s2=cfg.s2; }
        n++;
      });
      guardar(); pintarMes();
      aviso(n?("Se llenaron "+n+" días. Corrija los que hagan falta."):"No había días vacíos.");
    });
}

/* =====================================================================
   AVISO DEL TOPE LEGAL
   El Art. 55 permite hasta 4 horas suplementarias al día y 12 a la
   semana. Si se pasa, conviene saberlo.
   ===================================================================== */
function avisoTope(c){
  var dias=c.filas.filter(function(f){ return f.exceso>0; });
  var sem={}, pasa=[];
  c.filas.forEach(function(f){
    var d=new Date(+f.iso.slice(0,4), +f.iso.slice(5,7)-1, +f.iso.slice(8,10));
    var lun=new Date(d); lun.setDate(d.getDate()-((d.getDay()+6)%7));
    var k=lun.toISOString().slice(0,10);
    sem[k]=(sem[k]||0)+f.sup50;
  });
  Object.keys(sem).forEach(function(k){
    if(sem[k] > (BD.cfg.topeSemana||12)*60) pasa.push(fh(sem[k]));
  });
  if(!dias.length && !pasa.length) return "";
  return '<div class="caja aviso"><div class="cp">'+
    '<b>Ojo con el tope legal.</b> El Código del Trabajo permite hasta '+
    (BD.cfg.topeDia||4)+' horas suplementarias al día y '+(BD.cfg.topeSemana||12)+
    ' a la semana. '+
    (dias.length? 'Este mes hay <b>'+dias.length+' día(s)</b> que pasan el tope diario — '+
                  'lo que sobra ya se le cuenta al 100%. ' : '')+
    (pasa.length? 'Y <b>'+pasa.length+' semana(s)</b> superan las '+(BD.cfg.topeSemana||12)+
                  ' horas ('+pasa.join(", ")+').' : '')+
  '</div></div>';
}
