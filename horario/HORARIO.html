    '<td><b class="p100">'+fh(r.ext)+'</b></td>'+
    '<td><b>'+usd(r.total)+'</b></td>'+
    '<td class="dn"><b>'+usd(r.iess)+'</b></td>'+
    '<td class="dn"><b>'+usd(r.anticipo+r.prest)+'</b></td>'+
    '<td><b class="up">'+usd(r.neto)+'</b></td></tr></tfoot></table></div>'+
    '<div class="leyenda"><span class="mut">Toque un mes para abrirlo.</span></div></div>';

  box.innerHTML=h;
  box.querySelectorAll("tr[data-m]").forEach(function(tr){
    tr.onclick=function(){ MES=tr.getAttribute("data-m"); irA("mes"); };
  });
  var e=box.querySelector("#aExc");
  if(e) e.onclick=bajarExcel;
  var i2=box.querySelector("#aImp");
  if(i2) i2.onclick=imprimirAnio;
  /* la rosca del año */
  dibujarRosca({tTrab:horas, tSup:r.sup, tExt:r.ext});
}
function pc2(v,t){ return t? (v/t*100).toFixed(1)+"%" : "0%"; }

/* barras del año, sueldo abajo y extras arriba */
function barrasAnio(r){
  var max=Math.max.apply(null, r.meses.map(function(c){ return c.total; }))||1;
  var h='<div class="barras">';
  r.meses.forEach(function(c){
    var alto=Math.round(c.total/max*100);
    var ex=c.total? Math.round((c.pag50+c.pag100)/c.total*100):0;
    h+='<div class="bcol" title="'+MESES[c.mes]+': '+usd(c.total)+'">'+
      '<div class="bval">'+usd(c.total).replace("$","")+'</div>'+
      '<div class="bbar" style="height:'+Math.max(8,alto)+'%">'+
        '<div class="bext" style="height:'+ex+'%"></div></div>'+
      '<div class="blab">'+MESES[c.mes].slice(0,3)+'</div></div>';
  });
  return h+'</div><div class="leyenda mini2">'+
    '<span><i class="lg base"></i> sueldo</span>'+
    '<span><i class="lg extra"></i> horas extras</span></div>';
}

/* =====================================================================

    '<div class="campo ancho"><label>¿Cómo le pagan el sábado?</label><select id="cS100">'+
      '<option value="1"'+(c.sab100!==false?" selected":"")+'>Todo el día al 100% — día de descanso</option>'+
      '<option value="0"'+(c.sab100===false?" selected":"")+'>Es parte de mi jornada: al 50% solo lo que pase de 8 h</option>'+
    '</select></div>'+
    '<div class="campo ancho"><label>¿Su turno ordinario es de noche (19:00 a 06:00)?</label><select id="cNoc">'+
      '<option value="0"'+(!c.usaNoche?" selected":"")+'>No, trabajo de día</option>'+

  '</div></div>'+

  '<div class="caja"><h2>Recargos y aportes<span class="sp"></span>'+

  '<div class="campos">'+

    inpP("Aporte personal IESS","cIe",c.iess)+

  '</select></div>'+
  '<div class="nota">Vigentes en 2026 para el sector privado: aporte personal <b>9,45%</b>, '+
  'patronal <b>11,15%</b>, fondos de reserva <b>8,33%</b>. Si su rol muestra 12,15% de patronal, '+
  'es porque incluye el 0,5% del IECE y el 0,5% del SECAP.</div>'+

  '<div class="caja"><h2>Lo que dice la ley</h2><div class="cp">'+
    '<table class="trol">'+
      fila("Jornada ordinaria","8 h al día · 40 a la semana","valor hora = sueldo ÷ 240")+
      fila("Suplementarias — 50%","después de la jornada, hasta las 24:00","de lunes a viernes","up")+
      fila("Extraordinarias — 100%","sábado, domingo y feriado","el día completo","up")+
      fila("Extraordinarias — 100%","entre las 24:00 y las 06:00","la madrugada va al doble, sea el día que sea","up")+
      fila("Recargo nocturno — 25%","turno ordinario de 19:00 a 06:00","Art. 49, no es hora extra")+

  '</div></div>'+

    listaFeriados(+MES.slice(0,4))+

    'Para agregar el feriado de su cantón, toque ese día en la pestaña MES.</div>'+

  '<div class="pan"><div class="pt">'+ico("caja")+'RESPALDO Y BORRADO</div>'+
    '<div style="display:flex;gap:9px;flex-wrap:wrap">'+
      '<button class="b" id="cBaj">Descargar copia</button>'+
      '<button class="b" id="cRes">Restaurar copia</button>'+
      '<button class="b" id="cExc">Descargar Excel del año</button>'+
      '<span class="sp"></span>'+
      '<button class="b rj" id="cReset">Restablecer todo</button>'+
    '</div>'+

    '<b>los porcentajes de ley y los feriados se quedan</b>.</div>'+

function inp(t,id,v,tipo){
  return '<div class="campo"><label>'+t+'</label><input id="'+id+'" '+
    (tipo==="texto"?'style="font-family:inherit"':'inputmode="decimal"')+
    ' value="'+esc(v==null?"":v)+'"></div>';
}
function inpH(t,id,v){
  return '<div class="campo"><label>'+t+'</label><input type="time" id="'+id+'" value="'+esc(v||"")+'"></div>';
}
function inpP(t,id,v){
  return '<div class="campo"><label>'+t+' (%)</label><input id="'+id+'" inputmode="decimal" value="'+
    (v*100).toFixed(2).replace(/\.?0+$/,"")+'"></div>';
}
function listaFeriados(a){
  var F=feriadosDe(a), k=Object.keys(F).sort(), h='<div class="ferl">';
  k.forEach(function(iso){
    var quitado=BD.quitados[iso];
    h+='<div class="feri'+(quitado?" off":"")+'"><b>'+fLarga(iso)+'</b>'+
       '<span>'+esc(F[iso])+'</span></div>';
  });
  Object.keys(BD.feriados||{}).sort().forEach(function(iso){
    if(iso.slice(0,4)!==String(a)) return;
    h+='<div class="feri mio"><b>'+fLarga(iso)+'</b><span>'+esc(BD.feriados[iso])+' · suyo</span></div>';
  });
  return h+'</div>';
}

function engancharCfg(){
  var box=document.getElementById("cuerpo");
  function txt(id,campo){
    var e=box.querySelector("#"+id);
    if(e) e.addEventListener("change",function(){ BD.cfg[campo]=e.value.trim(); guardar(); });
  }
  function nu(id,campo,min){
    var e=box.querySelector("#"+id);
    if(e) e.addEventListener("change",function(){
      var v=num(e.value);
      if(v==null||(min!=null&&v<min)){ aviso("Valor no válido.",true); e.value=BD.cfg[campo]; return; }
      BD.cfg[campo]=v; guardar(); pintarCfg();
    });
  }
  /* un porcentaje cambiado a mano manda sobre la ley */
  function pc(id,campo){
    var e=box.querySelector("#"+id);
    if(e) e.addEventListener("change",function(){
      var v=num(e.value);
      if(v==null||v<0){ aviso("Porcentaje no válido.",true); return; }
      if(!BD.cfg.manual) BD.cfg.manual={};
      BD.cfg.manual[campo]=v/100; BD.cfg[campo]=v/100;
      guardar(); pintarCfg();
      aviso("Guardado a mano. En Leyes puede volver a los valores oficiales.");
    });
  }
  txt("cNom","nombre"); txt("cCar","cargo");
  var eEmp=box.querySelector("#cEmp");
  if(eEmp) eEmp.addEventListener("change", function(){
    BD.cfg.empresa=eEmp.value.trim();
    BD.cfg.empresaMia=true;        /* usted la escribió: ya no se toca */
    guardar();
  });
  nu("cSue","sueldo",1); nu("cHm","horasMes",1); nu("cJor","jornada",1);
  nu("cTd","topeDia",0);
  pc("cR50","rec50"); pc("cR100","rec100");
  pc("cIe","iess"); pc("cPa","patronal"); pc("cFo","fondos");
  ["cE1|e1","cS1|s1","cE2|e2","cS2|s2","cSE1|sE1","cSS1|sS1"].forEach(function(p){
    var q=p.split("|"), e=box.querySelector("#"+q[0]);
    if(e) e.addEventListener("change",function(){ BD.cfg[q[1]]=e.value; guardar(); });
  });
  var s=box.querySelector("#cS100");
  if(s) s.onchange=function(){ BD.cfg.sab100=this.value==="1"; guardar(); pintarCfg(); };
  var nn=box.querySelector("#cNoc");
  if(nn) nn.onchange=function(){ BD.cfg.usaNoche=this.value==="1"; guardar(); pintarCfg(); };
  var cf=box.querySelector("#cCf");
  if(cf) cf.onchange=function(){ BD.cfg.cobraFondos=this.value==="1"; guardar(); pintarCfg(); };
  var ley=box.querySelector("#cLey");
  if(ley) ley.onclick=function(){
    BD.cfg.iess=0.0945; BD.cfg.patronal=0.1115; BD.cfg.fondos=0.0833;
    BD.cfg.rec50=0.50; BD.cfg.rec100=1.00; BD.cfg.horasMes=240;
    BD.cfg.jornada=8; BD.cfg.topeDia=4; BD.cfg.topeSemana=12;
    guardar(); pintarCfg(); aviso("Puestos los valores vigentes en 2026.");
  };
  var b;
  if((b=box.querySelector("#cBaj"))) b.onclick=bajarCopia;
  if((b=box.querySelector("#cRes"))) b.onclick=function(){ box.querySelector("#cFile").click(); };
  if((b=box.querySelector("#cExc"))) b.onclick=bajarExcel;
  if((b=box.querySelector("#cReset"))) b.onclick=restablecerTodo;
  var f=box.querySelector("#cFile");
  if(f) f.onchange=function(){
    var a=f.files[0]; if(!a) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result);
        if(!d || !d.cfg) throw 0;
        confirmar("Restaurar copia","Se reemplaza todo lo que tiene ahora.","Restaurar",function(){
          BD.cfg=Object.assign(nuevaBD().cfg, d.cfg);
          BD.meses=d.meses||{}; BD.feriados=d.feriados||{}; BD.quitados=d.quitados||{};
          guardar(); repintar(); aviso("Copia restaurada.");
        }, true);
      }catch(e){ aviso("Ese archivo no sirve.",true); }
      f.value="";
    };
    r.readAsText(a);
  };
  engancharSync(box);
  engancharCandado(box);
  engancharColores(box);
  engancharLeyes(box);
}

function bajarCopia(){
  var t=JSON.stringify(BD,null,1);
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([t],{type:"application/json"}));
  a.download="horario-"+hoyISO()+".json";
  a.click();
  aviso("Copia descargada.");
}
