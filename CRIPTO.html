/* =====================================================================
   SINCRONIZAR ENTRE SUS EQUIPOS
   Los datos viven en un repositorio PRIVADO suyo de GitHub. Gratis,
   nadie más lo ve, y sirve para el teléfono y la computadora.
   Se juntan los cambios de los dos lados: gana el más reciente de cada
   registro, y lo que borró en un lado no vuelve a aparecer.
   ===================================================================== */
var SYNC={ ocupado:false, ultimo:null, error:"", auto:null };

function anotarBorrado(id){
  BD.borrados=BD.borrados||[];
  BD.borrados.push({id:id, t:Date.now()});
  if(BD.borrados.length>600) BD.borrados=BD.borrados.slice(-400);
}
function gitCfg(){ return (BD.ajustes && BD.ajustes.git) || {}; }

function gh(ruta, opciones){
  var g=gitCfg();
  if(!g.token) return Promise.reject(new Error("Falta la clave de GitHub"));
  var o=Object.assign({}, opciones||{});
  o.headers=Object.assign({
    "Authorization":"Bearer "+g.token,
    "Accept":"application/vnd.github+json",
    "X-GitHub-Api-Version":"2022-11-28"
  }, o.headers||{});
  return fetch("https://api.github.com"+ruta, o).then(function(r){
    if(r.status===401) throw new Error("La clave no sirve o se venció");
    if(r.status===403) throw new Error("La clave no tiene permiso sobre repositorios");
    if(r.status===404) return {__falta:true};
    if(!r.ok) return r.text().then(function(t){ throw new Error("GitHub respondió "+r.status); });
    return r.json();
  });
}

function conectarGit(token){
  BD.ajustes.git=Object.assign(gitCfg(), {token:token});
  return gh("/user").then(function(u){
    if(u.__falta || !u.login) throw new Error("No se pudo leer su cuenta");
    BD.ajustes.git.user=u.login;
    var repo=gitCfg().repo||"portafolio-cripto";
    BD.ajustes.git.repo=repo;
    return gh("/repos/"+u.login+"/"+repo).then(function(r){
      if(!r.__falta) return r;
      /* no existe: se crea privado */
      return gh("/user/repos",{method:"POST",body:JSON.stringify({
        name:repo, private:true, auto_init:true,
        description:"Datos privados de mi portafolio cripto"})});
    });
  }).then(function(){
    guardar();
    return sincronizar(true);
  });
}

function bajarRemoto(){
  var g=gitCfg();
  return gh("/repos/"+g.user+"/"+g.repo+"/contents/portafolio.json").then(function(r){
    if(r.__falta) return {datos:null, sha:null};
    var txt;
    try{ txt=decodeURIComponent(escape(atob((r.content||"").replace(/\n/g,"")))); }
    catch(e){ txt=atob((r.content||"").replace(/\n/g,"")); }
    var d=null;
    try{ d=JSON.parse(txt); }catch(e){}
    return {datos:d, sha:r.sha};
  });
}
function subirRemoto(sha){
  var g=gitCfg();
  var paquete={ops:BD.ops, fut:BD.fut, alertas:BD.alertas, borrados:BD.borrados||[],
               ajustes:sinClave(BD.ajustes), tema:BD.tema, sembrado:BD.sembrado,
               equipo:nombreEquipo(), guardado:Date.now()};
  var txt=JSON.stringify(paquete,null,1);
  var b64;
  try{ b64=btoa(unescape(encodeURIComponent(txt))); }catch(e){ b64=btoa(txt); }
  var cuerpo={message:"portafolio · "+nombreEquipo()+" · "+ahora(), content:b64};
  if(sha) cuerpo.sha=sha;
  return gh("/repos/"+g.user+"/"+g.repo+"/contents/portafolio.json",
    {method:"PUT", body:JSON.stringify(cuerpo)});
}
function sinClave(a){
  var c=Object.assign({}, a||{});
  if(c.git) c.git=Object.assign({}, c.git, {token:""});   /* la clave NUNCA viaja */
  return c;
}
function nombreEquipo(){
  if(BD.ajustes.equipo) return BD.ajustes.equipo;
  var u=(navigator.userAgent||"");
  return /Android|iPhone|iPad|Mobile/i.test(u) ? "teléfono" : "computadora";
}

/* junta lo de allá con lo de acá: gana el cambio más nuevo de cada registro */
function juntar(local, remoto, borrados){
  var por={}, fuera={};
  (borrados||[]).forEach(function(b){ fuera[b.id]=Math.max(fuera[b.id]||0, b.t||0); });
  function meter(arr){
    (arr||[]).forEach(function(x){
      if(!x || !x.id) return;
      var m=+x.mod||0;
      if(fuera[x.id] && fuera[x.id]>=m) return;        /* lo borró: no vuelve */
      var y=por[x.id];
      if(!y || m > (+y.mod||0)) por[x.id]=x;
    });
  }
  meter(local); meter(remoto);
  return Object.keys(por).map(function(k){ return por[k]; });
}

function sincronizar(silencioso){
  var g=gitCfg();
  if(!g.token || !g.user){ if(!silencioso) aviso("Primero conecte su cuenta.",true); return Promise.resolve(); }
  if(SYNC.ocupado) return Promise.resolve();
  SYNC.ocupado=true; pintarSync("trabajando");
  return bajarRemoto().then(function(r){
    var d=r.datos;
    if(d){
      var bor=(BD.borrados||[]).concat(d.borrados||[]);
      BD.ops=juntar(BD.ops, d.ops, bor);
      BD.fut=juntar(BD.fut, d.fut, bor);
      BD.alertas=juntarAlertas(BD.alertas, d.alertas);
      BD.borrados=bor.slice(-400);
      if(!BD.sembrado && d.sembrado) BD.sembrado=d.sembrado;
      /* el tema y los ajustes: se queda el más reciente, sin tocar la clave */
      if(d.ajustes){
        var mio=+BD.ajustes.mod||0, suyo=+d.ajustes.mod||0;
        if(suyo>mio){
          var tk=BD.ajustes.git;
          BD.ajustes=Object.assign({}, d.ajustes, {git:tk});
          if(d.tema) BD.tema=d.tema;
          aplicarTema();
        }
      }
      BD.ops.sort(function(a,b){ return (a.fecha||"")<(b.fecha||"")?-1:1; });
    }
    return subirRemoto(r.sha);
  }).then(function(){
    SYNC.ocupado=false; SYNC.ultimo=Date.now(); SYNC.error="";
    guardar(); repintar();
    if(!silencioso) aviso("Sincronizado. Sus cambios están en todos sus equipos.");
  }).catch(function(e){
    SYNC.ocupado=false; SYNC.error=String(e&&e.message||e);
    pintarSync("mal");
    if(!silencioso) aviso("No se pudo sincronizar: "+SYNC.error, true);
  });
}
function juntarAlertas(a,b){
  var v={}, r=[];
  (a||[]).concat(b||[]).forEach(function(x){
    if(!x||!x.sym) return;
    var k=x.sym+"|"+x.dir+"|"+x.precio;
    if(!v[k]){ v[k]=1; r.push(x); }
  });
  return r;
}
function pintarSync(estado){
  var e=document.getElementById("sync");
  if(!e) return;
  var g=gitCfg();
  if(!g.token){ e.style.display="none"; return; }
  e.style.display="";
  if(estado==="trabajando"){ e.className="syn"; e.innerHTML='<i></i>sincronizando…'; return; }
  if(estado==="mal" || SYNC.error){
    e.className="syn mal"; e.innerHTML='<i></i>sin sincronizar'; return;
  }
  e.className="syn ok";
  e.innerHTML='<i></i>'+(SYNC.ultimo?"guardado "+hora(SYNC.ultimo):"conectado");
}
function programarSync(){
  clearInterval(SYNC.auto);
  var g=gitCfg();
  if(!g.token || !BD.ajustes.gitAuto) return;
  SYNC.auto=setInterval(function(){ sincronizar(true); }, 90000);
}

      '<button class="b" id="gDesc">Desconectar este equipo</button></div>'+
    '<div class="nota">Al sincronizar se juntan los cambios de los dos equipos: de cada '+

function engancharSync(box){
  /* cada botón con SU propia variable: si se comparte, dentro del clic
     apunta al último y revienta */
  var bConn=box.querySelector("#gConn");
  if(bConn) bConn.onclick=function(){
    var t=box.querySelector("#gTok").value.trim();
    if(!t){ aviso("Pegue la clave.",true); return; }
    var eq=box.querySelector("#gEq").value.trim();
    if(eq) BD.ajustes.equipo=eq;
    bConn.disabled=true; bConn.textContent="Conectando…";
    conectarGit(t).then(function(){
      BD.ajustes.gitAuto=true; guardar(); programarSync(); repintar();
      aviso("Conectado. Ponga la misma clave en su otro equipo.");
    }).catch(function(e){
      BD.ajustes.git={}; guardar();
      bConn.disabled=false; bConn.textContent="Conectar";
      aviso("No se pudo conectar: "+(e.message||e), true);
    });
  };
  var bSync=box.querySelector("#gSync");
  if(bSync) bSync.onclick=function(){ sincronizar(false); };
  var bAuto=box.querySelector("#gAuto");
  if(bAuto) bAuto.onchange=function(){
    BD.ajustes.gitAuto=this.value==="1"; guardar(); programarSync();
    aviso(BD.ajustes.gitAuto?"Se sincronizará solo.":"Solo cuando usted pulse.");
  };
  var bEq=box.querySelector("#gEq2");
  if(bEq) bEq.onchange=function(){ BD.ajustes.equipo=this.value.trim(); guardar(); };
  var bDes=box.querySelector("#gDesc");
  if(bDes) bDes.onclick=function(){
    confirmar("Desconectar","Este equipo deja de sincronizar. Sus datos siguen aquí y también "+
      "en el repositorio.","Desconectar", function(){
        BD.ajustes.git={}; BD.ajustes.gitAuto=false; guardar();
        clearInterval(SYNC.auto); repintar(); aviso("Desconectado.");
      });
  };
}

function bajarArchivo(nom, txt, tipo){
  var b=new Blob([txt],{type:tipo||"application/json"}), u=URL.createObjectURL(b),
      a=document.createElement("a");
  a.href=u; a.download=nom; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },300);
}
function descargarCopia(){
  bajarArchivo("portafolio-"+hoy()+".json", JSON.stringify(BD,null,1));
  aviso("Copia descargada.");
}
function descargarCsv(){
  var f=[["TIPO","FECHA","MONEDA","LADO","CANTIDAD","PRECIO","MONTO","APAL","PORCENTAJE","GANANCIA","NOTA"]];
  BD.ops.forEach(function(o){
    f.push([o.tipo==="venta"?"VENTA":"COMPRA",o.fecha,o.sym,"",o.cant,o.precio,"","","","",o.nota||""]);
  });
  BD.fut.forEach(function(x){
    var e=estadoOp(x);
    f.push(["FUTURO",x.fecha||"",x.sym||"",x.lado,"","",e.monto,e.apal,
            e.pct!=null?(e.pct*100).toFixed(2):"", e.gan!=null?e.gan.toFixed(2):"", x.nota||""]);
  });
  bajarArchivo("portafolio-"+hoy()+".csv","\ufeff"+f.map(function(l){
    return l.map(function(c){ return '"'+String(c==null?"":c).replace(/"/g,'""')+'"'; }).join(";");
  }).join("\r\n"),"text/csv;charset=utf-8");
  aviso("Archivo descargado, se abre con Excel.");
}
function restaurarCopia(ev){
  var arch=ev.target.files&&ev.target.files[0]; if(!arch) return;
  var fr=new FileReader();
  fr.onload=function(){
    var d=null; try{ d=JSON.parse(fr.result); }catch(e){}
    if(!d||!Array.isArray(d.ops)){ aviso("Ese archivo no es una copia válida.",true); ev.target.value=""; return; }
    confirmar("Restaurar copia","Trae <b>"+d.ops.length+"</b> movimiento(s) y <b>"+
      ((d.fut&&d.fut.length)||0)+"</b> operación(es). Reemplaza lo que hay ahora.","Restaurar",
      function(){
        BD.ops=d.ops||[]; BD.fut=d.fut||[]; BD.precios=d.precios||{};
        BD.ajustes=Object.assign(BD.ajustes,d.ajustes||{});
        if(d.tema) BD.tema=Object.assign(BD.tema,d.tema);
        guardar(); aplicarTema(); programarPrecios(); repintar(); traerPrecios(true);
        aviso("Portafolio restaurado.");
      });
    ev.target.value="";
  };
  fr.readAsText(arch);
}

function abrir(html, listo){
  var v=document.getElementById("velo"), c=document.getElementById("veloIn");
  c.innerHTML=html; v.className="on";
  c.querySelectorAll("[data-cerrar]").forEach(function(b){ b.onclick=cerrar; });
  v.onclick=function(e){ if(e.target===v) cerrar(); };
  document.onkeydown=function(e){ if(e.key==="Escape") cerrar(); };
  if(listo) listo(c);
  var p=c.querySelector("input,select"); if(p&&p.focus) p.focus();
}
function cerrar(){
  document.getElementById("velo").className="";
  document.getElementById("veloIn").innerHTML=""; document.onkeydown=null;
}
function confirmar(tit, cuerpo, textoOk, alOk, peligro){
  abrir('<div class="hoja"><div class="hh"><h3>'+esc(tit)+'</h3><button class="x" data-cerrar>×</button></div>'+
    '<div class="hb"><div style="font-size:14px;line-height:1.75">'+cuerpo+'</div></div>'+
    '<div class="hf"><button class="b" data-cerrar>Cancelar</button>'+
    '<button class="b '+(peligro?"rj":"ac")+'" id="okB">'+esc(textoOk)+'</button></div></div>',
    function(M){ M.querySelector("#okB").onclick=function(){ cerrar(); alOk(); }; });
}

             mov:"Historial", alr:"Alertas de precio", dat:"Configuración"};

  ({res:pintarRes, spot:pintarSpot, fut:pintarFut, mov:pintarMov,
    alr:pintarAlr, dat:pintarDat}[vista]||pintarRes)();

  document.getElementById("pieTot").textContent =
    (BD.ops.length||BD.fut.length) ? usd(S.tot.valor+F.tot.margenAbierto) : "—";
}
function irA(v){
  vista=v; repintar();
  window.scrollTo({top:0,behavior:"smooth"});
}
function arrancar(){
  cargar();
  if(!BD.tema) BD.tema={ac:"#12E19A",h:215,s:14,L:9,up:"#12E19A",dn:"#FF4D5E",fz:16,rad:14};
  BD.ajustes=Object.assign({auto:true,cada:60,monto:20,apal:10,sl:7,tp:10}, BD.ajustes||{});
  BD.alertas=BD.alertas||[];
  if(BD.ajustes.marca===undefined) BD.ajustes.marca=true;
  if(BD.ajustes.marcaCada===undefined) BD.ajustes.marcaCada=12;
  if(BD.ajustes.marcaOp===undefined) BD.ajustes.marcaOp=5.5;
  if(!BD.ops.length && !BD.sembrado){
    BD.ops=SEMILLA_OPS.slice(); BD.sembrado=1;   /* solo sus compras del Excel */
    guardar();
  }
  aplicarTema();
  try{ programarMarca(); }catch(x){}
  try{ programarSync(); }catch(x){}
  document.getElementById("bRef").onclick=function(){ traerPrecios(false); };
  document.getElementById("bComprar").onclick=function(){ abrirOp("compra"); };
  repintar(); programarPrecios(); traerPrecios(true);
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden && PRE.ultimo && Date.now()-PRE.ultimo>120000) traerPrecios(true);
  });
  window.addEventListener("online", function(){ traerPrecios(true); });
}
