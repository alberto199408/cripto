<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20192%20192%22%3E%3Crect%20width%3D%22192%22%20height%3D%22192%22%20rx%3D%2242%22%20fill%3D%22%230B1017%22/%3E%3Ccircle%20cx%3D%2296%22%20cy%3D%2296%22%20r%3D%2260%22%20fill%3D%22%2312E19A%22/%3E%3Cpath%20fill%3D%22%2304120C%22%20d%3D%22M112%2086c2-11-6-17-18-21l4-15-9-2-4%2015-7-2%204-15-9-2-4%2015-18-4-2%2010s7%201%207%202c4%201%205%203%204%206l-9%2040c-1%202-2%203-4%202%200%200-7-2-7-2l-5%2011%2017%204-4%2016%209%202%204-15%207%202-4%2015%209%202%204-16c16%203%2028%202%2033-13%204-12%200-18-9-22%206-2%2011-6%2012-14zm-21%2031c-3%2012-22%205-28%204l5-21c6%201%2026%204%2023%2017zm3-31c-2%2011-18%205-24%204l5-19c6%201%2022%204%2019%2015z%22%20transform%3D%22scale%280.72%29%20translate%2837%2C37%29%22/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20192%20192%22%3E%3Crect%20width%3D%22192%22%20height%3D%22192%22%20rx%3D%2242%22%20fill%3D%22%230B1017%22/%3E%3Ccircle%20cx%3D%2296%22%20cy%3D%2296%22%20r%3D%2260%22%20fill%3D%22%2312E19A%22/%3E%3Cpath%20fill%3D%22%2304120C%22%20d%3D%22M112%2086c2-11-6-17-18-21l4-15-9-2-4%2015-7-2%204-15-9-2-4%2015-18-4-2%2010s7%201%207%202c4%201%205%203%204%206l-9%2040c-1%202-2%203-4%202%200%200-7-2-7-2l-5%2011%2017%204-4%2016%209%202%204-15%207%202-4%2015%209%202%204-16c16%203%2028%202%2033-13%204-12%200-18-9-22%206-2%2011-6%2012-14zm-21%2031c-3%2012-22%205-28%204l5-21c6%201%2026%204%2023%2017zm3-31c-2%2011-18%205-24%204l5-19c6%201%2022%204%2019%2015z%22%20transform%3D%22scale%280.72%29%20translate%2837%2C37%29%22/%3E%3C/svg%3E">

<style>
:root{
  --h:215; --s:14%; --L:9%; --fz:16px; --rad:14px;
  --ac:#12E19A; --ac2:#5CFFC8;
  --up:#12E19A; --dn:#FF4D5E;
  --b0:hsl(var(--h) var(--s) calc(var(--L) - 3%));
  --b1:hsl(var(--h) var(--s) var(--L));
  --b2:hsl(var(--h) var(--s) calc(var(--L) + 4%));
  --b3:hsl(var(--h) var(--s) calc(var(--L) + 9%));
  --ln:hsl(var(--h) var(--s) calc(var(--L) + 13%));
  --tx:hsl(var(--h) 18% 97%);
  --t2:hsl(var(--h) 12% 72%);
  --t3:hsl(var(--h) 10% 52%);
}
:root.claro{
  --tx:hsl(var(--h) 25% 11%); --t2:hsl(var(--h) 14% 30%); --t3:hsl(var(--h) 12% 46%);
  --b0:hsl(var(--h) var(--s) calc(var(--L) + 5%));
  --b1:hsl(var(--h) var(--s) var(--L));
  --b2:hsl(var(--h) var(--s) calc(var(--L) - 4%));
  --b3:hsl(var(--h) var(--s) calc(var(--L) - 8%));
  --ln:hsl(var(--h) var(--s) calc(var(--L) - 14%));
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--b0);color:var(--tx);font-size:var(--fz,14px);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:Consolas,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}

#app{display:flex;min-height:100vh}

/* ---------- barra lateral ---------- */
aside{width:196px;flex:none;background:var(--b1);border-right:1px solid var(--ln);
  display:flex;flex-direction:column;padding:16px 12px;gap:5px;position:sticky;top:0;height:100vh}
aside .marca{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
aside .marca .d{width:38px;height:38px;border-radius:11px;background:var(--ac);color:#04120C;
  display:grid;place-items:center;font-size:21px;font-weight:800;flex:none}
aside .marca b{font-size:14px;letter-spacing:.02em;line-height:1.2;display:block}
aside .marca span{font-size:10px;color:var(--t3);letter-spacing:.14em}
aside nav{display:flex;flex-direction:column;gap:4px}
aside nav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--t3);
  padding:11px 13px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;
  font-weight:600;text-align:left;width:100%;transition:.14s}
aside nav button:hover{background:var(--b2);color:var(--t2)}
aside nav button.on{background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--ac)}
aside nav button svg{width:18px;height:18px;flex:none}
aside nav button .bg{margin-left:auto;background:var(--dn);color:#fff;font-size:10px;font-weight:800;
  padding:2px 7px;border-radius:99px}
aside .pie{margin-top:auto;padding:14px;border-radius:12px;background:var(--b2);border:1px solid var(--ln);text-align:center}
aside .pie b{display:block;font-size:12.5px;margin-bottom:3px}
aside .pie span{font-size:10.5px;color:var(--t3)}

main{flex:1;min-width:0;padding:20px 24px 40px}
.encab{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.encab h1{margin:0;font-size:25px;font-weight:700;letter-spacing:-.01em}
.encab .der{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.act{font-size:12px;color:var(--t3);display:flex;align-items:center;gap:7px}
.act .lz{width:7px;height:7px;border-radius:50%;background:var(--up)}
.act.mal .lz{background:var(--dn)}
.act.vjo .lz{background:#F5A524}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--ln);margin-bottom:18px}
.tabs button{background:none;border:0;color:var(--t3);padding:11px 16px;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:600;border-bottom:2px solid transparent;
  display:flex;align-items:center;gap:8px}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac)}

/* ---------- tarjetas de cifras ---------- */
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px;margin-bottom:16px}
.met{background:var(--b1);border:1px solid var(--ln);border-radius:var(--rad,14px);padding:14px 16px}
.met .cab{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.met .cab .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac)}
.met .cab .ico svg{width:16px;height:16px}
.met .cab span{font-size:12px;color:var(--t2);font-weight:500;line-height:1.3}
.met .v{font-family:Consolas,monospace;font-size:26px;font-weight:700;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.1}
.met .v small{font-size:12px;font-weight:600;color:var(--t3);margin-left:5px}
.met .s{font-size:12px;color:var(--t3);margin-top:5px;font-family:Consolas,monospace}
.up{color:var(--up)}.dn{color:var(--dn)}.nt{color:var(--t2)}.ao{color:var(--ac)}

/* ---------- caja ---------- */
.caja{background:var(--b1);border:1px solid var(--ln);border-radius:var(--rad,14px);margin-bottom:16px;overflow:hidden}
.caja>h2{margin:0;padding:15px 18px;font-size:15px;font-weight:700;display:flex;align-items:center;
  gap:10px;flex-wrap:wrap}
.caja>h2 .sp{flex:1}
.cp{padding:16px 18px}

/* ---------- tabla de activos ---------- */
.env{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
thead th{text-align:right;padding:11px 14px;font-size:11.5px;font-weight:600;color:var(--t3);
  background:var(--b2);white-space:nowrap}
thead th:first-child{text-align:left}
tbody td{padding:13px 14px;text-align:right;font-family:Consolas,monospace;font-size:13.5px;
  font-variant-numeric:tabular-nums;border-bottom:1px solid var(--ln);white-space:nowrap}
tbody td:first-child{text-align:left;font-family:inherit}
tbody tr:last-child td{border-bottom:0}
tbody tr.cl{cursor:pointer;transition:background .12s}
tbody tr.cl:hover{background:var(--b2)}
.cri{display:flex;align-items:center;gap:11px}
.cri .ic{width:30px;height:30px;flex:none;border-radius:50%}
.cri b{font-size:14px;font-weight:700;display:block;line-height:1.25}
.cri span{font-size:11px;color:var(--t3)}
.disco{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-weight:800}

/* ---------- botones ---------- */
.b{background:var(--b2);color:var(--tx);border:1px solid var(--ln);padding:9px 14px;border-radius:9px;
  cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:.14s}
.b:hover{border-color:var(--ac);color:var(--ac)}
.b:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.b.ac{background:var(--ac);border-color:var(--ac);color:#04120C;font-weight:700}
.b.ac:hover{background:var(--ac2);color:#04120C}
.b.vd{background:color-mix(in srgb,var(--up) 15%,transparent);border-color:color-mix(in srgb,var(--up) 45%,transparent);color:var(--up)}
.b.rj{background:color-mix(in srgb,var(--dn) 13%,transparent);border-color:color-mix(in srgb,var(--dn) 42%,transparent);color:var(--dn)}
.b.rj:hover{background:color-mix(in srgb,var(--dn) 22%,transparent);color:var(--dn);border-color:var(--dn)}
.b.sm{padding:6px 12px;font-size:12px;border-radius:8px}
.b:disabled{opacity:.4;cursor:default}

label{display:block;font-size:11.5px;font-weight:600;color:var(--t3);margin-bottom:6px}
input,select{width:100%;background:var(--b0);color:var(--tx);border:1px solid var(--ln);
  border-radius:9px;padding:10px 12px;font-family:Consolas,monospace;font-size:14px}
select{font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--ac)}
input[type=color]{padding:3px;height:42px}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.ancho{grid-column:1/-1}
.nota{margin-top:12px;padding:12px 14px;border-radius:10px;
  background:color-mix(in srgb,var(--ac) 9%,transparent);
  border:1px solid color-mix(in srgb,var(--ac) 32%,transparent);
  font-family:Consolas,monospace;font-size:13px;color:var(--ac2);line-height:1.6}
.pill{display:flex;background:var(--b0);border:1px solid var(--ln);border-radius:9px;padding:3px}
.pill button{flex:1;background:none;border:0;color:var(--t3);padding:9px;border-radius:7px;
  font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.pill button.on{background:var(--b3);color:var(--tx)}
.pill button.on.v{background:color-mix(in srgb,var(--up) 20%,transparent);color:var(--up)}
.pill button.on.r{background:color-mix(in srgb,var(--dn) 18%,transparent);color:var(--dn)}

/* ---------- barra deslizante para vender ---------- */
.slid{margin:6px 0 4px}
.slid input[type=range]{width:100%;height:34px;padding:0;border:0;background:none;accent-color:var(--ac)}
.rapidos{display:flex;gap:7px;margin-top:4px}
.rapidos button{flex:1;background:var(--b0);border:1px solid var(--ln);color:var(--t2);
  padding:8px 4px;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.rapidos button:hover,.rapidos button.on{border-color:var(--ac);color:var(--ac)}
.espejo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.espejo div{background:var(--b0);border:1px solid var(--ln);border-radius:11px;padding:12px 14px}
.espejo .e{font-size:11px;color:var(--t3);margin-bottom:5px}
.espejo .v{font-family:Consolas,monospace;font-size:20px;font-weight:700}

/* ---------- fila inferior ---------- */
.inf{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.inf .caja{margin:0}
.rank{display:flex;align-items:center;gap:11px;padding:2px 0}
.rank .ic{width:30px;height:30px;border-radius:50%;flex:none}
.rank b{font-size:15px;font-weight:700}
.rank .pc{margin-left:auto;text-align:right;font-family:Consolas,monospace}
.rank .pc b{display:block;font-size:17px;font-weight:800}
.rank .pc span{font-size:12px}

/* ---------- rosca ---------- */
.rosca{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.rosca svg{width:150px;height:150px;flex:none}
.rosca .ley{flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px}
.rosca .ley span{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--t2)}
.rosca .ley i{width:9px;height:9px;border-radius:3px;flex:none}
.rosca .ley b{margin-left:auto;font-family:Consolas,monospace;color:var(--tx)}

/* ---------- alertas ---------- */
.alr{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:12px;
  background:var(--b0);border:1px solid var(--ln);margin-bottom:9px}
.alr.son{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,transparent)}
.alr .ic{width:30px;height:30px;border-radius:50%;flex:none}
.alr .q{flex:1;min-width:0}
.alr .q b{font-size:14px;display:block}
.alr .q span{font-size:12px;color:var(--t3);font-family:Consolas,monospace}

/* ---------- movimientos ---------- */
.mv{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:11px;background:var(--b0);
  border:1px solid var(--ln);margin-bottom:8px}
.mv .fh{text-align:center;flex:none;min-width:50px;padding:5px 7px;border-radius:9px;background:var(--b2)}
.mv .fh b{display:block;font-size:16px;font-weight:800;font-family:Consolas,monospace;line-height:1}
.mv .fh span{font-size:9.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em}
.mv .q{flex:1;min-width:0}
.mv .q .l1{font-size:14px;font-weight:600;margin-bottom:3px}
.mv .q .l1 em{font-style:normal;font-family:Consolas,monospace;font-weight:700}
.mv .q .l2{font-size:11.5px;color:var(--t3);font-family:Consolas,monospace}
.mv .p{text-align:right;flex:none;font-family:Consolas,monospace}
.mv .p b{font-size:16px;font-weight:800;display:block}
.mv .p span{font-size:11px;color:var(--t3)}
.mv.compra{border-left:3px solid var(--up)}
.mv.venta{border-left:3px solid var(--dn)}
.mv.fut{border-left:3px solid var(--ac)}

.chip{display:inline-block;padding:3px 9px;border-radius:6px;font-size:10.5px;font-weight:700}
.chip.l{background:color-mix(in srgb,var(--up) 18%,transparent);color:var(--up)}
.chip.s{background:color-mix(in srgb,var(--dn) 16%,transparent);color:var(--dn)}
.chip.a{background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac)}

/* ---------- ventana ---------- */
#velo{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);z-index:60;
  display:none;justify-content:center;padding:24px 14px;overflow-y:auto}
#velo.on{display:flex;align-items:flex-start}
.hoja{background:var(--b1);border:1px solid var(--ln);border-radius:16px;width:100%;max-width:540px;
  box-shadow:0 24px 70px rgba(0,0,0,.6)}
.hoja.ancha{max-width:720px}
.hoja .hh{padding:16px 20px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:12px}
.hoja .hh h3{margin:0;font-size:16px;font-weight:700;flex:1}
.hoja .hb{padding:20px}
.hoja .hf{padding:15px 20px;border-top:1px solid var(--ln);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.x{background:none;border:0;color:var(--t3);font-size:22px;cursor:pointer;padding:2px 7px;border-radius:7px}
.x:hover{color:var(--tx);background:var(--b2)}

#aviso{position:fixed;left:50%;bottom:22px;transform:translate(-50%,150%);background:var(--b2);
  border:1px solid var(--ln);border-left:3px solid var(--up);padding:13px 18px;border-radius:11px;
  font-size:13.5px;z-index:80;transition:transform .25s;max-width:88vw;box-shadow:0 14px 40px rgba(0,0,0,.5)}
#aviso.on{transform:translate(-50%,0)}
#aviso.mal{border-left-color:var(--dn)}

.alerta{margin-bottom:16px;padding:15px 17px;border-radius:13px;display:flex;align-items:center;gap:14px;
  flex-wrap:wrap;background:color-mix(in srgb,var(--dn) 11%,var(--b1));
  border:1px solid color-mix(in srgb,var(--dn) 42%,transparent)}
.alerta .t{flex:1;min-width:220px}
.alerta .t b{display:block;font-size:14.5px;margin-bottom:3px}
.alerta .t span{font-size:12.5px;color:var(--t2);line-height:1.5}

.vacio{padding:44px 20px;text-align:center;color:var(--t3)}
.vacio b{display:block;color:var(--tx);font-size:16px;margin-bottom:8px}
.vacio p{margin:0 auto 18px;max-width:400px;line-height:1.6;font-size:13.5px}
.mut{color:var(--t3);font-size:12.5px;line-height:1.6}
.pie-nota{margin-top:22px;padding-top:14px;border-top:1px solid var(--ln);display:flex;gap:18px;
  flex-wrap:wrap;font-size:11.5px;color:var(--t3)}
.temas{display:flex;gap:8px;flex-wrap:wrap}
.temas button{width:34px;height:34px;border-radius:9px;border:2px solid transparent;cursor:pointer}
.temas button.on{border-color:var(--tx)}

@media(max-width:860px){
  #app{flex-direction:column}
  aside{width:100%;height:auto;position:static;flex-direction:row;align-items:center;overflow-x:auto;
    padding:10px 12px;border-right:0;border-bottom:1px solid var(--ln)}
  aside .marca{padding:0 12px 0 4px}
  aside .marca span{display:none}
  aside nav{flex-direction:row;gap:4px}
  aside nav button{padding:9px 12px;font-size:12.5px}
  aside nav button span.tx{display:none}
  aside .pie{display:none}
  main{padding:14px}
  .encab h1{font-size:20px}
}

/* ===== MARCA DE AGUA: el logo de una moneda, cambiando cada tanto ===== */
#marca{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  display:grid;place-items:center}
#marca .ma{width:min(62vh,620px);height:min(62vh,620px);opacity:var(--maOp,.055);
  transition:opacity 1.4s ease;filter:saturate(1.2)}
#marca .ma svg{width:100%;height:100%;display:block}
#app{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){#marca .ma{transition:none}}

/* ===== los números van en blanco; el color se guarda para lo que importa ===== */
.met .v{color:var(--tx)}
.met .cab .ico{background:var(--b3);color:var(--t2)}
.met.dest .cab .ico{background:color-mix(in srgb,var(--ac) 20%,transparent);color:var(--ac)}

/* ===== ganancia y pérdida: cápsulas vivas ===== */
.gpill{display:inline-block;padding:4px 10px;border-radius:8px;font-weight:800;
  font-family:Consolas,monospace;font-size:13.5px;line-height:1.25}
.gpill.p{background:var(--up);color:#04120C}
.gpill.n{background:var(--dn);color:#fff}
.gpill.z{background:var(--b3);color:var(--t2)}
.gsub{display:block;font-size:11px;margin-top:3px;font-weight:700}

/* ===== tabla con vida ===== */
tbody tr.cl td:first-child{position:relative}
tbody tr.cl td:first-child::before{content:"";position:absolute;left:0;top:6px;bottom:6px;
  width:3px;border-radius:3px;background:var(--fc,transparent)}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--b2) 45%,transparent)}
tbody tr.cl:hover{background:color-mix(in srgb,var(--ac) 9%,transparent)}
.cri .ic{box-shadow:0 0 0 2px color-mix(in srgb,var(--fc) 45%,transparent)}
.pesoc{display:inline-flex;align-items:center;gap:7px}
.pesoc i{display:block;height:5px;border-radius:3px;background:var(--fc);min-width:3px}
.pesoc span{font-size:11px;color:var(--t3)}

/* ===== botón vender: rojo vivo de verdad ===== */
.b.rj{background:linear-gradient(140deg,#FF2D55,#E01040);border-color:#FF2D55;color:#fff;font-weight:700}
.b.rj:hover{background:linear-gradient(140deg,#FF4D6D,#FF2D55);border-color:#FF6B85;color:#fff}
.b.vd{background:linear-gradient(140deg,#00E08A,#00B26E);border-color:#00E08A;color:#04120C;font-weight:700}
.b.vd:hover{background:linear-gradient(140deg,#2BFFA8,#00E08A);color:#04120C}

/* ===== ventana de venta: viva ===== */
.hoja.venta .hh{background:linear-gradient(120deg,color-mix(in srgb,#FF2D55 26%,var(--b1)),var(--b1))}
.hoja.compra .hh{background:linear-gradient(120deg,color-mix(in srgb,var(--up) 22%,var(--b1)),var(--b1))}
.slid input[type=range]{accent-color:#FF2D55}
.espejo div{border-color:color-mix(in srgb,#FF2D55 30%,var(--ln))}
.rapidos button:hover,.rapidos button.on{border-color:#FF2D55;color:#FF4D6D;
  background:color-mix(in srgb,#FF2D55 12%,transparent)}

/* ===== selectores con icono ===== */
.selector{width:100%;display:flex;align-items:center;gap:11px;background:var(--b0);
  border:1px solid var(--ln);border-radius:10px;padding:10px 13px;cursor:pointer;
  font-family:inherit;color:var(--tx);text-align:left}
.selector:hover{border-color:var(--ac)}
.selector .ic,.selector .casa{width:30px;height:30px;flex:none}
.selector span{flex:1;min-width:0}
.selector span b{display:block;font-size:14px}
.selector span i{font-style:normal;font-size:11.5px;color:var(--t3)}
.selector em{font-style:normal;font-size:11px;color:var(--ac);font-weight:700}

.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px;
  max-height:52vh;overflow-y:auto}
.mfic{display:flex;align-items:center;gap:10px;background:var(--b0);border:1px solid var(--ln);
  border-radius:11px;padding:9px 11px;cursor:pointer;font-family:inherit;color:var(--tx);text-align:left}
.mfic:hover{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,transparent)}
.mfic.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.mfic .ic,.mfic .casa{width:28px;height:28px;flex:none}
.mfic span{flex:1;min-width:0}
.mfic span b{display:block;font-size:13.5px}
.mfic span i{font-style:normal;font-size:11px;color:var(--t3);display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mfic em{font-style:normal;font-size:9.5px;color:var(--ac);font-weight:800}

/* ===== logo de casa de cambio ===== */
.casa{display:inline-grid;place-items:center;border-radius:7px;flex:none}
.casa svg{width:74%;height:74%;display:block}
.casita{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--t3)}


/* ===== HERO: la cifra que importa, con color ===== */
.hero{border-radius:var(--rad,14px);margin-bottom:14px;overflow:hidden;
  border:1px solid var(--ln);background:var(--b1);position:relative}
.hero::before{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;
  background:radial-gradient(120% 150% at 0% 0%,var(--up),transparent 62%)}
.hero.pierde::before{background:radial-gradient(120% 150% at 0% 0%,var(--dn),transparent 62%)}
.hz{position:relative;display:flex;gap:20px;flex-wrap:wrap;padding:20px 22px}
.hprin{flex:1;min-width:280px}
.he{font-size:11.5px;letter-spacing:.16em;color:var(--t2);font-weight:700;margin-bottom:8px}
.hv{font-size:48px;font-weight:800;letter-spacing:-.035em;line-height:1}
.hv small{font-size:15px;font-weight:600;color:var(--t3);margin-left:7px}
.hg{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.gp2{font-family:Consolas,monospace;font-size:17px;font-weight:800}
.gch{font-family:Consolas,monospace;font-size:13px;font-weight:700;padding:4px 10px;
  border-radius:7px;background:var(--b2)}
.meta{margin-top:14px;max-width:420px}
.meta .mb{height:9px;border-radius:5px;background:var(--b0);overflow:hidden;border:1px solid var(--ln)}
.meta .mb i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--up));
  transition:width .6s ease}
.meta .mt{font-size:12px;color:var(--t2);margin-top:6px;font-family:Consolas,monospace}
.hsec{display:grid;grid-template-columns:repeat(2,minmax(130px,1fr));gap:10px;align-content:center}
.hc{background:var(--b2);border:1px solid var(--ln);border-radius:11px;padding:11px 13px}
.hc .e{font-size:9.5px;letter-spacing:.13em;color:var(--t3);font-weight:700}
.hc .v{font-size:19px;font-weight:700;margin-top:4px}
.hc .s{font-size:10.5px;color:var(--t3);margin-top:2px}

/* ===== gráfica de crecimiento ===== */
.gcre{width:100%;height:210px;display:block}
.leyg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--t3);font-weight:500}
.leyg i{width:14px;height:3px;border-radius:2px}
.gpie{display:flex;justify-content:space-between;font-size:11.5px;color:var(--t3);
  font-family:Consolas,monospace;padding-top:6px;border-top:1px solid var(--ln)}
.gpie b{font-size:14px}

/* ===== USDT ===== */
.tjU{border-color:color-mix(in srgb,#26A17B 45%,var(--ln))}
.icoU{width:46px;height:46px;flex:none;display:block}
.icoU .ic{width:46px;height:46px}
.etU{font-size:10px;letter-spacing:.14em;color:var(--t3);font-weight:700}
.valU{font-size:28px;font-weight:800;line-height:1.15;margin-top:2px}
.subU{font-size:11.5px;color:var(--t3)}

/* ===== mejor y peor juntas ===== */
.mpg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mp{background:var(--b0);border:1px solid var(--ln);border-left:3px solid var(--fc);
  border-radius:11px;padding:12px 13px}
.mpt{font-size:9.5px;letter-spacing:.14em;color:var(--t3);font-weight:800;margin-bottom:8px}

.mpc b{font-size:14px;display:block}
.mpc span{font-size:11px;color:var(--t3)}
.mpv{font-family:Consolas,monospace;font-size:24px;font-weight:800;line-height:1}
.mps{font-size:11.5px;color:var(--t3);font-family:Consolas,monospace;margin-top:4px}

/* ===== DETALLE ===== */
.detm{background:var(--b1)}
.dh{background:linear-gradient(115deg,color-mix(in srgb,var(--fc) 30%,var(--b1)),var(--b1));
  align-items:flex-start}

.dic .ic{width:52px;height:52px}

.dgran{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}

.dgran .v{font-size:27px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.dgran .s{font-size:11.5px;color:var(--t3);margin-top:4px;font-family:Consolas,monospace}

.dregla{position:relative;height:52px;margin:4px 0 2px}
.dregla .via{position:absolute;left:0;right:0;top:22px;height:8px;border-radius:5px;
  background:var(--b0);border:1px solid var(--ln)}
.dregla .via i{position:absolute;top:0;bottom:0;border-radius:5px;opacity:.55}
.dregla .pt{position:absolute;top:20px;width:12px;height:12px;border-radius:50%;
  transform:translateX(-50%);border:2px solid var(--b1);cursor:help}
.dregla .mk{position:absolute;top:15px;width:3px;height:22px;border-radius:2px;
  background:var(--t2);transform:translateX(-50%)}
.dregla .mk.aho{height:28px;top:12px}
.dregla .et{position:absolute;top:0;font-size:10.5px;font-family:Consolas,monospace;
  color:var(--t2);transform:translateX(-50%);white-space:nowrap}
.dregla .et.ab{top:auto;bottom:0}
.dregt{font-size:11px;color:var(--t3);margin-bottom:14px}

.dchips{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:9px;margin-bottom:14px}
.dch{background:var(--b0);border:1px solid var(--ln);border-radius:10px;padding:10px 12px}
.dch .e{font-size:9.5px;letter-spacing:.11em;color:var(--t3);font-weight:700}
.dch .v{font-size:16px;font-weight:700;margin-top:3px}
.dch .s{font-size:10px;color:var(--t3);margin-top:2px}

.dsim{background:var(--b0);border:1px solid color-mix(in srgb,var(--ac) 35%,var(--ln));
  border-radius:12px;padding:13px 15px;margin-bottom:14px}
.dst{font-size:14px;margin-bottom:4px}
.dst b{color:var(--ac);font-size:16px}
.dsim input[type=range]{width:100%;accent-color:var(--ac);height:30px;padding:0;border:0;background:none}

.dsv div{display:flex;flex-direction:column}
.dsv span{font-size:10.5px;color:var(--t3)}
.dsv .sv{font-size:21px;font-weight:800}

.dmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;font-size:12.5px}
.dmp div{background:var(--b0);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;
  font-family:Consolas,monospace}

.mvx{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;
  background:var(--b0);border:1px solid var(--ln);margin-bottom:9px}
.mvx.compra{border-left:3px solid var(--up)}
.mvx.venta{border-left:3px solid var(--dn)}
.mvx .fh{text-align:center;flex:none;min-width:52px;padding:6px 8px;border-radius:10px;background:var(--b2)}
.mvx .fh b{display:block;font-size:18px;font-weight:800;font-family:Consolas,monospace;line-height:1}
.mvx .fh span{font-size:9.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em}
.mvx .q{flex:1;min-width:0}

.mvx .q .l1 em{font-style:normal;font-family:Consolas,monospace;font-weight:800}
.mvx .q .l2{font-size:11.5px;color:var(--t3);font-family:Consolas,monospace;

.mvx .bar{height:4px;border-radius:3px;background:var(--b2);margin-top:7px;overflow:hidden}
.mvx .bar i{display:block;height:100%;background:var(--fc,var(--t3));opacity:.75}
.mvx .rr{text-align:right;flex:none;font-family:Consolas,monospace}
.mvx .rr b{display:block;font-size:15px;font-weight:800}
.mvx .rr span{font-size:9.5px;color:var(--t3)}
.mvx .p{text-align:right;flex:none;font-family:Consolas,monospace;min-width:76px}
.mvx .p b{font-size:16px;font-weight:800;display:block}
.mvx .p span{font-size:10.5px;color:var(--t3)}

tfoot td{padding:13px 14px;border-top:2px solid var(--ln);background:var(--b2);
  font-family:Consolas,monospace;font-size:14px;text-align:right;font-variant-numeric:tabular-nums}

}


.alx{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--ln)}
.alx:last-child{border-bottom:0}
.alx .ic{width:28px;height:28px;flex:none}

  letter-spacing:.03em;white-space:nowrap}
thead th:first-child span.cap{background:color-mix(in srgb,var(--ac) 16%,var(--b0));

/* ===== hero más llamativo ===== */
.hero::after{content:"";position:absolute;right:-6%;top:-30%;width:46%;height:190%;
  border-radius:50%;pointer-events:none;opacity:.10;
  background:radial-gradient(circle,var(--up),transparent 66%)}

.hero{border-width:1px;border-left:4px solid var(--up)}

/* ===== futuros: formulario ordenado ===== */
.fuw.elar .fh2{background:linear-gradient(115deg,color-mix(in srgb,var(--up) 28%,var(--b1)),var(--b1))}
.fuw.esc .fh2{background:linear-gradient(115deg,color-mix(in srgb,var(--dn) 26%,var(--b1)),var(--b1))}
.pill.grande button{flex-direction:column;gap:2px;padding:11px 8px;font-size:14px}
.pill.grande button span{display:block;font-size:10.5px;font-weight:500;opacity:.75}
.fsec{font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--ac);
  margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--ln)}

  border:1px solid var(--ln);text-align:center}
.frt{font-size:10.5px;letter-spacing:.15em;font-weight:800;color:var(--t3)}
.frv{font-family:Consolas,monospace;font-size:32px;font-weight:800;line-height:1.1;margin:4px 0}
.frs{font-size:12px;color:var(--t3);font-family:Consolas,monospace;line-height:1.6}

.pasos{margin:0;padding-left:20px;font-size:13px;line-height:1.9;color:var(--t2)}

/* ===== estado de sincronización ===== */
.syn{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--t3);

/* icono: dibujo propio, o disco con el color de la moneda y su símbolo */
function icono(sym){
  sym=String(sym||"").toUpperCase();
  var m=MONEDAS[sym];
  if(DIBUJOS[sym]) return '<svg class="ic" viewBox="0 0 32 32">'+DIBUJOS[sym]+'</svg>';
  var col=m?m.c:colorDe(sym), txt=(m&&m.t)?m.t:tintaPara(col);
  var t=sym.slice(0,4);
  return '<span class="ic"><span class="disco" style="background:'+col+';color:'+txt+
         ';font-size:'+(t.length>3?9:t.length>2?10.5:12)+'px">'+esc(t)+'</span></span>';
}
/* color estable para una moneda que no está en el catálogo */
function colorDe(sym){
  var h=0; for(var i=0;i<sym.length;i++) h=(h*31+sym.charCodeAt(i))%360;
  return "hsl("+h+",62%,52%)";
}
function tintaPara(c){
  if(c.indexOf("hsl")===0) return "#0A0E17";
  var r=parseInt(c.substr(1,2),16),g=parseInt(c.substr(3,2),16),b=parseInt(c.substr(5,2),16);
  return (r*0.299+g*0.587+b*0.114)>150 ? "#0A0E17" : "#fff";
}
function nombreDe(sym){ var m=MONEDAS[String(sym).toUpperCase()]; return m?m.n:String(sym).toUpperCase(); }
function esEstable(sym){ var m=MONEDAS[String(sym).toUpperCase()]; return !!(m&&m.estable); }

/* ---------- utilidades ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function num(v){
  if(v==null) return null;
  var s=String(v).trim().replace(/\s/g,"").replace(/,/g,".");
  if(s==="") return null;
  var n=parseFloat(s);
  return isNaN(n)?null:n;
}
/* dinero: siempre 2 decimales, con separador de miles */
function usd(n){
  if(n==null||isNaN(n)) return "—";
  var s=Math.abs(n).toLocaleString("es-EC",{minimumFractionDigits:2,maximumFractionDigits:2});
  return (n<0?"-":"")+"$"+s;
}
/* precio: los decimales que hagan falta según su tamaño */
function precio(n){
  if(n==null||isNaN(n)) return "—";
  var a=Math.abs(n), d = a>=1000?2 : a>=1?4 : a>=0.01?6 : 8;
  return "$"+n.toLocaleString("es-EC",{minimumFractionDigits:2,maximumFractionDigits:d});
}
/* cantidad de monedas: sin ceros de sobra */
function cant(n){
  if(n==null||isNaN(n)) return "—";
  var a=Math.abs(n), d = a>=1000?2 : a>=1?4 : a>=0.0001?6 : 8;
  return n.toLocaleString("es-EC",{minimumFractionDigits:0,maximumFractionDigits:d});
}
function pct(n,dec){
  if(n==null||isNaN(n)||!isFinite(n)) return "—";
  return (n>=0?"+":"")+n.toFixed(dec==null?2:dec)+"%";
}
function claseDe(n){ return n==null||isNaN(n)?"neutro":(n>0?"sube":(n<0?"baja":"neutro")); }
function hoy(){ var d=new Date(); return d.getFullYear()+"-"+P(d.getMonth()+1)+"-"+P(d.getDate()); }
function ahora(){ var d=new Date(); return hoy()+" "+P(d.getHours())+":"+P(d.getMinutes()); }
function P(n){ return (n<10?"0":"")+n; }
function fechaCorta(f){
  if(!f) return "—";
  var p=String(f).slice(0,10).split("-");
  if(p.length!==3) return esc(f);
  var M=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return p[2]+" "+M[(+p[1])-1]+" "+p[0].slice(2);
}
function hora(t){
  if(!t) return "—";
  var d=new Date(t);
  return P(d.getHours())+":"+P(d.getMinutes());
}
function idNuevo(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function aviso(txt, malo){
  var e=document.getElementById("aviso");
  if(!e) return;
  e.textContent=txt;
  e.className="on"+(malo?" mal":"");
  clearTimeout(aviso._t);
  aviso._t=setTimeout(function(){ e.className=""; },4000);
}

var BD={ ops:[], fut:[], precios:{}, alertas:[], borrados:[], ajustes:{}, tema:null, sembrado:0, v:7 };
var LLAVE="portafolio-cripto-v7";
var MEM=null;   /* si el navegador no deja guardar, al menos no se cae */

function guardar(){
  if(BD.ajustes) BD.ajustes.mod=Date.now();
  try{ localStorage.setItem(LLAVE, JSON.stringify(BD)); }
  catch(e){ MEM=JSON.stringify(BD); }
}
function cargar(){
  var t=null;
  try{ t=localStorage.getItem(LLAVE); }catch(e){ t=MEM; }
  if(!t) return;
  try{
    var d=JSON.parse(t);
    if(d&&typeof d==="object"){
      BD.ops=Array.isArray(d.ops)?d.ops:[];
      BD.fut=Array.isArray(d.fut)?d.fut:[];
      BD.precios=(d.precios&&typeof d.precios==="object")?d.precios:{};
      BD.ajustes=Object.assign({}, d.ajustes||{});
      BD.alertas=Array.isArray(d.alertas)?d.alertas:[];
      BD.borrados=Array.isArray(d.borrados)?d.borrados:[];
      BD.tema=d.tema||null; BD.sembrado=d.sembrado||0;
    }
  }catch(e){ /* archivo dañado: se empieza limpio en vez de morir */ }
}

function simbolos(){
  var s={};
  BD.ops.forEach(function(o){ if(o.sym) s[o.sym]=1; });
  BD.fut.forEach(function(f){ if(f.sym) s[f.sym]=1; });
  return Object.keys(s);
}

function precioDe(sym){
  var p=BD.precios[String(sym).toUpperCase()];
  if(p&&typeof p.p==="number") return p.p;
  if(esEstable(sym)) return 1;      /* las estables valen 1 dólar */
  return null;
}
function esManual(sym){
  var p=BD.precios[String(sym).toUpperCase()];
  return !!(p&&p.mano);
}
function ponerPrecioMano(sym, v){
  sym=String(sym).toUpperCase();
  BD.precios[sym]=Object.assign({}, BD.precios[sym], {p:v, mano:true, t:Date.now()});
  guardar();
}
function cambioDe(sym){
  var p=BD.precios[String(sym).toUpperCase()];
  return (p&&typeof p.ch==="number")?p.ch:null;
}

function traerPrecios(silencioso){
  var syms=simbolos().filter(function(s){ return !esEstable(s); });
  if(!syms.length){ pintarPulso("listo"); return Promise.resolve(); }
  if(PRE.cargando) return Promise.resolve();
  PRE.cargando=true; pintarPulso("buscando");
  /* se prueban varias fuentes: basta que una conteste */
  var fuentes=[binance, coingecko, coinbase, coincap];
  var i=0;
  function siguiente(){
    if(i>=fuentes.length) return Promise.reject(new Error("ninguna fuente respondió"));
    return fuentes[i++](syms).catch(siguiente);
  }
  return siguiente().then(function(res){
    var t=Date.now(), n=0;
    Object.keys(res.datos).forEach(function(s){
      BD.precios[s]=Object.assign({}, BD.precios[s], res.datos[s], {t:t, mano:false});
      n++;
    });
    PRE.ultimo=t; PRE.fuente=res.fuente; PRE.fallo="";
    guardar(); PRE.cargando=false; pintarPulso("listo"); repintar();
    var faltan=syms.filter(function(x){ return precioDe(x)==null; });
    if(!silencioso) aviso("Precios al día · "+n+" moneda(s) desde "+res.fuente+
      (faltan.length?" · sin precio: "+faltan.join(", "):"."));
  }).catch(function(e){
    PRE.cargando=false; PRE.fallo=String(e&&e.message||e);
    pintarPulso("sinred"); repintar();
    if(!silencioso) aviso("Ninguna fuente de precios respondió. Puede escribirlos a mano.", true);
  });
}

function conTiempo(url, ms){
  return new Promise(function(ok, mal){
    var listo=false;
    var t=setTimeout(function(){ if(!listo){ listo=true; mal(new Error("tardó demasiado")); } }, ms||9000);
    fetch(url,{cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("respuesta "+r.status);
      return r.json();
    }).then(function(j){ if(!listo){ listo=true; clearTimeout(t); ok(j); } })
      .catch(function(e){ if(!listo){ listo=true; clearTimeout(t); mal(e); } });
  });
}

function binance(syms){
  var pares=syms.map(function(s){ return '"'+s+'USDT"'; }).join(",");
  var url="https://api.binance.com/api/v3/ticker/24hr?symbols=["+pares+"]";
  return conTiempo(encodeURI(url)).then(function(arr){
    if(!Array.isArray(arr)||!arr.length) throw new Error("sin datos");
    var d={};
    arr.forEach(function(x){
      var s=String(x.symbol||"").replace(/USDT$/,"");
      var p=parseFloat(x.lastPrice), c=parseFloat(x.priceChangePercent);
      if(s&&!isNaN(p)) d[s]={p:p, ch:isNaN(c)?null:c};
    });
    if(!Object.keys(d).length) throw new Error("sin datos");
    return {datos:d, fuente:"Binance"};
  });
}

var CG_indice=null;   /* símbolo -> id interno de CoinGecko, se pide una sola vez */
function cgIndice(){
  if(CG_indice) return Promise.resolve(CG_indice);
  return conTiempo("https://api.coingecko.com/api/v3/coins/list", 12000).then(function(l){
    var m={};
    (l||[]).forEach(function(c){
      var s=String(c.symbol||"").toUpperCase();
      if(s && !m[s]) m[s]=c.id;      /* el primero suele ser el bueno */
    });
    CG_indice=m; return m;
  }).catch(function(){ return {}; });
}
function coingecko(syms){
  var faltan=syms.filter(function(s){ return !CG[s]; });
  /* si hay monedas que no conozco, primero se pide el índice */
  if(faltan.length && !CG_indice)
    return cgIndice().then(function(){ return coingeckoYa(syms); });
  return coingeckoYa(syms);
}
function coingeckoYa(syms){
  var ids=[], mapa={};
  syms.forEach(function(s){
    var id=CG[s] || (CG_indice&&CG_indice[s]) || String(s).toLowerCase();
    ids.push(id); mapa[id]=s;
  });
  var url="https://api.coingecko.com/api/v3/simple/price?ids="+ids.join(",")+
          "&vs_currencies=usd&include_24hr_change=true";
  return conTiempo(url).then(function(j){
    var d={};
    Object.keys(j||{}).forEach(function(id){
      var s=mapa[id]; if(!s) return;
      var p=j[id].usd, c=j[id].usd_24h_change;
      if(typeof p==="number") d[s]={p:p, ch:(typeof c==="number"?c:null)};
    });
    if(!Object.keys(d).length) throw new Error("sin datos");
    return {datos:d, fuente:"CoinGecko"};
  });
}

function coinbase(syms){
  /* Coinbase da una moneda por consulta; se piden en paralelo */
  return Promise.all(syms.map(function(sy){
    return conTiempo("https://api.coinbase.com/v2/prices/"+sy+"-USD/spot", 8000)
      .then(function(j){
        var p=parseFloat(j&&j.data&&j.data.amount);
        return isNaN(p)?null:{s:sy, p:p};
      }).catch(function(){ return null; });
  })).then(function(arr){
    var d={};
    arr.forEach(function(x){ if(x) d[x.s]={p:x.p, ch:null}; });
    if(!Object.keys(d).length) throw new Error("sin datos");
    return {datos:d, fuente:"Coinbase"};
  });
}
function coincap(syms){
  return conTiempo("https://api.coincap.io/v2/assets?limit=2000", 10000).then(function(j){
    var lista=(j&&j.data)||[], d={}, quiero={};
    syms.forEach(function(s){ quiero[s]=1; });
    lista.forEach(function(a){
      var s=String(a.symbol||"").toUpperCase();
      if(!quiero[s]) return;
      var p=parseFloat(a.priceUsd), c=parseFloat(a.changePercent24Hr);
      if(!isNaN(p)) d[s]={p:p, ch:isNaN(c)?null:c};
    });
    if(!Object.keys(d).length) throw new Error("sin datos");
    return {datos:d, fuente:"CoinCap"};
  });
}

function pintarPulso(estado){
  var p=document.getElementById("act"), t=document.getElementById("actT");
  if(!p||!t) return;
  var syms=simbolos().filter(function(s){ return !esEstable(s); });
  if(!syms.length){ p.className="act"; t.textContent="Sin monedas todavía"; return; }
  if(estado==="buscando"){ p.className="act"; t.textContent="Buscando precios…"; return; }
  if(estado==="sinred"){
    p.className="act mal";
    t.textContent = PRE.ultimo ? "Sin internet · precios de las "+hora(PRE.ultimo)
                               : "Sin internet · aún sin precios";
    return;
  }
  if(!PRE.ultimo){ p.className="act"; t.textContent="Sin precios todavía"; return; }
  var min=Math.round((Date.now()-PRE.ultimo)/60000);
  p.className="act"+(min>10?" vjo":"");
  t.textContent = "Actualización: "+(min<1?"ahora mismo":"hace "+min+" min")+
                  (PRE.fuente?" · "+PRE.fuente:"");
}

var relojPrecios=null;
function programarPrecios(){
  clearInterval(relojPrecios);
  if(!BD.ajustes.auto) return;
  var seg=Math.max(20, +BD.ajustes.cada||60);
  relojPrecios=setInterval(function(){ traerPrecios(true); }, seg*1000);
}

/* =====================================================================
   MARCA DE AGUA — el logo de una moneda popular, cambiando cada tanto
   ===================================================================== */
var MA_POPULARES=["BTC","ETH","BNB","SOL","XRP","ADA","DOGE","AVAX","LINK","DOT","MATIC","TRX","LTC","TON"];
var MA_reloj=null, MA_i=0;
function pintarMarca(){
  var d=document.getElementById("marca");
  if(!d) return;
  if(!BD.ajustes.marca){ d.innerHTML=""; return; }
  /* prefiere las monedas que él tiene; si no, las populares */
  /* solo monedas CON logo dibujado: nunca se muestra el nombre en letras */
  var mias=simbolos().filter(function(s){ return !esEstable(s) && DIBUJOS[s]; });
  var lista = mias.length ? mias : MA_POPULARES.filter(function(s){ return DIBUJOS[s]; });
  if(!lista.length){ d.innerHTML=""; return; }
  var sym=lista[MA_i%lista.length];
  var svg='<svg viewBox="0 0 32 32">'+DIBUJOS[sym]+'</svg>';
  d.innerHTML='<div class="ma" style="opacity:0">'+svg+'</div>';
  var e=d.firstChild;
  /* el desvanecido es un adorno: si algo falla aquí, no debe tumbar el arranque */
  try{
    if(typeof requestAnimationFrame==="function") requestAnimationFrame(function(){ e.style.opacity=""; });
    else e.style.opacity="";
  }catch(x){ e.style.opacity=""; }
  MA_i++;
}
function programarMarca(){
  clearInterval(MA_reloj);
  if(!BD.ajustes.marca) { pintarMarca(); return; }
  pintarMarca();
  var seg=Math.max(4, +BD.ajustes.marcaCada||12);
  MA_reloj=setInterval(pintarMarca, seg*1000);
}

function aclarar(hex, k){
  var r=parseInt(hex.substr(1,2),16), g=parseInt(hex.substr(3,2),16), b=parseInt(hex.substr(5,2),16);
  function m(x){ return Math.round(x+(255-x)*k); }
  return "#"+[m(r),m(g),m(b)].map(function(x){ return ("0"+x.toString(16)).slice(-2); }).join("");
}
function aplicarTema(){
  var t=BD.tema, R=document.documentElement.style;
  R.setProperty("--ac", t.ac);
  R.setProperty("--ac2", aclarar(t.ac,.35));
  R.setProperty("--h", t.h);
  R.setProperty("--s", t.s+"%");
  R.setProperty("--L", t.L+"%");
  R.setProperty("--up", t.up||"#2FD07E");

  document.documentElement.classList.toggle("claro", t.L>=52);
}

/* =====================================================================
   CUENTAS — spot
   ===================================================================== */
function estadoDe(sym){
  var ops=BD.ops.filter(function(o){ return o.sym===sym; })
                .sort(function(a,b){ return (a.fecha+a.id)<(b.fecha+b.id)?-1:1; });
  var cantidad=0, costo=0, realizado=0, comprado=0, vendido=0, nCompras=0, nVentas=0;
  ops.forEach(function(o){
    var c=+o.cant||0, p=+o.precio||0, com=+o.com||0;
    if(o.tipo==="venta"){
      if(c>cantidad+1e-12) c=cantidad;
      var prom = cantidad>0 ? costo/cantidad : 0;
      var salida = c*p - com;
      realizado += salida - c*prom;
      costo -= c*prom; cantidad -= c; vendido += salida; nVentas++;
      if(cantidad<1e-12){ cantidad=0; costo=0; }
    } else {
      cantidad += c; costo += c*p + com; comprado += c*p + com; nCompras++;
    }
  });
  var pr=precioDe(sym), valor = pr!=null ? cantidad*pr : null;
  var abierto = valor!=null ? valor-costo : null;
  return {sym:sym, ops:ops, cantidad:cantidad, costo:costo,
    promedio: cantidad>0?costo/cantidad:null, precio:pr, valor:valor, abierto:abierto,
    abiertoPct: (abierto!=null&&costo>0)?abierto/costo*100:null,
    realizado:realizado, comprado:comprado, vendido:vendido,
    nCompras:nCompras, nVentas:nVentas, cerrada: cantidad<=0 && ops.length>0};
}
function carteraSpot(){
  var s={}; BD.ops.forEach(function(o){ if(o.sym) s[o.sym]=1; });
  var lista=Object.keys(s).map(estadoDe);
  lista.sort(function(a,b){
    if(a.cerrada!==b.cerrada) return a.cerrada?1:-1;
    return (b.valor||0)-(a.valor||0);
  });
  var t={valor:0,costo:0,abierto:0,realizado:0,sinPrecio:0};
  lista.forEach(function(e){
    if(e.cantidad>0){
      t.costo+=e.costo;
      if(e.valor!=null){ t.valor+=e.valor; t.abierto+=e.abierto; } else t.sinPrecio++;
    }
    t.realizado+=e.realizado;
  });
  t.abiertoPct = t.costo>0 ? t.abierto/t.costo*100 : null;
  return {lista:lista, tot:t};
}


/* =====================================================================
   FUTUROS — usted pone dólares de margen; lo demás sale solo.
     margen  = lo que arriesga ($20)
     valor   = margen × apalancamiento
     monedas = valor ÷ precio de entrada
     % del precio  = cuánto se movió la moneda
     % de ganancia = ese movimiento × apalancamiento (sobre su margen)
     ganancia      = margen × % de ganancia
   ===================================================================== */
function estadoOp(f){
  var margen=+f.monto||0, apal=+f.apal||1, ent=+f.entrada||0;
  var valor=margen*apal;
  var monedas = ent>0 ? valor/ent : 0;
  var signo = f.lado==="SHORT" ? -1 : 1;
  var sal = (f.salida!=null && f.salida!=="") ? +f.salida : null;

  var pctPrecio=null, pctMargen=null;
  if(sal!=null && ent>0){
    pctPrecio = signo*(sal-ent)/ent*100;
    pctMargen = pctPrecio*apal;
  } else if(f.pct!=null && f.pct!==""){
    /* operaciones viejas: solo guardaban el % sobre el margen */
    pctMargen = (+f.pct)*100;
    pctPrecio = apal>0 ? pctMargen/apal : null;
  }
  var com=+f.com||0;
  var gan = pctMargen!=null ? margen*pctMargen/100 - com : null;

  /* liquidación aproximada, margen aislado */
  var liq = (ent>0 && apal>1)
    ? (f.lado==="SHORT" ? ent*(1+1/apal) : ent*(1-1/apal)) : null;

  /* qué gana si pega el TP y qué pierde si le llega el SL */
  var tp = (f.tp!=null && f.tp!=="") ? +f.tp : null;
  var sl = (f.sl!=null && f.sl!=="") ? +f.sl : null;
  var ganTp = (tp!=null && ent>0) ? margen*(signo*(tp-ent)/ent*100*apal)/100 : null;
  var perSl = (sl!=null && ent>0) ? margen*(signo*(sl-ent)/ent*100*apal)/100 : null;
  var rr = (ganTp!=null && perSl!=null && perSl<0) ? Math.abs(ganTp/perSl) : null;

  /* si sigue abierta y hay precio de mercado, cuánto va ganando ahora */
  var flot=null, pctFlot=null;
  if(sal==null && f.estado==="abierta" && ent>0 && f.sym){
    var pr=precioDe(f.sym);
    if(pr!=null){
      pctFlot = signo*(pr-ent)/ent*100*apal;
      flot = margen*pctFlot/100 - com;
    }
  }
  return {f:f, margen:margen, apal:apal, entrada:ent, valor:valor, monedas:monedas,
          salida:sal, pctPrecio:pctPrecio, pct:pctMargen!=null?pctMargen/100:null,
          pctMargen:pctMargen, gan:gan, com:com, liq:liq,
          tp:tp, sl:sl, ganTp:ganTp, perSl:perSl, rr:rr,
          flot:flot, pctFlot:pctFlot,
          abierta: f.estado==="abierta"};
}

function carteraFut(){
  var lista=BD.fut.map(estadoOp);
  var cerradas=lista.filter(function(e){ return !e.abierta && e.pct!=null; });
  var abiertas=lista.filter(function(e){ return e.abierta; });
  var t={n:cerradas.length, gan:0, pctAcum:0, ganadas:0, perdidas:0,
         margenAbierto:0, nAb:abiertas.length, flotante:0, comision:0};
  var sg=0,ng=0,sp=0,np=0;
  cerradas.forEach(function(e){
    t.gan+=e.gan; t.pctAcum+=e.pct; t.comision+=e.com;
    if(e.pct>0){ t.ganadas++; sg+=e.pct; ng++; } else { t.perdidas++; sp+=e.pct; np++; }
  });
  abiertas.forEach(function(e){ t.margenAbierto+=e.margen; t.flotante+=(e.flot||0); });
  t.aciertos = t.n ? t.ganadas/t.n*100 : null;
  t.mediaGana = ng ? sg/ng*100 : null;
  t.mediaPierde = np ? sp/np*100 : null;
  t.esperanza = t.n ? t.pctAcum/t.n*100 : null;
  t.lados={};
  ["LONG","SHORT"].forEach(function(l){
    var L=cerradas.filter(function(e){ return e.f.lado===l; });
    var g=L.filter(function(e){ return e.pct>0; });
    t.lados[l]={n:L.length, ganadas:g.length,
      aciertos: L.length?g.length/L.length*100:null,
      gan: L.reduce(function(a,e){ return a+e.gan; },0),
      pct: L.reduce(function(a,e){ return a+e.pct; },0)*100};
  });
  var racha=0, signo=null;
  for(var i=cerradas.length-1;i>=0;i--){
    var s=cerradas[i].pct>0;
    if(signo===null){ signo=s; racha=1; }
    else if(s===signo) racha++;
    else break;
  }
  t.racha=racha; t.rachaGana=signo;
  return {lista:lista, cerradas:cerradas, abiertas:abiertas, tot:t};
}

    };

      f.com=num(M.querySelector("#cK").value)||0;
      f.mod=Date.now();
      guardar(); cerrar(); repintar();

      aviso("Cerrada · "+(s2.gan>=0?"ganó ":"perdió ")+usd(Math.abs(s2.gan))+".");
    };
  });

/* aviso cuando faltan precios */
function alertaPrecios(){
  var syms=simbolos().filter(function(s){ return !esEstable(s); });
  var sin=syms.filter(function(s){ return precioDe(s)==null; });
  if(!sin.length) return "";
  var todos=sin.length===syms.length;
  return '<div class="alerta"><div class="t"><b>'+
    (todos?"No se pudieron traer los precios":"Sin precio: "+sin.join(", "))+'</b>'+
    '<span>'+(todos?"Sin precios no se puede calcular la ganancia. Pulse Actualizar, o escríbalos a mano una vez."
      :"Esas monedas no aparecen en las fuentes. Escriba el precio a mano.")+'</span></div>'+
    '<button class="b" onclick="traerPrecios(false)">Reintentar</button>'+
    '<button class="b ac" onclick="preciosAMano()">Escribir a mano</button></div>';
}

/* cambio de 24 h del portafolio, pesado por lo que tiene de cada una */
function cambio24(S){
  var v=0, d=0;
  S.lista.forEach(function(e){
    var ch=cambioDe(e.sym);
    if(e.cantidad>0 && e.valor!=null && ch!=null){ v+=e.valor; d+=e.valor*ch/100; }
  });
  return v>0 ? {pct:d/(v-d)*100, usd:d} : null;
}
/* USDT disponible: lo que le entró por sus ventas más las estables que registró */
function efectivo(){
  var t=0;
  BD.ops.forEach(function(o){
    if(o.tipo==="venta" && !esEstable(o.sym))
      t += (+o.cant||0)*(+o.precio||0) - (+o.com||0);
  });
  Object.keys(MONEDAS).forEach(function(s){
    if(!MONEDAS[s].estable) return;
    var e=estadoDe(s); if(e.cantidad>0) t+=e.cantidad;
  });
  return t;
}
function nVentas(){
  return BD.ops.filter(function(o){ return o.tipo==="venta"; }).length;
}

  var e=efectivo(), n=nVentas();

function filaRank(e){
  return '<div class="rank">'+icono(e.sym)+'<div><b>'+esc(e.sym)+'</b>'+

    '<span>'+(e.abierto>=0?"+":"−")+usd(e.abierto).replace("-","")+'</span></div></div>';

function resumenRosca(S, vivas, ch){
  var cv=vivas.filter(function(e){ return e.valor>0; })
              .sort(function(a,b){ return b.valor-a.valor; });
  var suma=cv.reduce(function(a,e){ return a+e.valor; },0);
  var texto="";
  if(!cv.length) texto="Todavía no hay precios para calcular el reparto.";
  else {
    var may=cv[0];
    texto="Su portafolio "+(S.tot.abierto>=0?"va ganando":"va perdiendo")+" "+
      usd(Math.abs(S.tot.abierto))+" ("+pct(S.tot.abiertoPct)+") sobre los "+usd(S.tot.costo)+
      " que invirtió. Está repartido en "+cv.length+" moneda(s), y la más pesada es "+
      may.sym+" con el "+(may.valor/suma*100).toFixed(0)+"% del total"+
      (ch?". En las últimas 24 h "+(ch.usd>=0?"subió ":"bajó ")+usd(Math.abs(ch.usd)):"")+".";
  }
  var h='<p class="mut" style="margin:0 0 14px;font-size:13px">'+esc(texto)+'</p>';
  if(!cv.length) return h;
  /* rosca */
  var R=64, r=42, C=2*Math.PI*R, acum=0;
  var s='<svg viewBox="0 0 150 150"><g transform="translate(75,75) rotate(-90)">';
  cv.forEach(function(e){
    var f=e.valor/suma, largo=C*f;
    s+='<circle r="'+R+'" fill="none" stroke="'+colDe(e.sym)+'" stroke-width="20" '+
       'stroke-dasharray="'+largo.toFixed(2)+' '+(C-largo).toFixed(2)+'" '+
       'stroke-dashoffset="'+(-acum).toFixed(2)+'"/>';
    acum+=largo;
  });
  s+='</g><text x="75" y="72" text-anchor="middle" font-family="Consolas,monospace" font-size="16" '+
     'font-weight="700" fill="var(--tx)">'+usd(suma).replace("$","")+'</text>'+
     '<text x="75" y="88" text-anchor="middle" font-size="10" fill="var(--t3)">USD</text></svg>';
  return h+'<div class="rosca">'+s+'<div class="ley">'+
    cv.slice(0,6).map(function(e){
      return '<span><i style="background:'+colDe(e.sym)+'"></i>'+esc(e.sym)+
        '<b>'+(e.valor/suma*100).toFixed(1)+'%</b></span>';
    }).join("")+'</div></div>';
}
function enganchar(c){
  c.querySelectorAll("tr[data-sym]").forEach(function(tr){
    tr.onclick=function(ev){
      if(ev.target.closest("button")) return;
      verMoneda(tr.getAttribute("data-sym"));
    };
  });
  c.querySelectorAll("[data-vender]").forEach(function(b){
    b.onclick=function(ev){ ev.stopPropagation(); venderMoneda(b.getAttribute("data-vender")); };
  });
}

function venderMoneda(sym){
  var e=estadoDe(sym);
  if(e.cantidad<=0){ aviso("No tiene "+sym+" para vender.",true); return; }
  var pr=precioDe(sym);
  abrir('<div class="hoja venta"><div class="hh">'+icono(sym)+
    '<h3>Vender '+esc(sym)+'</h3><button class="x" data-cerrar>×</button></div><div class="hb">'+
    '<div class="mut" style="margin-bottom:14px">Tiene <b class="mono" style="color:var(--tx)">'+
      cant(e.cantidad)+' '+esc(sym)+'</b> · compradas a '+precio(e.promedio)+' de promedio'+
      (pr!=null?' · hoy vale '+precio(pr):'')+'</div>'+
    '<label>Cuánto vender <b id="vPc" class="mono" style="color:var(--ac);font-size:14px">50%</b></label>'+
    '<div class="slid"><input type="range" id="vRg" min="0" max="100" step="0.5" value="50"></div>'+
    '<div class="rapidos">'+[25,50,75,100].map(function(p){
      return '<button data-rp="'+p+'">'+(p===100?"TODO":p+"%")+'</button>'; }).join("")+'</div>'+
    '<div class="espejo">'+
      '<div><div class="e">Va a vender</div><div class="v mono" id="vCant">—</div></div>'+
      '<div><div class="e">Recibe</div><div class="v mono ao" id="vUsd">—</div></div>'+
    '</div>'+
    '<div class="campos" style="margin-top:14px">'+
      '<div class="campo"><label>Precio de venta</label>'+
        '<input id="vPr" inputmode="decimal" value="'+(pr!=null?pr:"")+'"></div>'+
      '<div class="campo"><label>Fecha</label><input type="date" id="vF" value="'+hoy()+'"></div>'+
      '<div class="campo"><label>Comisión</label><input id="vK" inputmode="decimal" placeholder="0"></div>'+
      '<div class="campo"><label>Cantidad exacta</label>'+
        '<input id="vEx" inputmode="decimal" value=""></div>'+
    '</div>'+
    '<div class="nota" id="vR">Mueva la barra para elegir cuánto vender.</div>'+
    '</div><div class="hf"><button class="b" data-cerrar>Cancelar</button>'+
    '<button class="b rj" id="vOk">Registrar venta</button></div></div>',
  function(M){
    var rg=M.querySelector("#vRg"), ex=M.querySelector("#vEx");
    function cantidadElegida(){
      var v=num(ex.value);
      if(v!=null) return Math.min(v, e.cantidad);
      return e.cantidad * (+rg.value)/100;
    }
    function rec(){
      var c=cantidadElegida(), p=num(M.querySelector("#vPr").value),
          k=num(M.querySelector("#vK").value)||0;
      M.querySelector("#vPc").textContent=(e.cantidad>0?(c/e.cantidad*100).toFixed(1):"0")+"%";
      M.querySelector("#vCant").textContent=cant(c)+" "+sym;
      M.querySelector("#vUsd").textContent = p!=null ? usd(c*p-k) : "—";
      var r=M.querySelector("#vR");
      if(p==null){ r.textContent="Escriba el precio de venta."; return; }
      var g=(p-e.promedio)*c-k;
      var queda=e.cantidad-c;
      r.innerHTML="Recibe <b>"+usd(c*p-k)+"</b> · "+
        (g>=0?"gana <b style='color:var(--up)'>":"pierde <b style='color:var(--dn)'>")+
        usd(Math.abs(g))+"</b> frente a su promedio de "+precio(e.promedio)+
        (queda>1e-12?" · le quedan <b>"+cant(queda)+" "+sym+"</b>"
                    :" · <b>vende toda su posición</b>");
      M.querySelectorAll("[data-rp]").forEach(function(b){
        b.className = Math.abs((+b.getAttribute("data-rp"))-(c/e.cantidad*100))<0.6 ? "on" : "";
      });
    }

    });

    });
    ["#vPr","#vK"].forEach(function(id){ M.querySelector(id).addEventListener("input", rec); });

function diasInvertido(){

              .map(function(o){ return o.fecha; }).sort();

  return Math.max(0, Math.round(d));
}

/* =====================================================================
   CÓMO CRECIÓ SU DINERO — con las fechas reales de sus compras
   La línea gris es lo que fue poniendo; la de color, lo que vale hoy
   todo lo que llevaba comprado hasta esa fecha.
   ===================================================================== */
function graficaCrecimiento(){
  var ops=BD.ops.filter(function(o){ return o.fecha; })
                .slice().sort(function(a,b){ return a.fecha<b.fecha?-1:1; });
  if(ops.length<2) return "";
  var puntos=[], inv=0, val=0, tengo={};
  ops.forEach(function(o){
    var c=+o.cant||0, p=+o.precio||0, k=+o.com||0;
    if(o.tipo==="venta"){ tengo[o.sym]=(tengo[o.sym]||0)-c; inv-=c*p; }
    else { tengo[o.sym]=(tengo[o.sym]||0)+c; inv+=c*p+k; }
    val=0;
    Object.keys(tengo).forEach(function(s){
      var pr=precioDe(s);
      if(pr!=null && tengo[s]>0) val+=tengo[s]*pr;
    });
    puntos.push({f:o.fecha, inv:inv, val:val});
  });
  var W=760, H=210, mL=8, mR=8, mT=16, mB=26;
  var max=Math.max.apply(null, puntos.map(function(p){ return Math.max(p.inv,p.val); }))*1.12 || 1;
  function X(i){ return mL+(i/(puntos.length-1))*(W-mL-mR); }
  function Y(v){ return H-mB-(v/max)*(H-mT-mB); }
  function ruta(campo){
    return puntos.map(function(p,i){
      return (i?"L":"M")+X(i).toFixed(1)+" "+Y(p[campo]).toFixed(1);
    }).join(" ");
  }
  var area="M"+X(0).toFixed(1)+" "+(H-mB)+" "+
    puntos.map(function(p,i){ return "L"+X(i).toFixed(1)+" "+Y(p.val).toFixed(1); }).join(" ")+
    " L"+X(puntos.length-1).toFixed(1)+" "+(H-mB)+" Z";
  var ult=puntos[puntos.length-1];
  var gan=ult.val-ult.inv;

  var s='<svg viewBox="0 0 '+W+' '+H+'" class="gcre" preserveAspectRatio="none">'+
    '<defs><linearGradient id="gr1" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="'+(gan>=0?"var(--up)":"var(--dn)")+'" stop-opacity=".42"/>'+
    '<stop offset="1" stop-color="'+(gan>=0?"var(--up)":"var(--dn)")+'" stop-opacity="0"/>'+
    '</linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#gr1)"/>'+
    '<path d="'+ruta("inv")+'" fill="none" stroke="var(--t3)" stroke-width="2" '+
      'stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>'+
    '<path d="'+ruta("val")+'" fill="none" stroke="'+(gan>=0?"var(--up)":"var(--dn)")+
      '" stroke-width="2.6" vector-effect="non-scaling-stroke"/>';
  puntos.forEach(function(p,i){
    s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.val).toFixed(1)+'" r="3.2" '+
       'fill="var(--b1)" stroke="'+(gan>=0?"var(--up)":"var(--dn)")+'" stroke-width="2"/>';
  });
  s+='</svg>';
  return '<div class="caja"><h2>Cómo creció su dinero<span class="sp"></span>'+
    '<span class="leyg"><i style="background:var(--t3)"></i>lo que puso</span>'+
    '<span class="leyg"><i style="background:'+(gan>=0?"var(--up)":"var(--dn)")+'"></i>lo que vale hoy</span>'+
    '</h2><div class="cp" style="padding-bottom:10px">'+s+
    '<div class="gpie"><span>'+fechaCorta(puntos[0].f)+'</span>'+
    '<span class="'+cl(gan)+'"><b>'+(gan>=0?"+":"−")+usd(gan).replace("-","")+'</b> de diferencia</span>'+
    '<span>hoy</span></div></div></div>';
}

/* la regla de precios con cada compra marcada */
function reglaCompras(e, compras){
  if(e.precio==null || !compras.length) return "";
  var ps=compras.map(function(o){ return +o.precio; });
  ps.push(e.precio); ps.push(e.promedio);
  var lo=Math.min.apply(null,ps), hi=Math.max.apply(null,ps);
  var m=(hi-lo)*0.18 || lo*0.08;
  var min=lo-m, max=hi+m, an=max-min;
  function X(v){ return Math.max(1.5,Math.min(98.5,(v-min)/an*100)); }
  var xa=X(e.precio), xp=X(e.promedio), gana=e.precio>=e.promedio;
  var s='<div class="dregla"><div class="via">'+
    '<i style="left:'+Math.min(xp,xa)+'%;width:'+Math.abs(xa-xp)+'%;background:'+
    (gana?"var(--up)":"var(--dn)")+'"></i></div>';
  compras.forEach(function(o){
    var x=X(+o.precio), buena=e.precio>=+o.precio;
    s+='<span class="pt" style="left:'+x+'%;background:'+(buena?"var(--up)":"var(--dn)")+'" '+
       'title="'+esc(fechaCorta(o.fecha))+' · '+precio(o.precio)+'"></span>';
  });
  s+='<span class="mk prom" style="left:'+xp+'%"></span>'+
     '<span class="mk aho" style="left:'+xa+'%;background:'+(gana?"var(--up)":"var(--dn)")+'"></span>'+
     '<span class="et" style="left:'+xp+'%">promedio '+precio(e.promedio)+'</span>'+
     '<span class="et ab" style="left:'+xa+'%;color:'+(gana?"var(--up)":"var(--dn)")+'">hoy '+
     precio(e.precio)+'</span></div>'+
     '<div class="dregt">Cada punto es una compra suya · verde las que van ganando, rojo las que no</div>';
  return s;
}

/* filas de compras y ventas, con logo de la casa y días */

  var maxT=Math.max.apply(null, e.ops.map(function(o){ return (+o.cant||0)*(+o.precio||0); }))||1;

    var v=o.tipo==="venta";

      '<div class="fh"><b>'+(p[2]||"--")+'</b><span>'+(M2[(+p[1])-1]||"")+" "+(p[0]||"").slice(2)+'</span></div>'+
      '<div class="q"><div class="l1">'+(v?"Vendió":"Compró")+' <em>'+cant(o.cant)+'</em> '+esc(sym)+
        ' a <em>'+precio(o.precio)+'</em></div>'+
      '<div class="l2">'+(o.casa?logoCasa(o.casa,15)+" ":"")+
        (v?"recibió ":"pagó ")+usd(tot)+
        ((+o.com)?" · comisión "+usd(o.com):"")+
        (dd!=null?" · hace "+dd+" días":"")+
        (o.nota?" · "+esc(o.nota):"")+'</div>'+
      '<div class="bar"><i style="width:'+(bruto/maxT*100).toFixed(1)+'%"></i></div></div>'+
      (r!=null?'<div class="rr '+cl(r)+'"><b>'+pct(r,1)+'</b><span>esta compra</span></div>':'')+
      '<div class="p"><b class="'+(v?"dn":"up")+'">'+(v?"−":"+")+usd(tot).replace("-","")+'</b>'+
        '<span>'+(v?"salió":"entró")+'</span></div>'+
      '<button class="b sm" data-ed="'+o.id+'">Editar</button></div>';
  }).join("");
}

/* tarjeta de alertas: cuánto falta para que suenen */
function tarjetaAlertas(){
  var l=BD.alertas||[];
  if(!l.length){

      '<button class="b ac sm" onclick="nuevaAlerta()">+ Crear alerta</button></div></div>';
  }
  var con=l.map(function(a){
    var p=precioDe(a.sym);
    var son = p!=null && (a.dir==="sube" ? p>=a.precio : p<=a.precio);

  }).sort(function(x,y){

    '<button class="b sm" onclick="irA(\'alr\')">Ver todas</button></h2><div class="cp">'+
    con.slice(0,4).map(function(x){

          :(x.falta!=null?'<b>'+x.falta.toFixed(1)+'%</b><span>falta</span>':'<span>sin precio</span>'))+
        '</div></div>';
    }).join("")+'</div></div>';
}

/* =====================================================================

function pintarRes(){
  var c=document.getElementById("cuerpo"), S=carteraSpot(), F=carteraFut();

    c.innerHTML='<div class="caja"><div class="vacio"><b>Su portafolio empieza aquí</b>'+

    return;
  }
  var ch=cambio24(S), efe=efectivo();
  var vivas=S.lista.filter(function(e){ return e.cantidad>0 && !esEstable(e.sym); });
  var h=alertaPrecios()+avisoAlertas();
  h+=heroValor(S, ch, vivas, efe);
  h+=graficaCrecimiento();
  var conP=vivas.filter(function(e){ return e.abiertoPct!=null; })

        '<td>'+(e.valor!=null?usd(e.valor):"—")+'</td>'+
        '<td><span class="gpill '+(e.abierto>0?"p":e.abierto<0?"n":"z")+'">'+
          (e.abierto!=null?(e.abierto>=0?"+":"−")+usd(e.abierto).replace("-",""):"—")+'</span>'+
          (e.abiertoPct!=null?'<span class="gsub '+cl(e.abiertoPct)+'">'+pct(e.abiertoPct)+'</span>':'')+'</td>'+

  if(F.tot.n||F.tot.nAb){

      '<div class="mut" style="margin-top:5px">'+F.tot.n+' cerradas'+

var MOV_f="todo";
function pintarMov(){
  var c=document.getElementById("cuerpo"), todo=[];
  BD.ops.forEach(function(o){ todo.push({f:o.fecha,k:o.tipo==="venta"?"venta":"compra",o:o}); });
  BD.fut.forEach(function(x){ todo.push({f:x.fecha||"",k:"futuro",x:x}); });
  todo.sort(function(a,b){ return (a.f||"")<(b.f||"")?1:-1; });
  var lista=todo.filter(function(m){ return MOV_f==="todo"||m.k===MOV_f; });
  var M2=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  var nC=todo.filter(function(m){ return m.k==="compra"; }).length,
      nV=todo.filter(function(m){ return m.k==="venta"; }).length,
      nF=todo.filter(function(m){ return m.k==="futuro"; }).length;

  var h='<div class="mets">'+
    met(IC.mov,"Movimientos", String(todo.length), "", "desde el principio")+
    met(IC.sube,"Compras", String(nC), "up", "de criptomonedas")+
    met(IC.baja,"Ventas", String(nV), nV?"dn":"nt", "realizadas")+
    met(IC.fut,"Futuros", String(nF), "ao", "operaciones")+
    '</div>';
  h+='<div class="caja"><h2>Historial completo<span class="sp"></span>'+
    ["todo","compra","venta","futuro"].map(function(k){
      var e={todo:"Todo",compra:"Compras",venta:"Ventas",futuro:"Futuros"}[k];
      return '<button class="b sm'+(MOV_f===k?" ac":"")+'" data-mf="'+k+'">'+e+'</button>';
    }).join(" ")+'</h2><div class="cp">';
  if(!lista.length) h+='<div class="mut">No hay movimientos de ese tipo.</div>';
  lista.forEach(function(m){
    var p=String(m.f||"").split("-");
    var fh='<div class="fh"><b>'+(p[2]||"--")+'</b><span>'+(M2[(+p[1])-1]||"")+" "+(p[0]||"").slice(2)+'</span></div>';
    if(m.k==="futuro"){
      var e=estadoOp(m.x);
      h+='<div class="mv fut">'+(m.f?fh:'<div class="fh"><b>'+(m.x.n||"—")+'</b><span>op</span></div>')+
        '<div class="q"><div class="l1">'+(m.x.lado==="SHORT"?"Corto":"Largo")+' '+e.apal+'x'+
        (m.x.sym?" en "+esc(m.x.sym):"")+
        (e.pct!=null?' · salió en <em class="'+cl(e.pct)+'">'+pct(e.pct*100,1)+'</em>':' · <em>abierta</em>')+
        '</div><div class="l2">puso '+usd(e.monto)+(m.x.nota?" · "+esc(m.x.nota):"")+'</div></div>'+
        '<div class="p"><b class="'+cl(e.gan)+'">'+(e.gan!=null?(e.gan>=0?"+":"−")+
          usd(e.gan).replace("-",""):"—")+'</b><span>'+(e.pct!=null?"resultado":"sin cerrar")+'</span></div>'+
        '<button class="b sm" onclick="abrirFut(\''+m.x.id+'\')">Editar</button></div>';
    } else {
      var o=m.o, v=o.tipo==="venta";
      var bruto=(+o.cant||0)*(+o.precio||0), tot=v?bruto-(+o.com||0):bruto+(+o.com||0);
      h+='<div class="mv '+(v?"venta":"compra")+'">'+fh+
        '<div style="flex:none">'+icono(o.sym)+'</div>'+
        '<div class="q"><div class="l1">'+(v?"Vendió":"Compró")+' <em>'+cant(o.cant)+'</em> '+
        esc(o.sym)+' a <em>'+precio(o.precio)+'</em></div>'+
        '<div class="l2">'+esc(nombreDe(o.sym))+((+o.com)?" · comisión "+usd(o.com):"")+
        (o.nota?" · "+esc(o.nota):"")+'</div></div>'+
        '<div class="p"><b class="'+(v?"dn":"up")+'">'+(v?"−":"+")+usd(tot).replace("-","")+'</b>'+
        '<span>'+(v?"recibió":"pagó")+'</span></div>'+
        '<button class="b sm" onclick="abrirOp(null,null,\''+o.id+'\')">Editar</button></div>';
    }
  });
  h+='</div></div>';
  c.innerHTML=h;
  c.querySelectorAll("[data-mf]").forEach(function(b){
    b.onclick=function(){ MOV_f=b.getAttribute("data-mf"); pintarMov(); };
  });
}

/* =====================================================================
   ALERTAS — avisan cuando una moneda llega al precio que usted marque
   ===================================================================== */
function alertasQueSonaron(){
  return (BD.alertas||[]).filter(function(a){
    var p=precioDe(a.sym);
    if(p==null) return false;
    return a.dir==="sube" ? p>=a.precio : p<=a.precio;
  });
}
function avisoAlertas(){
  var s=alertasQueSonaron();
  if(!s.length) return "";
  return '<div class="alerta" style="background:color-mix(in srgb,var(--ac) 12%,var(--b1));'+
    'border-color:color-mix(in srgb,var(--ac) 45%,transparent)"><div class="t">'+
    '<b>'+s.length+' alerta(s) cumplida(s)</b><span>'+
    s.map(function(a){ return esc(a.sym)+" "+(a.dir==="sube"?"llegó a":"bajó a")+" "+precio(a.precio)+
      " (hoy "+precio(precioDe(a.sym))+")"; }).join(" · ")+
    '</span></div><button class="b ac" onclick="irA(\'alr\')">Ver alertas</button></div>';
}
function pintarAlr(){
  var c=document.getElementById("cuerpo");
  var lista=BD.alertas||[];
  var h='<div class="caja"><h2>Alertas de precio<span class="sp"></span>'+
    '<button class="b ac sm" onclick="nuevaAlerta()">+ Nueva alerta</button></h2><div class="cp">';
  if(!lista.length){
    h+='<div class="vacio"><b>Sin alertas</b><p>Marque un precio y el portafolio le avisa '+
      'cuando la moneda llegue ahí. Se revisa cada vez que se actualizan los precios.</p>'+
      '<button class="b ac" onclick="nuevaAlerta()">+ Crear la primera</button></div>';
  } else {
    lista.forEach(function(a,i){
      var p=precioDe(a.sym);
      var sono = p!=null && (a.dir==="sube" ? p>=a.precio : p<=a.precio);
      var falta = p!=null ? (a.precio-p)/p*100 : null;
      h+='<div class="alr'+(sono?" son":"")+'">'+icono(a.sym)+
        '<div class="q"><b>'+esc(a.sym)+' '+(a.dir==="sube"?"sube a":"baja a")+' '+precio(a.precio)+'</b>'+
        '<span>'+(p!=null
          ? ("hoy "+precio(p)+(sono?" · ¡cumplida!":" · falta "+pct(falta,1)))
          : "sin precio todavía")+'</span></div>'+
        (sono?'<span class="chip a">CUMPLIDA</span>':'')+
        '<button class="b sm" data-adel="'+i+'">Quitar</button></div>';
    });
  }
  h+='</div></div>';
  c.innerHTML=h;
  c.querySelectorAll("[data-adel]").forEach(function(b){
    b.onclick=function(){
      BD.alertas.splice(+b.getAttribute("data-adel"),1);
      guardar(); pintarAlr(); pintarMenu(); aviso("Alerta quitada.");
    };
  });
}
function nuevaAlerta(){
  var syms=simbolos();
  if(!syms.length){ aviso("Primero registre alguna compra.",true); return; }
  abrir('<div class="hoja"><div class="hh"><h3>Nueva alerta de precio</h3>'+
    '<button class="x" data-cerrar>×</button></div><div class="hb"><div class="campos">'+
    '<div class="campo ancho"><label>Moneda</label><select id="alS">'+
      syms.map(function(s){ return '<option value="'+esc(s)+'">'+esc(s)+' · '+esc(nombreDe(s))+'</option>'; }).join("")+
    '</select></div>'+
    '<div class="campo ancho"><label>Avisarme cuando</label>'+
      '<div class="pill" id="alD"><button data-d="sube" class="on v">SUBA A</button>'+
      '<button data-d="baja">BAJE A</button></div></div>'+
    '<div class="campo ancho"><label>Precio</label><input id="alP" inputmode="decimal" placeholder="0,00"></div>'+
    '</div><div class="nota" id="alR">Elija la moneda y el precio.</div></div>'+
    '<div class="hf"><button class="b" data-cerrar>Cancelar</button>'+
    '<button class="b ac" id="alOk">Crear alerta</button></div></div>',
  function(M){
    var dir="sube";
    M.querySelectorAll("#alD button").forEach(function(b){
      b.onclick=function(){
        dir=b.getAttribute("data-d");
        M.querySelectorAll("#alD button").forEach(function(x){
          var d=x.getAttribute("data-d");
          x.className = d===dir ? ("on "+(d==="baja"?"r":"v")) : "";
        });
        rec();
      };
    });
    function rec(){
      var s=M.querySelector("#alS").value, p=num(M.querySelector("#alP").value),
          ac=precioDe(s), r=M.querySelector("#alR");
      if(p==null){ r.textContent = ac!=null ? (s+" está hoy en "+precio(ac)) : "Elija el precio."; return; }
      if(ac==null){ r.textContent="Se avisará cuando "+s+" "+(dir==="sube"?"suba":"baje")+" a "+precio(p)+"."; return; }
      var d=(p-ac)/ac*100;
      r.textContent = s+" está en "+precio(ac)+" · su alerta está "+pct(d,1)+" de distancia"+
        ((dir==="sube"&&p<=ac)||(dir==="baja"&&p>=ac) ? " · ojo: ya se cumple ahora mismo" : "");
    }
    M.querySelector("#alS").addEventListener("change", rec);
    M.querySelector("#alP").addEventListener("input", rec);
    rec();
    M.querySelector("#alOk").onclick=function(){
      var s=M.querySelector("#alS").value, p=num(M.querySelector("#alP").value);
      if(p==null||p<=0){ aviso("Escriba el precio.",true); return; }
      BD.alertas=BD.alertas||[];
      BD.alertas.push({sym:s, dir:dir, precio:p, mod:Date.now()});
      guardar(); cerrar(); irA("alr"); pintarMenu();
      aviso("Alerta creada para "+s+".");
    };
  });
}

/* tarjeta con lo invertido en cada casa de cambio */
function tarjetaCasas(){
  var por={};
  BD.ops.forEach(function(o){
    if(o.tipo==="venta") return;
    var k=o.casa||"OTRA";
    por[k]=(por[k]||0)+(+o.cant||0)*(+o.precio||0)+(+o.com||0);
  });
  var ks=Object.keys(por).sort(function(a,b){ return por[b]-por[a]; });
  if(!ks.length) return "";
  var tot=ks.reduce(function(a,k){ return a+por[k]; },0);
  return '<div class="caja"><h2 style="font-size:14px">'+
    '<span style="color:var(--ac);display:flex">'+IC.banco+'</span> Dónde compró</h2><div class="cp">'+
    ks.map(function(k){
      return '<div class="rank" style="margin-bottom:9px">'+logoCasa(k,30)+
        '<div><b>'+esc(nombreCasa(k))+'</b><div class="mut" style="font-size:11.5px">'+
        (por[k]/tot*100).toFixed(0)+'% de lo invertido</div></div>'+
        '<div class="pc"><b>'+usd(por[k])+'</b></div></div>';
    }).join("")+'</div></div>';
}
function metD(icono, etiqueta, valor, clase, sub, unidad){
  return met(icono, etiqueta, valor, clase, sub, unidad).replace('class="met"','class="met dest"');
}

      (sg>=0?"+":"−")+usd(sg).replace("-","")+'</span></td><td></td></tr></tfoot>';
  }
  return h+'</table>';
}

        'placeholder="0,5" value="'+(o?o.cant:"")+'"></div>'+
      '<div class="campo"><label>Precio por moneda</label><input id="opP" inputmode="decimal" '+
        'placeholder="65000" value="'+(o?o.precio:"")+'"></div>'+
      '<div class="campo"><label>Comisión</label><input id="opK" inputmode="decimal" '+
        'placeholder="0" value="'+(o&&o.com?o.com:"")+'"></div>'+
      '<div class="campo ancho"><label>Total gastado (opcional)</label>'+
        '<input id="opT2" inputmode="decimal" placeholder="si escribe el total, la cantidad se calcula sola"></div>'+
      '<div class="campo ancho"><label>Nota</label><input id="opN" style="font-family:inherit" '+
        'placeholder="opcional" value="'+esc(o?(o.nota||""):"")+'"></div>'+

    '<button class="b" data-cerrar>Cancelar</button>'+
    '<button class="b ac" id="opOk">'+(o?"Guardar":"Registrar")+'</button></div></div>',
  function(M){
    var sel=t;
    function pintaSel(){
      M.querySelector("#opS").innerHTML = mon
        ? icono(mon)+'<span><b>'+esc(mon)+'</b><i>'+esc(nombreDe(mon))+'</i></span><em>cambiar</em>'
        : '<span><b>Elegir moneda…</b><i>toque para buscar entre todas</i></span><em>elegir</em>';
      M.querySelector("#opE").innerHTML = logoCasa(casa,26)+
        '<span><b>'+esc(nombreCasa(casa))+'</b><i>casa de cambio</i></span><em>cambiar</em>';

    pintaSel();
    M.querySelector("#opS").onclick=function(){
      elegirMoneda(mon, function(s){ mon=s; abrirOpVuelve(); });
    };
    M.querySelector("#opE").onclick=function(){
      elegirCasa(casa, function(c){ casa=c; abrirOpVuelve(); });
    };
    /* al volver de un selector se reabre el formulario con lo escrito */
    function abrirOpVuelve(){
      var datos={cant:M.querySelector("#opC").value, precio:M.querySelector("#opP").value,
        com:M.querySelector("#opK").value, fecha:M.querySelector("#opF").value,
        nota:M.querySelector("#opN").value};
      setTimeout(function(){
        abrirOp(sel, mon, editar);
        var N=document.getElementById("veloIn");
        if(!N) return;
        if(N.querySelector("#opC")){
          N.querySelector("#opC").value=datos.cant;
          N.querySelector("#opP").value=datos.precio;
          N.querySelector("#opK").value=datos.com;
          N.querySelector("#opF").value=datos.fecha;
          N.querySelector("#opN").value=datos.nota;
          OP_casa=casa;
          N.querySelector("#opC").dispatchEvent(new Event("input",{bubbles:true}));
        }
      },0);
    }
    if(OP_casa){ casa=OP_casa; OP_casa=null; pintaSel(); }

    M.querySelectorAll("#opT button").forEach(function(b){
      b.onclick=function(){
        sel=b.getAttribute("data-t");

      };
    });
    /* si escribe el total gastado, la cantidad sale sola */
    M.querySelector("#opT2").addEventListener("input", function(){
      var tt=num(this.value), p=num(M.querySelector("#opP").value);
      if(tt!=null && p!=null && p>0){
        M.querySelector("#opC").value=String(tt/p).replace(".",",");
        rec();
      }

    function rec(){
      var c=num(M.querySelector("#opC").value), p=num(M.querySelector("#opP").value),
          k=num(M.querySelector("#opK").value)||0, r=M.querySelector("#opR");
      if(!mon){ r.textContent="Primero elija la criptomoneda."; return; }
      if(c==null||p==null){ r.textContent="Escriba cantidad y precio."; return; }

      var txt=(sel==="venta"?"Recibe ":"Paga ")+usd(tot)+" por "+cant(c)+" "+mon+
              " en "+nombreCasa(casa);
      var pr=precioDe(mon);
      if(sel==="compra" && pr!=null){
        var d=(pr-p)/p*100;
        txt+=" · hoy "+mon+" está en "+precio(pr)+" ("+pct(d,1)+" contra este precio)";

      if(sel==="venta"){
        var est=estadoDe(mon);
        var disp=est.cantidad+(o&&o.sym===mon&&o.tipo==="venta"?(+o.cant||0):0);
        if(c>disp+1e-9) txt+=" · OJO: solo tiene "+cant(disp)+" "+mon;
        else if(est.promedio!=null){
          var g=(p-est.promedio)*c-k;
          txt+=" · "+(g>=0?"gana ":"pierde ")+usd(Math.abs(g))+" contra su promedio de "+precio(est.promedio);
        }
      }
      r.textContent=txt;
    }
    ["#opC","#opP","#opK"].forEach(function(id){
      M.querySelector(id).addEventListener("input", rec);
    });
    rec();

    if(o) M.querySelector("#opD").onclick=function(){
      cerrar();
      confirmar("Eliminar","Se borra la "+(o.tipo==="venta"?"venta":"compra")+" de "+cant(o.cant)+
        " "+esc(o.sym)+".","Eliminar",function(){
          BD.ops=BD.ops.filter(function(x){ return x.id!==o.id; });
          guardar(); repintar(); aviso("Eliminado.");
        }, true);
    };
    M.querySelector("#opOk").onclick=function(){
      var c=num(M.querySelector("#opC").value), p=num(M.querySelector("#opP").value),
          k=num(M.querySelector("#opK").value)||0, f=M.querySelector("#opF").value||hoy(),
          n=M.querySelector("#opN").value.trim();
      if(!mon){ aviso("Elija la criptomoneda.",true); return; }
      if(c==null||c<=0){ aviso("La cantidad debe ser mayor que cero.",true); return; }
      if(p==null||p<0){ aviso("Revise el precio.",true); return; }
      if(sel==="venta"){
        var est=estadoDe(mon), disp=est.cantidad+(o&&o.sym===mon&&o.tipo==="venta"?(+o.cant||0):0);
        if(c>disp+1e-9){ aviso("No puede vender "+cant(c)+" "+mon+": tiene "+cant(disp)+".",true); return; }
      }
      if(o){ o.sym=mon;o.tipo=sel;o.cant=c;o.precio=p;o.com=k;o.fecha=f;o.nota=n;o.casa=casa;o.mod=Date.now(); }
      else BD.ops.push({id:idNuevo(),sym:mon,tipo:sel,cant:c,precio:p,com:k,fecha:f,
                        nota:n,casa:casa,mod:Date.now()});
      BD.ajustes.casa=casa;
      guardar(); cerrar(); repintar(); traerPrecios(true);
      aviso(o?"Guardado.":(sel==="venta"?"Venta registrada.":"Compra registrada en "+nombreCasa(casa)+"."));
    };
  });
}
