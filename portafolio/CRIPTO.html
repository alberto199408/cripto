/* =====================================================================
   2 · UTILIDADES — números, fechas, texto
   ===================================================================== */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* entiende 1.250,50 y 1,250.50 y 0,5 y 0.5 */
function num(v){
  if(v==null) return null;
  var s=String(v).trim().replace(/[\s$%]/g,"");
  if(s==="") return null;
  var neg=s.charAt(0)==="-";
  if(neg||s.charAt(0)==="+") s=s.slice(1);
  var c=s.lastIndexOf(","), p=s.lastIndexOf(".");
  if(c>=0&&p>=0){ if(c>p) s=s.replace(/\./g,"").replace(/,/g,"."); else s=s.replace(/,/g,""); }
  else if(c>=0){ s=(s.split(",").length>2)?s.replace(/,/g,""):s.replace(",","."); }
  else if((s.split(".").length-1)>1){ s=s.replace(/\./g,""); }
  var n=parseFloat(s);
  if(isNaN(n)||!isFinite(n)) return null;
  return neg?-n:n;
}
function usd(n){
  if(n==null||isNaN(n)||!isFinite(n)) return "—";
  var s=Math.abs(n).toLocaleString("es-EC",{minimumFractionDigits:2,maximumFractionDigits:2});
  return (n<0?"-":"")+"$"+s;
}
/* dinero con los centavos que hagan falta cuando la cifra es chiquita */
function usdF(n){
  if(n==null||isNaN(n)||!isFinite(n)) return "—";
  var a=Math.abs(n), d=a>=1?2:(a>=0.01?3:4);
  return (n<0?"-":"")+"$"+a.toLocaleString("es-EC",{minimumFractionDigits:2,maximumFractionDigits:d});
}
function precio(n){
  if(n==null||isNaN(n)||!isFinite(n)) return "—";
  var a=Math.abs(n), d=a>=1000?2:a>=1?4:a>=0.01?6:8;
  return "$"+n.toLocaleString("es-EC",{minimumFractionDigits:2,maximumFractionDigits:d});
}
function cant(n){
  if(n==null||isNaN(n)||!isFinite(n)) return "—";
  var a=Math.abs(n), d=a>=1000?2:a>=1?4:a>=0.0001?6:8;
  return n.toLocaleString("es-EC",{minimumFractionDigits:0,maximumFractionDigits:d});
}
function pct(n,dec){
  if(n==null||isNaN(n)||!isFinite(n)) return "—";
  return (n>=0?"+":"")+n.toFixed(dec==null?2:dec).replace(".",",")+"%";
}
function pctS(n,dec){
  if(n==null||isNaN(n)||!isFinite(n)) return "—";
  return n.toFixed(dec==null?1:dec).replace(".",",")+"%";
}
function cl(n){ return n==null||isNaN(n)?"nt":(n>0?"up":(n<0?"dn":"nt")); }
function P(n){ return (n<10?"0":"")+n; }
function hoy(){ var d=new Date(); return d.getFullYear()+"-"+P(d.getMonth()+1)+"-"+P(d.getDate()); }
function horaYa(){ var d=new Date(); return P(d.getHours())+":"+P(d.getMinutes()); }
function ahora(){ return hoy()+" "+horaYa(); }
/* "1 operación" / "3 operaciones", nunca "1 operación(es)" */
function plural(n,uno,varios){ return n+" "+(Math.abs(n)===1?uno:varios); }
/* lo mismo cuando el número ya va escrito aparte */
function pal(n,uno,varios){ return Math.abs(n)===1?uno:varios; }
function hora(t){ if(!t) return "—"; var d=new Date(t); return P(d.getHours())+":"+P(d.getMinutes()); }
var MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fechaCorta(f){
  if(!f) return "—";
  var p=String(f).slice(0,10).split("-");
  if(p.length!==3) return esc(f);
  return (+p[2])+" "+MESES[(+p[1])-1]+" "+p[0].slice(2);
}
function fLarga(iso){
  var M=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre",
         "octubre","noviembre","diciembre"];
  var p=String(iso).split("-");
  return (+p[2])+" de "+(M[+p[1]-1]||"")+" de "+p[0];
}
function diasDesde(f){
  if(!f) return null;
  return Math.max(0, Math.round((Date.now()-new Date(String(f).slice(0,10)+"T12:00:00").getTime())/86400000));
}
function idNuevo(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
/* redondea un precio a los decimales que tienen sentido para su tamaño,
   para que al arrastrar la línea no salga 0,4145188731 */
function redondearPrecio(p){
  if(p==null||isNaN(p)) return p;
  var a=Math.abs(p), d = a>=1000?2 : a>=1?4 : a>=0.01?6 : 8;
  return +p.toFixed(d);
}
/* un número listo para escribirlo en una casilla, con coma decimal */
function paraCasilla(n){
  if(n==null||isNaN(n)) return "";
  return String(+(+n).toFixed(10)).replace(".",",");
}

function aviso(txt, malo){
  var e=document.getElementById("aviso");
  if(!e) return;
  e.setAttribute("role","status"); e.setAttribute("aria-live","polite");
  e.innerHTML=txt; e.title="Toque para cerrar";
  e.onclick=function(){ e.className=""; };
  e.className="on"+(malo?" mal":"");
  clearTimeout(aviso._t);
  var ms=Math.min(15000, Math.max(malo?6000:3500, String(txt).length*65));
  aviso._t=setTimeout(function(){ e.className=""; }, ms);
}

/* =====================================================================
   3 · LA CAJA DE DATOS
   Es la misma de siempre, así que al reemplazar el archivo no se pierde
   ni un registro. Lo nuevo (backtesting) se agrega al lado.
   ===================================================================== */
var BD={
  ops:[],        /* spot: compras y ventas                        */
  fut:[],        /* futuros de verdad                             */
  back:[],       /* operaciones de las pruebas (backtesting)      */
  pruebas:[],    /* las pruebas, cada una con su nombre y cartera */
  ordenes:[],    /* ventas programadas de spot: "vende X cuando llegue a Y" */
  histTot:[],    /* lo que valía todo su dinero, cada tanto, para la línea del resumen */
  precios:{},    /* último precio conocido de cada moneda         */
  logos:{},      /* logos bajados, para que salgan sin internet   */
  monedas:{},    /* monedas que usted agregó y no estaban         */
  alertas:[],
  borrados:[],
  ajustes:{},
  tema:null,
  sembrado:0,
  v:7
};
var MEM=null;              /* si el navegador no deja guardar, al menos no se cae */
var AJ_FIRMA=null;
var GUARDA_FALLA=false;

function firmaAjustes(){
  try{ return JSON.stringify([Object.assign({},BD.ajustes,{mod:0,git:0,verChk:0}), BD.tema]); }
  catch(e){ return ""; }
}
function guardar(){
  if(BD.ajustes){
    var f=firmaAjustes();
    if(AJ_FIRMA===null) AJ_FIRMA=f;
    else if(f!==AJ_FIRMA){ AJ_FIRMA=f; BD.ajustes.mod=Date.now(); }
    if(!BD.ajustes.mod) BD.ajustes.mod=Date.now();
  }
  try{ if(typeof GUARDADO_HORA!=="undefined" && GUARDADO_HORA){ GUARDADO_HORA=""; pintarBotonGuardar(); } }catch(e){}
  try{ localStorage.setItem(LLAVE, JSON.stringify(BD)); GUARDA_FALLA=false; }
  catch(e){
    MEM=JSON.stringify(BD);
    if(!GUARDA_FALLA){
      GUARDA_FALLA=true;
      /* lo más pesado son los logos: se sueltan y se vuelve a intentar */
      try{
        BD.logos={};
        localStorage.setItem(LLAVE, JSON.stringify(BD));
        GUARDA_FALLA=false;
      }catch(x){
        try{ aviso("Este navegador no está dejando guardar. Lo de hoy queda solo en memoria: "+
          "descargue una copia desde Configuración antes de cerrar la ventana.", true); }catch(y){}
      }
    }
  }
}
function cargar(){
  var t=null;
  try{ t=localStorage.getItem(LLAVE); }catch(e){ t=MEM; }
  if(!t) return;
  try{
    var d=JSON.parse(t);
    if(d&&typeof d==="object"){
      BD.ops=Array.isArray(d.ops)?d.ops:[];
      BD.fut=Array.isArray(d.fut)?d.fut:[];
      BD.back=Array.isArray(d.back)?d.back:[];
      BD.pruebas=Array.isArray(d.pruebas)?d.pruebas:[];
      BD.ordenes=Array.isArray(d.ordenes)?d.ordenes:[];
      BD.histTot=Array.isArray(d.histTot)?d.histTot:[];
      BD.precios=(d.precios&&typeof d.precios==="object")?d.precios:{};
      BD.logos=(d.logos&&typeof d.logos==="object")?d.logos:{};
      BD.monedas=(d.monedas&&typeof d.monedas==="object")?d.monedas:{};
      BD.ajustes=Object.assign({}, d.ajustes||{});
      BD.alertas=Array.isArray(d.alertas)?d.alertas:[];
      BD.borrados=Array.isArray(d.borrados)?d.borrados:[];
      BD.tema=d.tema||null;
      BD.sembrado=d.sembrado||0;
    }
  }catch(e){ /* archivo dañado: se empieza limpio en vez de morir */ }
}

/* =====================================================================
   4 · MONEDAS Y LOGOS
   El logo sale de tres sitios, en este orden: el dibujo propio, el que
   se bajó la primera vez y quedó guardado, o un disco con su color.
   ===================================================================== */
function datosMoneda(sym){
  sym=String(sym||"").toUpperCase();
  return MONEDAS[sym] || BD.monedas[sym] || null;
}
function nombreDe(sym){
  var m=datosMoneda(sym);
  return (m&&m.n) || String(sym||"").toUpperCase();
}
function esEstable(sym){
  var m=datosMoneda(sym);
  return !!(m&&m.estable);
}
function cgDe(sym){
  var m=datosMoneda(sym);
  return (m&&m.cg)||null;
}
function colorDe(sym){
  var h=0, s=String(sym||"");
  for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%360;
  return "hsl("+h+",62%,52%)";
}
function colDe(sym){
  var m=datosMoneda(sym);
  return (m&&m.c)||colorDe(sym);
}
/* tintaPara() vive en la parte de colores, más abajo */
function icono(sym, tam){
  sym=String(sym||"").toUpperCase();
  var st=tam?' style="width:'+tam+'px;height:'+tam+'px"':'';
  if(DIBUJOS[sym]) return '<svg class="ic"'+st+' viewBox="0 0 32 32">'+DIBUJOS[sym]+'</svg>';
  if(BD.logos[sym]) return '<img class="ic"'+st+' src="'+esc(BD.logos[sym])+'" alt="'+esc(sym)+'">';
  var m=datosMoneda(sym), col=colDe(sym), txt=(m&&m.t)?m.t:tintaPara(col);
  var t=sym.slice(0,4);
  return '<span class="ic"'+st+'><span class="disco" style="background:'+col+';color:'+txt+
    ';font-size:'+(t.length>3?9:t.length>2?10.5:12)+'px">'+esc(t)+'</span></span>';
}
function logoCasa(k, tam){
  var c=CASAS[k]||CASAS.OTRA;
  return '<span class="casa" style="width:'+(tam||22)+'px;height:'+(tam||22)+'px;background:'+c.c+
    ';color:'+(c.t||"#fff")+'" title="'+esc(c.n)+'"><svg viewBox="0 0 32 32">'+c.d+'</svg></span>';
}
function nombreCasa(k){ return (CASAS[k]||CASAS.OTRA).n; }

/* baja el logo una sola vez y lo deja guardado dentro del archivo de datos */
var LOGO_pedido={};
function traerLogo(sym, url){
  sym=String(sym||"").toUpperCase();
  if(!sym || DIBUJOS[sym] || BD.logos[sym] || LOGO_pedido[sym]) return Promise.resolve(false);
  LOGO_pedido[sym]=1;
  var p = url ? Promise.resolve(url) : buscarImagen(sym);
  return p.then(function(u){
    if(!u) return false;
    return fetch(u,{cache:"force-cache"}).then(function(r){
      if(!r.ok) throw new Error("no");
      return r.blob();
    }).then(function(b){
      if(b.size>90000) throw new Error("muy grande");
      return new Promise(function(ok,mal){
        var fr=new FileReader();
        fr.onload=function(){ ok(fr.result); };
        fr.onerror=function(){ mal(new Error("no se pudo leer")); };
        fr.readAsDataURL(b);
      });
    }).then(function(dataUri){
      BD.logos[sym]=dataUri;
      guardar();
      try{ refrescarLogos(sym); }catch(e){}
      return true;
    });
  }).catch(function(){ return false; });
}
function buscarImagen(sym){
  var cg=cgDe(sym);
  var url="https://api.coingecko.com/api/v3/search?query="+encodeURIComponent(cg||sym);
  return fetch(url,{cache:"no-store"}).then(function(r){ return r.json(); }).then(function(j){
    var l=(j&&j.coins)||[];
    var x = (cg && l.filter(function(c){ return c.id===cg; })[0]) ||
            l.filter(function(c){ return String(c.symbol||"").toUpperCase()===sym; })[0] || l[0];
    return x ? (x.large||x.thumb||null) : null;
  }).catch(function(){ return null; });
}
/* cuando llega un logo nuevo, se cambian los que estaban en pantalla sin repintar todo */
function refrescarLogos(sym){
  if(!BD.logos[sym]) return;
  document.querySelectorAll('.ic[data-sym="'+sym+'"]').forEach(function(e){
    var tam=e.getAttribute("style")||"";
    var img=document.createElement("img");
    img.className="ic"; img.src=BD.logos[sym]; img.alt=sym;
    img.setAttribute("data-sym",sym); img.setAttribute("style",tam);
    if(e.parentNode) e.parentNode.replaceChild(img,e);
  });
}
/* agrega una moneda que no estaba en el catálogo */
function agregarMoneda(sym, nombre, cg, img){
  sym=String(sym).toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(!sym) return null;
  if(!MONEDAS[sym]){
    BD.monedas[sym]=Object.assign({}, BD.monedas[sym], {
      n: nombre||BD.monedas[sym]&&BD.monedas[sym].n||sym,
      c: (BD.monedas[sym]&&BD.monedas[sym].c)||colorDe(sym),
      cg: cg||(BD.monedas[sym]&&BD.monedas[sym].cg)||null
    });
    guardar();
  }
  if(img) traerLogo(sym, img); else traerLogo(sym);
  return sym;
}
/* =====================================================================
   5 · PRECIOS
   Primero el canal EN VIVO de Binance, que manda el precio al segundo.
   Si esa moneda no está en Binance, o no hay internet, se piden a
   CoinGecko, Coinbase o CoinCap. Si todo falla, se usan los últimos
   precios guardados y se dice desde cuándo son.
   ===================================================================== */
var PRE={ cargando:false, ultimo:null, fuente:"", fallo:"", vivo:false };

/* todas las monedas que aparecen en algún lado */
function simbolos(){
  var s={};
  BD.ops.forEach(function(o){ if(o.sym) s[String(o.sym).toUpperCase()]=1; });
  BD.fut.forEach(function(f){ if(f.sym) s[String(f.sym).toUpperCase()]=1; });
  BD.back.forEach(function(f){ if(f.sym) s[String(f.sym).toUpperCase()]=1; });
  (BD.alertas||[]).forEach(function(a){ if(a.sym) s[String(a.sym).toUpperCase()]=1; });
  if(typeof MIRANDO==="string" && MIRANDO) s[MIRANDO]=1;   /* la del formulario abierto */
  return Object.keys(s);
}
function simbolosVivos(){
  return simbolos().filter(function(s){ return !esEstable(s); });
}
function precioDe(sym){
  var p=BD.precios[String(sym||"").toUpperCase()];
  if(p&&typeof p.p==="number") return p.p;
  if(esEstable(sym)) return 1;
  return null;
}
function cambioDe(sym){
  var p=BD.precios[String(sym||"").toUpperCase()];
  return (p&&typeof p.ch==="number")?p.ch:null;
}
function esManual(sym){
  var p=BD.precios[String(sym||"").toUpperCase()];
  return !!(p&&p.mano);
}
function ponerPrecioMano(sym,v){
  sym=String(sym).toUpperCase();
  BD.precios[sym]=Object.assign({},BD.precios[sym],{p:v,mano:true,t:Date.now()});
  guardar();
}
function quitarPrecioMano(sym){
  sym=String(sym).toUpperCase();
  if(BD.precios[sym]) BD.precios[sym]=Object.assign({},BD.precios[sym],{mano:false});
  guardar();
}
function preciosManuales(){
  var r={};
  Object.keys(BD.precios||{}).forEach(function(s){
    if(BD.precios[s]&&BD.precios[s].mano) r[s]=BD.precios[s];
  });
  return r;
}
/* guarda un precio nuevo; devuelve true si de verdad cambió */
function ponerPrecio(sym,p,ch,fuente){
  sym=String(sym).toUpperCase();
  var vj=BD.precios[sym];
  if(vj&&vj.mano) return false;                 /* el precio escrito a mano manda */
  var antes=vj&&typeof vj.p==="number"?vj.p:null;
  BD.precios[sym]=Object.assign({},vj,{p:p, ch:(ch==null?(vj?vj.ch:null):ch),
                                       t:Date.now(), mano:false});
  if(antes!==p){ TIC[sym]=(p>antes)?1:(p<antes?-1:0); return true; }
  return false;
}
var TIC={};        /* para pintar en verde o rojo el número que acaba de cambiar */

/* ---------------------------------------------------------------------
   EL CANAL EN VIVO (websocket de Binance)
   --------------------------------------------------------------------- */
var VIVO={ ws:null, syms:[], intento:0, reloj:null, guarda:null, ultimoMsg:0 };

function parBinance(s){ return String(s).toLowerCase()+"usdt"; }

function conectarVivo(){
  if(typeof WebSocket!=="function") return;
  var syms=simbolosVivos();
  if(!syms.length){ cerrarVivo(); return; }
  /* si ya está conectado con las mismas monedas, no se toca */
  if(VIVO.ws && VIVO.ws.readyState<=1 && VIVO.syms.join()===syms.join()) return;
  cerrarVivo();
  VIVO.syms=syms;
  var flujos=syms.slice(0,60).map(function(s){ return parBinance(s)+"@miniTicker"; }).join("/");
  var url="wss://stream.binance.com:9443/stream?streams="+flujos;
  var ws;
  try{ ws=new WebSocket(url); }catch(e){ return; }
  VIVO.ws=ws;
  ws.onopen=function(){
    VIVO.intento=0; PRE.vivo=true; PRE.fallo="";
    pintarPulso();
  };
  ws.onmessage=function(ev){
    var d;
    try{ d=JSON.parse(ev.data); }catch(e){ return; }
    var x=d&&d.data; if(!x||!x.s) return;
    var sym=String(x.s).replace(/USDT$/,"");
    var p=parseFloat(x.c), o=parseFloat(x.o);
    if(isNaN(p)) return;
    var ch = (!isNaN(o)&&o>0) ? (p-o)/o*100 : null;
    ponerPrecio(sym,p,ch,"Binance en vivo");
    PRE.ultimo=Date.now(); PRE.fuente="Binance en vivo"; VIVO.ultimoMsg=Date.now();
    pedirRefresco();
  };
  ws.onclose=function(){
    PRE.vivo=false;
    if(VIVO.ws!==ws) return;
    VIVO.ws=null;
    pintarPulso();
    /* vuelve a intentar, esperando cada vez un poco más */
    VIVO.intento++;
    var espera=Math.min(30000, 1500*Math.pow(1.7,Math.min(VIVO.intento,8)));
    clearTimeout(VIVO.reloj);
    VIVO.reloj=setTimeout(conectarVivo, espera);
  };
  ws.onerror=function(){ try{ ws.close(); }catch(e){} };
}
function cerrarVivo(){
  clearTimeout(VIVO.reloj);
  if(VIVO.ws){ var w=VIVO.ws; VIVO.ws=null; try{ w.onclose=null; w.close(); }catch(e){} }
  PRE.vivo=false;
}
/* los precios que llegan en vivo se guardan cada 20 s, no en cada tic */
function guardarPreciosDeVezEnCuando(){
  clearInterval(VIVO.guarda);
  VIVO.guarda=setInterval(function(){ if(PRE.vivo) guardar(); }, 20000);
}

/* ---------------------------------------------------------------------
   LAS FUENTES DE RESPALDO
   --------------------------------------------------------------------- */
function conTiempo(url, ms){
  return new Promise(function(ok,mal){
    var listo=false;
    var t=setTimeout(function(){ if(!listo){ listo=true; mal(new Error("tardó demasiado")); } }, ms||9000);
    fetch(url,{cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("respuesta "+r.status);
      return r.json();
    }).then(function(j){ if(!listo){ listo=true; clearTimeout(t); ok(j); } })
      .catch(function(e){ if(!listo){ listo=true; clearTimeout(t); mal(e); } });
  });
}
function binance(syms){
  var pares=syms.map(function(s){ return '"'+parBinance(s).toUpperCase()+'"'; }).join(",");
  var url="https://api.binance.com/api/v3/ticker/24hr?symbols=["+pares+"]";
  return conTiempo(encodeURI(url)).then(function(arr){
    if(!Array.isArray(arr)||!arr.length) throw new Error("sin datos");
    var d={};
    arr.forEach(function(x){
      var s=String(x.symbol||"").replace(/USDT$/,"");
      var p=parseFloat(x.lastPrice), c=parseFloat(x.priceChangePercent);
      if(s&&!isNaN(p)) d[s]={p:p,ch:isNaN(c)?null:c};
    });
    if(!Object.keys(d).length) throw new Error("sin datos");
    return {datos:d, fuente:"Binance"};
  });
}
var CG_indice=null;
function cgIndice(){
  if(CG_indice) return Promise.resolve(CG_indice);
  return conTiempo("https://api.coingecko.com/api/v3/coins/list",12000).then(function(l){
    var m={};
    (l||[]).forEach(function(c){
      var s=String(c.symbol||"").toUpperCase();
      if(s&&!m[s]) m[s]=c.id;
    });
    CG_indice=m; return m;
  }).catch(function(){ return {}; });
}
function coingecko(syms){
  var faltan=syms.filter(function(s){ return !cgDe(s); });
  if(faltan.length && !CG_indice) return cgIndice().then(function(){ return coingeckoYa(syms); });
  return coingeckoYa(syms);
}
function coingeckoYa(syms){
  var ids=[], mapa={};
  syms.forEach(function(s){
    var id=cgDe(s)||(CG_indice&&CG_indice[s])||String(s).toLowerCase();
    ids.push(id); mapa[id]=s;
  });
  var url="https://api.coingecko.com/api/v3/simple/price?ids="+ids.join(",")+
          "&vs_currencies=usd&include_24hr_change=true";
  return conTiempo(url).then(function(j){
    var d={};
    Object.keys(j||{}).forEach(function(id){
      var s=mapa[id]; if(!s) return;
      var p=j[id].usd, c=j[id].usd_24h_change;
      if(typeof p==="number") d[s]={p:p, ch:(typeof c==="number"?c:null)};
    });
    if(!Object.keys(d).length) throw new Error("sin datos");
    return {datos:d, fuente:"CoinGecko"};
  });
}
function coinbase(syms){
  return Promise.all(syms.map(function(sy){
    return conTiempo("https://api.coinbase.com/v2/prices/"+sy+"-USD/spot",8000)
      .then(function(j){ var p=parseFloat(j&&j.data&&j.data.amount); return isNaN(p)?null:{s:sy,p:p}; })
      .catch(function(){ return null; });
  })).then(function(arr){
    var d={};
    arr.forEach(function(x){ if(x) d[x.s]={p:x.p,ch:null}; });
    if(!Object.keys(d).length) throw new Error("sin datos");
    return {datos:d, fuente:"Coinbase"};
  });
}
function coincap(syms){
  return conTiempo("https://api.coincap.io/v2/assets?limit=2000",10000).then(function(j){
    var lista=(j&&j.data)||[], d={}, quiero={};
    syms.forEach(function(s){ quiero[s]=1; });
    lista.forEach(function(a){
      var s=String(a.symbol||"").toUpperCase();
      if(!quiero[s]) return;
      var p=parseFloat(a.priceUsd), c=parseFloat(a.changePercent24Hr);
      if(!isNaN(p)) d[s]={p:p,ch:isNaN(c)?null:c};
    });
    if(!Object.keys(d).length) throw new Error("sin datos");
    return {datos:d, fuente:"CoinCap"};
  });
}

function traerPrecios(silencioso){
  var syms=simbolosVivos();
  if(!syms.length){ pintarPulso(); return Promise.resolve(); }
  if(PRE.cargando) return Promise.resolve();
  PRE.cargando=true; pintarPulso("buscando");
  var fuentes=[binance,coingecko,coinbase,coincap], i=0;
  function siguiente(){
    if(i>=fuentes.length) return Promise.reject(new Error("ninguna fuente respondió"));
    return fuentes[i++](syms).catch(siguiente);
  }
  return siguiente().then(function(res){
    var n=0;
    Object.keys(res.datos).forEach(function(s){
      if(BD.precios[s]&&BD.precios[s].mano) return;
      ponerPrecio(s,res.datos[s].p,res.datos[s].ch,res.fuente); n++;
    });
    PRE.ultimo=Date.now();
    if(!PRE.vivo) PRE.fuente=res.fuente;
    PRE.fallo="";
    guardar(); PRE.cargando=false; pintarPulso(); repintar();
    var faltan=syms.filter(function(x){ return precioDe(x)==null; });
    if(!silencioso) aviso("Precios al día · "+plural(n,"moneda","monedas")+" desde "+res.fuente+
      (faltan.length?" · sin precio: "+faltan.join(", "):"."));
  }).catch(function(e){
    PRE.cargando=false; PRE.fallo=String(e&&e.message||e);
    pintarPulso(); repintar();
    if(!silencioso) aviso("Ninguna fuente de precios respondió. Puede escribirlos a mano "+
      "desde Configuración.", true);
  });
}

function pintarPulso(estado){
  var p=document.getElementById("pulso"), t=document.getElementById("pulsoT");
  if(!p||!t) return;
  var syms=simbolosVivos();
  if(!syms.length){ p.className="pulso"; t.textContent="Sin monedas todavía"; return; }
  if(estado==="buscando"){ p.className="pulso"; t.textContent="Buscando precios…"; return; }
  if(PRE.vivo){ p.className="pulso on"; t.textContent="EN VIVO · Binance"; return; }
  if(PRE.fallo){
    p.className="pulso mal";
    t.textContent = PRE.ultimo ? "Sin internet · precios de las "+hora(PRE.ultimo)
                               : "Sin internet · aún sin precios";
    return;
  }
  if(!PRE.ultimo){ p.className="pulso"; t.textContent="Sin precios todavía"; return; }
  var min=Math.round((Date.now()-PRE.ultimo)/60000);
  p.className="pulso"+(min>10?" vjo":"");
  t.textContent=(min<1?"Actualizado ahora":"Hace "+min+" min")+(PRE.fuente?" · "+PRE.fuente:"");
}

var relojPrecios=null;
function programarPrecios(){
  clearInterval(relojPrecios);
  if(!BD.ajustes.auto) return;
  var seg=Math.max(20, +BD.ajustes.cada||60);
  relojPrecios=setInterval(function(){
    /* si el canal en vivo está trabajando, no hace falta molestar a nadie más */
    if(PRE.vivo && (Date.now()-VIVO.ultimoMsg)<60000) return;
    traerPrecios(true);
  }, seg*1000);
}

/* =====================================================================
   6 · LAS CIFRAS QUE SE MUEVEN SOLAS
   En vez de repintar la pantalla entera (que haría perder el cursor y
   parpadear todo), se buscan los números marcados y solo se cambian ellos.
   ===================================================================== */
var REF={ pedido:false, ultimo:0 };
function pedirRefresco(){
  if(REF.pedido) return;
  REF.pedido=true;
  var espera=Math.max(0, 280-(Date.now()-REF.ultimo));
  setTimeout(function(){
    REF.pedido=false; REF.ultimo=Date.now();
    try{ refrescarVivos(); }catch(e){}
  }, espera);
}
function ponTexto(el, txt, clase){
  if(!el) return;
  if(el.textContent!==txt){
    el.textContent=txt;
    var s=el.getAttribute("data-s");
    var t=s?TIC[s]:0;
    if(t){
      el.classList.remove("sb","bj");
      void el.offsetWidth;
      el.classList.add("tic", t>0?"sb":"bj");
      setTimeout(function(){ el.classList.remove("sb","bj"); }, 480);
    }
  }
  if(clase!=null){
    var base=el.getAttribute("data-cls")||"";
    var nueva=(base+" "+clase).trim();
    if(el.className!==nueva) el.className=nueva;
  }
}
function refrescarVivos(){
  var S=null, F=null, B=null;
  function spot(){ if(!S) S=carteraSpot(); return S; }
  function fut(){ if(!F) F=carteraFut(BD.fut); return F; }

  document.querySelectorAll("[data-v]").forEach(function(el){
    var v=el.getAttribute("data-v"), s=el.getAttribute("data-s"), id=el.getAttribute("data-f");
    var pr, e, o;
    if(v==="pr"){ ponTexto(el, precio(precioDe(s))); }
    else if(v==="ch"){
      var c=cambioDe(s);
      ponTexto(el, c==null?"—":pct(c,1), cl(c));
    }
    else if(v==="spVal"){ e=estadoDe(s); ponTexto(el, e.valor!=null?usd(e.valor):"—"); }
    else if(v==="spGan"){
      e=estadoDe(s);
      ponTexto(el, e.abierto!=null?((e.abierto>=0?"+":"−")+usd(e.abierto).replace("-","")):"—",
        e.abierto>0?"gpill p":e.abierto<0?"gpill n":"gpill z");
    }
    else if(v==="spGanP"){ e=estadoDe(s); ponTexto(el, pct(e.abiertoPct), "gsub "+cl(e.abiertoPct)); }
    else if(v==="total"){ ponTexto(el, usd(spot().tot.valor)); }
    else if(v==="totGan"){
      var g=spot().tot.abierto;
      ponTexto(el, (g>=0?"+":"−")+usd(g).replace("-",""), g>0?"gpill p":g<0?"gpill n":"gpill z");
    }
    else if(v==="totGanP"){ ponTexto(el, pct(spot().tot.abiertoPct), "gp2 "+cl(spot().tot.abiertoPct)); }
    else if(v==="pieTot"){
      var t=spot().tot.valor + fut().tot.margenAbierto + fut().tot.flotante;
      ponTexto(el, (BD.ops.length||BD.fut.length)?usd(t):"—");
    }
    else if(v==="futPr"){ ponTexto(el, precio(precioDe(s))); }
    else if(v==="futFlot"){
      o=unaFut(id); if(!o) return;
      e=estadoOp(o);
      ponTexto(el, e.flot!=null?((e.flot>=0?"+":"−")+usd(e.flot).replace("-","")):"sin precio",
        e.flot==null?"gpill z":(e.flot>0?"gpill p":e.flot<0?"gpill n":"gpill z"));
    }
    else if(v==="futFlotP"){
      o=unaFut(id); if(!o) return;
      e=estadoOp(o);
      ponTexto(el, e.pctFlot!=null?pct(e.pctFlot,1):"—", "gsub "+cl(e.pctFlot));
    }
    else if(v==="futTot"){
      var T=fut().tot;
      ponTexto(el, (T.flotante>=0?"+":"−")+usd(T.flotante).replace("-",""), cl(T.flotante));
    }
    else if(v==="riel"){
      o=unaFut(id); if(!o) return;
      var x=posicionRiel(estadoOp(o));
      if(x!=null) el.style.left=x.toFixed(1)+"%";
    }
    else if(v==="spark"){ dibujarSpark(el, s); }
    else if(v==="alrFalta"){
      pr=precioDe(s);
      var meta=parseFloat(el.getAttribute("data-p"));
      ponTexto(el, pr!=null?pctS(Math.abs((meta-pr)/pr*100)):"—");
    }
  });
  TIC={};
  try{ pintarPulso(); }catch(e){}
  try{ refrescarGrafica(); }catch(e){}
  try{ vigilarCierres(); }catch(e){}
}
function unaFut(id){
  var l=BD.fut.filter(function(x){ return x.id===id; })[0];
  return l || BD.back.filter(function(x){ return x.id===id; })[0] || null;
}
/* dónde cae el precio de hoy entre el stop y el objetivo, de 0 a 100 */
function posicionRiel(e){
  var a=e.sl, b=e.tp, pr=precioDe(e.f.sym);
  if(pr==null||a==null||b==null||a===b) return null;
  var lo=Math.min(a,b), hi=Math.max(a,b);
  var x=(pr-lo)/(hi-lo)*100;
  if(e.f.lado==="SHORT") x=100-x;
  return Math.max(2,Math.min(98,x));
}
/* =====================================================================
   7 · LA GRÁFICA CON REGLA
   Las velas de la moneda, en vivo, y tres líneas que usted ARRASTRA con
   el dedo o con el ratón: la entrada, el stop loss y el take profit.
   Al mover el stop, de una vez cambia el porcentaje que arriesga, el
   lote y el margen. En Spot muestra además una raya por cada compra.
   Con cada precio nuevo solo se mueve la última vela y la línea HOY:
   no se repinta todo, por eso no se traba.
   ===================================================================== */
var INTERVALOS=[["5m","5 min"],["15m","15 min"],["1h","1 hora"],["4h","4 horas"],["1d","1 día"]];
var VELAS={};
var GRAF=null;

function clave(sym,inter){ return String(sym).toUpperCase()+"|"+inter; }

function traerVelas(sym, inter){
  var k=clave(sym,inter), c=VELAS[k];
  if(c && (Date.now()-c.t)<45000) return Promise.resolve(c.d);
  var url="https://api.binance.com/api/v3/klines?symbol="+parBinance(sym).toUpperCase()+
          "&interval="+inter+"&limit=120";
  return conTiempo(url,9000).then(function(a){
    if(!Array.isArray(a)||!a.length) throw new Error("sin velas");
    var d=a.map(function(x){
      return {t:+x[0], a:parseFloat(x[1]), h:parseFloat(x[2]), b:parseFloat(x[3]), c:parseFloat(x[4])};
    }).filter(function(x){ return !isNaN(x.c); });
    if(!d.length) throw new Error("sin velas");
    VELAS[k]={t:Date.now(), d:d};
    return d;
  }).catch(function(){
    var cg=cgDe(sym);
    if(!cg) return null;
    var dias={"5m":1,"15m":1,"1h":7,"4h":30,"1d":180}[inter]||7;
    return conTiempo("https://api.coingecko.com/api/v3/coins/"+cg+
      "/market_chart?vs_currency=usd&days="+dias,11000).then(function(j){
      var pr=(j&&j.prices)||[];
      if(!pr.length) return null;
      var paso=Math.max(1,Math.floor(pr.length/120));
      var d=[];
      for(var i=0;i<pr.length;i+=paso){
        var p=pr[i][1];
        d.push({t:pr[i][0], a:p, h:p, b:p, c:p, linea:true});
      }
      VELAS[k]={t:Date.now(), d:d};
      return d;
    }).catch(function(){ return null; });
  });
}

/* ---------------------------------------------------------------------
   op = { sym, inter, lado(), valores(), alMover(campo,precio), soloVer,
          marcas: [{p, et}], etiquetas: {entrada:"PROMEDIO"} }
   --------------------------------------------------------------------- */
function montarGrafica(cont, op){
  if(!cont) return;
  var estado={ cont:cont, op:op, inter:op.inter||BD.ajustes.inter||"15m",
               velas:null, min:0, max:1, cargando:false, ultimoPintado:0 };
  GRAF=estado;
  cont.className="graf";
  cont.innerHTML=
    '<div class="gcab">'+
      '<span class="gsym"></span>'+
      '<span class="sp" style="flex:1"></span>'+
      '<span class="envivo" id="gVivo" style="display:none"><i></i>EN VIVO</span>'+
      '<div class="gint">'+INTERVALOS.map(function(x){
        return '<button data-int="'+x[0]+'" class="'+(x[0]===estado.inter?"on":"")+'">'+x[1]+'</button>';
      }).join("")+'</div>'+
    '</div>'+
    '<div class="gzona">'+
      '<svg class="gsvg" viewBox="0 0 1000 300" preserveAspectRatio="none"></svg>'+
      '<div class="gejes"></div>'+
      '<div class="glineas"></div>'+
      '<div class="gcargando">Trayendo la gráfica…</div>'+
    '</div>'+
    '<div class="gpieg"></div>';

  cont.querySelectorAll("[data-int]").forEach(function(b){
    b.onclick=function(){
      estado.inter=b.getAttribute("data-int");
      BD.ajustes.inter=estado.inter; guardar();
      cont.querySelectorAll("[data-int]").forEach(function(x){
        x.className = x.getAttribute("data-int")===estado.inter ? "on" : "";
      });
      cargarVelas();
    };
  });
  function cargarVelas(){
    estado.cargando=true;
    var z=cont.querySelector(".gcargando");
    if(z){ z.style.display=""; z.textContent="Trayendo la gráfica…"; }
    traerVelas(op.sym, estado.inter).then(function(d){
      estado.cargando=false;
      estado.velas=d;
      if(z) z.style.display=d?"none":"";
      if(!d && z) z.textContent="No hay gráfica de "+esc(op.sym)+
        " (sin internet, o esa moneda no la tiene). Puede escribir el stop a mano.";
      dibujar(estado);
    });
  }
  cargarVelas();
  estado.redibujar=function(){ dibujar(estado); };
  return estado;
}

function aY(estado,p){ return (estado.max-p)/(estado.max-estado.min)*100; }
function aP(estado,y){ return estado.max-(y/100)*(estado.max-estado.min); }

/* la escala: sale de las velas; las líneas la estiran solo hasta cierto punto */
function calcularEscala(estado){
  var op=estado.op, v=estado.velas, val=op.valores?op.valores():{};
  var pr=precioDe(op.sym);
  var pv=[];
  if(v) v.forEach(function(x){ pv.push(x.h,x.b); });
  if(pr!=null) pv.push(pr);
  pv=pv.filter(function(x){ return x!=null&&!isNaN(x)&&isFinite(x)&&x>0; });
  if(!pv.length) pv=[val.entrada||1, val.sl||1].filter(function(x){ return x>0; });
  if(!pv.length) pv=[1];
  var vlo=Math.min.apply(null,pv), vhi=Math.max.apply(null,pv);
  if(vhi===vlo){ vhi=vlo*1.01; vlo=vlo*0.99; }
  var span=vhi-vlo;
  var tope=vhi+span*1.5, piso=Math.max(0,vlo-span*1.5);
  var lo=vlo, hi=vhi;
  var quiero=[val.entrada,val.sl,val.tp];
  (op.marcas||[]).forEach(function(m){ quiero.push(m.p); });
  quiero.forEach(function(x){
    if(x==null||isNaN(x)||x<=0) return;
    if(x<lo) lo=Math.max(piso,x);
    if(x>hi) hi=Math.min(tope,x);
  });
  var m=(hi-lo)*0.10;
  estado.min=lo-m; estado.max=hi+m;
}
function fueraDe(estado,x){
  if(x==null||isNaN(x)||x<=0) return 0;
  if(x>estado.max) return 1;
  if(x<estado.min) return -1;
  return 0;
}

function dibujar(estado){
  var cont=estado.cont, op=estado.op;
  if(!cont||!document.body.contains(cont)) return;
  var v=estado.velas, val=op.valores?op.valores():{};
  var pr=precioDe(op.sym);
  calcularEscala(estado);
  estado.ultimoPintado=Date.now();

  /* --- las velas --- */
  var svg=cont.querySelector(".gsvg");
  if(v && v.length){
    var n=v.length, an=1000/n, cuerpo=Math.max(2, an*0.68);
    var s="";
    if(v[0].linea){
      var d="";
      v.forEach(function(x,i){
        d+=(i?"L":"M")+((i+0.5)*an).toFixed(1)+" "+(aY(estado,x.c)*3).toFixed(1);
      });
      s+='<path d="'+d+'" fill="none" stroke="var(--ac)" stroke-width="2" '+
         'vector-effect="non-scaling-stroke"/>';
    } else {
      v.forEach(function(x,i){
        var cx=(i+0.5)*an, sube=x.c>=x.a, ult=(i===n-1);
        var col=sube?"var(--up)":"var(--dn)";
        var y1=aY(estado,x.h)*3, y2=aY(estado,x.b)*3;
        var ya=aY(estado,x.a)*3, yc=aY(estado,x.c)*3;
        var top=Math.min(ya,yc), alto=Math.max(1.5,Math.abs(yc-ya));
        s+='<line'+(ult?' id="vUltM"':'')+' x1="'+cx.toFixed(1)+'" y1="'+y1.toFixed(1)+
           '" x2="'+cx.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="'+col+
           '" stroke-width="1.2" vector-effect="non-scaling-stroke"/>'+
           '<rect'+(ult?' id="vUlt"':'')+' x="'+(cx-cuerpo/2).toFixed(1)+'" y="'+top.toFixed(1)+
           '" width="'+cuerpo.toFixed(1)+'" height="'+alto.toFixed(1)+'" fill="'+col+
           '" shape-rendering="crispEdges"/>';
      });
    }
    svg.innerHTML=s;
  } else svg.innerHTML="";

  /* --- las rayas de precio del fondo --- */
  var ejes=cont.querySelector(".gejes"), he="";
  for(var i=0;i<=4;i++){
    var y=i*25, p=aP(estado,y);
    he+='<div class="gr" style="top:'+y+'%"><span>'+precio(p)+'</span></div>';
  }
  ejes.innerHTML=he;

  /* --- líneas, sombras y marcas --- */
  var L=cont.querySelector(".glineas");
  var lado=op.lado?op.lado():"LONG";
  var ET=Object.assign({entrada:"ENTRADA", sl:"STOP", tp:"OBJETIVO"}, op.etiquetas||{});
  function yClamp(p){ return Math.max(0,Math.min(100, aY(estado,p))); }
  var hl="";
  if(!op.soloVer){
    if(val.entrada>0 && val.sl>0){
      var y1b=yClamp(val.entrada), y2b=yClamp(val.sl);
      hl+='<div class="gsom riesgo" style="top:'+Math.min(y1b,y2b)+'%;height:'+Math.abs(y2b-y1b)+'%"></div>';
    }
    if(val.entrada>0 && val.tp>0){
      var y3=yClamp(val.entrada), y4=yClamp(val.tp);
      hl+='<div class="gsom premio" style="top:'+Math.min(y3,y4)+'%;height:'+Math.abs(y4-y3)+'%"></div>';
    }
  }
  /* una raya por cada compra (Spot) */
  (op.marcas||[]).forEach(function(m){
    if(!(m.p>0)) return;
    var f=fueraDe(estado,m.p);
    var ym=f?(f>0?1:99):aY(estado,m.p);
    hl+='<div class="gcompra" style="top:'+ym.toFixed(2)+'%"><i></i><span>'+
        esc(m.et||"")+(f?(f>0?" ↑":" ↓"):"")+'</span></div>';
  });
  [{k:"entrada",c:"ent",v:val.entrada},{k:"sl",c:"sl",v:val.sl},{k:"tp",c:"tp",v:val.tp}]
  .forEach(function(x){
    if(x.v==null||isNaN(x.v)||x.v<=0) return;
    var f=fueraDe(estado,x.v);
    var y=f?(f>0?0.8:99.2):aY(estado,x.v);
    var dif=(val.entrada>0 && x.k!=="entrada")?(x.v-val.entrada)/val.entrada*100:null;
    hl+='<div class="ln '+x.c+(f?" lejos":"")+(y>84?" abajo":"")+'" data-ln="'+x.k+
        '" style="top:'+y.toFixed(2)+'%">'+
        (op.soloVer?'':'<span class="tir" title="Arrastre para mover">⇕</span>')+
        '<span class="et"><b>'+esc(ET[x.k])+'</b> '+(f?(f>0?"↑ ":"↓ "):"")+precio(x.v)+
        (dif!=null?' <i>'+pct(dif,2)+'</i>':'')+'</span></div>';
  });
  if(pr!=null){
    var yp=aY(estado,pr);
    if(yp>=-5&&yp<=105)
      hl+='<div class="ln ahora'+(yp>84?" abajo":"")+'" style="top:'+yp.toFixed(2)+'%">'+
          '<span class="et"><b>HOY</b> '+precio(pr)+'</span></div>';
  }
  L.innerHTML=hl;

  var vv=cont.querySelector("#gVivo");
  if(vv) vv.style.display = PRE.vivo ? "" : "none";
  var gs=cont.querySelector(".gsym");
  if(gs) gs.innerHTML=icono(op.sym,22)+'<b>'+esc(op.sym)+'</b>'+
    (pr!=null?'<span class="mono" data-v="pr" data-s="'+esc(op.sym)+'">'+precio(pr)+'</span>':'');

  /* --- arrastrar --- */
  if(!op.soloVer) L.querySelectorAll("[data-ln]").forEach(function(el){
    el.onpointerdown=function(ev){
      ev.preventDefault(); ev.stopPropagation();
      var campo=el.getAttribute("data-ln");
      var caja=cont.querySelector(".gzona");
      var r=caja.getBoundingClientRect();
      el.classList.add("agarrada");
      estado.arrastrando=true;
      function mover(e2){
        var y=((e2.clientY-r.top)/r.height)*100;
        y=Math.max(0,Math.min(100,y));
        var p=aP(estado,y);
        if(!(p>0)) return;
        el.style.top=y.toFixed(2)+"%";
        el.classList.toggle("abajo", y>84);
        var et=el.querySelector(".et");
        if(et){
          var v2=op.valores?op.valores():{};
          var dif=(v2.entrada>0&&campo!=="entrada")?(p-v2.entrada)/v2.entrada*100:null;
          et.innerHTML='<b>'+esc(ET[campo])+'</b> '+precio(p)+(dif!=null?' <i>'+pct(dif,2)+'</i>':'');
        }
        if(op.alMover) op.alMover(campo, p);
      }
      function soltar(){
        el.classList.remove("agarrada");
        estado.arrastrando=false;
        window.removeEventListener("pointermove", mover);
        window.removeEventListener("pointerup", soltar);
        window.removeEventListener("pointercancel", soltar);
        dibujar(estado);
      }
      window.addEventListener("pointermove", mover);
      window.addEventListener("pointerup", soltar);
      window.addEventListener("pointercancel", soltar);
    };
  });

  /* --- pie --- */
  var pie=cont.querySelector(".gpieg");
  if(pie){
    if(op.soloVer){
      pie.innerHTML = (op.marcas&&op.marcas.length)
        ? '<span>Cada raya naranja es una <b>compra suya</b> · la verde punteada es su <b>precio promedio</b></span>'
        : '<span class="mut">La línea punteada es su precio promedio.</span>';
    } else if(val.entrada>0 && val.sl>0){
      var dist=Math.abs(val.entrada-val.sl)/val.entrada*100;
      var bien = lado==="SHORT" ? (val.sl>val.entrada) : (val.sl<val.entrada);
      pie.innerHTML='<span>Su stop está a <b class="'+(bien?"":"dn")+'">'+pctS(dist,2)+
        '</b> de la entrada'+(bien?"":" · <b class='dn'>del lado equivocado para un "+
        (lado==="SHORT"?"CORTO":"LARGO")+"</b>")+'</span>'+
        (val.tp>0?'<span>El objetivo está a <b>'+
          pctS(Math.abs(val.tp-val.entrada)/val.entrada*100,2)+'</b></span>':'');
    } else pie.innerHTML='<span class="mut">Arrastre la línea del <b>STOP</b> hasta donde '+
      'quiera ponerlo y el lote se calcula solo.</span>';
  }
}

/* con cada precio nuevo: solo la última vela y la línea HOY. Nada más se toca. */
function refrescarGrafica(){
  if(!GRAF || !GRAF.cont || !document.body.contains(GRAF.cont)){ GRAF=null; return; }
  var E=GRAF, pr=precioDe(E.op.sym);
  if(pr==null || E.arrastrando) return;
  var v=E.velas;
  if(v&&v.length&&!v[0].linea){
    var u=v[v.length-1];
    u.c=pr; if(pr>u.h) u.h=pr; if(pr<u.b) u.b=pr;
    /* si el precio se salió de la escala, toca repintar entero (rara vez) */
    if(pr>E.max||pr<E.min){ dibujar(E); return; }
    var rect=E.cont.querySelector("#vUlt"), mecha=E.cont.querySelector("#vUltM");
    if(rect&&mecha){
      var sube=u.c>=u.a, col=sube?"var(--up)":"var(--dn)";
      var ya=aY(E,u.a)*3, yc=aY(E,u.c)*3;
      rect.setAttribute("y", Math.min(ya,yc).toFixed(1));
      rect.setAttribute("height", Math.max(1.5,Math.abs(yc-ya)).toFixed(1));
      rect.setAttribute("fill", col);
      mecha.setAttribute("y1",(aY(E,u.h)*3).toFixed(1));
      mecha.setAttribute("y2",(aY(E,u.b)*3).toFixed(1));
      mecha.setAttribute("stroke", col);
    }
  }
  var hoyL=E.cont.querySelector(".ln.ahora");
  var yp=aY(E,pr);
  if(hoyL){
    hoyL.style.top=yp.toFixed(2)+"%";
    hoyL.classList.toggle("abajo", yp>84);
    var et=hoyL.querySelector(".et");
    if(et) et.innerHTML='<b>HOY</b> '+precio(pr);
  } else if(yp>=-5&&yp<=105) dibujar(E);
  /* las velas nuevas (cada 15 min) sí se traen enteras, pero sin molestar */
  if(Date.now()-E.ultimoPintado>120000 && !E.cargando){
    E.cargando=true;
    traerVelas(E.op.sym, E.inter).then(function(d){
      E.cargando=false;
      if(d){ E.velas=d; dibujar(E); }
    });
  }
}
/* =====================================================================
   8 · SPOT — cuánto tiene, a qué precio compró, cuánto va ganando
   Cada compra suma monedas y suma costo. Cada venta saca monedas al
   precio PROMEDIO y lo que gane o pierda en esa venta queda registrado.
   ===================================================================== */
function estadoDe(sym){
  var S=String(sym).toUpperCase();
  var ops=BD.ops.filter(function(o){ return String(o.sym).toUpperCase()===S; })
                .sort(function(a,b){
                  var fa=(a.fecha||""), fb=(b.fecha||"");
                  if(fa!==fb) return fa<fb?-1:1;
                  return String(a.id||"")<String(b.id||"")?-1:1;
                });
  var cantidad=0, costo=0, realizado=0, comprado=0, vendido=0, nCompras=0, nVentas=0, com=0;
  var porOp={};
  ops.forEach(function(o){
    var c=+o.cant||0, p=+o.precio||0, k=+o.com||0;
    com+=k;
    if(o.tipo==="venta"){
      var pedida=c;
      if(c>cantidad+1e-12) c=cantidad;
      var prom = cantidad>0 ? costo/cantidad : 0;
      var salida=c*p-k;
      var base=c*prom;
      var g=salida-base;
      porOp[o.id]={tipo:"venta", gan:g, pct: base>0?g/base*100:null, prom:prom, cant:c,
                   recortada: pedida>c+1e-12, sinCosto: !(base>0), entro:salida};
      realizado+=g; costo-=base; cantidad-=c; vendido+=salida; nVentas++;
      if(cantidad<1e-12){ cantidad=0; costo=0; }
    } else {
      var pagado=c*p+k;
      porOp[o.id]={tipo:"compra", pagado:pagado, precio:p, cant:c};
      cantidad+=c; costo+=pagado; comprado+=pagado; nCompras++;
    }
  });
  var pr=precioDe(S);
  if(pr!=null) Object.keys(porOp).forEach(function(k2){
    var x=porOp[k2];
    if(x.tipo!=="compra"||!(x.pagado>0)) return;
    x.valorHoy=x.cant*pr;
    x.gan=x.valorHoy-x.pagado;
    x.pct=x.gan/x.pagado*100;
  });
  var valor = pr!=null ? cantidad*pr : null;
  var abierto = valor!=null ? valor-costo : null;
  return {sym:S, ops:ops, cantidad:cantidad, costo:costo,
    promedio: cantidad>0?costo/cantidad:null, precio:pr, valor:valor, abierto:abierto,
    abiertoPct:(abierto!=null&&costo>0)?abierto/costo*100:null,
    realizado:realizado, comprado:comprado, vendido:vendido, comision:com,
    nCompras:nCompras, nVentas:nVentas, cerrada: cantidad<=0&&ops.length>0, porOp:porOp};
}
function resultadoDeOps(){
  var r={};
  carteraSpot().lista.forEach(function(e){
    Object.keys(e.porOp||{}).forEach(function(k){ r[k]=e.porOp[k]; });
  });
  return r;
}
function carteraSpot(){
  var s={};
  BD.ops.forEach(function(o){ if(o.sym) s[String(o.sym).toUpperCase()]=1; });
  var lista=Object.keys(s).map(estadoDe);
  lista.sort(function(a,b){
    if(a.cerrada!==b.cerrada) return a.cerrada?1:-1;
    return (b.valor||0)-(a.valor||0);
  });
  var t={valor:0,costo:0,abierto:0,realizado:0,sinPrecio:0,costoConPrecio:0,costoSinPrecio:0,
         sinPrecioSyms:[],comprado:0,cerradas:0,realizadoCerradas:0,comision:0};
  lista.forEach(function(e){
    t.comprado+=e.comprado; t.comision+=e.comision;
    if(e.cerrada){ t.cerradas++; t.realizadoCerradas+=e.realizado; }
    if(e.cantidad>0){
      t.costo+=e.costo;
      if(e.valor!=null){ t.valor+=e.valor; t.abierto+=e.abierto; t.costoConPrecio+=e.costo; }
      else { t.sinPrecio++; t.costoSinPrecio+=e.costo; t.sinPrecioSyms.push(e.sym); }
    }
    t.realizado+=e.realizado;
  });
  t.abiertoPct = t.costoConPrecio>0 ? t.abierto/t.costoConPrecio*100 : null;
  return {lista:lista, tot:t};
}
/* USDT disponible: entra lo que depositó y lo que cobró; sale lo que pagó y lo que retiró */
function efectivoDet(){
  var vend=0, comp=0, dep=0, ret=0;
  BD.ops.forEach(function(o){
    var bruto=(+o.cant||0)*(+o.precio||0), k=(+o.com||0);
    if(esEstable(o.sym)){
      if(o.tipo==="venta") ret+=(+o.cant||0)*(+o.precio||1);
      else dep+=(+o.cant||0)*(+o.precio||1);
    } else {
      if(o.tipo==="venta") vend+=bruto-k; else comp+=bruto+k;
    }
  });
  return {vend:vend, comp:comp, dep:dep, ret:ret, total: vend-comp+dep-ret};
}
function efectivo(){ return efectivoDet().total; }
function nVentasSpot(){ return BD.ops.filter(function(o){ return o.tipo==="venta"; }).length; }
function cambio24(S){
  var v=0,d=0;
  S.lista.forEach(function(e){
    var ch=cambioDe(e.sym);
    if(e.cantidad>0&&e.valor!=null&&ch!=null){ v+=e.valor; d+=e.valor*ch/100; }
  });
  var ayer=v-d;
  return v>0 ? {pct: ayer>0?d/ayer*100:null, usd:d} : null;
}
function diasInvertido(){
  var f=BD.ops.filter(function(o){ return o.tipo!=="venta"&&o.fecha; })
              .map(function(o){ return o.fecha; }).sort();
  if(!f.length) return 0;
  return diasDesde(f[0]);
}
function comisionesTotales(){
  var t=BD.ops.reduce(function(a,o){ return a+(+o.com||0); },0);
  t+=BD.fut.reduce(function(a,f){ return a+(+f.com||0); },0);
  return t;
}

/* =====================================================================
   9 · FUTUROS
     margen  = lo que pone de su bolsillo
     posición = margen × apalancamiento
     monedas  = posición ÷ precio de entrada
     % del precio  = cuánto se movió la moneda
     % de ganancia = ese movimiento × apalancamiento, sobre el margen
     ganancia      = margen × % de ganancia − comisión
   ===================================================================== */
function estadoOp(f){
  var margen=+f.monto||0, apal=+f.apal||1, ent=+f.entrada||0;
  var valor=margen*apal;
  var monedas = ent>0 ? valor/ent : 0;
  var signo = f.lado==="SHORT" ? -1 : 1;
  var sal = (f.salida!=null&&f.salida!=="") ? +f.salida : null;

  var pctPrecio=null, pctMargen=null;
  if(sal!=null&&ent>0){
    pctPrecio=signo*(sal-ent)/ent*100;
    pctMargen=pctPrecio*apal;
  } else if(f.pct!=null&&f.pct!==""){
    pctMargen=(+f.pct)*100;
    pctPrecio= apal>0 ? pctMargen/apal : null;
  }
  var com=+f.com||0;
  var gan = pctMargen!=null ? margen*pctMargen/100-com : null;

  var liq = (ent>0&&apal>1)
    ? (f.lado==="SHORT" ? ent*(1+1/apal) : ent*(1-1/apal)) : null;
  var liquidado=false;
  if(liq!=null&&sal!=null) liquidado = (f.lado==="SHORT") ? (sal>=liq) : (sal<=liq);
  var topado=false;
  if(gan!=null&&margen>0&&gan<-margen){ gan=-margen; pctMargen=-100; topado=true; }

  var tp=(f.tp!=null&&f.tp!=="")?+f.tp:null;
  var sl=(f.sl!=null&&f.sl!=="")?+f.sl:null;
  var ganTp=(tp!=null&&ent>0)?margen*(signo*(tp-ent)/ent*100*apal)/100:null;
  var perSl=(sl!=null&&ent>0)?margen*(signo*(sl-ent)/ent*100*apal)/100:null;
  var rr=(ganTp!=null&&perSl!=null&&perSl<0)?Math.abs(ganTp/perSl):null;

  var flot=null, pctFlot=null, enPeligro=null;
  if(sal==null && f.estado==="abierta" && ent>0 && f.sym){
    var pr=precioDe(f.sym);
    if(pr!=null){
      pctFlot=signo*(pr-ent)/ent*100*apal;
      flot=margen*pctFlot/100-com;
      if(liq!=null){
        enPeligro=signo*(pr-liq)/liq*100;
        if((f.lado==="SHORT")?(pr>=liq):(pr<=liq)) liquidado=true;
      }
      if(margen>0&&flot<-margen){ flot=-margen; pctFlot=-100; topado=true; }
    }
  }
  return {f:f, margen:margen, apal:apal, entrada:ent, valor:valor, monedas:monedas,
    salida:sal, pctPrecio:pctPrecio, pct: pctMargen!=null?pctMargen/100:null,
    pctMargen:pctMargen, gan:gan, com:com, liq:liq, liquidado:liquidado, topado:topado,
    enPeligro:enPeligro, tp:tp, sl:sl, ganTp:ganTp, perSl:perSl, rr:rr,
    flot:flot, pctFlot:pctFlot, abierta: f.estado==="abierta"};
}

function carteraFut(fuente){
  var lista=(fuente||[]).map(estadoOp);
  var cerradas=lista.filter(function(e){ return !e.abierta&&e.pct!=null; });
  var abiertas=lista.filter(function(e){ return e.abierta; });
  var t={n:cerradas.length, gan:0, pctAcum:0, ganadas:0, perdidas:0, neutras:0, nLiq:0,
         margenAbierto:0, nAb:abiertas.length, flotante:0, comision:0, enRiesgo:0,
         sinPrecioAb:0, bruto:0};
  var sg=0,ng=0,sp=0,np=0;
  cerradas.forEach(function(e){
    if(e.liquidado) t.nLiq++;
    t.gan+=e.gan; t.bruto+=e.gan+e.com; t.pctAcum+=e.pct; t.comision+=e.com;
    if(e.pct>0){ t.ganadas++; sg+=e.pct; ng++; }
    else if(e.pct<0){ t.perdidas++; sp+=e.pct; np++; }
    else t.neutras++;
  });
  abiertas.forEach(function(e){
    t.margenAbierto+=e.margen;
    t.flotante+=(e.flot||0);
    t.comision+=e.com;
    if(e.liquidado) t.enRiesgo++;
    if(e.flot==null) t.sinPrecioAb++;
  });
  var decididas=t.ganadas+t.perdidas;
  t.decididas=decididas;
  t.aciertos = decididas ? t.ganadas/decididas*100 : null;
  t.mediaGana = ng ? sg/ng*100 : null;
  t.mediaPierde = np ? sp/np*100 : null;
  t.esperanza = t.n ? t.pctAcum/t.n*100 : null;
  /* factor de ganancia: lo que ganó dividido por lo que perdió */
  var gp=0, pp=0;
  cerradas.forEach(function(e){ if(e.gan>0) gp+=e.gan; else pp+=Math.abs(e.gan); });
  t.factor = pp>0 ? gp/pp : (gp>0?Infinity:null);
  t.ganado=gp; t.perdido=pp;
  /* lo mismo pero EN DÓLARES, que es como se entiende de verdad */
  t.porOperacion = t.n ? t.gan/t.n : null;        /* le deja esto por operación */
  t.ganaUsd  = t.ganadas  ? gp/t.ganadas  : null; /* cuánto gana cuando acierta */
  t.pierdeUsd= t.perdidas ? pp/t.perdidas : null; /* cuánto pierde cuando falla */
  t.lados={};
  ["LONG","SHORT"].forEach(function(l){
    var L=cerradas.filter(function(e){ return e.f.lado===l; });
    var g=L.filter(function(e){ return e.pct>0; });
    t.lados[l]={n:L.length, ganadas:g.length,
      aciertos: L.length?g.length/L.length*100:null,
      gan: L.reduce(function(a,e){ return a+e.gan; },0),
      pct: L.reduce(function(a,e){ return a+e.pct; },0)*100};
  });
  /* racha y peor caída */
  var racha=0, signo=null;
  for(var i=cerradas.length-1;i>=0;i--){
    if(cerradas[i].pct===0) continue;
    var s2=cerradas[i].pct>0;
    if(signo===null){ signo=s2; racha=1; }
    else if(s2===signo) racha++;
    else break;
  }
  t.racha=racha; t.rachaGana=signo;
  var acum=0, pico=0, caida=0;
  cerradas.forEach(function(e){
    acum+=e.gan;
    if(acum>pico) pico=acum;
    if(pico-acum>caida) caida=pico-acum;
  });
  t.caida=caida;
  /* disciplina: cómo le va cuando respeta el plan */
  var conPlan=cerradas.filter(function(e){ return planCompleto(e.f); });
  var sinPlan=cerradas.filter(function(e){ return !planCompleto(e.f); });
  function res(L){
    if(!L.length) return null;
    var g=L.filter(function(e){ return e.pct>0; }).length;
    return {n:L.length, ganadas:g, aciertos:g/L.length*100,
            gan:L.reduce(function(a,e){ return a+e.gan; },0)};
  }
  t.conPlan=res(conPlan); t.sinPlan=res(sinPlan);
  return {lista:lista, cerradas:cerradas, abiertas:abiertas, tot:t};
}

/* =====================================================================
   10 · LA CALCULADORA DE LOTE
   Usted dice cuánto es su cartera y qué porcentaje arriesga. La distancia
   hasta el stop loss manda el tamaño de la posición. El apalancamiento
   NO cambia lo que arriesga: solo cambia cuánta plata deja amarrada.
   ===================================================================== */
var PLAN=[
  ["ten","Tendencia principal identificada"],
  ["zon","Zona de entrada confirmada"],
  ["adx","ADX a favor"],
  ["kon","Konkorde a favor"],
  ["sl", "Stop loss puesto en el gráfico"],
  ["not","Sin noticias importantes a la vista"],
  ["cab","Entro con la cabeza fría, no por apuro"]
];
var ANIMOS=["Tranquilo","Confiado","Con apuro","Con miedo","Con rabia","Aburrido"];
function planCompleto(f){
  var p=f&&f.plan;
  if(!p||typeof p!=="object") return false;
  return PLAN.every(function(x){ return !!p[x[0]]; });
}
function planCuantos(f){
  var p=(f&&f.plan)||{};
  return PLAN.filter(function(x){ return !!p[x[0]]; }).length;
}

function calcLote(cfg, entrada, sl, lado, tp){
  var r={ok:false};
  var cartera=+cfg.cartera||0, riesgoPct=+cfg.riesgo||0, apal=Math.max(1,+cfg.apal||1);
  var comPct=+cfg.com||0;
  r.cartera=cartera; r.riesgoPct=riesgoPct; r.apal=apal;
  r.riesgo = cartera*riesgoPct/100;
  if(!(entrada>0)||!(sl>0)||!(r.riesgo>0)) return r;
  r.dist=Math.abs(entrada-sl)/entrada;
  if(!(r.dist>0)) return r;
  r.distPct=r.dist*100;
  r.ladoBien = lado==="SHORT" ? (sl>entrada) : (sl<entrada);
  r.posicion = r.riesgo/r.dist;
  r.margen = r.posicion/apal;
  r.monedas = r.posicion/entrada;
  r.com = r.posicion*comPct/100*2;              /* entrar y salir */
  r.perdidaSL = r.riesgo + r.com;
  r.perdidaPctMargen = r.margen>0 ? r.perdidaSL/r.margen*100 : null;
  r.liq = lado==="SHORT" ? entrada*(1+1/apal) : entrada*(1-1/apal);
  r.liqAntes = r.dist >= (1/apal);              /* lo liquidan antes del stop */
  r.apalMax = Math.floor(1/r.dist);             /* el más alto que aguanta ese stop */
  if(tp>0){
    r.distTp=Math.abs(tp-entrada)/entrada;
    r.tpBien = lado==="SHORT" ? (tp<entrada) : (tp>entrada);
    r.ganTp = r.posicion*r.distTp - r.com;
    r.rr = r.perdidaSL>0 ? r.ganTp/r.perdidaSL : null;
    r.ganTpPctMargen = r.margen>0 ? r.ganTp/r.margen*100 : null;
  }
  /* si el margen no le alcanza para su cartera, se avisa */
  r.pasaCartera = r.margen > cartera;
  r.ok=true;
  return r;
}
/* al revés: usted escribe el margen y se calcula qué porcentaje está arriesgando */
function riesgoDeMargen(cfg, entrada, sl, margen){
  var apal=Math.max(1,+cfg.apal||1), comPct=+cfg.com||0, cartera=+cfg.cartera||0;
  if(!(entrada>0)||!(sl>0)||!(margen>0)||!(cartera>0)) return null;
  var dist=Math.abs(entrada-sl)/entrada;
  var posicion=margen*apal;
  var perdida=posicion*dist + posicion*comPct/100*2;
  return {perdida:perdida, pct: perdida/cartera*100, posicion:posicion};
}

    'textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'))
    .filter(function(x){ return x.offsetParent!==null||x===document.activeElement; });

function abrir(html, listo, alCerrar){
  var v=document.getElementById("velo"), c=document.getElementById("veloIn");
  if(!CERRAR_CB) FOCO_PREVIO=document.activeElement;
  CERRAR_CB=alCerrar||null;
  c.innerHTML=html; v.className="on";
  var h=c.querySelector(".hoja");

  c.querySelectorAll("[data-cerrar]").forEach(function(b){ b.onclick=cerrar; });
  v.onclick=function(e){ if(e.target===v) cerrar(); };
  document.onkeydown=function(e){
    if(e.key==="Escape"){ cerrar(); return; }
    if(e.key==="Tab"){
      var l=enfocables(c); if(!l.length) return;
      var pri=l[0], ult=l[l.length-1];
      if(e.shiftKey&&document.activeElement===pri){ e.preventDefault(); ult.focus(); }
      else if(!e.shiftKey&&document.activeElement===ult){ e.preventDefault(); pri.focus(); }
      else if(l.indexOf(document.activeElement)<0){ e.preventDefault(); pri.focus(); }
      return;
    }
    if(e.key==="Enter"){
      var a=document.activeElement;
      if(!a||!c.contains(a)) return;
      if(a.tagName==="TEXTAREA"||a.tagName==="BUTTON") return;
      if(a.getAttribute&&a.getAttribute("data-sinenter")!=null) return;
      var pie=c.querySelector(".hf"); if(!pie) return;

      });
      var ok=bs[bs.length-1];
      if(ok){ e.preventDefault(); ok.click(); }
    }
  };
  if(listo) listo(c);
  var p=c.querySelector("input:not([type=hidden]):not([type=range]),select");
  if(p&&p.focus&&window.innerWidth>900) p.focus();
}

function sparkSvg(h, color){
  if(!h||h.length<3) return "";
  var lo=Math.min.apply(null,h), hi=Math.max.apply(null,h);
  if(hi===lo){ hi=lo*1.0001||1; }
  var W=72,H=26;
  var d=h.map(function(p,i){
    return (i?"L":"M")+(i/(h.length-1)*W).toFixed(1)+" "+(H-((p-lo)/(hi-lo))*(H-4)-2).toFixed(1);
  }).join(" ");
  var area=d+" L"+W+" "+H+" L0 "+H+" Z";
  var id="sg"+Math.random().toString(36).slice(2,7);
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
    '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="'+color+'" stop-opacity=".45"/>'+
    '<stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#'+id+')"/>'+
    '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linejoin="round" '+
    'vector-effect="non-scaling-stroke"/></svg>';
}

/* =====================================================================
   14 · ORDENAR Y BUSCAR EN LAS TABLAS
   ===================================================================== */
var ORD={col:"valor", desc:true}, BUSCA="";
function ordenarLista(lista){
  var L=lista.slice(), c=ORD.col;
  L.sort(function(a,b){
    var x,y;
    if(c==="sym"){ x=a.sym; y=b.sym; return (x<y?-1:x>y?1:0)*(ORD.desc?-1:1); }
    if(c==="precio"){ x=precioDe(a.sym)||0; y=precioDe(b.sym)||0; }
    else if(c==="cant"){ x=a.cantidad; y=b.cantidad; }
    else if(c==="prom"){ x=a.promedio||0; y=b.promedio||0; }
    else if(c==="inv"){ x=a.costo||0; y=b.costo||0; }
    else if(c==="gan"){ x=a.abierto||0; y=b.abierto||0; }
    else if(c==="pct"){ x=a.abiertoPct||0; y=b.abiertoPct||0; }
    else { x=a.valor||0; y=b.valor||0; }
    return (x-y)*(ORD.desc?-1:1);
  });
  return L;
}
function filtrarLista(lista){
  if(!BUSCA) return lista;
  var q=BUSCA.toLowerCase();
  return lista.filter(function(e){
    return e.sym.toLowerCase().indexOf(q)>=0 ||
           String(nombreDe(e.sym)).toLowerCase().indexOf(q)>=0;
  });
}
function thOrd(t,col,opt){
  var act=ORD.col===col;
  return '<th data-orden="'+col+'" class="ord'+(act?" act":"")+(opt?" opt":"")+'">'+
    '<span class="cap">'+esc(t)+' '+(act?(ORD.desc?"▼":"▲"):"⇅")+'</span></th>';
}
function thOrdGan(){
  var eD=ORD.col==="gan", eP=ORD.col==="pct";
  return '<th class="ord'+((eD||eP)?" act":"")+'">'+
    '<span class="cap" data-orden="gan">Ganancia '+(eD?(ORD.desc?"▼":"▲"):"⇅")+'</span> '+
    '<span class="cap" data-orden="pct" style="padding:5px 8px">% '+
    (eP?(ORD.desc?"▼":"▲"):"")+'</span></th>';
}
function engancharOrden(box, repintar2){
  box.querySelectorAll("[data-orden]").forEach(function(th){
    th.onclick=function(ev){
      ev.stopPropagation();
      var c=th.getAttribute("data-orden");
      if(ORD.col===c) ORD.desc=!ORD.desc; else { ORD.col=c; ORD.desc = c!=="sym"; }
      repintar2();
    };
  });
  var b=box.querySelector("#buscarM");
  if(b) b.oninput=function(){
    BUSCA=b.value.trim();

  };

/* =====================================================================
   15 · DIBUJITOS: rosca, línea pequeña, curva de ganancia
   ===================================================================== */
function rosca(partes, centro, pie){
  /* partes: [{v, color, et}] */
  var suma=partes.reduce(function(a,x){ return a+x.v; },0);
  if(!(suma>0)) return "";
  var R=64, C=2*Math.PI*R, acum=0;
  var s='<svg viewBox="0 0 150 150"><g transform="translate(75,75) rotate(-90)">';
  partes.forEach(function(x){
    var largo=C*(x.v/suma);
    s+='<circle r="'+R+'" fill="none" stroke="'+x.color+'" stroke-width="20" '+
       'stroke-dasharray="'+largo.toFixed(2)+' '+(C-largo).toFixed(2)+'" '+
       'stroke-dashoffset="'+(-acum).toFixed(2)+'"/>';
    acum+=largo;
  });
  s+='</g><text x="75" y="72" text-anchor="middle" font-family="inherit" '+
     'font-size="15" font-weight="700" fill="var(--tx)">'+esc(centro||"")+'</text>'+
     '<text x="75" y="88" text-anchor="middle" font-size="9.5" fill="var(--t3)">'+
     esc(pie||"")+'</text></svg>';
  return '<div class="rosca">'+s+'<div class="ley">'+
    partes.slice(0,7).map(function(x){
      return '<span><i style="background:'+x.color+'"></i>'+esc(x.et)+
        '<b>'+pctS(x.v/suma*100)+'</b></span>';
    }).join("")+'</div></div>';
}
/* línea pequeña del precio, con lo que el canal en vivo va dejando */
var HIST={};
function anotarHist(sym,p){
  if(p==null) return;
  var h=HIST[sym]=HIST[sym]||[];
  if(h.length && Math.abs(h[h.length-1]-p)<1e-12) return;
  h.push(p);
  if(h.length>40) h.shift();
}
function dibujarSpark(el, sym){
  var h=HIST[sym]||[];
  if(h.length<3){ el.innerHTML=""; return; }
  var lo=Math.min.apply(null,h), hi=Math.max.apply(null,h);
  if(hi===lo){ hi=lo*1.0001||1; }
  var W=62,H=22;
  var d=h.map(function(p,i){
    return (i?"L":"M")+(i/(h.length-1)*W).toFixed(1)+" "+
           (H-((p-lo)/(hi-lo))*(H-3)-1.5).toFixed(1);
  }).join(" ");
  var sube=h[h.length-1]>=h[0];
  el.innerHTML='<svg class="spark" viewBox="0 0 '+W+' '+H+'"><path d="'+d+'" fill="none" '+
    'stroke="'+(sube?"var(--up)":"var(--dn)")+'" stroke-width="1.6" stroke-linejoin="round" '+
    'vector-effect="non-scaling-stroke"/></svg>';
}
/* curva de cómo creció (o se encogió) el dinero, operación a operación */
function curvaGanancia(puntos, titulo){
  if(puntos.length<2) return "";
  var W=760,H=190,mL=6,mR=6,mT=14,mB=18;
  var vals=puntos.map(function(p){ return p.v; });
  var lo=Math.min.apply(null,vals.concat([0])), hi=Math.max.apply(null,vals.concat([0]));
  if(hi===lo){ hi=lo+1; }
  var m=(hi-lo)*0.12;
  lo-=m; hi+=m;
  function X(i){ return mL+(i/(puntos.length-1))*(W-mL-mR); }
  function Y(v){ return H-mB-((v-lo)/(hi-lo))*(H-mT-mB); }
  var fin=vals[vals.length-1], sube=fin>=0;
  var d=puntos.map(function(p,i){ return (i?"L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1); }).join(" ");
  var area="M"+X(0).toFixed(1)+" "+Y(0).toFixed(1)+" "+
    puntos.map(function(p,i){ return "L"+X(i).toFixed(1)+" "+Y(p.v).toFixed(1); }).join(" ")+
    " L"+X(puntos.length-1).toFixed(1)+" "+Y(0).toFixed(1)+" Z";
  var col=sube?"var(--up)":"var(--dn)";
  var s='<svg viewBox="0 0 '+W+' '+H+'" class="gcre" preserveAspectRatio="none">'+
    '<defs><linearGradient id="gq" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="'+col+'" stop-opacity=".40"/>'+
    '<stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'+
    '<line x1="'+mL+'" y1="'+Y(0).toFixed(1)+'" x2="'+(W-mR)+'" y2="'+Y(0).toFixed(1)+
    '" stroke="var(--t3)" stroke-width="1" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>'+
    '<path d="'+area+'" fill="url(#gq)"/>'+
    '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2.4" '+
    'vector-effect="non-scaling-stroke" stroke-linejoin="round"/>';
  puntos.forEach(function(p,i){
    if(puntos.length<=40 || i===puntos.length-1)
      s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="2.8" fill="var(--b1)" '+
         'stroke="'+col+'" stroke-width="2"/>';
  });
  s+='</svg>';
  return '<div class="caja"><h2><span class="ic">'+IC.sube+'</span>'+esc(titulo)+
    '<span class="sp"></span><span class="mono '+cl(fin)+'" style="font-size:16px;font-weight:700">'+
    (fin>=0?"+":"−")+usd(fin).replace("-","")+'</span></h2>'+
    '<div class="cp" style="padding-bottom:10px">'+s+
    '<div class="gpie"><span>operación 1</span>'+
    '<span>'+puntos.length+' operaciones</span>'+
    '<span>hoy</span></div></div></div>';
}

function historialSpot(){

    if(fa!==fb) return fa<fb?1:-1;
    return (+b.mod||0)-(+a.mod||0);
  });
  if(!todo.length) return "";
  var RES=resultadoDeOps();
  var ver=todo.slice(0, SPOT_cuantos);
  return '<div class="caja"><h2><span class="ic">'+IC.mov+'</span>Historial de movimientos'+
    '<span class="chip g">'+todo.length+'</span><span class="sp"></span>'+
    '<button class="b sm" id="spCsv">Exportar</button></h2><div class="cp">'+
    ver.map(function(o){
      var v=o.tipo==="venta";
      var bruto=(+o.cant||0)*(+o.precio||0), k=(+o.com||0);
      var tot = v ? bruto-k : bruto+k;

          (R.pct!=null?" "+pct(R.pct,1):"")+(R.recortada?" · vendió de más":"")+'</span></div>'
        : '<div class="r"><b>—</b><span>sin compra previa</span></div>';
      else col = R.pct!=null
        ? '<div class="r"><b class="'+cl(R.pct)+'">'+pct(R.pct,1)+'</b>'+
          '<span>hoy vale '+usd(R.valorHoy)+'</span></div>'
        : '<div class="r"><b>—</b><span>sin precio hoy</span></div>';
      return '<div class="mv '+(v?"venta":"compra")+'" style="--fc:'+colDe(o.sym)+'">'+
        '<div class="fh"><b>'+(p[2]||"--")+'</b><span>'+(MESES[(+p[1])-1]||"")+" "+
        (p[0]||"").slice(2)+'</span></div>'+
        '<div style="flex:none">'+icono(o.sym,26)+'</div>'+
        '<div class="q"><div class="l1">'+(v?"Vendió":"Compró")+' <em>'+cant(o.cant)+'</em> '+
        esc(o.sym)+' a <em>'+precio(o.precio)+'</em>'+
        (v&&R.prom?' <span class="mut">· le costaba '+precio(R.prom)+'</span>':'')+'</div>'+
        '<div class="l2">'+(o.casa?logoCasa(o.casa,14):"")+esc(nombreCasa(o.casa||"OTRA"))+
        (k?" · comisión "+usd(k):"")+(dd!=null?" · hace "+dd+" días":"")+
        (o.nota?" · "+esc(o.nota):"")+'</div></div>'+
        col+
        '<div class="p"><b class="'+(v?"up":"dn")+'">'+(v?"+":"−")+usd(tot).replace("-","")+'</b>'+
        '<span>'+(v?"recibió":"pagó")+'</span></div>'+
        '<button class="b sm" data-ed="'+esc(o.id)+'">Editar</button></div>';
    }).join("")+
    (todo.length>ver.length
      ? '<div style="text-align:center;margin-top:8px"><button class="b" id="spMas">'+
        'Ver '+Math.min(50,todo.length-ver.length)+' más ('+(todo.length-ver.length)+
        ' sin mostrar)</button></div>'
      : '')+
    '</div></div>';
}

  var sub = partes.length ? partes.join(" · ") : "todavía no ha registrado nada";

function tarjetaCasas(){
  var por={};
  BD.ops.forEach(function(o){
    if(o.tipo==="venta"||esEstable(o.sym)) return;
    var k=o.casa||"OTRA";
    por[k]=(por[k]||0)+(+o.cant||0)*(+o.precio||0)+(+o.com||0);
  });
  var ks=Object.keys(por).sort(function(a,b){ return por[b]-por[a]; });
  if(!ks.length) return "";
  var tot=ks.reduce(function(a,k){ return a+por[k]; },0);
  return '<div class="caja"><h2><span class="ic">'+IC.banco+'</span>Dónde compró</h2><div class="cp">'+
    ks.map(function(k){
      return '<div class="rank" style="margin-bottom:8px">'+logoCasa(k,30)+
        '<div><b>'+esc(nombreCasa(k))+'</b><div class="mut" style="font-size:11px">'+
        (por[k]/tot*100).toFixed(0)+'% de lo invertido</div></div>'+
        '<div class="pc"><b>'+usd(por[k])+'</b></div></div>';
    }).join("")+'</div></div>';
}
function alertaPrecios(){
  var vivas={};
  carteraSpot().lista.forEach(function(e){ if(e.cantidad>0) vivas[e.sym]=1; });
  BD.fut.forEach(function(f){ if(f.sym&&f.estado==="abierta") vivas[String(f.sym).toUpperCase()]=1; });
  var syms=Object.keys(vivas).filter(function(s){ return !esEstable(s); });
  var sin=syms.filter(function(s){ return precioDe(s)==null; });

  return '<div class="alerta"><div class="t"><b>'+
    (todos?"No se pudieron traer los precios":"Sin precio: "+sin.join(", "))+'</b><span>'+
    (todos?"Sin precios no se puede calcular la ganancia. Pulse Actualizar, o escríbalos a mano una vez."

}

function engancharPanel(c){
  var q=function(id){ return c.querySelector(id)||document.getElementById(id.slice(1)); };
  var S=q("#spS"), E=q("#spE");
  function pinta(){
    if(S) S.innerHTML = SP.sym
      ? icono(SP.sym,28)+'<span><b>'+esc(SP.sym)+'</b><i>'+esc(nombreDe(SP.sym))+
        (precioDe(SP.sym)!=null?' · ahora '+precio(precioDe(SP.sym)):'')+'</i></span><em>cambiar</em>'
      : '<span><b>Elegir moneda…</b><i>toque para buscar entre todas</i></span><em>elegir</em>';
    if(E) E.innerHTML = logoCasa(SP.casa,26)+'<span><b>'+esc(nombreCasa(SP.casa))+
      '</b><i>casa de cambio</i></span><em>cambiar</em>';
  }
  pinta();
  if(S) S.onclick=function(){
    elegirMoneda(SP.sym, function(s){
      SP.sym=s; MIRANDO=s;
      repintarPanelSpot();
      traerPrecios(true); conectarVivo();
      var pp=document.getElementById("spP");
      if(pp && !pp.value && precioDe(s)!=null) pp.value=String(precioDe(s)).replace(".",",");
      recPanel();
    });
  };
  if(E) E.onclick=function(){
    elegirCasa(SP.casa, function(k){ SP.casa=k; BD.ajustes.casa=k; guardar(); pinta(); });
  };
  c.querySelectorAll("#spT button").forEach(function(b){
    b.onclick=function(){ SP.tipo=b.getAttribute("data-t"); repintarPanelSpot(); };
  });
  var M=q("#spM"), Pq=q("#spP"), C=q("#spC"), K=q("#spK");
  var editando=null;
  function desdeMonto(){
    if(!M){ recPanel(); return; }
    var m=num(M.value), p=num(Pq.value), k=num(K.value)||0;
    if(m!=null&&p!=null&&p>0){
      var c2 = SP.tipo==="venta" ? (m+k)/p : (m-k)/p;
      C.value = c2>0 ? String(+c2.toFixed(10)).replace(".",",") : "";
    }
    recPanel();
  }
  function desdeCantidad(){
    var c2=num(C.value), p=num(Pq.value), k=num(K.value)||0;
    if(M && c2!=null&&p!=null&&p>0){
      var m = SP.tipo==="venta" ? c2*p-k : c2*p+k;
      M.value=String(+m.toFixed(2)).replace(".",",");
    }
    recPanel();
  }
  if(M) M.addEventListener("input", function(){ editando="m"; desdeMonto(); });
  if(C) C.addEventListener("input", function(){ editando="c"; desdeCantidad(); });
  if(Pq) Pq.addEventListener("input", function(){
    SP.modo="mano";
    if(editando==="c") desdeCantidad(); else desdeMonto();
  });
  if(K) K.addEventListener("input", function(){
    if(editando==="c") desdeCantidad(); else desdeMonto();
  });
  var F=q("#spF"); if(F) F.addEventListener("change", recPanel);
  var hy=q("#spHoy");
  if(hy) hy.onclick=function(){
    if(!SP.sym){ aviso("Primero elija la moneda.",true); return; }
    var p=precioDe(SP.sym);
    if(p==null){ aviso("Todavía no hay precio de "+SP.sym+".",true); return; }
    Pq.value=String(p).replace(".",",");
    SP.modo="hoy";
    if(editando==="c") desdeCantidad(); else desdeMonto();
  };
  c.querySelectorAll("#spPanel [data-rp]").forEach(function(b){
    b.onclick=function(){
      if(!SP.sym){ aviso("Primero elija la moneda.",true); return; }
      var e=estadoDe(SP.sym), p=+b.getAttribute("data-rp");
      if(!(e.cantidad>0)){ aviso("No tiene "+SP.sym+" para vender.",true); return; }
      var cc = p===100 ? e.cantidad : e.cantidad*p/100;
      C.value=paraCasilla(cc);
      if(!Pq.value && precioDe(SP.sym)!=null) Pq.value=paraCasilla(precioDe(SP.sym));
      editando="c"; desdeCantidad();
      c.querySelectorAll("#spPanel [data-rp]").forEach(function(x){
        x.className = x===b ? "on" : "";
      });
    };
  });
  var lp=q("#spLimpia");
  if(lp) lp.onclick=function(){
    ["spM","spP","spC","spK","spN"].forEach(function(id){
      var el=document.getElementById(id); if(el) el.value="";
    });
    recPanel();
  };
  var ok=q("#spOk");
  if(ok) ok.onclick=guardarMovimiento;
  recPanel();
}
function recPanel(){
  var r=document.getElementById("spR");
  if(!r) return;
  function g(id){ var e=document.getElementById(id); return e?num(e.value):null; }
  var c=g("spC"), p=g("spP"), k=g("spK")||0, m=g("spM");
  var esV0=SP.tipo==="venta";
  function cajitas(rec,g,q){
    var a=document.getElementById("spRecibe"), b=document.getElementById("spGana"), d=document.getElementById("spQueda");
    if(a) a.textContent = rec!=null?usd(rec):"—";
    if(b){ b.textContent = g!=null?((g>=0?"+":"−")+usd(g).replace("-","")):"—"; b.className="v "+cl(g); }
    if(d) d.textContent = q!=null?cant(q):"—";
  }
  if(!SP.sym){
    r.className="nota"; cajitas(null,null,null);
    r.innerHTML = esV0 ? "Elija la moneda que va a vender." : "Elija la moneda y escriba cuántos dólares.";
    return;
  }
  if(esV0){
    var ev=estadoDe(SP.sym);
    if(!(ev.cantidad>0)){
      r.className="nota mal"; cajitas(null,null,null);
      r.innerHTML="<b>No tiene "+esc(SP.sym)+" para vender.</b> Solo se puede vender lo que ha registrado como comprado.";
      return;
    }
  }
  if(c==null||p==null){
    r.className="nota"; cajitas(null,null,null);
    r.innerHTML = esV0
      ? "Escriba <b>cuántas monedas</b> vende (o toque 25%, 50%, 75%, TODO) y el <b>precio</b>."
      : "Escriba el <b>monto en dólares</b> y el <b>precio</b>: la cantidad sale sola.";
    return;
  }
  var avisos=[], esV=SP.tipo==="venta";
  if(p<=0) avisos.push("El precio tiene que ser mayor que cero");
  if(c<=0) avisos.push("La cantidad tiene que ser mayor que cero");
  var fSel=(document.getElementById("spF")||{}).value;
  if(fSel&&fSel>hoy()) avisos.push("Esa fecha todavía no llega");
  var tot = esV ? c*p-k : c*p+k;
  var txt=(esV?"Recibe <b>":"Paga <b>")+usd(tot)+"</b> por <b>"+cant(c)+" "+esc(SP.sym)+
          "</b> en "+esc(nombreCasa(SP.casa));
  var pr=precioDe(SP.sym);
  if(!esV&&pr!=null&&p>0){
    var d=(pr-p)/p*100;
    txt+=" · ahora "+esc(SP.sym)+" está en "+precio(pr)+" (<b class='"+cl(d)+"'>"+pct(d,1)+"</b>)";
  }
  if(!esV&&esEstable(SP.sym))
    avisos.push("El USDT que registre aquí cuenta como dinero que METIÓ desde fuera. "+
      "Si es el USDT que le quedó de una venta, no hace falta: ya está contado");
  if(esV){
    var e=estadoDe(SP.sym);
    if(c>e.cantidad+1e-9){ avisos.push("Solo tiene "+cant(e.cantidad)+" "+SP.sym); cajitas(tot,null,null); }
    else if(e.promedio!=null){
      var gg=(p-e.promedio)*c-k;
      var queda=e.cantidad-c;
      cajitas(tot, gg, queda>1e-12?queda:0);
      txt+=" · "+(gg>=0?"gana <b class='up'>":"pierde <b class='dn'>")+usd(Math.abs(gg))+
           "</b> contra su promedio de "+precio(e.promedio)+
           (queda>1e-12 ? " · le quedan <b>"+cant(queda)+" "+esc(SP.sym)+"</b>"
                        : " · <b>vende toda su posición</b>");
    }
  } else {
    var D=efectivoDet();
    if(tot>D.total+1e-9 && D.total>0)
      avisos.push("Le quedan "+usd(D.total)+" de USDT: va a quedar en negativo");
    var ee=estadoDe(SP.sym);
    if(ee.cantidad>0&&ee.promedio!=null){
      var nuevo=(ee.costo+tot)/(ee.cantidad+c);
      txt+=" · su promedio pasa de <b>"+precio(ee.promedio)+"</b> a <b>"+precio(nuevo)+"</b>";
    }
  }
  r.className = avisos.length ? "nota ojo" : "nota";
  r.innerHTML = avisos.length ? ("<b>OJO:</b> "+avisos.join(" · ")+"<br>"+txt) : txt;
}
function guardarMovimiento(){
  function g(id){ var e=document.getElementById(id); return e?num(e.value):null; }
  function t(id){ var e=document.getElementById(id); return e?e.value:""; }
  var c=g("spC"), p=g("spP"), k=g("spK")||0, f=t("spF")||hoy(), n=(t("spN")||"").trim();
  if(!SP.sym){ aviso("Elija la criptomoneda.",true); return; }
  if(c==null||c<=0){ aviso("La cantidad debe ser mayor que cero. Escriba el monto y el precio.",true); return; }
  if(p==null||p<=0){ aviso("Escriba el precio por moneda.",true); return; }
  if(k<0){ aviso("La comisión no puede ser negativa.",true); return; }
  if(SP.tipo==="venta"){
    var e=estadoDe(SP.sym);
    if(c>e.cantidad+1e-9){
      aviso("No puede vender "+cant(c)+" "+SP.sym+": tiene "+cant(e.cantidad)+".",true); return;
    }
  }
  BD.ops.push({id:idNuevo(), sym:String(SP.sym).toUpperCase(), tipo:SP.tipo, cant:c, precio:p,
               com:k, fecha:f, nota:n, casa:SP.casa, mod:Date.now()});
  BD.ajustes.casa=SP.casa;
  guardar();
  var gan=null;
  if(SP.tipo==="venta"){
    var e2=estadoDe(SP.sym);
    var R=e2.porOp[BD.ops[BD.ops.length-1].id];
    if(R&&R.gan!=null) gan=R.gan;
  }
  SP.sel=String(SP.sym).toUpperCase();
  pintarSpot(); repintarCabecera();
  conectarVivo(); traerPrecios(true); traerLogo(SP.sym);
  aviso(SP.tipo==="venta"
    ? ("Venta registrada"+(gan!=null?" · "+(gan>=0?"ganó ":"perdió ")+usd(Math.abs(gan)):"")+".")
    : ("Compra registrada · "+cant(c)+" "+SP.sym+" en "+nombreCasa(SP.casa)+"."));
}

/* la regla con cada compra marcada */
function reglaCompras(e, compras){
  if(e.precio==null||!compras.length) return "";
  var ps=compras.map(function(o){ return +o.precio; });
  ps.push(e.precio); if(e.promedio!=null) ps.push(e.promedio);
  var lo=Math.min.apply(null,ps), hi=Math.max.apply(null,ps);
  var m=(hi-lo)*0.18||lo*0.08;
  var min=lo-m, max=hi+m, an=max-min;
  function X(v){ return Math.max(1.5,Math.min(98.5,(v-min)/an*100)); }
  var xa=X(e.precio), xp=X(e.promedio), gana=e.precio>=e.promedio;
  var s='<div class="riel" style="height:52px;margin-top:14px">'+
    '<div class="via" style="background:var(--b0)"></div>'+
    '<div style="position:absolute;top:16px;height:9px;border-radius:5px;left:'+
    Math.min(xp,xa)+'%;width:'+Math.abs(xa-xp)+'%;background:'+(gana?"var(--up)":"var(--dn)")+
    ';opacity:.6"></div>';
  compras.forEach(function(o){
    var x=X(+o.precio), buena=e.precio>=+o.precio;
    s+='<span style="position:absolute;top:14px;left:'+x+'%;width:12px;height:12px;'+
       'border-radius:50%;transform:translateX(-50%);border:2px solid var(--b1);background:'+
       (buena?"var(--up)":"var(--dn)")+'" title="'+esc(fechaCorta(o.fecha))+' · '+
       precio(o.precio)+'"></span>';
  });
  s+='<span class="mk" style="left:'+xp+'%"></span>'+
     '<span class="aho" style="left:'+xa+'%;background:'+(gana?"var(--up)":"var(--dn)")+'"></span>'+
     '<span class="et" style="top:0;bottom:auto;left:'+xp+'%;transform:translateX(-50%)">promedio '+
     precio(e.promedio)+'</span>'+
     '<span class="et" style="left:'+xa+'%;transform:translateX(-50%);color:'+
     (gana?"var(--upTx)":"var(--dnTx)")+'">hoy '+precio(e.precio)+'</span></div>'+
     '<div class="mut" style="font-size:11px">Cada punto es una compra suya · verde las que '+
     'van ganando, rojo las que no</div>';
  return s;
}

    '<div style="font-size:14px;margin-bottom:4px">Si '+esc(sym)+' llega a '+

function filasMov(e, sym){
  var maxT=Math.max.apply(null, e.ops.map(function(o){
    return (+o.cant||0)*(+o.precio||0); }))||1;
  return e.ops.slice().reverse().map(function(o){
    var v=o.tipo==="venta";
    var bruto=(+o.cant||0)*(+o.precio||0), tot=v?bruto-(+o.com||0):bruto+(+o.com||0);
    var p=String(o.fecha||"").split("-");
    var dd=diasDesde(o.fecha);
    var R=(e.porOp||{})[o.id]||{};
    var r=(!v&&e.precio!=null)?(e.precio-(+o.precio))/(+o.precio)*100:null;
    return '<div class="mv '+(v?"venta":"compra")+'" style="--fc:'+colDe(sym)+'">'+
      '<div class="fh"><b>'+(p[2]||"--")+'</b><span>'+(MESES[(+p[1])-1]||"")+" "+
      (p[0]||"").slice(2)+'</span></div>'+
      '<div class="q"><div class="l1">'+(v?"Vendió":"Compró")+' <em>'+cant(o.cant)+'</em> '+
      esc(sym)+' a <em>'+precio(o.precio)+'</em></div>'+
      '<div class="l2">'+(o.casa?logoCasa(o.casa,14):"")+(v?"recibió ":"pagó ")+usd(tot)+
      ((+o.com)?" · comisión "+usd(o.com):"")+(dd!=null?" · hace "+dd+" días":"")+
      (o.nota?" · "+esc(o.nota):"")+'</div>'+
      '<div class="bar"><i style="width:'+(bruto/maxT*100).toFixed(1)+'%"></i></div></div>'+
      (v
        ? (R.gan!=null
            ? '<div class="r"><b class="'+cl(R.gan)+'">'+(R.gan>=0?"+":"−")+
              usd(R.gan).replace("-","")+'</b><span>'+(R.gan>=0?"ganó":"perdió")+
              (R.pct!=null?" "+pct(R.pct,1):"")+'</span></div>'
            : '<div class="r"><b>—</b><span>sin compra previa</span></div>')
        : (r!=null?'<div class="r"><b class="'+cl(r)+'">'+pct(r,1)+
           '</b><span>esta compra</span></div>':''))+
      '<button class="b sm" data-ed="'+esc(o.id)+'">Editar</button></div>';
  }).join("");
}
