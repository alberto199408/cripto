<style>
/* =====================================================================
   TODO EL COLOR SALE DE AQUÍ, y lo pone el programa desde Configuración.
   Las letras se calculan solas a partir del fondo: nunca quedan ilegibles.
   ===================================================================== */
:root{
  --fz:15px; --rad:14px;
  --b0:#070B12; --b1:#0E1420; --b2:#151D2C; --b3:#1D2738; --ln:#273348;
  --tx:#F2F6FC; --t2:#B7C3D6; --t3:#8593A8;
  --ac:#10E0A0; --ac2:#6BFFD0; --ojoTx:#FFBE7B; --acInk:#04120C; --acTx:#10E0A0;
  --up:#16D98A; --dn:#FF4D6A; --upTx:#16D98A; --dnTx:#FF4D6A; --upInk:#04120C; --dnInk:#fff;
  --c1:#16D98A; --c2:#F5A524; --c3:#9B6BFF; --c4:#3B82F6; --c5:#EC4899; --c6:#22B8E6;
  --maOp:.05;
  --sombra:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--b0);color:var(--tx);font-size:var(--fz);
  font-family:"Segoe UI Variable Text","Segoe UI",Roboto,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
  font-synthesis:none;text-rendering:optimizeSpeed;overflow-x:hidden}
.mono{font-family:inherit;font-variant-numeric:tabular-nums}
.up{color:var(--upTx)} .dn{color:var(--dnTx)} .nt{color:var(--t2)} .ao{color:var(--acTx)}
.mut{color:var(--t2);font-size:13px;line-height:1.6}
h1,h2,h3{margin:0;color:var(--tx)}
b,strong{color:var(--tx)}

/* ---------- marca de agua ---------- */
#marca{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:grid;place-items:center}
#marca .ma{width:min(62vh,600px);height:min(62vh,600px);opacity:var(--maOp);
  transition:opacity 1.2s ease}
#marca .ma svg,#marca .ma img{width:100%;height:100%;display:block}

/* ---------- armazón ---------- */
#app{display:flex;min-height:100vh;position:relative;z-index:1}
aside{width:200px;flex:none;background:var(--b1);border-right:1px solid var(--ln);
  display:flex;flex-direction:column;padding:16px 12px;gap:5px;
  padding-top:max(16px,env(safe-area-inset-top));position:sticky;top:0;height:100vh}
aside .logo{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
aside .logo .d{width:42px;height:42px;border-radius:12px;flex:none;overflow:hidden;background:var(--b2);
  box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 35%,transparent)}
aside .logo .d img{width:100%;height:100%;display:block}
aside .logo b{font-size:15px;line-height:1.2;display:block}
aside .logo span{font-size:11px;color:var(--t3);letter-spacing:.08em}
aside nav{display:flex;flex-direction:column;gap:4px}
aside nav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--t2);
  padding:11px 13px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:14px;
  font-weight:600;text-align:left;width:100%;transition:.14s}
aside nav button:hover{background:var(--b2);color:var(--tx)}
aside nav button.on{background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--acTx);
  box-shadow:inset 3px 0 0 var(--ac)}
aside nav button svg{width:18px;height:18px;flex:none}
aside nav button .bg{margin-left:auto;background:var(--dn);color:#fff;font-size:11px;
  font-weight:700;padding:2px 7px;border-radius:99px}
aside .pie{margin-top:auto;padding:13px;border-radius:12px;background:var(--b2);
  border:1px solid var(--ln);text-align:center}
aside .pie b{display:block;font-size:17px;font-weight:700}
aside .pie span{font-size:11px;color:var(--t3);letter-spacing:.08em}

main{flex:1;min-width:0;padding:18px 22px calc(40px + env(safe-area-inset-bottom))}
.encab{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.encab h1{font-size:28px;font-weight:700;letter-spacing:0;line-height:1.1}
.encab p{margin:3px 0 0;font-size:13px;color:var(--t2)}
.encab .der{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}

/* ---------- indicadores de la cabecera ---------- */
.pulso,.syn{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--t2);
  padding:7px 12px;border-radius:99px;background:var(--b1);border:1px solid var(--ln);white-space:nowrap}
.pulso i,.syn i{width:7px;height:7px;border-radius:50%;background:var(--t3);flex:none}
.pulso.on i{background:var(--up);animation:late 1.6s infinite}
.pulso.mal i,.syn.mal i{background:var(--dn)}
.pulso.vjo i{background:#F5A524}
.syn.ok i{background:var(--up)}
@keyframes late{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}

/* ---------- botones ---------- */
.b{background:var(--b2);color:var(--tx);border:1px solid var(--ln);padding:9px 14px;
  border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;
  transition:.14s;display:inline-flex;align-items:center;gap:7px;justify-content:center;
  white-space:nowrap}
.b:hover{border-color:var(--acTx);color:var(--acTx)}
.b:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.b:disabled{opacity:.42;cursor:default;pointer-events:none}
.b.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.b.ac{background:var(--ac);border-color:transparent;
  color:var(--acInk);font-weight:700;box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 30%,transparent)}
.b.ac:hover{filter:brightness(1.08);color:var(--acInk)}
.b.vd{background:var(--up);border-color:transparent;color:var(--upInk);font-weight:700}
.b.rj{background:var(--dn);border-color:transparent;color:var(--dnInk);font-weight:700}
.b.vd:hover,.b.rj:hover{filter:brightness(1.1);color:inherit}
.b.gh{background:none;border-color:var(--ln);color:var(--t2)}
.b svg{width:15px;height:15px}

/* ---------- caja ---------- */
.caja{background:var(--b1);border:1px solid var(--ln);border-radius:var(--rad);
  margin-bottom:14px;overflow:hidden}
.caja>h2{padding:14px 17px;font-size:16px;font-weight:700;display:flex;align-items:center;
  gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--ln);color:var(--tx)}
.caja>h2 .sp{flex:1}
.caja>h2 .ic{width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:var(--ac);color:var(--acInk)}
.caja>h2 .ic svg{width:15px;height:15px}
.cp{padding:15px 17px}

/* ---------- tarjetas de cifras, cada una con su color ---------- */
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:11px;margin-bottom:14px}
.met{--c:var(--ac);position:relative;overflow:hidden;border-radius:var(--rad);padding:13px 15px;
  background:linear-gradient(145deg,color-mix(in srgb,var(--c) 16%,var(--b1)),var(--b1) 70%);
  border:1px solid color-mix(in srgb,var(--c) 42%,var(--ln));
  box-shadow:inset 0 1px 0 color-mix(in srgb,var(--c) 25%,transparent)}
.met::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);
  pointer-events:none}
.met .cab{display:flex;align-items:center;gap:9px;margin-bottom:8px;position:relative}
.met .cab .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:var(--c);color:var(--cInk,#04120C);box-shadow:0 4px 12px color-mix(in srgb,var(--c) 40%,transparent)}
.met .cab .ico svg{width:16px;height:16px}
.met .cab span{font-size:11px;color:var(--t2);font-weight:700;letter-spacing:.08em;line-height:1.25;
  text-transform:uppercase}
.met .v{font-size:25px;font-weight:700;letter-spacing:0;
  font-variant-numeric:tabular-nums;line-height:1.1;color:var(--tx);position:relative}
.met .v small{font-size:12px;font-weight:600;color:var(--t3);margin-left:5px}
.met .s{font-size:12px;color:var(--t2);margin-top:4px;position:relative}
.met .msp{position:absolute;right:10px;bottom:8px;width:72px;height:26px;opacity:.9}
.met .msp svg{width:100%;height:100%;overflow:visible}

/* ---------- hero: la cifra grande ---------- */
.cima{display:grid;grid-template-columns:minmax(290px,1fr) minmax(0,1.6fr);gap:12px;margin-bottom:14px}
.cima .mets{margin:0;align-content:start;grid-template-columns:repeat(3,1fr)}
@media(max-width:1250px){ .cima{grid-template-columns:1fr} .cima .mets{grid-template-columns:repeat(3,1fr)} }
.hero{border-radius:var(--rad);overflow:hidden;position:relative;margin-bottom:14px;
  border:1px solid color-mix(in srgb,var(--up) 45%,var(--ln));
  background:linear-gradient(150deg,color-mix(in srgb,var(--up) 16%,var(--b1)),var(--b1) 65%)}
.hero.pierde{border-color:color-mix(in srgb,var(--dn) 45%,var(--ln));
  background:linear-gradient(150deg,color-mix(in srgb,var(--dn) 15%,var(--b1)),var(--b1) 65%)}
.cima .hero{margin:0}
.hero .hfondo{position:absolute;left:0;right:0;bottom:0;height:40%;opacity:.16;pointer-events:none}
.hero .hfondo svg{width:100%;height:100%;display:block}
.hz{position:relative;display:flex;gap:18px;flex-wrap:wrap;padding:19px 21px}
.hprin{flex:1;min-width:250px}
.he{font-size:11px;letter-spacing:.08em;color:var(--t2);font-weight:700;margin-bottom:7px}
.hv{font-size:44px;font-weight:700;letter-spacing:-.01em;line-height:1;color:var(--tx)}
.hv small{font-size:14px;font-weight:600;color:var(--t3);margin-left:7px}
.hg{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap}
.gp2{font-size:15px;font-weight:700}
.gch{font-size:13px;font-weight:700;padding:4px 10px;
  border-radius:7px;background:var(--b2);border:1px solid var(--ln)}
.meta{margin-top:13px;max-width:430px}
.meta .mb{height:9px;border-radius:5px;background:var(--b0);overflow:hidden;border:1px solid var(--ln)}
.meta .mb i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--up));
  transition:width .6s ease}
.meta .mt{font-size:12px;color:var(--t2);margin-top:5px}

/* ---------- cápsulas de ganancia y chips ---------- */
.gpill{display:inline-block;padding:4px 10px;border-radius:8px;font-weight:700;
  font-size:13px;line-height:1.25;white-space:nowrap}
.gpill.p{background:var(--up);color:var(--upInk)}
.gpill.n{background:var(--dn);color:var(--dnInk)}
.gpill.z{background:var(--b3);color:var(--t2)}
.gsub{display:block;font-size:11px;margin-top:3px;font-weight:700}
.chip{display:inline-block;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:700;
  white-space:nowrap}
.chip.l{background:color-mix(in srgb,var(--up) 22%,transparent);color:var(--upTx)}
.chip.s{background:color-mix(in srgb,var(--dn) 20%,transparent);color:var(--dnTx)}
.chip.a{background:color-mix(in srgb,var(--ac) 20%,transparent);color:var(--acTx)}
.chip.g{background:var(--b3);color:var(--t2)}

/* ---------- tablas ---------- */
.env{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--b2)}
thead th{text-align:right;padding:11px 10px;font-weight:700;white-space:nowrap;
  border-bottom:1px solid var(--ln)}
thead th:first-child{text-align:left}
thead th .cap{display:inline-block;background:var(--b0);border:1px solid var(--ln);
  border-radius:999px;padding:5px 11px;font-size:11px;font-weight:700;color:var(--t2);
  letter-spacing:.02em;white-space:nowrap}
thead th.ord{cursor:pointer;user-select:none}
thead th.ord:hover .cap{color:var(--tx);border-color:var(--acTx)}
thead th.ord.act .cap{color:var(--acTx);border-color:color-mix(in srgb,var(--ac) 55%,transparent);
  background:color-mix(in srgb,var(--ac) 12%,var(--b0))}
tbody td{padding:12px 10px;text-align:right;font-size:13px;
  font-variant-numeric:tabular-nums;border-bottom:1px solid var(--ln);white-space:nowrap;color:var(--tx)}
tbody td:first-child{text-align:left;font-family:inherit}
tbody tr:last-child td{border-bottom:0}
tbody tr.cl{cursor:pointer;transition:background .12s}
tbody tr.cl:hover{background:color-mix(in srgb,var(--ac) 9%,transparent)}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--b2) 45%,transparent)}
tbody tr td:first-child{position:relative}
tbody tr.cl td:first-child::before{content:"";position:absolute;left:0;top:6px;bottom:6px;
  width:3px;border-radius:3px;background:var(--fc,transparent)}
tfoot td{padding:12px 10px;border-top:2px solid var(--ln);background:var(--b2);
  font-size:14px;text-align:right;font-variant-numeric:tabular-nums;
  font-weight:700;color:var(--tx)}
tfoot td:first-child{text-align:left;font-family:inherit;font-size:13px;color:var(--t2)}
.vacio{padding:42px 20px;text-align:center;color:var(--t2)}
.vacio b{display:block;color:var(--tx);font-size:17px;margin-bottom:8px}
.vacio p{margin:0 auto 16px;max-width:430px;line-height:1.6;font-size:14px}

/* ---------- moneda con su logo ---------- */
.cri{display:flex;align-items:center;gap:10px}
.ic{width:30px;height:30px;flex:none;border-radius:50%;display:block;object-fit:cover}
.cri .ic{box-shadow:0 0 0 2px color-mix(in srgb,var(--fc) 45%,transparent)}
.cri b{font-size:14px;font-weight:700;display:block;line-height:1.25}
.cri span{font-size:11px;color:var(--t2)}
.disco{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-weight:700}
.casa{display:inline-grid;place-items:center;border-radius:7px;flex:none}
.casa svg{width:74%;height:74%;display:block}
.casita{display:inline-flex;align-items:center;gap:5px}

/* ---------- formularios ---------- */
label{display:block;font-size:12px;font-weight:700;color:var(--t2);margin-bottom:6px;
  letter-spacing:.03em}
label small{font-weight:500;color:var(--t3);letter-spacing:0;font-size:11px}
input,select,textarea{width:100%;background:var(--b0);color:var(--tx);border:1px solid var(--ln);
  border-radius:9px;padding:10px 12px;font-size:14px}
input::placeholder{color:var(--t3);opacity:1}
select,textarea{font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px;border-color:var(--acTx)}
input:disabled{opacity:.6}
input[type=color]{padding:3px;height:42px;cursor:pointer}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--acTx);height:30px}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.campos.dos{grid-template-columns:1fr 1fr}
.campo.ancho,.ancho{grid-column:1/-1}
.nota{margin-top:11px;padding:11px 13px;border-radius:10px;
  background:color-mix(in srgb,var(--ac) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--ac) 32%,transparent);
  font-size:13px;color:var(--tx);line-height:1.65}
.nota b{color:var(--ac2)}
.nota.ojo{background:color-mix(in srgb,#FF9F3C 14%,transparent);
  border-color:color-mix(in srgb,#FF9F3C 50%,transparent)}
.nota.ojo b{color:var(--ojoTx)}
.nota.mal{background:color-mix(in srgb,var(--dn) 13%,transparent);
  border-color:color-mix(in srgb,var(--dn) 48%,transparent)}
.nota.mal b{color:var(--dnTx)}
.pill{display:flex;background:var(--b0);border:1px solid var(--ln);border-radius:9px;padding:3px;gap:3px}
.pill button{flex:1;background:none;border:0;color:var(--t2);padding:9px;border-radius:7px;
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.14s}
.pill button:hover{color:var(--tx)}
.pill button.on{background:var(--b3);color:var(--tx)}
.pill button.on.v{background:color-mix(in srgb,var(--up) 24%,transparent);color:var(--upTx)}
.pill button.on.r{background:color-mix(in srgb,var(--dn) 22%,transparent);color:var(--dnTx)}
.pill.grande button{flex-direction:column;gap:2px;padding:10px 8px;font-size:14px}
.pill.grande button span{display:block;font-size:11px;font-weight:500;opacity:.8}
.selector{width:100%;display:flex;align-items:center;gap:10px;background:var(--b0);
  border:1px solid var(--ln);border-radius:9px;padding:9px 12px;cursor:pointer;
  font-family:inherit;color:var(--tx);text-align:left}
.selector:hover{border-color:var(--acTx)}
.selector .ic,.selector .casa{width:28px;height:28px;flex:none}
.selector span{flex:1;min-width:0}
.selector span b{display:block;font-size:14px}
.selector span i{font-style:normal;font-size:11px;color:var(--t2)}
.selector em{font-style:normal;font-size:12px;color:var(--acTx);font-weight:700}
.modos{display:flex;gap:4px;margin-top:6px}
.modos button{flex:1;background:var(--b0);border:1px solid var(--ln);color:var(--t2);padding:5px 6px;
  border-radius:7px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer}
.modos button.on{background:var(--ac);border-color:var(--acTx);color:var(--acInk)}
.rapidos{display:flex;gap:7px;margin-top:6px}
.rapidos button{flex:1;background:var(--b0);border:1px solid var(--ln);color:var(--t2);
  padding:8px 4px;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.rapidos button:hover,.rapidos button.on{border-color:var(--acTx);color:var(--acTx);
  background:color-mix(in srgb,var(--ac) 12%,transparent)}

/* ---------- franja de ajustes a la vista ---------- */
.franja{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;
  background:var(--b1);border:1px solid var(--ln);border-radius:var(--rad);
  padding:13px 15px;margin-bottom:14px;position:relative}
.franja .fc{min-width:0}
.franja .fc label{display:flex;align-items:center;gap:5px;margin-bottom:5px}
.franja .fc input,.franja .fc select{padding:8px 10px;font-size:14px;font-weight:700}
.franja .fr{display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:color-mix(in srgb,var(--dn) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--dn) 45%,transparent);border-radius:10px;padding:8px 10px}
.franja .fr .e{font-size:11px;letter-spacing:.07em;color:var(--t2);font-weight:700}
.franja .fr .v{font-size:19px;font-weight:700;color:var(--dnTx)}
.franja .sw{display:flex;align-items:center;gap:8px;background:var(--b0);border:1px solid var(--ln);
  border-radius:10px;padding:8px 10px;cursor:pointer;user-select:none}
.franja .sw i{width:34px;height:20px;border-radius:99px;background:var(--b3);position:relative;flex:none;
  transition:.2s}
.franja .sw i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;
  border-radius:50%;background:var(--t2);transition:.2s}
.franja .sw.on i{background:var(--up)}
.franja .sw.on i::after{left:16px;background:var(--upInk)}
.franja .sw span{font-size:12px;font-weight:700;color:var(--t2);line-height:1.25}
.franja .sw.on span{color:var(--tx)}

/* ---------- resultado de la calculadora ---------- */
.lote{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.lote .lc{--c:var(--ln);background:var(--b0);border:1px solid var(--ln);border-radius:11px;
  padding:11px 13px;text-align:center}
.lote .lc.dest{border-color:color-mix(in srgb,var(--ac) 55%,transparent);
  background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 16%,var(--b0)),var(--b0))}
.lote .lc .e{font-size:11px;letter-spacing:.1em;color:var(--t2);font-weight:700}
.lote .lc .v{font-size:20px;font-weight:700;margin-top:3px;
  letter-spacing:0;color:var(--tx)}
.lote .lc .s{font-size:12px;color:var(--t2);margin-top:2px}

/* ---------- barra entre el stop y el objetivo ---------- */
.riel{position:relative;height:42px;margin:10px 0 2px}
.riel .via{position:absolute;left:0;right:0;top:16px;height:9px;border-radius:5px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--dn) 60%,transparent),
  var(--b3) 48%,var(--b3) 52%,color-mix(in srgb,var(--up) 60%,transparent));
  border:1px solid var(--ln);overflow:hidden}
.riel .mk{position:absolute;top:10px;width:3px;height:21px;border-radius:2px;
  background:var(--t2);transform:translateX(-50%)}
.riel .aho{position:absolute;top:7px;width:13px;height:27px;border-radius:5px;
  transform:translateX(-50%);border:2px solid var(--b1);transition:left .35s ease;z-index:2}
.riel .et{position:absolute;bottom:0;font-size:11px;
  color:var(--t2);white-space:nowrap}
.riel .et.iz{left:0} .riel .et.de{right:0}
.riel .et.ce{left:50%;transform:translateX(-50%)}

/* ---------- gráfica con regla ---------- */
.graf{background:var(--b0);border:1px solid var(--ln);border-radius:12px;overflow:hidden;
  margin-top:10px;user-select:none}
.gcab{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--ln);
  flex-wrap:wrap}
.gsym{display:flex;align-items:center;gap:8px;font-size:14px}
.gsym b{font-weight:700}
.gsym span.mono{color:var(--t2);font-size:13px}
.gint{display:flex;gap:3px;background:var(--b1);border:1px solid var(--ln);border-radius:8px;padding:2px}
.gint button{background:none;border:0;color:var(--t2);padding:5px 9px;border-radius:6px;
  font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.gint button:hover{color:var(--tx)}
.gint button.on{background:var(--ac);color:var(--acInk)}
.gzona{position:relative;height:300px;touch-action:none;overflow:hidden}
.gsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.gejes{position:absolute;inset:0;pointer-events:none}
.gejes .gr{position:absolute;left:0;right:0;border-top:1px dashed color-mix(in srgb,var(--ln) 85%,transparent)}
.gejes .gr span{position:absolute;right:4px;top:2px;font-size:11px;color:var(--t2);
  background:color-mix(in srgb,var(--b0) 70%,transparent);
  padding:0 3px;border-radius:3px}
.glineas{position:absolute;inset:0}
.gsom{position:absolute;left:0;right:0;pointer-events:none}
.gsom.riesgo{background:color-mix(in srgb,var(--dn) 15%,transparent)}
.gsom.premio{background:color-mix(in srgb,var(--up) 14%,transparent)}
.gcompra{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--c2);opacity:.85;
  pointer-events:none}
.gcompra i{position:absolute;right:6px;top:-9px;width:9px;height:9px;border-radius:50%;
  background:var(--c2);border:2px solid var(--b0)}
.gcompra span{position:absolute;left:6px;top:-8px;font-size:11px;
  font-weight:700;color:var(--c2Tx);background:color-mix(in srgb,var(--b0) 88%,transparent);padding:0 4px;
  border-radius:3px;white-space:nowrap}
.ln{position:absolute;left:0;right:0;height:30px;margin-top:-15px;color:var(--t2);
  cursor:ns-resize;touch-action:none;z-index:3}
.ln::before{content:"";position:absolute;left:0;right:0;top:14px;
  border-top:2px dashed currentColor}
.ln .tir{position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:7px;
  display:grid;place-items:center;font-size:13px;background:var(--b2);
  border:1px solid currentColor;color:inherit}
.ln[data-ln="sl"] .tir{left:34px}
.ln[data-ln="tp"] .tir{left:64px}
.ln .et{position:absolute;right:4px;top:4px;background:var(--b2);border:1px solid currentColor;
  border-radius:6px;padding:3px 8px;font-size:12px;
  white-space:nowrap;line-height:1.5}
.ln .et b{font-size:11px;letter-spacing:.08em;margin-right:3px;color:inherit}
.ln .et i{font-style:normal;opacity:.85}
.ln.abajo .et,.ln.abajo .tir{top:auto;bottom:4px}
.ln.ent{color:var(--acTx)}
.ln.sl{color:var(--dnTx)}
.ln.tp{color:var(--upTx)}
.ln.ahora{color:var(--tx);cursor:default;z-index:2;pointer-events:none}
.ln.ahora::before{border-top-style:solid}
.ln.ahora .et{background:var(--tx);color:var(--b0);border-color:var(--tx);font-weight:700;right:60px}
.ln.ahora .et b{color:var(--b0)}
.ln.agarrada::before{border-top-style:solid;border-top-width:3px}
.ln.agarrada .et,.ln.agarrada .tir{filter:brightness(1.3)}
.ln.lejos::before{border-top-style:dotted}
.gcargando{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  padding:20px;color:var(--t2);font-size:13px;background:var(--b0);z-index:4}
.gpieg{display:flex;gap:16px;flex-wrap:wrap;padding:9px 11px;border-top:1px solid var(--ln);
  font-size:12px;color:var(--t2)}

/* ---------- checklist de disciplina ---------- */
.chk{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:7px}
.chk button{display:flex;align-items:center;gap:9px;background:var(--b0);border:1px solid var(--ln);
  border-radius:9px;padding:9px 11px;cursor:pointer;font-family:inherit;font-size:13px;
  color:var(--t2);text-align:left;transition:.14s;font-weight:600}
.chk button .cj{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--ln);flex:none;
  display:grid;place-items:center;font-size:11px;color:transparent}
.chk button.on{border-color:color-mix(in srgb,var(--up) 55%,transparent);
  background:color-mix(in srgb,var(--up) 11%,transparent);color:var(--tx)}
.chk button.on .cj{background:var(--up);border-color:var(--upTx);color:var(--upInk)}
.animo{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.animo button{background:var(--b0);border:1px solid var(--ln);border-radius:99px;padding:7px 13px;
  cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;color:var(--t2)}
.animo button.on{border-color:var(--acTx);color:var(--acTx);background:color-mix(in srgb,var(--ac) 14%,transparent)}

/* ---------- lista de movimientos ---------- */
.mv{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;
  background:var(--b0);border:1px solid var(--ln);margin-bottom:8px;flex-wrap:wrap}
.mv.compra{border-left:3px solid var(--up)}
.mv.venta{border-left:3px solid var(--dn)}
.mv.fut{border-left:3px solid var(--ac)}
.mv .fh{text-align:center;flex:none;min-width:50px;padding:5px 7px;border-radius:9px;background:var(--b2)}
.mv .fh b{display:block;font-size:16px;font-weight:700;line-height:1}
.mv .fh span{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.07em}
.mv .q{flex:1;min-width:170px}
.mv .q .l1{font-size:14px;font-weight:600;margin-bottom:3px;color:var(--tx)}
.mv .q .l1 em{font-style:normal;font-weight:700}
.mv .q .l2{font-size:12px;color:var(--t2);
  display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.mv .bar{height:4px;border-radius:3px;background:var(--b2);margin-top:6px;overflow:hidden}
.mv .bar i{display:block;height:100%;background:var(--fc,var(--t3));opacity:.8}
.mv .r{text-align:right;flex:none;min-width:92px}
.mv .r>b{display:block;font-size:15px;font-weight:700}
.mv .r>span{font-size:12px;color:var(--t2)}
.mv .p{text-align:right;flex:none;min-width:80px}
.mv .p>b{font-size:15px;font-weight:700;display:block}
.mv .p>span:not(.gpill):not(.gsub){font-size:12px;color:var(--t2)}
.mv .acc{display:flex;gap:7px;flex-wrap:wrap;flex:none}

/* ---------- rosca y gráficas ---------- */
.rosca{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.rosca svg{width:150px;height:150px;flex:none}
.rosca .ley{flex:1;min-width:145px;display:flex;flex-direction:column;gap:6px}
.rosca .ley span{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t2)}
.rosca .ley i{width:9px;height:9px;border-radius:3px;flex:none}
.rosca .ley b{margin-left:auto;color:var(--tx)}
.gcre{width:100%;height:200px;display:block}
.leyg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--t2);font-weight:500}
.leyg i{width:14px;height:3px;border-radius:2px}
.gpie{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);
  padding-top:6px;border-top:1px solid var(--ln)}
.gpie b{font-size:14px}
.spark{width:62px;height:22px;display:block;overflow:visible}

/* ---------- fila inferior de tarjetas ---------- */
.inf{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:12px}
.inf .caja{margin:0}
.ancha2{grid-column:span 2;min-width:280px}
.rank{display:flex;align-items:center;gap:11px;padding:3px 0}
.rank .ic{width:30px;height:30px}
.rank b{font-size:14px;font-weight:700}
.rank .pc{margin-left:auto;text-align:right}
.rank .pc b{display:block;font-size:16px;font-weight:700}
.rank .pc span{font-size:12px;color:var(--t2)}
.mpg{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mp{background:var(--b0);border:1px solid var(--ln);border-left:3px solid var(--fc);
  border-radius:11px;padding:11px 12px}
.mpt{font-size:11px;letter-spacing:.08em;color:var(--t2);font-weight:700;margin-bottom:7px}
.mpc{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.mpc .ic{width:27px;height:27px}
.mpc b{font-size:14px;display:block}
.mpc span{font-size:12px;color:var(--t2)}
.mpv{font-size:22px;font-weight:700;line-height:1}
.mps{font-size:11px;color:var(--t2);margin-top:4px}

/* ---------- ventana ---------- */
#velo{position:fixed;inset:0;background:rgba(0,0,0,.74);backdrop-filter:blur(5px);z-index:60;
  display:none;justify-content:center;padding:22px 13px;overflow-y:auto}
#velo.on{display:flex;align-items:flex-start}
.hoja{background:var(--b1);border:1px solid var(--ln);border-radius:16px;width:100%;max-width:540px;
  box-shadow:0 24px 70px rgba(0,0,0,.6)}
.hoja.ancha{max-width:760px}
.hoja .hh{padding:15px 19px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:11px}
.hoja .hh h3{font-size:16px;font-weight:700;flex:1}
.hoja .hb{padding:19px}
.hoja .hf{padding:14px 19px;border-top:1px solid var(--ln);display:flex;gap:9px;
  justify-content:flex-end;flex-wrap:wrap}
.hoja.elar .hh{background:linear-gradient(115deg,color-mix(in srgb,var(--up) 26%,var(--b1)),var(--b1))}
.hoja.esc .hh,.hoja.venta .hh{background:linear-gradient(115deg,color-mix(in srgb,var(--dn) 24%,var(--b1)),var(--b1))}
.x{background:none;border:0;color:var(--t2);font-size:22px;cursor:pointer;padding:2px 7px;border-radius:7px}
.x:hover{color:var(--tx);background:var(--b2)}
.fsec{font-size:12px;letter-spacing:.08em;font-weight:700;color:var(--acTx);
  margin:17px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--ln)}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px;
  max-height:50vh;overflow-y:auto}
.mfic{display:flex;align-items:center;gap:10px;background:var(--b0);border:1px solid var(--ln);
  border-radius:11px;padding:9px 11px;cursor:pointer;font-family:inherit;color:var(--tx);text-align:left}
.mfic:hover{border-color:var(--acTx);background:color-mix(in srgb,var(--ac) 9%,transparent)}
.mfic.on{border-color:var(--acTx);background:color-mix(in srgb,var(--ac) 15%,transparent)}
.mfic .ic,.mfic .casa{width:28px;height:28px}
.mfic span{flex:1;min-width:0}
.mfic span b{display:block;font-size:13px}
.mfic span i{font-style:normal;font-size:12px;color:var(--t2);display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mfic em{font-style:normal;font-size:11px;color:var(--acTx);font-weight:700}

/* ---------- avisos ---------- */
#aviso{position:fixed;left:50%;bottom:22px;transform:translate(-50%,160%);background:var(--b2);
  border:1px solid var(--ln);border-left:3px solid var(--up);padding:13px 18px;border-radius:11px;
  font-size:14px;z-index:80;transition:transform .25s,opacity .25s;max-width:min(88vw,520px);
  box-shadow:0 14px 40px rgba(0,0,0,.5);line-height:1.5;cursor:pointer;color:var(--tx);
  opacity:0;visibility:hidden;pointer-events:none}
#aviso.on{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto}
#aviso.mal{border-left-color:var(--dnTx)}
.alerta{margin-bottom:14px;padding:14px 16px;border-radius:13px;display:flex;align-items:center;
  gap:13px;flex-wrap:wrap;background:color-mix(in srgb,var(--dn) 12%,var(--b1));
  border:1px solid color-mix(in srgb,var(--dn) 42%,transparent)}
.alerta .t{flex:1;min-width:210px}
.alerta .t b{display:block;font-size:14px;margin-bottom:3px}
.alerta .t span{font-size:13px;color:var(--t2);line-height:1.5}
#verNueva{position:fixed;left:50%;transform:translateX(-50%) translateY(150%);bottom:18px;
  z-index:90;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:13px;
  background:var(--b1);border:1px solid var(--ac);box-shadow:0 10px 40px rgba(0,0,0,.55);
  transition:transform .35s ease,opacity .3s;max-width:calc(100vw - 24px);flex-wrap:wrap;
  opacity:0;visibility:hidden;pointer-events:none}
#verNueva.on{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;pointer-events:auto}
#verNueva span{font-size:14px;font-weight:600}

/* ---------- el latido de los precios ---------- */
.tic{transition:color .2s,background-color .45s}
.tic.sb{background:color-mix(in srgb,var(--up) 28%,transparent);border-radius:5px}
.tic.bj{background:color-mix(in srgb,var(--dn) 28%,transparent);border-radius:5px}
.envivo{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  letter-spacing:.1em;color:var(--upTx)}
.envivo i{width:6px;height:6px;border-radius:50%;background:var(--up);animation:late 1.6s infinite}

/* ---------- varios ---------- */
.pesoc{display:inline-flex;align-items:center;gap:6px}
.pesoc i{display:block;height:5px;border-radius:3px;background:var(--fc);min-width:3px}
.pesoc span{font-size:12px;color:var(--t2)}
.busca{max-width:190px;padding:7px 11px;font-size:13px;font-family:inherit}
.pie-nota{margin-top:20px;padding-top:13px;border-top:1px solid var(--ln);display:flex;gap:17px;
  flex-wrap:wrap;font-size:12px;color:var(--t2)}
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px}
.temas button{padding:7px 7px 6px;border-radius:12px;border:2px solid transparent;cursor:pointer;
  text-align:left;font-family:inherit;display:block;position:relative;
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.25)}
.temas button.on{border-color:var(--acTx);box-shadow:0 0 0 2px var(--b0),0 0 0 4px var(--acTx)}
.temas button .tp{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px}
.temas button .tp i{width:12px;height:12px;border-radius:50%;flex:none}
.temas button .tp b{font-size:13px;font-weight:700;color:inherit;flex:1}
.temas button .tp em{font-style:normal;font-size:10px;font-weight:700;padding:1px 5px;border-radius:999px}
.temas button .tn{display:block;font-size:12px;font-weight:700;margin-top:6px;padding-left:2px}
.pasos{margin:0;padding-left:19px;font-size:13px;line-height:1.85;color:var(--t2)}
.pasos b{color:var(--tx)}
.fcalc{margin-top:10px;padding:11px 13px;border-radius:10px;background:var(--b0);
  border:1px solid var(--ln);font-size:13px;
  color:var(--t2);line-height:1.65}
.fcalc b{color:var(--tx)}
.paleta{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:9px}
.paleta .campo label{font-size:12px}

/* ---------- teléfono ---------- */
@media(max-width:900px){
  #app{flex-direction:column}
  aside{width:100%;height:auto;position:sticky;top:0;z-index:30;flex-direction:row;
    align-items:center;overflow-x:auto;padding:9px 11px;border-right:0;
    border-bottom:1px solid var(--ln)}
  aside .logo{padding:0 10px 0 4px}
  aside .logo span{display:none}
  aside nav{flex-direction:row;gap:4px}
  aside nav button{padding:9px 11px;font-size:12px}
  aside nav button span.tx{display:none}
  aside .pie{display:none}
  main{padding:13px 12px 40px}
  .encab{gap:9px}
  .encab h1{font-size:22px}
  .encab p{display:none}
  .encab .der{width:100%;margin-left:0}
  .encab .der .b{flex:1}
  .cima{grid-template-columns:1fr}
  .hz{padding:15px 14px;gap:13px}
  .hv{font-size:34px}
  .hprin{min-width:0}
  .mets,.cima .mets{grid-template-columns:1fr 1fr}
  .inf{grid-template-columns:1fr}
  .ancha2{grid-column:auto}
  .mpg{grid-template-columns:1fr}
  .hoja,.hoja.ancha{max-width:100%}
  #velo{padding:9px 7px}
  .hoja .hb{padding:14px}
  .campos{grid-template-columns:1fr 1fr}
  .franja{grid-template-columns:1fr 1fr}
  thead th,tbody td{padding:9px 7px;font-size:12px}
  .opt{display:none}
  .b.sm{min-height:36px}
  .busca{max-width:none;flex:1 1 100%}
  .mv{gap:10px}
  .mv .q{flex:1 1 100%;order:2;min-width:0}
  .mv .fh{order:1}
  .mv .r,.mv .p{order:3;text-align:left;min-width:0;border-right:0;padding-right:0}
  .mv .acc{order:4;margin-left:auto}
  .lote{grid-template-columns:1fr 1fr}
  .gzona{height:250px}
  .chk{grid-template-columns:1fr}
  .temas{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:520px){
  .campos{grid-template-columns:1fr}
  .campos.dos{grid-template-columns:1fr 1fr}
  .hv{font-size:30px}
  .met .v{font-size:21px}
  .campo label .b.sm{float:none!important;display:block;width:fit-content;margin:3px 0 5px}
  .campos.dos .campo:has(.modos){grid-column:1/-1}
  .modos button{padding:7px 4px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  aside,.encab .der,.pie-nota,#velo,#aviso,#verNueva,#marca{display:none!important}
  body{background:#fff;color:#000}
}
</style>
</head>
