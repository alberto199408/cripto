function ambito(k){
  if(k==="back"){
    var p=pruebaActiva();
    return {
      k:"back", prueba:p,
      lista: p?opsDePrueba(p.id):[],
      cfg: cfgPrueba(p),
      guardarCfg: function(c){
        if(!p) return;
        p.capital=c.cartera0!=null?c.cartera0:p.capital;
        p.riesgo=c.riesgo; p.apal=c.apal; p.com=c.com; p.mod=Date.now();
        guardar();
      },
      nuevo: function(o){ o.prueba=p?p.id:""; BD.back.push(o); },
      quitar: function(id){ BD.back=BD.back.filter(function(x){ return x.id!==id; }); },
      pinta: pintarBack
    };
  }
  return {
    k:"fut", prueba:null,
    lista: BD.fut,
    cfg: cfgReal(),
    guardarCfg: function(c){ guardarCfgReal(c); },
    nuevo: function(o){ BD.fut.push(o); },
    quitar: function(id){ BD.fut=BD.fut.filter(function(x){ return x.id!==id; }); },
    pinta: pintarFut
  };
}

/* convierte lo escrito en el stop a un precio de verdad */
function slAPrecio(A){
  var ent=num(FU.entrada), v=num(FU.sl);
  if(ent==null||v==null||ent<=0) return null;
  var baja = FU.lado!=="SHORT";
  if(FU.slModo==="precio") return v;
  var dist;
  if(FU.slModo==="pp") dist=v/100;
  else dist=(v/Math.max(1,A.cfg.apal))/100;      /* % del margen */
  return baja ? ent*(1-dist) : ent*(1+dist);
}
function valoresFU(A){
  return {entrada:num(FU.entrada), sl:slAPrecio(A), tp:num(FU.tp)};
}

    '<div class="lc"><div class="e">POSICIÓN (LOTE)</div><div class="v">'+usdF(R.posicion)+'</div>'+
      '<div class="s">'+cant(R.monedas)+' '+esc(FU.sym||"monedas")+'</div></div>'+
    '<div class="lc dest"><div class="e">DINERO QUE PONE</div><div class="v">'+usdF(R.margen)+'</div>'+
      '<div class="s">con '+R.apal+'x</div></div>'+
    '<div class="lc"><div class="e">SI SALTA EL STOP</div><div class="v dn">−'+
      usdF(R.perdidaSL).replace("-","")+'</div>'+
      '<div class="s">a '+pctS(R.distPct,2)+' de la entrada</div></div>'+
    (R.ganTp!=null
      ? '<div class="lc"><div class="e">SI PEGA EL OBJETIVO</div><div class="v up">+'+
        usdF(R.ganTp)+'</div><div class="s">'+
        (R.rr!=null?("relación "+R.rr.toFixed(2).replace(".",",")+" a 1"):"")+'</div></div>'
      : '<div class="lc"><div class="e">ARRIESGA</div><div class="v">'+usdF(R.riesgo)+'</div>'+
        '<div class="s">'+pctS(R.riesgoPct)+' de '+usd(R.cartera)+'</div></div>')+
    '<div class="lc"><div class="e">LO LIQUIDAN EN</div><div class="v" style="font-size:16px">'+
      precio(R.liq)+'</div><div class="s">margen aislado</div></div>';

  var p=[];
  if(!R.ladoBien) p.push("<b>OJO:</b> en un "+(FU.lado==="SHORT"?"CORTO el stop va POR ENCIMA":
    "LARGO el stop va POR DEBAJO")+" de la entrada. Así como está no le corta la pérdida.");
  if(R.liqAntes) p.push("<b>OJO:</b> con "+R.apal+"x lo liquidan a "+pctS(100/R.apal,1)+
    " y su stop está a "+pctS(R.distPct,1)+": <b>lo liquidarían antes</b> de que el stop alcance "+
    "a cerrarle. Baje el apalancamiento a <b>"+Math.max(1,R.apalMax)+"x</b> o menos.");
  if(R.pasaCartera) p.push("<b>OJO:</b> el margen ("+usdF(R.margen)+") es más que toda su cartera ("+
    usd(R.cartera)+"). Ese stop está demasiado cerca para este riesgo.");
  if(R.tpBien===false) p.push("<b>OJO:</b> en un "+(FU.lado==="SHORT"?"CORTO el objetivo va POR DEBAJO":
    "LARGO el objetivo va POR ENCIMA")+" de la entrada.");
  if(R.rr!=null&&R.rr<1&&R.tpBien) p.push("Con ese objetivo arriesga más de lo que puede ganar "+
    "(relación "+R.rr.toFixed(2).replace(".",",")+" a 1).");
  var prHoy = FU.sym?precioDe(FU.sym):null;
  if(prHoy!=null&&v.entrada>0){
    var lejos=Math.abs(v.entrada-prHoy)/prHoy*100;
    if(lejos>20) p.push("<b>OJO:</b> hoy "+esc(FU.sym)+" está en "+precio(prHoy)+", un "+
      pctS(lejos,0)+" lejos de la entrada que escribió. Revise que no le falte o le sobre un número.");
  }
  if(av){
    if(p.length){ av.style.display=""; av.className="nota ojo"; av.innerHTML=p.join("<br>"); }
    else { av.style.display=""; av.className="nota";
      av.innerHTML="Pase lo que pase, si se respeta el stop usted pierde <b>"+usdF(R.perdidaSL)+
        "</b> — el "+pctS(R.perdidaSL/R.cartera*100,2)+" de su cartera. "+
        "El apalancamiento no cambia eso: solo cambia cuánta plata deja amarrada."; }
  }

  /* resultado si ya la está registrando cerrada */
  var res=document.getElementById("fuRes");
  if(res){
    if(sal!=null&&sal>0&&v.entrada>0){
      var st=estadoOp({sym:FU.sym, lado:FU.lado, monto:R.margen, apal:R.apal, entrada:v.entrada,
        salida:sal, com:R.com, estado:"cerrada", tp:v.tp, sl:v.sl});
      res.style.display=""; res.className="nota";
      res.innerHTML="Esa operación "+(st.gan>=0?"<b class='up'>gana ":"<b class='dn'>pierde ")+
        usdF(Math.abs(st.gan))+"</b> · el precio se movió "+pct(st.pctPrecio,2)+
        ", con "+R.apal+"x eso es <b>"+pct(st.pctMargen,1)+"</b> de su margen"+
        (st.liquidado?" · <b class='dn'>a ese precio ya lo habrían liquidado</b>":"");
    } else res.style.display="none";
  }
}

  }
  FU.amb=k;
  if(!FU.fecha) FU.fecha=hoy();
  var F=carteraFut(A.lista), T=F.tot;

  /* ---- franja de riesgo ---- */
  h+=franjaRiesgo(A);
  if(k==="back") h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 14px">'+

      BD.pruebas.length+' pruebas</button>':'')+

    '<button class="b sm gh" onclick="borrarPrueba()" style="margin-left:auto">Borrar esta prueba</button>'+
    '</div>';

  /* ---- hero ---- */
  var cartera=A.cfg.cartera;
  var base = (A.k==="back"&&A.prueba) ? (+A.prueba.capital||cartera) : cartera;
  var ahoraC = base + T.gan + T.flotante;
  var curva=[]; (function(){ var ac=0; F.cerradas.forEach(function(e){ ac+=e.gan; curva.push(ac); }); })();
  var extra = (cartera>0)
    ? '<div class="meta"><div class="mb"><i style="width:'+
      Math.max(0,Math.min(100,ahoraC/(base*2)*100)).toFixed(1)+'%;background:'+

  h+='<div class="cima">'+
    heroGrande(k==="back"?"RESULTADO DE LA PRUEBA":"RESULTADO EN FUTUROS", ahoraC, T.gan+T.flotante,
      (T.aciertos!=null?T.aciertos.toFixed(0)+"% acertadas · ":"")+T.ganadas+' de '+T.decididas+
      (T.nAb?' · '+plural(T.nAb,"abierta","abiertas"):''), null, curva, extra, true)+
    '<div class="mets">'+
      met(IC.diana,"Le deja por operación",
          T.porOperacion==null?"—":((T.porOperacion>=0?"+":"−")+usdF(T.porOperacion).replace("-","")),
          cl(T.porOperacion),
          T.n?("promedio de "+plural(T.n,"operación cerrada","operaciones cerradas")):"todavía no ha cerrado ninguna", 4, curva)+
      met(IC.sube,"Cuando acierta, gana",
          T.ganaUsd==null?"—":("+"+usdF(T.ganaUsd)),"up",
          T.ganadas?("promedio de "+plural(T.ganadas,"operación ganada","operaciones ganadas")):"todavía no ha ganado ninguna", 1)+
      met(IC.baja,"Cuando falla, pierde",
          T.pierdeUsd==null?"—":("−"+usdF(T.pierdeUsd).replace("-","")),"dn",
          T.perdidas?("promedio de "+plural(T.perdidas,"operación perdida","operaciones perdidas")):"todavía no ha perdido ninguna", 5)+
      met(IC.escudo,"Por cada $1 que pierde",
          T.factor==null?"—":(T.factor===Infinity?"∞":("gana "+usdF(T.factor))),
          T.factor>=1?"up":"dn",
          T.factor==null?"hacen falta operaciones cerradas"
            :(T.factor===Infinity?"todavía no ha perdido nada"
              :(T.factor>=1?"gana más de lo que pierde":"pierde más de lo que gana")), 3)+
      met(IC.banco,"Comisiones pagadas", usdF(T.comision), T.comision>0?"dn":"",
          (T.bruto>0 && T.comision>0)
            ? (T.comision>=T.bruto ? "se comieron toda la ganancia"
               : "de cada $100 que ganó, "+usdF(T.comision/T.bruto*100)+" fueron a comisiones")
            : "lo que le cobró la casa de cambio", 2)+
      met(IC.mov,"Sin cerrar todavía", T.nAb?('<span data-v="futTot" class="'+cl(T.flotante)+'">'+
          (T.flotante>=0?"+":"−")+usd(T.flotante).replace("-","")+'</span>'):"—","",
          T.nAb?(plural(T.nAb,"operación","operaciones")+" · esto gana o pierde si las cierra ahora"+
                 (T.enRiesgo?" · "+T.enRiesgo+" a punto de liquidar":""))
               :"nada abierto", 6)+

  /* ---- panel de registrar ---- */

      F.abiertas.map(function(e){ return filaAbierta(e,k); }).join("")+'</div></div>';
  }

  /* ---- disciplina ---- */
  if(T.conPlan||T.sinPlan) h+=cajaDisciplina(T);

  /* ---- largos contra cortos y curva ---- */
  if(T.n>=3){
    h+='<div class="inf">'+
      '<div class="caja"><h2><span class="ic">'+IC.diana+'</span>Largos contra cortos</h2>'+
      '<div class="cp mpg">'+["LONG","SHORT"].map(function(l){
        var d=T.lados[l];
        return '<div class="mp" style="--fc:'+(l==="LONG"?"var(--up)":"var(--dn)")+'">'+
          '<div class="mpt">'+(l==="LONG"?"▲ LARGOS":"▼ CORTOS")+'</div>'+
          '<div class="mpv '+cl(d.gan)+'">'+usdF(d.gan)+'</div>'+
          '<div class="mps">'+d.n+' ops · '+d.ganadas+' acertadas'+
          (d.aciertos!=null?" ("+d.aciertos.toFixed(0)+"%)":"")+'</div></div>';
      }).join("")+'</div>'+consejoFut(T)+'</div>'+
      '<div class="caja"><h2><span class="ic">'+IC.torta+'</span>Reparto</h2><div class="cp">'+
      rosca([{v:T.ganadas,color:"var(--up)",et:"Acertadas"},
             {v:T.perdidas,color:"var(--dn)",et:"Fallidas"},
             {v:T.neutras,color:"var(--t3)",et:"En tablas"}].filter(function(x){ return x.v>0; }),
            String(T.n), "cerradas")+'</div></div></div>';
    var acum=0;
    h+=curvaGanancia(F.cerradas.map(function(e){ acum+=e.gan; return {v:acum}; }),
      "Cómo fue creciendo");
  }

  /* ---- historial ---- */
  h+=tablaHistorial(F,k,T);

  c.innerHTML=h;
  engancharAmbito(c,A);
}

function consejoFut(T){
  var p=[];
  if(T.aciertos!=null) p.push('Acierta <b>'+T.aciertos.toFixed(0)+'%</b> ('+T.ganadas+' de '+
    T.decididas+').');
  if(T.porOperacion!=null) p.push('Cada operación le deja <b class="'+cl(T.porOperacion)+'">'+
    (T.porOperacion>=0?"+":"−")+usdF(T.porOperacion).replace("-","")+'</b> en promedio.');
  if(T.ganaUsd!=null&&T.pierdeUsd!=null&&T.pierdeUsd!==0){
    var r=Math.abs(T.ganaUsd/T.pierdeUsd);
    p.push('Cuando acierta gana '+usdF(T.ganaUsd)+' y cuando falla pierde '+
      usdF(T.pierdeUsd).replace("-","")+' — gana <b>'+r.toFixed(2).replace(".",",")+' veces</b> lo que pierde'+
      (r>=1.5?' (buena)':r>=1?' (justa)':' (arriesga más de lo que gana)')+'.');
  }
  var L=T.lados.LONG, S=T.lados.SHORT;
  if(L.n>=2&&S.n>=2&&L.aciertos!=null&&S.aciertos!=null){
    var d=L.aciertos-S.aciertos;
    if(Math.abs(d)>=15) p.push('Le va bastante mejor en <b>'+(d>0?"largos":"cortos")+'</b> ('+
      (d>0?L.aciertos:S.aciertos).toFixed(0)+'% contra '+
      (d>0?S.aciertos:L.aciertos).toFixed(0)+'%).');
  }
  if(T.racha>=3) p.push('Lleva <b>'+T.racha+'</b> seguidas '+(T.rachaGana?"ganando":"perdiendo")+'.');
  if(T.nLiq) p.push('<b class="dn">'+T.nLiq+'</b> '+(T.nLiq===1?"terminó":"terminaron")+' en liquidación.');
  return p.length?'<div class="cp" style="padding-top:0"><div class="fcalc">'+p.join(" ")+
    '</div></div>':"";
}

      (sg>=0?"+":"−")+usdF(sg).replace("-","")+'</span></td><td></td><td></td></tr></tfoot>';
  }
  h+='</table></div>'+
    (lista.length>ver.length
      ? '<div class="cp" style="text-align:center"><button class="b" id="fuMas">Ver '+
        Math.min(50,lista.length-ver.length)+' más</button></div>' : '')+
    '</div>';
  return h;
}

function montarGraf(A){
  var g=document.getElementById("fuGraf");
  if(!g||!FU.sym) { if(g) g.innerHTML=""; return; }
  MIRANDO=FU.sym;
  montarGrafica(g, {
    sym:FU.sym,
    lado:function(){ return FU.lado; },
    valores:function(){ return valoresFU(A); },
    alMover:function(campo, p){
      p=redondearPrecio(p);
      var ent=num(FU.entrada);
      if(campo==="entrada"){
        FU.entrada=paraCasilla(p);
        var E=document.getElementById("fuE"); if(E) E.value=FU.entrada;
      } else if(campo==="sl"){
        if(FU.slModo==="precio") FU.sl=paraCasilla(p);
        else if(ent>0){
          var d=Math.abs(ent-p)/ent*100;
          FU.sl = FU.slModo==="pp" ? paraCasilla(+d.toFixed(3))
                                   : paraCasilla(+(d*A.cfg.apal).toFixed(2));
        }
        var L=document.getElementById("fuSL"); if(L) L.value=FU.sl;
      } else if(campo==="tp"){
        FU.tp=paraCasilla(p);
        var T2=document.getElementById("fuTP"); if(T2) T2.value=FU.tp;
      }
      recLote(A);
    }
  });
}
/* al escribir en las casillas, las líneas de la gráfica se mueven solas */
function pintarLineas(A){
  if(GRAF && GRAF.cont && document.body.contains(GRAF.cont)) dibujar(GRAF);
}

function guardarOperacion(A){
  var c=A.cfg;
  var v=valoresFU(A);
  var sal=num(FU.salida);
  if(!FU.sym){ aviso("Elija la moneda.",true); return; }
  if(!(c.cartera>0)){ aviso("Escriba arriba cuánto es su cartera.",true); return; }
  if(v.entrada==null||v.entrada<=0){ aviso("Escriba el precio de entrada.",true); return; }
  if(v.sl==null||v.sl<=0){ aviso("Escriba el stop loss: de ahí sale el lote.",true); return; }
  var R=calcLote(c, v.entrada, v.sl, FU.lado, v.tp);
  if(!R.ok||!(R.margen>0)){ aviso("No se pudo calcular el lote. Revise la entrada y el stop.",true); return; }
  if(!R.ladoBien){
    aviso("El stop está del lado equivocado para un "+(FU.lado==="SHORT"?"CORTO":"LARGO")+
      ". Córrijalo antes de registrar.",true);
    return;
  }
  if(sal!=null&&sal<=0){ aviso("El precio de salida debe ser mayor que cero, o déjelo vacío.",true); return; }
  var lista=A.lista;
  var n=lista.reduce(function(m,x){ return Math.max(m,+x.n||0); },0)+1;
  var o={ id:idNuevo(), n:n, sym:String(FU.sym).toUpperCase(), lado:FU.lado,
    monto:+R.margen.toFixed(6), apal:R.apal, entrada:v.entrada,
    sl:v.sl, tp:(v.tp!=null&&v.tp>0)?v.tp:null,
    salida: sal!=null?sal:null, com:+R.com.toFixed(6),
    fecha:FU.fecha||hoy(), hora:horaYa(),
    cierre: sal!=null?hoy():"",
    nota:(FU.nota||"").trim(), estr:(FU.estr||"").trim(), animo:FU.animo,
    plan:Object.assign({},FU.plan),
    riesgo:R.riesgo, cartera:c.cartera,
    pct:null, estado: sal==null?"abierta":"cerrada", mod:Date.now() };
  A.nuevo(o);
  guardar();
  var dicho;
  if(sal==null) dicho="Operación abierta · metió "+usdF(R.margen)+", arriesga "+usdF(R.perdidaSL)+".";
  else {
    var st=estadoOp(o);
    dicho="Operación registrada · "+(st.gan>=0?"ganó ":"perdió ")+usdF(Math.abs(st.gan))+".";
  }
  limpiarFU(A.k);
  A.pinta(); repintarCabecera(); conectarVivo();
  aviso(dicho);
}

/* =====================================================================
   18b · LO QUE SE HACE SOLO CON EL PRECIO EN VIVO
   - Futuros y backtesting: cuando el precio toca el stop o el objetivo,
     la operación se cierra sola EN ESTE REGISTRO a ese precio.
   - Spot: una venta programada ("vende tanto cuando llegue a tanto")
     se registra sola cuando el precio llega.
   En los dos casos suena, avisa en pantalla y manda una notificación.
   (El programa no toca su cuenta de Binance: eso lo hace usted allá.)
   ===================================================================== */
function autoActivo(){ return BD.ajustes.autoCierre!==false; }

var VIG_ultimo=0;
function vigilarCierres(){
  if(!autoActivo()) return;
  if(Date.now()-VIG_ultimo<900) return;          /* con una vez por segundo basta */
  VIG_ultimo=Date.now();
  var hechas=[];

  /* --- futuros y pruebas --- */
  [["fut",BD.fut],["back",BD.back]].forEach(function(par){
    (par[1]||[]).forEach(function(f){
      if(f.estado!=="abierta"||!f.sym) return;
      var pr=precioDe(f.sym); if(pr==null) return;
      var sl=(f.sl!=null&&f.sl!=="")?+f.sl:null, tp=(f.tp!=null&&f.tp!=="")?+f.tp:null;
      var toco=null;
      if(f.lado==="SHORT"){
        if(sl&&pr>=sl) toco={p:sl,q:"stop"}; else if(tp&&pr<=tp) toco={p:tp,q:"objetivo"};
      } else {
        if(sl&&pr<=sl) toco={p:sl,q:"stop"}; else if(tp&&pr>=tp) toco={p:tp,q:"objetivo"};
      }
      if(!toco) return;
      f.salida=toco.p; f.estado="cerrada"; f.cierre=hoy(); f.pct=null;
      f.auto=toco.q; f.horaCierre=horaYa(); f.mod=Date.now();
      var st=estadoOp(f);
      hechas.push({tipo:par[0], texto:(par[0]==="back"?"[prueba] ":"")+f.sym+" op "+(f.n||"")+
        " tocó el "+toco.q+" en "+precio(toco.p)+" · "+(st.gan>=0?"ganó ":"perdió ")+
        usdF(Math.abs(st.gan)), bueno:st.gan>=0});
    });
  });

  /* --- ventas programadas de spot --- */
  (BD.ordenes||[]).slice().forEach(function(o){
    var pr=precioDe(o.sym); if(pr==null) return;
    var toca = o.dir==="baja" ? pr<=o.precio : pr>=o.precio;
    if(!toca) return;
    var e=estadoDe(o.sym);
    var c=Math.min(+o.cant||0, e.cantidad);
    anotarBorrado(o.id);
    BD.ordenes=BD.ordenes.filter(function(x){ return x.id!==o.id; });
    if(!(c>0)){
      hechas.push({tipo:"spot", texto:"La venta programada de "+o.sym+" no se hizo: ya no tenía monedas", bueno:false});
      return;
    }
    var prom=e.promedio||0;
    BD.ops.push({id:idNuevo(), sym:o.sym, tipo:"venta", cant:c, precio:o.precio, com:+o.com||0,
      fecha:hoy(), nota:"venta programada · se cumplió a las "+horaYa(),
      casa:BD.ajustes.casa||"BINANCE", auto:true, mod:Date.now()});
    var g=(o.precio-prom)*c-(+o.com||0);
    hechas.push({tipo:"spot", texto:"Se vendieron "+cant(c)+" "+o.sym+" a "+precio(o.precio)+
      " (venta programada) · "+(g>=0?"ganó ":"perdió ")+usd(Math.abs(g)), bueno:g>=0});
  });

  if(!hechas.length) return;
  guardar();
  sonar(hechas.some(function(h){ return !h.bueno; })?"malo":"bueno");
  var txt=hechas.map(function(h){ return h.texto; }).join(" · ");
  aviso("<b>Se hizo solo:</b> "+esc(txt), false);
  notificar("Portafolio Cripto", txt);
  try{ repintar(); }catch(e){}
  if(gitCfg().token) sincronizar(true);
}

/* --- un sonido corto, sin archivos --- */
var AUDIO=null;
function sonar(tipo){
  try{
    if(!AUDIO) AUDIO=new (window.AudioContext||window.webkitAudioContext)();
    var t=AUDIO.currentTime;
    var notas = tipo==="malo" ? [[440,0],[330,0.18]] : [[660,0],[880,0.14],[1100,0.28]];
    notas.forEach(function(n){
      var o=AUDIO.createOscillator(), g=AUDIO.createGain();
      o.type="sine"; o.frequency.value=n[0];
      g.gain.setValueAtTime(0.0001,t+n[1]);
      g.gain.exponentialRampToValueAtTime(0.25,t+n[1]+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+n[1]+0.16);
      o.connect(g); g.connect(AUDIO.destination);
      o.start(t+n[1]); o.stop(t+n[1]+0.2);
    });
  }catch(e){}
}
/* --- notificación del sistema (en el teléfono sale aunque la app esté atrás) --- */
function pedirPermisoAvisos(){
  try{
    if(!("Notification" in window)) return Promise.resolve(false);
    if(Notification.permission==="granted") return Promise.resolve(true);
    if(Notification.permission==="denied") return Promise.resolve(false);
    return Notification.requestPermission().then(function(p){ return p==="granted"; });
  }catch(e){ return Promise.resolve(false); }
}
function notificar(titulo, cuerpo){
  try{
    if(!("Notification" in window) || Notification.permission!=="granted") return;
    var op={body:cuerpo, tag:"cripto-"+Date.now(), icon:undefined};
    if(SW_REG && SW_REG.showNotification) SW_REG.showNotification(titulo, op);
    else new Notification(titulo, op);
  }catch(e){}
}

function alertaSuena(a){
  var p=precioDe(a.sym);
  if(p==null) return false;
  return a.dir==="sube" ? p>=a.precio : p<=a.precio;
}
function alertasQueSonaron(){
  var cambio=false;

    var son=alertaSuena(a);
    if(!son&&a.visto){ a.visto=0; a.mod=Date.now(); cambio=true; }
    return son&&!a.visto;
  });
  if(cambio){ try{ guardar(); }catch(e){} }

}

/* =====================================================================
   21 · SINCRONIZAR PC Y TELÉFONO  (igual que siempre, no se cambió nada)
   Los datos viven en un repositorio PRIVADO suyo de GitHub. Se juntan
   los cambios de los dos lados: de cada registro gana el más reciente,
   y lo que borró en un lado no vuelve a aparecer.
   ===================================================================== */
var SYNC={ ocupado:false, ultimo:null, error:"", auto:null, firma:"", sha:"" };
var RELOJ_avisado=false;

function firmaDatos(){
  try{
    return JSON.stringify({o:BD.ops, f:BD.fut, b:BD.back, p:BD.pruebas, a:BD.alertas, r:BD.ordenes,
      d:BD.borrados, m:preciosManuales(), n:BD.monedas,
      j:BD.ajustes&&BD.ajustes.mod, t:BD.tema});
  }catch(e){ return String(Date.now()); }
}
function limpiarBorrados(l){
  var por={};
  (l||[]).forEach(function(x){ if(x&&x.id) por[x.id]=Math.max(por[x.id]||0, +x.t||0); });
  return Object.keys(por).map(function(k){ return {id:k,t:por[k]}; })
    .sort(function(a,b){ return a.t-b.t; }).slice(-600);
}
function anotarBorrado(id){
  if(!id) return;
  BD.borrados=BD.borrados||[];
  BD.borrados.push({id:id, t:Date.now()});
  if(BD.borrados.length>900) BD.borrados=BD.borrados.slice(-600);
}
function gitCfg(){ return (BD.ajustes&&BD.ajustes.git)||{}; }

function gh(ruta, opciones){
  var g=gitCfg();
  if(!g.token) return Promise.reject(new Error("Falta la clave de GitHub"));
  var o=Object.assign({}, opciones||{});
  o.headers=Object.assign({
    "Authorization":"Bearer "+g.token,
    "Accept":"application/vnd.github+json",
    "X-GitHub-Api-Version":"2022-11-28"
  }, o.headers||{});
  return fetch("https://api.github.com"+ruta, o).then(function(r){
    try{
      var dd=r.headers.get("date");
      if(dd){
        var dif=Math.abs(new Date(dd).getTime()-Date.now());
        if(dif>5*60000 && !RELOJ_avisado){
          RELOJ_avisado=true;
          aviso("El reloj de este equipo está desfasado "+Math.round(dif/60000)+
            " "+pal(dif,"minuto","minutos")+" contra el de internet. Póngalo en hora: si no, al juntar los cambios "+
            "entre sus equipos puede ganar la versión equivocada.", true);
        }
      }
    }catch(e){}
    if(r.status===401){ var e1=new Error("La clave no sirve o se venció"); e1.codigo=401; throw e1; }
    if(r.status===403){ var e2=new Error("La clave no tiene permiso sobre repositorios"); e2.codigo=403; throw e2; }
    if(r.status===404) return {__falta:true};
    if(!r.ok) return r.text().then(function(){
      var e3=new Error(r.status===409?"los dos equipos escribieron a la vez"
                                     :("GitHub respondió "+r.status));
      e3.codigo=r.status; throw e3;
    });
    return r.json();
  });
}
function conectarGit(token){
  BD.ajustes.git=Object.assign(gitCfg(), {token:token});
  return gh("/user").then(function(u){
    if(u.__falta||!u.login) throw new Error("No se pudo leer su cuenta");
    BD.ajustes.git.user=u.login;
    var repo=gitCfg().repo||"portafolio-cripto";
    BD.ajustes.git.repo=repo;
    return gh("/repos/"+u.login+"/"+repo).then(function(r){
      if(!r.__falta) return r;
      return gh("/user/repos",{method:"POST",body:JSON.stringify({
        name:repo, private:true, auto_init:true,
        description:"Datos privados de mi portafolio cripto"})});
    });
  }).then(function(){
    guardar();
    return sincronizar(true);
  });
}
function bajarRemoto(){
  var g=gitCfg();
  return gh("/repos/"+g.user+"/"+g.repo+"/contents/portafolio.json").then(function(r){
    if(r.__falta) return {datos:null, sha:null};
    var txt;
    try{ txt=decodeURIComponent(escape(atob((r.content||"").replace(/\n/g,"")))); }
    catch(e){ txt=atob((r.content||"").replace(/\n/g,"")); }
    var d=null, roto=false;
    try{ d=JSON.parse(txt); }catch(e){ roto=true; }
    return {datos:d, sha:r.sha, roto:roto};
  });
}
function subirRemoto(sha){
  var g=gitCfg();
  var paquete={ops:BD.ops, fut:BD.fut, back:BD.back, pruebas:BD.pruebas, ordenes:BD.ordenes||[],
    alertas:BD.alertas, borrados:BD.borrados||[], manuales:preciosManuales(),
    monedas:BD.monedas, ajustes:sinClave(BD.ajustes), tema:BD.tema, sembrado:BD.sembrado,
    equipo:nombreEquipo(), version:VERSION, guardado:Date.now()};
  var txt=JSON.stringify(paquete,null,1);
  var b64;
  try{ b64=btoa(unescape(encodeURIComponent(txt))); }catch(e){ b64=btoa(txt); }
  var cuerpo={message:"portafolio · "+nombreEquipo()+" · "+ahora(), content:b64};
  if(sha) cuerpo.sha=sha;
  return gh("/repos/"+g.user+"/"+g.repo+"/contents/portafolio.json",
    {method:"PUT", body:JSON.stringify(cuerpo)});
}
function sinClave(a){
  var c=Object.assign({}, a||{});
  if(c.git) c.git=Object.assign({}, c.git, {token:""});   /* la clave NUNCA viaja */
  if(c.nube) c.nube=Object.assign({}, c.nube, {mRef:""});  /* ni el permiso de Microsoft */
  return c;
}
function nombreEquipo(){
  if(BD.ajustes.equipo) return BD.ajustes.equipo;
  var u=(navigator.userAgent||"");
  return /Android|iPhone|iPad|Mobile/i.test(u) ? "teléfono" : "computadora";
}
function juntar(local, remoto, borrados){
  var por={}, fuera={};
  (borrados||[]).forEach(function(b){ fuera[b.id]=Math.max(fuera[b.id]||0, b.t||0); });
  function meter(arr){
    (arr||[]).forEach(function(x){
      if(!x) return;
      if(!x.id) x.id="v_"+[x.tipo||x.lado||"", x.sym||"", x.fecha||"",
                           x.cant!=null?x.cant:x.monto, x.precio!=null?x.precio:x.entrada].join("_");
      var m=+x.mod||0;
      if(fuera[x.id]&&fuera[x.id]>=m) return;
      var y=por[x.id];
      if(!y||m>(+y.mod||0)) por[x.id]=x;
    });
  }
  meter(local); meter(remoto);
  return Object.keys(por).map(function(k){ return por[k]; });
}
function sincronizar(silencioso, reintento){
  var g=gitCfg();
  if(!g.token||!g.user){
    if(!silencioso) aviso("Primero conecte su cuenta de GitHub en Configuración.",true);
    return Promise.resolve();
  }
  if(SYNC.ocupado) return Promise.resolve();
  SYNC.ocupado=true; pintarSync("trabajando");
  return bajarRemoto().then(function(r){
    if(r.roto) throw new Error("el archivo del repositorio no se pudo leer; no se subió nada "+
      "para no pisar lo que tenga el otro equipo");
    var d=r.datos;
    if(d){
      var bor=limpiarBorrados((BD.borrados||[]).concat(d.borrados||[]));
      BD.ops=juntar(BD.ops, d.ops, bor);
      BD.fut=juntar(BD.fut, d.fut, bor);
      BD.back=juntar(BD.back, d.back, bor);
      BD.pruebas=juntar(BD.pruebas, d.pruebas, bor);
      BD.ordenes=juntar(BD.ordenes||[], d.ordenes, bor);
      BD.alertas=juntarAlertas(BD.alertas, d.alertas, bor);
      BD.borrados=bor;
      if(!BD.sembrado&&d.sembrado) BD.sembrado=d.sembrado;
      if(d.monedas) BD.monedas=Object.assign({}, d.monedas, BD.monedas);
      if(d.ajustes){
        var mio=+BD.ajustes.mod||0, suyo=+d.ajustes.mod||0;
        if(suyo>mio){
          var tk=BD.ajustes.git;
          BD.ajustes=Object.assign({}, d.ajustes, {git:tk});
          if(d.tema) BD.tema=d.tema;
          aplicarTema();
        }
      }
      if(d.manuales) Object.keys(d.manuales).forEach(function(x){
        var mio2=BD.precios[x], suyo2=d.manuales[x];
        if(!mio2||!mio2.mano||(+suyo2.t||0)>(+mio2.t||0))
          BD.precios[x]=Object.assign({}, suyo2, {mano:true});
      });
      BD.ops.sort(function(a,b){
        var fa=a.fecha||"", fb=b.fecha||"";
        if(fa!==fb) return fa<fb?-1:1;
        var ia=String(a.id||""), ib=String(b.id||"");
        return ia<ib?-1:(ia>ib?1:0);
      });
      /* si el otro equipo todavía tiene una versión vieja, se avisa UNA vez */
      if(d.version && +d.version < +VERSION && !BD.ajustes.avisadoVer){
        BD.ajustes.avisadoVer=1;
        aviso("Su otro equipo ("+esc(d.equipo||"el otro")+") todavía tiene la versión "+
          esc(String(d.version))+". Publíquele la "+VERSION+" desde Configuración antes de "+
          "usar el backtesting, o esa parte no le viajará.", true);
      }
    }
    if(silencioso && SYNC.firma && SYNC.firma===firmaDatos() && SYNC.sha && SYNC.sha===r.sha)
      return null;
    return subirRemoto(r.sha).then(function(res){
      SYNC.firma=firmaDatos();
      if(res&&res.content&&res.content.sha) SYNC.sha=res.content.sha;
      return res;
    });
  }).then(function(){
    SYNC.ocupado=false; SYNC.ultimo=Date.now(); SYNC.error="";
    guardar(); repintar();
    if(!silencioso) aviso("Sincronizado. Sus cambios están en todos sus equipos.");
  }).catch(function(e){
    SYNC.ocupado=false;
    if(e&&e.codigo===409&&!reintento) return sincronizar(silencioso,true);
    SYNC.error=String(e&&e.message||e);
    pintarSync("mal");
    if(!silencioso) aviso("No se pudo sincronizar: "+SYNC.error, true);
  });
}
function juntarAlertas(a,b,borrados){
  var fuera={}, por={}, r=[];
  (borrados||[]).forEach(function(x){ fuera[x.id]=Math.max(fuera[x.id]||0, x.t||0); });
  (a||[]).concat(b||[]).forEach(function(x){
    if(!x||!x.sym) return;
    if(!x.id) x.id="va_"+[x.sym,x.dir,x.precio].join("_");
    if(fuera[x.id]&&fuera[x.id]>=(+x.mod||0)) return;
    var y=por[x.id];
    if(!y||(+x.mod||0)>(+y.mod||0)) por[x.id]=x;
  });
  Object.keys(por).forEach(function(k){ r.push(por[k]); });
  return r;
}
function pintarSync(estado){
  var e=document.getElementById("sync"), t=document.getElementById("syncT");
  if(!e||!t) return;
  var g=gitCfg();
  if(!g.token){ e.style.display="none"; return; }
  e.style.display="";
  if(estado==="trabajando"){ e.className="syn"; t.textContent="sincronizando…"; return; }
  if(estado==="mal"||SYNC.error){ e.className="syn mal"; t.textContent="sin sincronizar"; return; }
  e.className="syn ok";
  t.textContent=SYNC.ultimo?("enviado "+hora(SYNC.ultimo)):"conectado";
}
function programarSync(){
  clearInterval(SYNC.auto);
  var g=gitCfg();
  if(!g.token||!BD.ajustes.gitAuto) return;
  SYNC.auto=setInterval(function(){ sincronizar(true); }, 90000);
}

/* =====================================================================
   22 · RESPALDO AUTOMÁTICO A UNA CARPETA DE ESTA COMPUTADORA
   ===================================================================== */
var RESP={handle:null, nombre:"", ok:"", permiso:false};
var RESP_ultimo=0, GESTO_pedido=false;
function haySoporteCarpeta(){ return typeof window.showDirectoryPicker==="function"; }
function permisoCarpeta(h,pedir){
  var o={mode:"readwrite"};
  if(!h||!h.queryPermission) return Promise.resolve(false);
  return h.queryPermission(o).then(function(p){
    if(p==="granted") return true;
    if(!pedir) return false;
    return h.requestPermission(o).then(function(q){ return q==="granted"; });
  }).catch(function(){ return false; });
}
function idbResp(op,val){
  return new Promise(function(res){
    try{
      var r=indexedDB.open("cripto-respaldo",1);
      r.onupgradeneeded=function(){ r.result.createObjectStore("h"); };
      r.onerror=function(){ res(null); };
      r.onsuccess=function(){
        var db=r.result, tx=db.transaction("h", op==="get"?"readonly":"readwrite");
        var st=tx.objectStore("h");
        var q = op==="get" ? st.get("carpeta") : st.put(val,"carpeta");
        q.onsuccess=function(){ res(op==="get"?q.result:true); };
        q.onerror=function(){ res(null); };
      };
    }catch(e){ res(null); }
  });
}
function elegirCarpetaRespaldo(){
  if(!haySoporteCarpeta()){
    aviso("Hace falta Chrome o Edge, y abrir el programa con ABRIR CRIPTO.",true); return;
  }
  var pedir;
  try{ pedir=window.showDirectoryPicker({mode:"readwrite"}); }
  catch(e){ aviso("No se pudo abrir el selector de carpeta.",true); return; }
  pedir.then(function(h){
    return permisoCarpeta(h,true).then(function(ok){ if(!ok) throw {name:"Sin"}; return h; });
  }).then(function(h){
    RESP.handle=h; RESP.nombre=h.name||"respaldos"; RESP.permiso=true;
    return idbResp("put",h);
  }).then(function(){
    aviso("Respaldo automático activado en "+RESP.nombre+".");
    if(vista==="dat") pintarDat();
    return respaldarAhora(true);
  }).catch(function(e){
    if(e&&e.name==="AbortError") return;
    aviso("No se pudo activar el respaldo.",true);
  });
}
function apagarRespaldo(){
  RESP.handle=null; RESP.nombre=""; RESP.ok=""; RESP.permiso=false;
  idbResp("put",null);
  if(vista==="dat") pintarDat();
  aviso("Respaldo automático apagado.");
}
function respaldarAhora(forzar){
  if(!RESP.handle) return Promise.resolve(false);
  var t=Date.now();
  if(!forzar&&(t-RESP_ultimo)<15000) return Promise.resolve(false);
  RESP_ultimo=t;
  if(typeof RESP.handle.getDirectoryHandle!=="function"){ RESP.handle=null; return Promise.resolve(false); }
  var txt=JSON.stringify(Object.assign({}, BD, {ajustes:sinClave(BD.ajustes), logos:{}, histTot:[]}));
  return RESP.handle.getDirectoryHandle("CRIPTO",{create:true})
    .then(function(dh){ return dh.getFileHandle(hoy()+".json",{create:true}); })
    .then(function(fh){ return fh.createWritable(); })
    .then(function(w){ return w.write(txt).then(function(){ return w.close(); }); })
    .then(function(){ RESP.ok=horaYa(); return true; })
    .catch(function(e){
      if(e&&e.name==="NotAllowedError"){
        RESP.permiso=false; pedirPermisoConGesto();
        aviso("El respaldo necesita permiso otra vez. Toque la pantalla.",true);
      } else aviso("No se pudo guardar el respaldo en la carpeta.",true);
      return false;
    });
}
function pedirPermisoConGesto(){
  if(GESTO_pedido) return;
  GESTO_pedido=true;
  var g=function(){
    document.removeEventListener("pointerdown",g,true);
    document.removeEventListener("keydown",g,true);
    GESTO_pedido=false;
    if(RESP.handle&&!RESP.permiso)
      permisoCarpeta(RESP.handle,true).then(function(ok){
        RESP.permiso=!!ok;
        if(ok) respaldarAhora(true); else { RESP.handle=null; RESP.nombre=""; }
        if(vista==="dat") pintarDat();
      });
  };
  document.addEventListener("pointerdown",g,true);
  document.addEventListener("keydown",g,true);
}
function reconectarRespaldo(){
  return idbResp("get").then(function(h){
    if(!h||typeof h.getDirectoryHandle!=="function") return false;
    RESP.handle=h; RESP.nombre=h.name||"respaldos";
    return permisoCarpeta(h,false).then(function(ok){
      RESP.permiso=!!ok;
      if(vista==="dat") pintarDat();
      if(!ok) pedirPermisoConGesto();
      return true;
    });
  }).catch(function(){ return false; });
}

   24 · EL PROGRAMA: versión, actualización sola del teléfono, publicar
   ===================================================================== */
var PROG={ remota:null, txt:null, buscando:false, ultima:0 };
var SW_REG=null;
function registrarAyudante(){
  if(location.protocol==="file:") return;
  if(!navigator.serviceWorker) return;
  var recargando=false;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(recargando) return; recargando=true; location.reload();
  });
  navigator.serviceWorker.register("sw.js").then(function(reg){
    SW_REG=reg;
    if(reg.waiting&&navigator.serviceWorker.controller) mostrarVersionNueva();
    reg.addEventListener("updatefound", function(){
      var n=reg.installing; if(!n) return;
      n.addEventListener("statechange", function(){
        if(n.state==="installed"&&navigator.serviceWorker.controller) mostrarVersionNueva();
      });
    });
    document.addEventListener("visibilitychange", function(){
      if(!document.hidden){ try{ reg.update(); }catch(e){} }
    });
    setInterval(function(){ try{ reg.update(); }catch(e){} }, 900000);
    try{ reg.update(); }catch(e){}
  }).catch(function(){});
}
function mostrarVersionNueva(txt){
  var e=document.getElementById("verNueva");
  if(!e) return;
  if(txt) document.getElementById("vnTxt").textContent=txt;
  e.className="on";
  document.getElementById("vnOk").onclick=function(){
    e.className="";
    if(SW_REG&&SW_REG.waiting) SW_REG.waiting.postMessage({tipo:"actualizar"});
    else location.reload();
  };
  document.getElementById("vnNo").onclick=function(){ e.className=""; };
}
function repoApp(){ return (BD.ajustes&&BD.ajustes.repoApp)||"cripto"; }
function textoDeGithub(r){
  var b=(r.content||"").replace(/\n/g,"");
  try{ return decodeURIComponent(escape(atob(b))); }catch(e){ return atob(b); }
}
function buscarVersionPrograma(silencioso){
  var g=gitCfg();
  if(!g.token||!g.user){
    if(!silencioso) aviso("Primero conecte su clave de GitHub.",true);
    return Promise.resolve(null);
  }
  if(PROG.buscando) return Promise.resolve(null);
  PROG.buscando=true;
  return gh("/repos/"+g.user+"/"+repoApp()+"/contents/CRIPTO.html").then(function(r){
    PROG.buscando=false;
    if(r.__falta) throw new Error("no hay un CRIPTO.html en el repositorio "+repoApp());
    var txt=textoDeGithub(r);
    var m=txt.match(/var VERSION="([^"]+)"/);
    PROG.remota=m?m[1]:"?";
    PROG.txt=txt; PROG.ultima=Date.now();
    var hayNueva=(+PROG.remota > +VERSION);
    if(!silencioso){
      aviso(hayNueva
        ? ("Hay la versión "+PROG.remota+" publicada. Usted tiene la "+VERSION+".")
        : ("Está al día: publicada la "+PROG.remota+", aquí la "+VERSION+"."));
      if(vista==="dat") pintarDat();
    } else if(hayNueva&&location.protocol==="file:"){
      mostrarVersionNueva("Hay publicada la versión "+PROG.remota+" (usted tiene la "+VERSION+")");
      var ok=document.getElementById("vnOk");
      ok.textContent="Descargarla";
      ok.onclick=function(){
        document.getElementById("verNueva").className="";
        descargarPrograma();
      };
    }
    return PROG.remota;
  }).catch(function(e){
    PROG.buscando=false;
    if(!silencioso) aviso("No se pudo consultar: "+(e.message||e),true);
    return null;
  });
}
function descargarPrograma(){
  if(!PROG.txt){ aviso("Primero pulse Buscar versión nueva.",true); return; }
  bajarArchivo("CRIPTO.html", PROG.txt, "text/html;charset=utf-8");
  aviso("Descargado. Reemplace con él el CRIPTO.html de su carpeta y vuelva a abrir el programa.");
}
function leerTexto(f){
  return new Promise(function(ok,mal){
    var fr=new FileReader();
    fr.onload=function(){ ok(fr.result); };
    fr.onerror=function(){ mal(new Error("no se pudo leer "+f.name)); };
    fr.readAsText(f);
  });
}
function leerBase64(f){
  return new Promise(function(ok,mal){
    var fr=new FileReader();
    fr.onload=function(){ ok(String(fr.result).split(",")[1]||""); };
    fr.onerror=function(){ mal(new Error("no se pudo leer "+f.name)); };
    fr.readAsDataURL(f);
  });
}
function pareceDatos(txt){
  var t=String(txt||"").replace(/^﻿/,"").trim();
  if(t.charAt(0)!=="{"&&t.charAt(0)!=="[") return false;
  try{
    var d=JSON.parse(t);
    if(!d||typeof d!=="object") return false;
    if(Array.isArray(d.ops)||Array.isArray(d.fut)||Array.isArray(d.back)||d.ajustes||d.borrados)
      return true;
  }catch(e){}
  return false;
}
function publicarPrograma(archivos){
  var g=gitCfg(), repo=repoApp();
  if(!g.token||!g.user){ aviso("Primero conecte su clave de GitHub.",true); return; }
  var lista=[].slice.call(archivos||[]);
  if(!lista.length) return;
  var malos=lista.filter(function(f){ return !/\.(html|js|webmanifest|css|png|svg)$/i.test(f.name); });
  if(malos.length){
    aviso("Aquí solo se publica el programa (CRIPTO.html, sw.js, manifest.webmanifest y los iconos). \""+
      esc(malos[0].name)+"\" no se sube: este repositorio es público y sus datos no pueden ir ahí.",
      true);
    return;
  }
  aviso("Publicando "+plural(lista.length,"archivo","archivos")+" en "+repo+"…");
  var i=0, ok=[], err=[];
  function siguiente(){
    if(i>=lista.length){
      if(err.length) aviso("Publicados "+ok.length+" · falló "+err.join(" · "),true);
      else aviso("Publicado: "+ok.join(", ")+". El teléfono lo toma solo la próxima vez que "+
        "lo abra con internet.");
      PROG.remota=null; PROG.txt=null;
      BD.ajustes.avisadoVer=0; guardar();
      if(vista==="dat") pintarDat();
      return;
    }
    var f=lista[i++];
    var esImagen=/\.(png|svg)$/i.test(f.name);
    (esImagen?leerBase64(f):leerTexto(f)).then(function(txt){
      if(!esImagen && pareceDatos(txt)) throw new Error("parece una copia de sus datos, no el programa");
      var ruta="/repos/"+g.user+"/"+repo+"/contents/"+encodeURIComponent(f.name);
      return gh(ruta).then(function(r){
        var b64;
        if(esImagen) b64=txt;
        else { try{ b64=btoa(unescape(encodeURIComponent(txt))); }catch(e){ b64=btoa(txt); } }
        var cuerpo={message:"programa · "+f.name+" · "+ahora(), content:b64};
        if(!r.__falta&&r.sha) cuerpo.sha=r.sha;
        return gh(ruta,{method:"PUT", body:JSON.stringify(cuerpo)});
      });
    }).then(function(){ ok.push(f.name); siguiente(); })
      .catch(function(e){ err.push(f.name+" ("+(e.message||e)+")"); siguiente(); });
  }
  siguiente();
}

function nubeCfg(){

    s.onerror=function(){ mal(new Error("No se pudo cargar Google. Revise su internet.")); };
    if(!y) document.head.appendChild(s);

function googleListo(){
  var c=nubeCfg();
  if(!c.gId) return Promise.reject(new Error("Falta pegar la clave de aplicación de Google."));
  if(!nubeHttps()) return Promise.reject(new Error("FILE"));
  return cargarScript("https://accounts.google.com/gsi/client").then(function(){
    if(!(window.google&&google.accounts&&google.accounts.oauth2))
      throw new Error("Google no respondió. Revise su internet.");
    if(!NUBE.g.cli||NUBE.g.cli._id!==c.gId){
      NUBE.g.cli=google.accounts.oauth2.initTokenClient({
        client_id:c.gId, scope:G_ALCANCE, callback:function(){}
      });
      NUBE.g.cli._id=c.gId;
    }
    return NUBE.g.cli;
  });
}
function googleToken(pedirle){
  if(NUBE.g.tok&&Date.now()<NUBE.g.exp-60000) return Promise.resolve(NUBE.g.tok);
  return googleListo().then(function(cli){
    return new Promise(function(ok,mal){
      var fin=false;
      cli.callback=function(r){
        if(fin) return; fin=true;
        if(r&&r.access_token){
          NUBE.g.tok=r.access_token;
          NUBE.g.exp=Date.now()+((+r.expires_in||3600)*1000);
          ok(NUBE.g.tok);
        } else mal(new Error((r&&(r.error_description||r.error))||"Google no entregó el permiso."));
      };
      cli.error_callback=function(e){
        if(fin) return; fin=true;
        var t=(e&&e.type)||"";
        if(t==="popup_closed") return mal(new Error("Se cerró la ventana de Google sin terminar."));
        if(t==="popup_failed_to_open")
          return mal(new Error("El navegador bloqueó la ventana de Google. Permita las ventanas emergentes de esta página."));
        mal(new Error("CALLADO"));
      };
      try{ cli.requestAccessToken({prompt: pedirle?"consent":""}); }
      catch(e){ if(!fin){ fin=true; mal(e); } }
      setTimeout(function(){ if(!fin){ fin=true; mal(new Error("Google no respondió a tiempo.")); } },150000);
    });
  });
}
function gApi(url,op,reintento){
  return googleToken(false).then(function(tok){
    var o=Object.assign({},op||{});
    o.headers=Object.assign({},o.headers||{},{Authorization:"Bearer "+tok});
    return fetch(url,o);
  }).then(function(r){
    if(r.status===401&&!reintento){ NUBE.g.tok=""; NUBE.g.exp=0; return gApi(url,op,true); }
    if(!r.ok) return r.text().then(function(t){ var e=new Error(nubeMsg(r.status,t,"Google Drive")); e.cod=r.status; throw e; });
    return r;
  });
}
function carpetaGoogle(){
  var c=nubeCfg();
  if(c.gCarp) return Promise.resolve(c.gCarp);
  var q="mimeType='application/vnd.google-apps.folder' and name='"+NUBE_CARPETA+"' and trashed=false";
  return gApi("https://www.googleapis.com/drive/v3/files?q="+encodeURIComponent(q)+"&fields=files(id)&pageSize=1")
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(j.files&&j.files.length){ c.gCarp=j.files[0].id; return c.gCarp; }
      return gApi("https://www.googleapis.com/drive/v3/files?fields=id",{
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({name:NUBE_CARPETA,mimeType:"application/vnd.google-apps.folder"})

function ponerGoogle(nombre,texto,id,carpeta){
  var lim="limiteCripto"+Date.now();
  var meta={name:nombre};
  if(!id&&carpeta) meta.parents=[carpeta];
  var cuerpo="--"+lim+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+
    JSON.stringify(meta)+"\r\n--"+lim+
    "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+texto+"\r\n--"+lim+"--";
  return gApi("https://www.googleapis.com/upload/drive/v3/files"+(id?("/"+id):"")+
      "?uploadType=multipart&fields=id,name",
    {method:id?"PATCH":"POST",
     headers:{"Content-Type":"multipart/related; boundary="+lim}, body:cuerpo})
    .then(function(r){ return r.json(); });
}

/* =====================================================================
   ONEDRIVE (cuenta de Outlook / Hotmail / Live)
   ===================================================================== */
function msRedir(){ return location.origin+location.pathname; }
function b64url(buf){
  var b=new Uint8Array(buf), s="";
  for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]);
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function azarTexto(n){
  var a=new Uint8Array(n);
  (window.crypto||window.msCrypto).getRandomValues(a);
  return b64url(a.buffer);
}
function retoDe(v){
  return crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)).then(b64url);
}
/* cuando Microsoft devuelve la ventanita a esta misma página */
function atenderRegresoMS(){
  var h=location.hash||"";
  if(h.indexOf("code=")<0&&h.indexOf("error=")<0) return false;
  var p;
  try{ p=new URLSearchParams(h.replace(/^#/,"")); }catch(e){ return false; }
  if(!p.get("state")) return false;
  var d={tipo:"ms-oauth",code:p.get("code"),state:p.get("state"),
         error:p.get("error"),error_description:p.get("error_description")};
  try{
    if(window.opener&&window.opener!==window){
      window.opener.postMessage(d,location.origin);
      document.title="Listo";
      document.body.innerHTML='<p style="font:16px system-ui;padding:30px;color:#222">'+
        'Listo. Ya puede cerrar esta ventana.</p>';
      setTimeout(function(){ try{ window.close(); }catch(e){} },500);
      return true;
    }
  }catch(e){}
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  return false;
}
function vincularMicrosoft(){
  var c=nubeCfg();
  NUBE.m.error=""; NUBE.m.ocupado=true; pintarNube();
  if(!c.mId){ NUBE.m.ocupado=false;
    NUBE.m.error="Falta pegar la clave de aplicación de Microsoft."; pintarNube();
    aviso(NUBE.m.error,true); return Promise.resolve(false); }
  if(!nubeHttps()){ NUBE.m.ocupado=false;
    NUBE.m.error="Para vincular OneDrive abra el programa desde su dirección de internet ("+
      nubeDireccion()+"); desde el archivo del disco Microsoft no lo permite.";
    pintarNube(); aviso(NUBE.m.error,true); return Promise.resolve(false); }
  var ver=azarTexto(48), est=azarTexto(16);
  return retoDe(ver).then(function(ch){
    var u="https://login.microsoftonline.com/common/oauth2/v2.0/authorize"+
      "?client_id="+encodeURIComponent(c.mId)+"&response_type=code"+
      "&redirect_uri="+encodeURIComponent(msRedir())+"&response_mode=fragment"+
      "&scope="+encodeURIComponent(M_ALCANCE)+
      "&code_challenge="+ch+"&code_challenge_method=S256&state="+est+"&prompt=select_account";
    return new Promise(function(ok,mal){
      var w=window.open(u,"nubeMS","width=540,height=680");
      if(!w) return mal(new Error("El navegador bloqueó la ventana de Microsoft. Permita las ventanas emergentes de esta página."));
      var fin=false, rel=null;
      function alMensaje(ev){
        if(ev.origin!==location.origin||!ev.data||ev.data.tipo!=="ms-oauth") return;
        if(ev.data.state!==est) return;
        fin=true; window.removeEventListener("message",alMensaje); clearInterval(rel);
        try{ w.close(); }catch(e){}
        if(ev.data.error) return mal(new Error(ev.data.error_description||ev.data.error));
        ok(canjearMicrosoft(ev.data.code,ver));
      }
      window.addEventListener("message",alMensaje);
      rel=setInterval(function(){
        if(fin) return clearInterval(rel);
        if(w.closed){ clearInterval(rel); window.removeEventListener("message",alMensaje);
          mal(new Error("Se cerró la ventana de Microsoft sin terminar.")); }
      },700);
    });
  }).then(function(){
    return correoMicrosoft();
  }).then(function(correo){
    c.mVin=true; if(correo) c.mCorreo=correo;
    NUBE.m.ocupado=false; guardar(); programarNube(); pintarNube();
    aviso("Vinculado con OneDrive"+(correo?(" · "+correo):"")+". Subiendo su portafolio…");
    return guardarOneDrive(true);
  }).catch(function(e){
    NUBE.m.ocupado=false;
    NUBE.m.error=(e&&e.message)||"No se pudo vincular.";
    pintarNube(); aviso(NUBE.m.error,true); return false;
  });
}
function guardarTokenMS(j){
  NUBE.m.tok=j.access_token;
  NUBE.m.exp=Date.now()+((+j.expires_in||3600)*1000);
  var c=nubeCfg();
  if(j.refresh_token) c.mRef=j.refresh_token;
  return NUBE.m.tok;
}
function pedirTokenMS(cuerpo){
  return fetch("https://login.microsoftonline.com/common/oauth2/v2.0/token",
    {method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:cuerpo.toString()})
    .then(function(r){ return r.json().then(function(j){
      if(!r.ok) throw new Error(j.error_description||j.error||"Microsoft rechazó el permiso.");
      return j; }); })
    .then(guardarTokenMS);
}
function canjearMicrosoft(code,ver){
  var c=nubeCfg(), b=new URLSearchParams();
  b.set("client_id",c.mId); b.set("grant_type","authorization_code");
  b.set("code",code); b.set("redirect_uri",msRedir());
  b.set("code_verifier",ver); b.set("scope",M_ALCANCE);
  return pedirTokenMS(b);
}
function tokenMicrosoft(){
  if(NUBE.m.tok&&Date.now()<NUBE.m.exp-60000) return Promise.resolve(NUBE.m.tok);
  var c=nubeCfg();
  if(!c.mRef) return Promise.reject(new Error("Microsoft pide confirmar la cuenta otra vez: pulse «Vincular con Outlook»."));
  var b=new URLSearchParams();
  b.set("client_id",c.mId); b.set("grant_type","refresh_token");
  b.set("refresh_token",c.mRef); b.set("scope",M_ALCANCE);
  return pedirTokenMS(b);
}

          c:TARJETAS_FABRICA.slice(), fz:15, rad:14};

/* ---------- color: las cuentas ---------- */
function hexRgb(h){
  h=String(h||"").replace("#","");
  if(h.length===3) h=h.split("").map(function(x){ return x+x; }).join("");
  var n=parseInt(h,16);
  if(isNaN(n)||h.length!==6) return null;
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function rgbHex(r){
  return "#"+r.map(function(x){ x=Math.max(0,Math.min(255,Math.round(x)));
    return ("0"+x.toString(16)).slice(-2); }).join("");
}
function mezclar(a,b,t){
  var A=hexRgb(a)||[0,0,0], B=hexRgb(b)||[255,255,255];
  return rgbHex([A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t]);
}
function aclarar(hex,k){ return mezclar(hex,"#ffffff",k); }
function oscurecer(hex,k){ return mezclar(hex,"#000000",k); }
function luminancia(hex){
  var r=hexRgb(hex); if(!r) return 0;
  var v=r.map(function(c){ c/=255; return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4); });
  return 0.2126*v[0]+0.7152*v[1]+0.0722*v[2];
}
function contraste(a,b){
  var la=luminancia(a), lb=luminancia(b);
  var hi=Math.max(la,lb), lo=Math.min(la,lb);
  return (hi+0.05)/(lo+0.05);
}
/* acerca una letra al blanco o al negro hasta que se lea bien sobre ese fondo */
function legible(fg,bg,minimo,meta){
  /* meta: hacia dónde se corre el color (blanco en temas oscuros, negro en claros) */
  if(!meta) meta = luminancia(bg)<0.4 ? "#FFFFFF" : "#000000";
  var c=fg, i=0;
  while(contraste(c,bg)<minimo && i<20){ c=mezclar(c,meta,0.12); i++; }
  return c;
}
/* la tinta (letra) que mejor se lee ENCIMA de un color: la que más contraste da */
function tintaPara(c){
  if(String(c).indexOf("hsl")===0) return "#0A0E17";
  return contraste(c,"#0A0E17")>=contraste(c,"#FFFFFF") ? "#0A0E17" : "#FFFFFF";
}
/* del tema viejo (tono, saturación, claridad) al nuevo (un color de fondo) */
function normalizarTema(t){
  t=t||{};
  if(!t.bg){
    var h=(t.h!=null?+t.h:218), s=(t.s!=null?+t.s:16)/100, l=(t.L!=null?+t.L:7)/100;
    l=Math.max(0.03,Math.min(0.97,l+0.03));
    var C=(1-Math.abs(2*l-1))*s, X=C*(1-Math.abs((h/60)%2-1)), m=l-C/2, r=0,g=0,b=0;
    if(h<60){r=C;g=X;}else if(h<120){r=X;g=C;}else if(h<180){g=C;b=X;}
    else if(h<240){g=X;b=C;}else if(h<300){r=X;b=C;}else{r=C;b=X;}
    t.bg=rgbHex([(r+m)*255,(g+m)*255,(b+m)*255]);
  }
  if(!hexRgb(t.bg)) t.bg="#0E1420";
  if(!hexRgb(t.ac)) t.ac="#10E0A0";
  if(!hexRgb(t.up)) t.up="#16D98A";
  if(!hexRgb(t.dn)) t.dn="#FF4D6A";
  if(!Array.isArray(t.c)||t.c.length<6) t.c=TARJETAS_FABRICA.slice();
  t.c=t.c.map(function(x,i){ return hexRgb(x)?x:TARJETAS_FABRICA[i]; });
  t.fz=Math.max(12,Math.min(20,+t.fz||15));
  t.rad=Math.max(0,Math.min(26,t.rad!=null?+t.rad:14));
  return t;
}
function aplicarTema(){
  var t=BD.tema=normalizarTema(BD.tema);
  var R=document.documentElement.style;
  var bg=t.bg;
  /* las letras SIEMPRE se leen: se escoge la que más contraste da contra el fondo
     y, si el fondo elegido es un gris a medias donde nada se lee, se corre un poco
     hacia el lado contrario hasta que el texto respire */
  var tx = contraste("#F2F6FC",bg)>=contraste("#0E1420",bg) ? "#F2F6FC" : "#0E1420";
  var oscuro = (tx==="#F2F6FC"), k=0;
  while(contraste(tx,bg)<7 && k<30){ bg=mezclar(bg, oscuro?"#000000":"#FFFFFF", 0.08); k++; }
  var b1=bg;
  var b0=oscuro?oscurecer(bg,0.38):oscurecer(bg,0.05);
  var b2=oscuro?aclarar(bg,0.055):oscurecer(bg,0.05);
  var b3=oscuro?aclarar(bg,0.11):oscurecer(bg,0.10);
  var ln=oscuro?aclarar(bg,0.17):oscurecer(bg,0.16);
  /* la superficie "peor": la más parecida a la letra (cápsulas, menú marcado, fichas);
     todo texto de color se comprueba contra ella para que se lea en cualquier parte */
  var peor=oscuro?aclarar(bg,0.22):oscurecer(bg,0.26);
  var hacia=oscuro?"#FFFFFF":"#000000";
  var t2=legible(mezclar(tx,bg,0.24), peor, 6.0, hacia);
  var t3=legible(mezclar(tx,bg,0.40), peor, 4.6, hacia);
  /* los colores de acento: una versión para FONDOS (botones, cápsulas) y otra para TEXTO */
  var ac=legible(t.ac, b1, 2.2), up=legible(t.up, b1, 2.2), dn=legible(t.dn, b1, 2.2);
  /* para TEXTO el color se suaviza un poco (un neón puro sobre fondo oscuro "vibra" y parece borroso) */
  var acTx=legible(mezclar(t.ac,hacia,0.14), peor, 4.6, hacia),
      upTx=legible(mezclar(t.up,hacia,0.14), peor, 4.6, hacia),
      dnTx=legible(mezclar(t.dn,hacia,0.14), peor, 4.6, hacia);
  R.setProperty("--b0",b0); R.setProperty("--b1",b1); R.setProperty("--b2",b2);
  R.setProperty("--b3",b3); R.setProperty("--ln",ln);
  R.setProperty("--tx",tx); R.setProperty("--t2",t2); R.setProperty("--t3",t3);
  R.setProperty("--ac",ac); R.setProperty("--ac2",legible(aclarar(ac,0.35),peor,4.6,hacia)); R.setProperty("--acInk",tintaPara(ac));
  R.setProperty("--acTx",acTx);
  R.setProperty("--ojoTx",legible("#FFBE7B",peor,4.6,hacia));
  R.setProperty("--up",up); R.setProperty("--dn",dn);
  R.setProperty("--upTx",upTx); R.setProperty("--dnTx",dnTx);
  R.setProperty("--upInk",tintaPara(up)); R.setProperty("--dnInk",tintaPara(dn));
  t.c.forEach(function(c,i){
    var cc=legible(c,b1,2.4);
    R.setProperty("--c"+(i+1), cc);
    R.setProperty("--c"+(i+1)+"Ink", tintaPara(cc));
    R.setProperty("--c"+(i+1)+"Tx", legible(mezclar(c,hacia,0.14),peor,4.6,hacia));
  });
  R.setProperty("--fz",t.fz+"px");
  R.setProperty("--rad",t.rad+"px");
  R.setProperty("--maOp",((BD.ajustes&&BD.ajustes.marcaOp!=null?BD.ajustes.marcaOp:5)/100));
  document.documentElement.classList.toggle("claro",!oscuro);
  var m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content",b0);
}

/* =====================================================================
   INSTALAR · que quede UNA sola aplicación, sin archivos sueltos
   ===================================================================== */
var INSTALAR={evento:null};
/* El programa es UN SOLO ARCHIVO. Desde el disco no hace falta nada más.
   Solo cuando corre desde internet se engancha el manifiesto, que es lo que
   le permite al teléfono (y a Chrome en la PC) instalarlo como aplicación. */
function engancharManifiesto(){
  if(location.protocol!=="http:"&&location.protocol!=="https:") return;
  if(document.querySelector('link[rel="manifest"]')) return;
  var l=document.createElement("link");
  l.rel="manifest"; l.href="manifest.webmanifest";
  document.head.appendChild(l);
}
function prepararInstalar(){
  engancharManifiesto();
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault(); INSTALAR.evento=e;
    if(typeof vista!=="undefined"&&vista==="dat") pintarDat();
  });
  window.addEventListener("appinstalled", function(){
    INSTALAR.evento=null;
    aviso("Listo. El programa quedó instalado como aplicación, con su icono.");
    if(typeof vista!=="undefined"&&vista==="dat") pintarDat();
  });
}
function yaInstalado(){
  try{
    return (window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||
           navigator.standalone===true;
  }catch(e){ return false; }
}
function instalarApp(){
  if(INSTALAR.evento){
    var e=INSTALAR.evento; INSTALAR.evento=null;
    e.prompt();
    try{ e.userChoice.then(function(r){
      if(!r||r.outcome!=="accepted") aviso("No se instaló. Puede volver a intentarlo cuando quiera.");
    }); }catch(x){}
    return;
  }
  abrir('<div class="hoja"><div class="hh"><h3>Instalar como una sola aplicación</h3>'+
    '<button class="x" data-cerrar>×</button></div><div class="hb">'+
    '<div style="font-size:14px;line-height:1.8">'+
    (location.protocol==="file:"
      ? ('Esta ventana está abierta desde un <b>archivo del disco</b>, y así no se puede instalar. '+
         'Abra en Chrome o Edge su dirección de internet:<br><br>'+
         '<b class="mono" style="word-break:break-all">'+esc(nubeDireccion())+'</b><br><br>'+
         'y desde ahí vuelva a pulsar «Instalar». Queda como un programa normal, con su icono, '+
         'su propia ventana y sin barra de direcciones — y ya no necesita ningún archivo suelto '+
         'ni el lanzador.')
      : ('<b>En la computadora (Chrome o Edge):</b> pulse el icono de instalar que sale al final de '+
         'la barra de direcciones, o el menú <b>⋮ → Instalar Portafolio Cripto</b>.<br><br>'+
         '<b>En Android (Chrome):</b> menú <b>⋮ → Instalar aplicación</b> o '+
         '<b>Añadir a pantalla de inicio</b>.<br><br>'+
         '<b>En iPhone (Safari):</b> el botón de compartir y <b>Añadir a pantalla de inicio</b>.'))+
    '</div></div><div class="hf"><button class="b ac" data-cerrar>Entendido</button></div></div>');
}

function engancharDat(box){
  var x;
  var nb=box.querySelector("#nubeCaja"); if(nb) engancharNube(nb);
  var ic=box.querySelector("#idiCaja"); if(ic) engancharIdioma(ic);
  var bi=box.querySelector("#pInst"); if(bi) bi.onclick=instalarApp;
  /* --- tema --- */
  box.querySelectorAll("[data-tema]").forEach(function(b){
    b.onclick=function(){
      var t=TEMAS[+b.getAttribute("data-tema")];
      BD.tema=Object.assign({}, BD.tema, {bg:t.bg, ac:t.ac});
      aplicarTema(); guardar(); pintarDat();
    };
  });
  function colorVivo(id,campo){
    var el=box.querySelector(id); if(!el) return;
    el.addEventListener("input", function(){ BD.tema[campo]=el.value; aplicarTema(); guardar(); });
  }
  colorVivo("#tBg","bg"); colorVivo("#tAc","ac"); colorVivo("#tUp","up"); colorVivo("#tDn","dn");
  box.querySelectorAll("[data-tc]").forEach(function(el){
    el.addEventListener("input", function(){
      BD.tema.c[+el.getAttribute("data-tc")]=el.value; aplicarTema(); guardar();
    });
  });
  function rango(id,campo,suf,et){
    var el=box.querySelector(id); if(!el) return;
    el.addEventListener("input", function(){
      BD.tema[campo]=+el.value;
      var e=box.querySelector(et); if(e) e.textContent=el.value+suf;
      aplicarTema(); guardar();
    });
  }
  rango("#tF","fz"," px","#tFv"); rango("#tR","rad"," px","#tRv");
  if((x=box.querySelector("#tReset"))) x.onclick=function(){
    BD.tema=temaFabrica();
    aplicarTema(); guardar(); pintarDat(); aviso("Colores de fábrica.");
  };
  /* --- marca --- */
  if((x=box.querySelector("#mkOn"))) x.onchange=function(){
    BD.ajustes.marca=this.value==="1"; guardar(); programarMarca();
  };
  if((x=box.querySelector("#mkCada"))) x.onchange=function(){
    BD.ajustes.marcaCada=+this.value; guardar(); programarMarca();
  };
  if((x=box.querySelector("#mkOp"))) x.addEventListener("input", function(){
    BD.ajustes.marcaOp=+this.value;
    var e=box.querySelector("#mkOv"); if(e) e.textContent=this.value+"%";
    document.documentElement.style.setProperty("--maOp",(this.value/100));
    guardar();
  });
  /* --- precios --- */
  if((x=box.querySelector("#aAuto"))) x.onchange=function(){
    BD.ajustes.auto=this.value==="1"; guardar(); programarPrecios();
    aviso(BD.ajustes.auto?"Se pedirán también cada tanto.":"Solo cuando usted pulse.");
  };
  if((x=box.querySelector("#aCada"))) x.onchange=function(){
    BD.ajustes.cada=+this.value; guardar(); programarPrecios(); aviso("Listo.");
  };
  if((x=box.querySelector("#aCasa"))) x.onchange=function(){ BD.ajustes.casa=this.value; guardar(); };
  if((x=box.querySelector("#aNombre"))) x.addEventListener("change", function(){
    BD.ajustes.nombre=this.value.trim(); guardar();
    aviso(BD.ajustes.nombre?("Los papeles saldrán a nombre de "+BD.ajustes.nombre+"."):"Nombre quitado.");
  });
  if((x=box.querySelector("#aMeta"))) x.addEventListener("change", function(){
    var v=num(this.value);
    BD.ajustes.meta=(v!=null&&v>0)?v:0; guardar();
    aviso(BD.ajustes.meta?("Meta puesta en "+usd(BD.ajustes.meta)+"."):"Meta quitada.");
  });
  /* --- programa --- */
  var pgR=box.querySelector("#pgRepo");
  if(pgR) pgR.addEventListener("change", function(){
    BD.ajustes.repoApp=pgR.value.trim()||"cripto";

function bajarArchivo(nom, txt, tipo){
  var b=new Blob([txt],{type:tipo||"application/json"}), u=URL.createObjectURL(b),
      a=document.createElement("a");
  a.href=u; a.download=nom; document.body.appendChild(a); a.click();
  setTimeout(function(){ try{ URL.revokeObjectURL(u); a.remove(); }catch(e){} },400);
}
function numEs(n,dec){
  if(n==null||isNaN(n)||!isFinite(n)) return "";
  return (+n).toFixed(dec==null?2:dec).replace(".",",");
}
function descargarCopia(){
  var c=Object.assign({}, BD, {ajustes:sinClave(BD.ajustes), logos:{}, histTot:[]});
  bajarArchivo("portafolio-"+hoy()+".json", JSON.stringify(c,null,1));
  aviso("Copia descargada. No lleva su clave de GitHub.");
}
/* manda la copia por el menú de compartir del teléfono (Drive, Gmail, WhatsApp…) */
function compartirCopia(){
  var c=Object.assign({}, BD, {ajustes:sinClave(BD.ajustes), logos:{}, histTot:[]});
  var txt=JSON.stringify(c,null,1), nombre="portafolio-"+hoy()+".json";
  var puede=false, archivo=null;
  try{
    archivo=new File([txt], nombre, {type:"application/json"});
    puede=!!(navigator.canShare && navigator.share && navigator.canShare({files:[archivo]}));
  }catch(e){ puede=false; }
  if(!puede){
    bajarArchivo(nombre, txt);
    aviso("Este navegador no tiene el menú de compartir: la copia se descargó. Guárdela en su "+
      "carpeta de Google Drive u OneDrive y queda en la nube.");
    return;
  }
  navigator.share({files:[archivo], title:"Copia del portafolio cripto",
    text:"Copia de mis registros · "+hoy()}).then(function(){
    aviso("Copia enviada.");
  }).catch(function(e){
    if(e && e.name==="AbortError") return;
    bajarArchivo(nombre, txt);
    aviso("No se pudo compartir; la copia se descargó.", true);
  });
}
/* trae una copia (de un archivo o de la nube) y reemplaza lo de este equipo */
function aplicarCopia(d){

        var tk=BD.ajustes.git, t=Date.now();
        BD.ops=Array.isArray(d.ops)?d.ops:[];
        BD.fut=Array.isArray(d.fut)?d.fut:[];
        BD.back=Array.isArray(d.back)?d.back:[];
        BD.pruebas=Array.isArray(d.pruebas)?d.pruebas:[];
        BD.ordenes=Array.isArray(d.ordenes)?d.ordenes:[];
        BD.precios=(d.precios&&typeof d.precios==="object")?d.precios:{};
        BD.monedas=(d.monedas&&typeof d.monedas==="object")?d.monedas:{};
        BD.alertas=Array.isArray(d.alertas)?d.alertas:[];
        BD.borrados=Array.isArray(d.borrados)?d.borrados:[];
        BD.ajustes=Object.assign({}, BD.ajustes, d.ajustes||{}, {git:tk});
        if(d.tema) BD.tema=Object.assign({}, BD.tema, d.tema);
        ordenarDatosViejos();
        /* lo que vuelve de la copia tiene que MANDAR sobre el otro equipo */
        var vivos={};
        [BD.ops,BD.fut,BD.back,BD.pruebas,BD.alertas,BD.ordenes].forEach(function(L){
          L.forEach(function(o){ o.mod=t; if(o.id) vivos[o.id]=1; });
        });
        BD.borrados=(BD.borrados||[]).filter(function(x){ return !vivos[x.id]; });
        SYNC.firma=""; SYNC.sha="";
        guardar(); aplicarTema(); programarPrecios(); programarMarca();
        repintar(); traerPrecios(true); conectarVivo();
        if(gitCfg().token) sincronizar(true);
        aviso("Portafolio restaurado · "+plural(BD.ops.length,"movimiento","movimientos")+", "+
          plural(BD.fut.length,"futuro","futuros")+" y "+BD.back.length+" de prueba.");
}
/* lo mismo, pero partiendo del texto que bajó de Google Drive u OneDrive */
function restaurarTexto(txt,donde){
  var d=null;
  try{ d=JSON.parse(txt); }catch(e){}
  if(!d||!Array.isArray(d.ops)){ aviso("La copia de "+donde+" no se pudo leer.",true); return false; }
  aplicarCopia(d);
  return true;
}
function restaurarCopia(ev){
  var arch=ev.target.files&&ev.target.files[0];
  if(!arch) return;
  var fr=new FileReader();
  fr.onload=function(){
    var d=null;
    try{ d=JSON.parse(fr.result); }catch(e){}
    if(!d||!Array.isArray(d.ops)){ aviso("Ese archivo no es una copia válida.",true); ev.target.value=""; return; }
    confirmar("Restaurar copia","Trae <b>"+d.ops.length+"</b> "+pal(d.ops.length,"movimiento","movimientos")+", <b>"+
      ((d.fut&&d.fut.length)||0)+"</b> "+pal((d.fut&&d.fut.length)||0,"operación","operaciones")+" de futuros, <b>"+
      ((d.pruebas&&d.pruebas.length)||0)+"</b> "+pal((d.pruebas&&d.pruebas.length)||0,"prueba","pruebas")+" y <b>"+
      ((d.alertas&&d.alertas.length)||0)+"</b> "+pal((d.alertas&&d.alertas.length)||0,"alerta","alertas")+". Reemplaza lo que hay ahora. "+
      "Su clave de GitHub no se toca, y lo que traiga la copia manda sobre el otro equipo.",
      "Restaurar", function(){ aplicarCopia(d); });
    ev.target.value="";
  };
  fr.readAsText(arch);
}

/* =====================================================================
   30 · IDIOMA · el programa entero en otro idioma
   ---------------------------------------------------------------------
   Cómo funciona: cada texto que el programa dibuja pasa por el
   diccionario antes de verse. Donde hay números ("3 operaciones"), se
   guardan aparte, se busca la frase con # en lugar del número y después
   se vuelven a poner. En español no se toca nada.
   ===================================================================== */
var IDIOMAS=[
  ["es","Español","🇪🇸"], ["en","English","🇬🇧"], ["pt","Português","🇧🇷"],
  ["fr","Français","🇫🇷"], ["de","Deutsch","🇩🇪"], ["it","Italiano","🇮🇹"]
];
var DIC={};          /* lo llena 15-diccionario.js */
var IDI_obs=null;
var IDI_SALTAR={SCRIPT:1,STYLE:1,SVG:1,CODE:1};

function idioma(){
  var i=(BD.ajustes&&BD.ajustes.idioma)||"es";
  return DIC[i]?i:"es";
}
function nombreIdioma(c){
  for(var i=0;i<IDIOMAS.length;i++) if(IDIOMAS[i][0]===c) return IDIOMAS[i][1];
  return "Español";
}
/* ¿es un símbolo de moneda? (BTC, ETH…) para dejarlo tal cual */
function esSimboloMoneda(x){
  if(MONEDAS[x]) return true;
  if(BD.monedas&&BD.monedas[x]) return true;
  return x==="USDT"||x==="USDC"||x==="USD";
}
/* cambia los datos que varían por huecos: números → # · monedas → @ */
function moldeIdioma(k){
  var nums=[], syms=[];
  var m=String(k).replace(/-?\d[\d.,]*/g, function(n){ nums.push(n); return "#"; });
  m=m.replace(/\b[A-Z][A-Z0-9]{1,5}\b/g, function(x){
    if(!esSimboloMoneda(x)) return x;
    syms.push(x); return "@";
  });
  return {m:m, nums:nums, syms:syms};
}
function rellenar(p, nums, syms){
  var i=0, j=0;
  return p.replace(/[#@]/g, function(c){
    if(c==="#") return i<nums.length?nums[i++]:"#";
    return j<syms.length?syms[j++]:"@";
  });
}
/* traduce un texto suelto (conserva los espacios de los lados) */
function tr(t){
  if(t==null) return t;
  var d=DIC[idioma()];
  if(!d) return t;
  var k=String(t).replace(/\s+/g," ").trim();
  if(!k||k.length>400) return t;
  var v=d[k];
  if(v!=null) return String(t).replace(k,v);
  var M=moldeIdioma(k);
  if(!M.nums.length&&!M.syms.length) return t;
  var p=d[M.m];
  if(p==null) return t;
  return String(t).replace(k, rellenar(p, M.nums, M.syms));
}
/* el texto de un nodo, si cambia */
function traducirTexto(n){
  var a=n.nodeValue;
  if(!a||!/[a-záéíóúñü]/i.test(a)) return;
  var b=tr(a);
  if(b!==a) n.nodeValue=b;
}
var IDI_ATRIBS=["placeholder","title","aria-label","alt"];
function traducirElemento(el){
  IDI_ATRIBS.forEach(function(a){
    if(!el.hasAttribute||!el.hasAttribute(a)) return;
    var v=el.getAttribute(a), w=tr(v);
    if(w!==v) el.setAttribute(a,w);
  });
}
/* traduce una rama entera del documento */
function traducirNodo(raiz){
  if(!raiz) return;
  if(raiz.nodeType===3) return traducirTexto(raiz);
  if(raiz.nodeType!==1) return;
  if(IDI_SALTAR[raiz.tagName]) return;
  traducirElemento(raiz);
  var p=document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT, {
    acceptNode:function(n){
      if(n.nodeType===1&&IDI_SALTAR[n.tagName]) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  var n;
  while((n=p.nextNode())){
    if(n.nodeType===3) traducirTexto(n); else traducirElemento(n);
  }
}
function conectarVigia(){
  if(!IDI_obs) return;
  IDI_obs.observe(document.body,{childList:true,subtree:true,characterData:true,
    attributes:true,attributeFilter:IDI_ATRIBS});
}
/* se queda mirando: todo lo que el programa dibuje después, también se traduce */
function vigilarIdioma(){
  if(IDI_obs){ IDI_obs.disconnect(); IDI_obs=null; }
  if(idioma()==="es") return;
  IDI_obs=new MutationObserver(function(ms){
    IDI_obs.disconnect();
    try{
      ms.forEach(function(m){
        if(m.type==="characterData") traducirTexto(m.target);
        else if(m.type==="attributes") traducirElemento(m.target);
        else if(m.addedNodes) for(var i=0;i<m.addedNodes.length;i++) traducirNodo(m.addedNodes[i]);
      });
    }catch(e){}
    conectarVigia();
  });
  conectarVigia();
}
function aplicarIdioma(repintando){
  var i=idioma();
  try{ document.documentElement.lang=i; }catch(e){}
  if(i==="es"){
    if(IDI_obs){ IDI_obs.disconnect(); IDI_obs=null; }
    if(repintando!==false){ try{ repintar(); }catch(e){} }
    return;
  }
  vigilarIdioma();
  if(repintando!==false){ try{ repintar(); }catch(e){} }
  if(IDI_obs) IDI_obs.disconnect();
  try{ traducirNodo(document.body); }catch(e){}
  conectarVigia();
}
