  header span{display:block;font-size:13px;color:var(--t2);font-weight:600;margin-top:2px}

  .idiomas button{background:var(--b1);border:1px solid var(--ln);color:var(--t2);
    padding:7px 13px;border-radius:999px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .idiomas button:hover{color:var(--tx);border-color:var(--ac)}
  .idiomas button[aria-current=true]{background:color-mix(in srgb,var(--ac) 18%,transparent);
    border-color:var(--ac);color:var(--tx)}
  .fecha{font-size:13px;color:var(--t3);margin:0 0 26px;padding-bottom:18px;
    border-bottom:1px solid var(--ln)}
  h2{font-size:18px;margin:34px 0 10px;letter-spacing:-.01em}
  h2:first-of-type{margin-top:0}
  p{margin:0 0 13px;color:var(--t2)}
  strong{color:var(--tx);font-weight:650}
  ul{margin:0 0 16px;padding-left:20px;color:var(--t2)}
  li{margin-bottom:7px}
  li::marker{color:var(--ac)}
  .caja{background:var(--b1);border:1px solid var(--ln);border-radius:var(--rad);
    padding:16px 18px;margin:0 0 20px}
  .caja p:last-child{margin-bottom:0}
  .caja.fuerte{border-color:color-mix(in srgb,var(--ac) 45%,transparent);
    background:color-mix(in srgb,var(--ac) 8%,var(--b1))}
  a{color:var(--ac)}
  table{width:100%;border-collapse:collapse;margin:0 0 18px;font-size:14.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--ln);vertical-align:top}
  th{color:var(--t3);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
  td{color:var(--t2)} td:first-child{color:var(--tx);font-weight:600;white-space:nowrap}
  footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--ln);
    font-size:13.5px;color:var(--t3)}
  @media (max-width:520px){
    h1{font-size:21px} .env{padding:24px 16px 56px}
    td:first-child{white-space:normal}
  }
</style>
</head>

function tabla(d){

  SERVICIOS.forEach(function(s){

function pintar(idi){
  var d=T[idi]||T.es;
  document.documentElement.lang=idi;
  document.getElementById("tit").textContent=d.titulo;
  document.getElementById("fecha").textContent=d.fecha;
  var h="";
  d.bloques.forEach(function(b){
    if(b[0]==="caja fuerte"){ h+='<div class="caja fuerte">'+b[2]+'</div>'; return; }
    h+='<h2>'+b[1]+'</h2>'+b[2];
    if(b[3]==="tabla") h+=tabla(d.tabla);
  });
  document.getElementById("texto").innerHTML=h;
  document.getElementById("pie").innerHTML=d.pie;
  [].forEach.call(document.querySelectorAll("#idiomas button"), function(x){
    x.setAttribute("aria-current", x.dataset.i===idi ? "true" : "false");
  });
  try{ localStorage.setItem("priv-idi", idi); }catch(e){}
  try{ history.replaceState(null,"","#"+idi); }catch(e){}
}

  var nav=document.getElementById("idiomas");
  nav.innerHTML=ORDEN.map(function(i){
    return '<button type="button" data-i="'+i+'">'+ETIQUETA[i]+'</button>';
  }).join("");
  nav.addEventListener("click", function(e){
    var b=e.target.closest("button"); if(b) pintar(b.dataset.i);
  });
  var inicial=(location.hash||"").replace("#","");
  if(ORDEN.indexOf(inicial)<0){ try{ inicial=localStorage.getItem("priv-idi")||""; }catch(e){} }
  if(ORDEN.indexOf(inicial)<0){
    var n=(navigator.language||"es").slice(0,2).toLowerCase();
    inicial = ORDEN.indexOf(n)>=0 ? n : "es";
  }
  pintar(inicial);
})();
</script>
